s! Paso 1: Todo programador profesional comete decenas de errores todos los días. Paso 2: Un error no significa que seas malo; significa que la computadora te está dando una pista para afinar tu lógica. Paso 3: Los errores son tus mejores maestros.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Equivocarse es aprender","code":"-- Un error no rompe tu computadora; solo te da una pista para mejorar.\nprint(\"¡Sin miedo al éxito!\")","language":"lua","output":"¡Sin miedo al éxito!","explanation":"Aprender a leer los errores te da superpoderes en programación.","position":1}],"exercises":[{"id":"9abfd0a5-0d7b-4cae-ba68-aa8a658cc08d","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"En programación, ¿recibir un mensaje de error en la terminal es algo normal del proceso de aprendizaje y te brinda pistas para corregir tu código?","prompt_code":null,"score":10,"concept_ids":["lua-fund-perder-miedo-error"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"347250ab-b773-4720-a6b6-2bcf0e37bdeb","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"f10a6b28-1fbb-4726-96d1-e341b562c7d6","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["f10a6b28-1fbb-4726-96d1-e341b562c7d6"],"explanation":"¡Verdadero! Los errores son avisos informativos diseñados para ayudarte a encontrar y corregir desajustes lógicos.","hints":[],"section_id":"d35989c6-0c4c-4b6d-a46b-e0980f17f147","lesson_id":"ef4f9aa3-062d-4f47-b02f-21c5b7f8633e"}]},{"id":"7b1810b5-9bd6-465f-b3d0-afb338ab3b34","title":"¿Qué es un traceback?","slug":"que-es-un-traceback","position":2,"concept_id":"lua-fund-traceback-concepto","explanation":"Cuando algo sale mal, Lua te muestra un mensaje llamado 'traceback'. Paso 1: 'Traceback' significa 'rastreo hacia atrás'. Paso 2: Es como las huellas de un detective en la nieve que te muestran exactamente por qué camino venía el programa. Paso 3: Te lleva directo al renglón del crimen para que no tengas que buscar a ciegas.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Huellas de error","code":"lua: main.lua:3: attempt to perform arithmetic\nstack traceback:\n\tmain.lua:3: in main chunk","language":"lua","output":"","explanation":"El traceback te indica el archivo y la línea donde ocurrió el tropiezo.","position":1}],"exercises":[{"id":"2d9c7521-b88b-4073-92ad-5a0cedfba3d6","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Qué es el 'traceback' que muestra Lua cuando ocurre una falla en el programa?","prompt_code":null,"score":10,"concept_ids":["lua-fund-traceback-concepto"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"c850414c-e070-4996-87e5-153836d5742b","label":"A","body":"Un reporte detectivesco que rastrea en qué archivo y en qué línea ocurrió el problema","is_correct":true,"position":1},{"id":"e55d480c-a058-45d1-b8cf-ad6a6f041394","label":"B","body":"Una factura que debes pagar por internet","is_correct":false,"position":2},{"id":"16d8fc29-8521-4c88-b007-1e6a2756da6f","label":"C","body":"Una lista de los mejores videojuegos del año","is_correct":false,"position":3},{"id":"1bfda265-e9e5-4944-8a08-513e01415c35","label":"D","body":"El nombre de tu tarjeta gráfica","is_correct":false,"position":4}],"correct_answer_ids":["c850414c-e070-4996-87e5-153836d5742b"],"explanation":"¡Exacto! El traceback rastrea la pila de ejecución y te señala la línea exacta donde ocurrió la falla.","hints":[],"section_id":"d35989c6-0c4c-4b6d-a46b-e0980f17f147","lesson_id":"7b1810b5-9bd6-465f-b3d0-afb338ab3b34"}]},{"id":"1e87e102-1c84-4abc-89c2-65fc1db46774","title":"La anatomía del mensaje de error","slug":"anatomia-del-mensaje-de-error","position":3,"concept_id":"lua-fund-anatomia-error","explanation":"Los mensajes de error de Lua tienen una estructura matemática muy predecible: `archivo.lua:línea: descripción`. Paso 1: La primera parte te da el nombre del archivo (ej: `main.lua`). Paso 2: El número entre dos puntos te da el renglón exacto (ej: `:5:` significa línea 5). Paso 3: El texto final te dice qué salió mal. ¡Sabiendo leer esto, solucionas cualquier problema en 10 segundos!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Estructura del error","code":"main.lua:5: 'end' expected\n-- [Archivo] [Línea] [Motivo de la falla]","language":"lua","output":"","explanation":"main.lua en línea 5 necesita un 'end'.","position":1}],"exercises":[{"id":"32b0d492-c94c-4442-a770-ec98cc12e3b1","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"Si la terminal te muestra el mensaje `main.lua:12: unexpected symbol`, ¿en qué número de renglón debes buscar el problema?","prompt_code":null,"score":10,"concept_ids":["lua-fund-anatomia-error"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"dfe977e8-cdfb-4729-addc-2e82a671de46","label":"A","body":"En el renglón 1","is_correct":false,"position":1},{"id":"cae75bba-2951-4a6f-a0e5-a041ec66a0c3","label":"B","body":"En el renglón 12","is_correct":true,"position":2},{"id":"c5c414e6-bf9b-4ff6-9127-2055cc0b9b4e","label":"C","body":"En el renglón 100","is_correct":false,"position":3},{"id":"7d20dec7-fae4-43e1-8249-bbb0c938030a","label":"D","body":"En ningún renglón","is_correct":false,"position":4}],"correct_answer_ids":["cae75bba-2951-4a6f-a0e5-a041ec66a0c3"],"explanation":"¡Muy bien! El número entre dos puntos (`:12:`) te indica con total precisión el número de línea del archivo.","hints":[],"section_id":"d35989c6-0c4c-4b6d-a46b-e0980f17f147","lesson_id":"1e87e102-1c84-4abc-89c2-65fc1db46774"}]},{"id":"3ca6cc0d-5b91-4865-a982-c7d0f5919730","title":"Error al escribir (Syntax Error)","slug":"error-al-escribir-syntax-error","position":4,"concept_id":"lua-fund-syntax-error","explanation":"Existen dos grandes familias de errores. La primera es el error de sintaxis (Syntax Error). Paso 1: Ocurre cuando cometes una falta de ortografía en el código antes de que empiece a correr. Paso 2: Olvidar cerrar una comilla, olvidar cerrar un paréntesis o escribir mal una palabra. Paso 3: Lua detecta esto al instante y te avisa antes de hacer nada.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Error de sintaxis","code":"-- print(\"Falta comilla de cierre)\n-- syntax error: unfinished string near '\"Falta...'","language":"lua","output":"syntax error","explanation":"Una comilla sin cerrar es un error clásico de sintaxis.","position":1}],"exercises":[{"id":"49607e6d-aea0-4144-97d7-b96e90768851","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Qué es un 'Syntax Error' (error de sintaxis) en Lua?","prompt_code":null,"score":10,"concept_ids":["lua-fund-syntax-error"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"0ef160e9-b97f-438e-9ca7-c0bc79d96e56","label":"A","body":"Que el teclado está desconectado","is_correct":false,"position":1},{"id":"187f28f3-5a0f-4ad7-a800-9f08e422145a","label":"B","body":"Un corte de energía eléctrica en tu ciudad","is_correct":false,"position":2},{"id":"6b3c3e71-5788-4a3c-9b7b-b6464216eb48","label":"C","body":"Que el monitor se quedó sin brillo","is_correct":false,"position":3},{"id":"c695d7d7-3e3c-47c8-9d7f-f8044faf3e44","label":"D","body":"Una falla al escribir las reglas del lenguaje, como olvidar cerrar una comilla o un paréntesis","is_correct":true,"position":4}],"correct_answer_ids":["c695d7d7-3e3c-47c8-9d7f-f8044faf3e44"],"explanation":"¡Correcto! Los errores de sintaxis ocurren cuando el código viola las reglas gramaticales del lenguaje.","hints":[],"section_id":"d35989c6-0c4c-4b6d-a46b-e0980f17f147","lesson_id":"3ca6cc0d-5b91-4865-a982-c7d0f5919730"}]},{"id":"cc0c844a-5148-42d4-95a7-2ecaaae98e32","title":"Error al ejecutar (Runtime Error)","slug":"error-al-ejecutar-runtime-error","position":5,"concept_id":"lua-fund-runtime-error","explanation":"La segunda familia es el error de ejecución (Runtime Error). Paso 1: Tu código está perfectamente escrito sin faltas de ortografía. Paso 2: Pero cuando empieza a correr, le pides a la computadora algo imposible (como dividir entre cero o usar un dato vacío). Paso 3: El programa arranca bien y se estrella a mitad del camino al toparse con esa orden imposible.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Error de ejecución","code":"print(\"Paso 1 funcionando\")\n-- Luego intentas algo imposible y tropieza en tiempo de ejecución","language":"lua","output":"Paso 1 funcionando\nerror...","explanation":"El programa arranca pero se detiene al encontrar una operación imposible.","position":1}],"exercises":[{"id":"74eea3ad-69ab-4cb8-9aed-689477d38677","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"Un 'Runtime Error' ocurre mientras el programa ya se está ejecutando, cuando se intenta realizar una operación que resulta imposible o inválida en ese momento. ¿Es verdadero?","prompt_code":null,"score":10,"concept_ids":["lua-fund-runtime-error"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"1d0d836f-5d04-4d36-9190-30df5cfbc869","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"b24ed872-6970-4b55-bc16-e688b5d77843","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["b24ed872-6970-4b55-bc16-e688b5d77843"],"explanation":"¡Verdadero! A diferencia de los errores de sintaxis que se detectan al leer el texto, los runtime errors ocurren durante la ejecución dinámica.","hints":[],"section_id":"d35989c6-0c4c-4b6d-a46b-e0980f17f147","lesson_id":"cc0c844a-5148-42d4-95a7-2ecaaae98e32"}]},{"id":"854695aa-2c32-429d-a93e-6e50992d8eee","title":"El error attempt to index a nil value","slug":"error-attempt-to-index-nil","position":6,"concept_id":"lua-fund-error-nil-index","explanation":"Este es el error más temido por los que no lo conocen: `attempt to index a nil value`. ¡Pero es una tontería de entender! Paso 1: `nil` significa 'vacío', o sea que no hay nada ahí. Paso 2: `attempt to index` significa que intentaste abrir una cajita para buscar algo adentro. Paso 3: ¡Intentaste abrir una caja que ni siquiera existe! Solo verifica que la variable esté creada y se soluciona.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Caja vacía","code":"local jugador = nil\n-- print(jugador.puntos) => Error: attempt to index a nil value","language":"lua","output":"error: attempt to index a nil value","explanation":"No puedes buscar propiedades dentro de algo que está completamente vacío (nil).","position":1}],"exercises":[{"id":"171387bc-4729-4970-9b17-d21b4466c7b7","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"En Lua, ¿qué significa en palabras sencillas el error `attempt to index a nil value`?","prompt_code":null,"score":10,"concept_ids":["lua-fund-error-nil-index"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"ecf24888-6aba-4ac7-adb2-4725aa290177","label":"A","body":"Que intentaste acceder a los datos de una variable que está vacía o que no existe todavía","is_correct":true,"position":1},{"id":"e047a608-03f9-4e25-9646-8dcedbe16ab5","label":"B","body":"Que el disco duro está lleno","is_correct":false,"position":2},{"id":"64cae5a9-f3ce-49f0-b94d-058e4e1b562a","label":"C","body":"Que tu juego tiene demasiados colores","is_correct":false,"position":3},{"id":"100aaa64-8551-4243-83db-6f91617269d0","label":"D","body":"Que debes comprar una computadora nueva","is_correct":false,"position":4}],"correct_answer_ids":["ecf24888-6aba-4ac7-adb2-4725aa290177"],"explanation":"¡Exacto! Ocurre cuando intentas acceder a campos o métodos de un valor nulo (`nil`).","hints":[],"section_id":"d35989c6-0c4c-4b6d-a46b-e0980f17f147","lesson_id":"854695aa-2c32-429d-a93e-6e50992d8eee"}]},{"id":"4b8efd14-7334-4b08-83b2-c0f9c7b157c6","title":"La técnica detectivesca de apagar líneas con --[[ ]]","slug":"tecnica-apagar-lineas-para-debug","position":7,"concept_id":"lua-fund-debug-aislar-error","explanation":"Si tienes un error y no sabes cuál línea es la culpable, usa el método del cerco. Paso 1: Encierra la mitad de tu archivo entre `--[[` y `]]`. Paso 2: Ejecuta tu programa. Paso 3: Si ya no falla, la línea culpable estaba en la mitad que apagaste. Destapa poco a poco hasta acorralarla. ¡Es el truco más rápido del mundo!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Aislar con comentarios","code":"--[[\n  -- Si apagas este bloque y el error desaparece,\n  -- el fallo estaba aquí adentro.\n]]","language":"lua","output":"","explanation":"Comentar bloques te permite aislar fallos sin perder tu código.","position":1}],"exercises":[{"id":"a805e1fa-fe40-4b90-ba83-cf1540be2733","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"Si tu programa falla y sospechas de un bloque de 5 líneas, ¿cuál es la mejor técnica para comprobarlo sin perder tu trabajo?","prompt_code":null,"score":10,"concept_ids":["lua-fund-debug-aislar-error"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"05716a45-eec9-481f-9403-802d483977b7","label":"A","body":"Borrar las 5 líneas para siempre del archivo","is_correct":false,"position":1},{"id":"6e3e755a-8771-4798-a73b-9ce000b8f451","label":"B","body":"Encerrar las 5 líneas entre `--[[` y `]]` para desactivarlas temporalmente","is_correct":true,"position":2},{"id":"6395feed-2ba1-4bc1-8f16-84c5bd076a11","label":"C","body":"Apagar la pantalla","is_correct":false,"position":3},{"id":"0c45a2e2-e345-4b33-8e20-f9f2419107a6","label":"D","body":"Cambiarle el nombre a la computadora","is_correct":false,"position":4}],"correct_answer_ids":["6e3e755a-8771-4798-a73b-9ce000b8f451"],"explanation":"¡Muy bien! Comentar el bloque te permite probar el programa sin destruir el código original.","hints":[],"section_id":"d35989c6-0c4c-4b6d-a46b-e0980f17f147","lesson_id":"4b8efd14-7334-4b08-83b2-c0f9c7b157c6"}]},{"id":"ece25307-0fb8-4554-8be6-a8560ef59f7a","title":"Depuración con print","slug":"depuracion-con-print","position":8,"concept_id":"lua-fund-debug-con-print","explanation":"¿Cómo saber hasta dónde llegó tu programa antes de fallar? ¡Ponle miguitas de pan con print! Paso 1: Escribes `print(\"Punto 1\")` arriba, `print(\"Punto 2\")` en medio y `print(\"Punto 3\")` abajo. Paso 2: Ejecutas tu archivo. Paso 3: Si en pantalla sale Punto 1 y Punto 2, pero NO sale Punto 3, ¡sabes con exactitud milimétrica que el tropiezo ocurrió entre el 2 y el 3!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Migas de pan","code":"print(\"1. Inicio\")\n-- aquí ocurre algo misterioso\nprint(\"2. Llegó hasta aquí\")","language":"lua","output":"1. Inicio\n2. Llegó hasta aquí","explanation":"Los prints te muestran en qué punto exacto se detiene el flujo de ejecución.","position":1}],"exercises":[{"id":"101b9de8-8fec-448d-9bd7-7e8d6e96bb74","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"¿Colocar instrucciones `print()` provisionales a lo largo de tu código te ayuda a descubrir hasta qué punto exacto avanzó tu programa antes de fallar?","prompt_code":null,"score":10,"concept_ids":["lua-fund-debug-con-print"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"7950b14a-6454-4670-ad84-f87503182196","label":"A","body":"Verdadero","is_correct":true,"position":1},{"id":"22a9a36d-a1c1-48c4-825b-09cc6d248b3b","label":"B","body":"Falso","is_correct":false,"position":2}],"correct_answer_ids":["7950b14a-6454-4670-ad84-f87503182196"],"explanation":"¡Verdadero! El 'print debugging' es una de las técnicas de diagnóstico más universales y efectivas de la historia de la programación.","hints":[],"section_id":"d35989c6-0c4c-4b6d-a46b-e0980f17f147","lesson_id":"ece25307-0fb8-4554-8be6-a8560ef59f7a"}]},{"id":"3fa4d2ec-197f-4974-b8d2-7055fd2ff55e","title":"Probar la sospecha en la consola lua -i","slug":"probar-sospecha-en-repl","position":9,"concept_id":"lua-fund-debug-repl","explanation":"Si dudas de cómo se comporta una instrucción específica, no toques tu archivo grande todavía. Paso 1: Abre la consola interactiva con `lua -i`. Paso 2: Escribe esa única línea solita para ver cómo reacciona Lua. Paso 3: Una vez que entiendas cómo responde y esté corregida, la copias con seguridad en tu archivo.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Ensayar antes de editar","code":"$ lua -i\n> print(5 + 5) -- Ensayas en el REPL\n10","language":"lua","output":"10","explanation":"Probar líneas dudosas en el REPL evita romper archivos grandes.","position":1}],"exercises":[{"id":"2018db00-5585-4018-81d4-86ebf03ea6ce","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"Si tienes dudas sobre cómo funciona una sola orden antes de ponerla en tu juego, ¿qué herramienta te permite probarla aisladamente en 10 segundos?","prompt_code":null,"score":10,"concept_ids":["lua-fund-debug-repl"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"cdb0d2b1-74b3-47fa-96c1-9ce77c18e8fe","label":"A","body":"La consola interactiva `lua -i`","is_correct":true,"position":1},{"id":"1d1cc4ee-08fa-4557-bde8-15652c6b07fb","label":"B","body":"Una llamada telefónica al soporte técnico","is_correct":false,"position":2},{"id":"239bbabf-b170-42e4-8c48-1455a2da6c9a","label":"C","body":"Reiniciar el módem de internet","is_correct":false,"position":3},{"id":"267ffc3a-b9f1-40dd-94de-643b3da56bb9","label":"D","body":"Formatear el disco duro","is_correct":false,"position":4}],"correct_answer_ids":["cdb0d2b1-74b3-47fa-96c1-9ce77c18e8fe"],"explanation":"¡Exacto! El modo interactivo es el laboratorio de pruebas perfecto para comprobar expresiones al instante.","hints":[],"section_id":"d35989c6-0c4c-4b6d-a46b-e0980f17f147","lesson_id":"3fa4d2ec-197f-4974-b8d2-7055fd2ff55e"}]},{"id":"108abaf6-8d72-41c7-abf1-2839eb586d03","title":"Mini-repaso de la Sección 8","slug":"mini-repaso-seccion-ocho","position":10,"concept_id":"lua-fund-s08-repaso","explanation":"¡Tienes el botiquín de primeros auxilios completo! Paso 1: Ya no le temes a los errores. Paso 2: Sabes leer la línea del problema en el traceback. Paso 3: Sabes usar comentarios para aislar fallos y prints para rastrear el camino. ¡Estás preparado para el gran proyecto de graduación del Módulo 1!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Resumen S08","code":"print(\"¡Kit de supervivencia completado!\")","language":"lua","output":"¡Kit de supervivencia completado!","explanation":"Ya tienes mentalidad y herramientas de programador maduro.","position":1}],"exercises":[{"id":"149b4931-314b-4519-a33a-bcc93f1fdb86","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"Para solucionar un error en Lua, leemos el archivo y la línea en el traceback, y podemos usar comentarios y `print()` para aislar la causa. ¿Es verdadero?","prompt_code":null,"score":10,"concept_ids":["lua-fund-s08-repaso"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"2b78c9b8-eba4-4889-9130-3b733cc7cabe","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"823151db-91d9-4f65-b705-d47b27d8cb1c","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["823151db-91d9-4f65-b705-d47b27d8cb1c"],"explanation":"¡Verdadero! Has dominado las estrategias esenciales para resolver cualquier problema de código.","hints":[],"section_id":"d35989c6-0c4c-4b6d-a46b-e0980f17f147","lesson_id":"108abaf6-8d72-41c7-abf1-2839eb586d03"}]}]},{"id":"905b546a-6ed8-4058-a1c3-59f69abfa1c4","title":"Checkpoint y Proyecto Integrador","slug":"checkpoint","position":9,"type":"review","status":"published","content_version":2,"estimated_minutes":15,"xp_on_complete":10,"lessons":[{"id":"08926b6f-951f-4d05-9c76-44642ca97ebb","title":"Mapa mental general de Fundamentos","slug":"mapa-mental-general","position":1,"concept_id":"lua-fund-mapa-mental","explanation":"¡Mira todo lo que has aprendido en este módulo! Paso 1: Qué es Lua, su ligereza en Roblox y contar en 1. Paso 2: Instrucciones secuenciales, chunks y la consola `lua -i`. Paso 3: print con textos, comillas, números y comas. Paso 4: Comentarios `--` y `--[[ ]]`. Paso 5: Archivos `.lua`. Paso 6: Ejecución y la regla del `end`. Paso 7: Estilo sin `;`. Paso 8: Depuración con tracebacks. ¡8 pilares sólidos!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Mapa de poder","code":"-- Lua -> Chunks -> Print -> Comentarios -> Archivos -> End -> Estilo -> Debug\nprint(\"¡8 pilares asimilados!\")","language":"lua","output":"¡8 pilares asimilados!","explanation":"El mapa completo de fundamentos que dominas hoy.","position":1}],"exercises":[{"id":"1caef95d-f774-496f-ac46-0630930e6473","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"¿El Módulo 01 te ha enseñado desde qué es Lua hasta cómo ejecutar archivos `.lua`, imprimir datos, usar comentarios y resolver errores?","prompt_code":null,"score":10,"concept_ids":["lua-fund-mapa-mental"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"4e47d45c-4773-4c31-9c31-18b4ece76203","label":"A","body":"Verdadero","is_correct":true,"position":1},{"id":"bc9798c0-d897-47a1-afa4-e899bb800c9f","label":"B","body":"Falso","is_correct":false,"position":2}],"correct_answer_ids":["4e47d45c-4773-4c31-9c31-18b4ece76203"],"explanation":"¡Verdadero! Tienes una base sólida y completa para seguir creciendo en programación.","hints":[],"section_id":"905b546a-6ed8-4058-a1c3-59f69abfa1c4","lesson_id":"08926b6f-951f-4d05-9c76-44642ca97ebb"}]},{"id":"cd986c15-c7a6-4f67-8c9d-7f64e040c632","title":"Repaso activo 1: La naturaleza de Lua","slug":"repaso-activo-naturaleza-lua","position":2,"concept_id":"lua-fund-repaso-naturaleza","explanation":"Pongamos a prueba tu memoria rápida. Pregúntate: ¿dónde brilla Lua? Paso 1: En videojuegos como Roblox y motores como LÖVE. Paso 2: En servidores como NGINX por ser ultra veloz y ligero (menos de 300 KB). Paso 3: Nació en Brasil en 1993 y sus listas empiezan en la posición 1.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Lua al natural","code":"print(\"Ligero, veloz, incrustado y natural\")","language":"lua","output":"Ligero, veloz, incrustado y natural","explanation":"Las virtudes de Lua resumidas en una línea.","position":1}],"exercises":[{"id":"c9394ff4-e080-4d89-801f-72592d49c41a","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Cuál es la razón principal por la que plataformas como Roblox eligen Lua para sus mundos interactivos?","prompt_code":null,"score":10,"concept_ids":["lua-fund-repaso-naturaleza"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"024559a3-9a6a-42d6-81fc-6b0fb93d2070","label":"A","body":"Porque es liviano, arranca veloz y ejecuta las reglas del juego sin consumir casi memoria","is_correct":true,"position":1},{"id":"5f26cf8a-562d-400d-b6a0-49dea7750a60","label":"B","body":"Porque es el único lenguaje que viene en color verde","is_correct":false,"position":2},{"id":"0bc7b170-db86-463d-9d70-3186391378cd","label":"C","body":"Porque borra los archivos innecesarios de Windows","is_correct":false,"position":3},{"id":"084843dc-1a9c-4a87-aa70-7814d161f8eb","label":"D","body":"Porque solo funciona si no hay conexión a internet","is_correct":false,"position":4}],"correct_answer_ids":["024559a3-9a6a-42d6-81fc-6b0fb93d2070"],"explanation":"¡Correcto! Su velocidad, ligereza y facilidad de integración son insuperables.","hints":[],"section_id":"905b546a-6ed8-4058-a1c3-59f69abfa1c4","lesson_id":"cd986c15-c7a6-4f67-8c9d-7f64e040c632"}]},{"id":"a4cd99bf-da21-49c2-9e54-b7d7c98bef34","title":"Repaso activo 2: De la terminal al archivo","slug":"repaso-activo-archivos-repl","position":3,"concept_id":"lua-fund-repaso-archivos","explanation":"Recuerda la dualidad entre probar y construir. Paso 1: La consola `lua -i` te da el cursor `>` para ensayar una línea en 5 segundos. Paso 2: El archivo con extensión `.lua` (como `main.lua`) guarda tu software de forma permanente en tu disco. Paso 3: Siempre pulsas Ctrl + S para guardar antes de ejecutar.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"De la prueba a la obra","code":"-- Guardado en main.lua y probado con 'lua main.lua'\nprint(\"¡Flujo dominado!\")","language":"lua","output":"¡Flujo dominado!","explanation":"Dominar el flujo de archivos es ser un programador autónomo.","position":1}],"exercises":[{"id":"f3053367-a434-47aa-b82f-9a63435a48e4","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"Tienes un archivo guardado llamado `main.lua`. ¿Qué comando escribes en la terminal para que Lua lo ponga en marcha?","prompt_code":null,"score":10,"concept_ids":["lua-fund-repaso-archivos"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"873d17a6-7232-4ef4-b4a6-9a07ff6f9d27","label":"A","body":"iniciar main","is_correct":false,"position":1},{"id":"f3c81971-fbc6-4b4b-be8b-5fa544f90d62","label":"B","body":"abrir main.lua","is_correct":false,"position":2},{"id":"efcc710a-caf9-4b44-a10c-70d55fa92056","label":"C","body":"play main","is_correct":false,"position":3},{"id":"ca73a940-696b-4623-8aa5-36010b508eb7","label":"D","body":"lua main.lua","is_correct":true,"position":4}],"correct_answer_ids":["ca73a940-696b-4623-8aa5-36010b508eb7"],"explanation":"¡Exacto! El comando es `lua main.lua`.","hints":[],"section_id":"905b546a-6ed8-4058-a1c3-59f69abfa1c4","lesson_id":"a4cd99bf-da21-49c2-9e54-b7d7c98bef34"}]},{"id":"420cad7a-89d5-4a61-8aa3-f8790f216c19","title":"Repaso activo 3: La salida con print","slug":"repaso-activo-salida-print","position":4,"concept_id":"lua-fund-repaso-print","explanation":"Aseguremos que la salida en pantalla no tenga secretos para ti. Paso 1: `print(\"Texto\")` muestra el mensaje limpio sin comillas. Paso 2: `print(50)` muestra el número directamente. Paso 3: Las comas dentro de print separan los elementos automáticamente con un espacio.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Salida maestra","code":"print(\"Nivel:\", 10, \"Puntos:\", 500)","language":"lua","output":"Nivel:\t10\tPuntos:\t500","explanation":"Combinación de textos, números y comas en un solo renglón.","position":1}],"exercises":[{"id":"01065c1f-9e06-4f2d-8493-06d0d33cb2b7","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"predict_output","difficulty":"easy","category":"fundamentos","prompt":"¿Qué mensaje exacto aparecerá en la pantalla al ejecutar este código?","prompt_code":"print(\"Vidas restantes:\", 3)","score":10,"concept_ids":["lua-fund-repaso-print"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"33587073-5bc1-436c-9aca-df170e9f75b5","label":"A","body":"Vidas restantes: 3 (con un espacio de separación)","is_correct":true,"position":1},{"id":"1433089d-4892-4d5c-b069-cbb55c9690c6","label":"B","body":"\"Vidas restantes:\" 3 (con las comillas visibles)","is_correct":false,"position":2},{"id":"56a6f071-9df7-4d6a-a80f-6379df833edf","label":"C","body":"Vidas restantes:3 (pegado sin separación)","is_correct":false,"position":3},{"id":"5742cd70-102f-400f-8a89-b862c453d2d0","label":"D","body":"Error por mezclar texto con número","is_correct":false,"position":4}],"correct_answer_ids":["33587073-5bc1-436c-9aca-df170e9f75b5"],"explanation":"¡Correcto! En Lua la coma separa los argumentos automáticamente con un espacio limpio.","hints":[],"section_id":"905b546a-6ed8-4058-a1c3-59f69abfa1c4","lesson_id":"420cad7a-89d5-4a61-8aa3-f8790f216c19"}]},{"id":"b557dedd-acb9-4e33-baf2-bb7d9a82ef81","title":"Repaso activo 4: El valor de las notas","slug":"repaso-activo-comentarios","position":5,"concept_id":"lua-fund-repaso-comentarios","explanation":"Recuerda las dos herramientas para dejarte notas. Paso 1: Dos guiones `--` al inicio apagan un renglón individual. Paso 2: `--[[` abre un bloque multilínea y `]]` lo cierra. Paso 3: Los comentarios te permiten documentar el por qué de tus ideas y apagar código sospechoso durante tus pruebas.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Notas completas","code":"-- Nota simple\n--[[\n  Nota larga\n]]\nprint(\"Visible\")","language":"lua","output":"Visible","explanation":"Las notas no se ejecutan ni hacen más lento tu programa.","position":1}],"exercises":[{"id":"8e42c3ec-c6bd-42b7-95eb-0f09a5abe0ed","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"Si quieres escribir una nota personal de varias líneas que la computadora ignore, ¿qué símbolos usas al inicio y al final?","prompt_code":null,"score":10,"concept_ids":["lua-fund-repaso-comentarios"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"df0e8de5-b839-4591-8845-ad4cd57d9087","label":"A","body":"--[[ al inicio y ]] al final","is_correct":true,"position":1},{"id":"7f0cbd64-0e9e-40ff-890e-67da8f42e930","label":"B","body":"/* al inicio y */ al final","is_correct":false,"position":2},{"id":"97e4357a-7949-428d-8e94-089ed37bb1fb","label":"C","body":"(( al inicio y )) al final","is_correct":false,"position":3},{"id":"52722212-53a5-4ee3-b1b2-fe8d6db9fa23","label":"D","body":"-- al inicio y -- al final","is_correct":false,"position":4}],"correct_answer_ids":["df0e8de5-b839-4591-8845-ad4cd57d9087"],"explanation":"¡Muy bien! `--[[` y `]]` delimitan comentarios multilínea en Lua.","hints":[],"section_id":"905b546a-6ed8-4058-a1c3-59f69abfa1c4","lesson_id":"b557dedd-acb9-4e33-baf2-bb7d9a82ef81"}]},{"id":"cb3377d6-725c-405a-af74-64a363c69018","title":"Repaso activo 5: La regla del cierre con end","slug":"repaso-activo-cierre-end","position":6,"concept_id":"lua-fund-repaso-cierre-end","explanation":"La regla sagrada de los bloques en Lua: Paso 1: Todo bloque abierto con `if`, `while` o `function` debe cerrarse con la palabra `end`. Paso 2: Si olvidas el `end`, Lua buscará hasta el final del archivo y marcará `'end' expected`. Paso 3: Acostúmbrate a escribir el `end` de cierre en cuanto abras la condición.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Cierre seguro","code":"if true then\n  print(\"Bloque cerrado correctamente\")\nend","language":"lua","output":"Bloque cerrado correctamente","explanation":"El bloque se cierra con llave usando la palabra end.","position":1}],"exercises":[{"id":"384eaa77-6979-4db7-8c50-7ee4bd34a522","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"find_error","difficulty":"easy","category":"fundamentos","prompt":"En este código, ¿qué palabra clave obligatoria falta para que Lua pueda ejecutarlo sin error?","prompt_code":"if true then\n  print(\"Todo listo\")","score":10,"concept_ids":["lua-fund-repaso-cierre-end"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"eb2d7de1-44e7-45ce-88ea-b5dd51689e5f","label":"A","body":"Falta un punto y coma","is_correct":false,"position":1},{"id":"d5dd4de0-9732-4ac3-bd2b-e5a7c663ac33","label":"B","body":"Falta la palabra 'end' al final del bloque","is_correct":true,"position":2},{"id":"2a111f23-0bf0-4a94-8813-06c70dd5aa99","label":"C","body":"Falta una coma","is_correct":false,"position":3},{"id":"09584b42-7020-430d-ba31-cb96ccdbe5dc","label":"D","body":"No falta nada","is_correct":false,"position":4}],"correct_answer_ids":["d5dd4de0-9732-4ac3-bd2b-e5a7c663ac33"],"explanation":"¡Exacto! Olvidar `end` es el error más clásico del principiante; ahora ya sabes detectarlo al instante.","hints":[],"section_id":"905b546a-6ed8-4058-a1c3-59f69abfa1c4","lesson_id":"cb3377d6-725c-405a-af74-64a363c69018"}]},{"id":"6990a044-18d7-4c21-81f3-b7fca21ffbac","title":"Repaso activo 6: Nombres legales y estilo","slug":"repaso-activo-nombres-estilo","position":7,"concept_id":"lua-fund-repaso-estilo","explanation":"Repasemos las normas de elegancia en Lua. Paso 1: Nombres con letras, números y guión bajo; nunca empezar con número. Paso 2: Nunca usar las 21 palabras reservadas como `local` o `if`. Paso 3: Sangría de 2 espacios para ver escalones visuales y nada de punto y coma `;` innecesario.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Estilo puro","code":"local nombre_heroe = \"Arturo\"\nif true then\n  print(nombre_heroe)\nend","language":"lua","output":"Arturo","explanation":"Nombre legal, indentación de 2 espacios y sin punto y coma.","position":1}],"exercises":[{"id":"24b156bc-4943-40fc-9c90-d215d10c0b1d","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Por qué el nombre de variable `1puntos` causa un error en Lua?","prompt_code":null,"score":10,"concept_ids":["lua-fund-repaso-estilo"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"8492f570-e344-4747-a74d-210f6a8db505","label":"A","body":"Porque empieza con un número, lo cual está prohibido en las reglas de Lua","is_correct":true,"position":1},{"id":"cb07d110-b1b6-4733-ad89-1590c58a31d1","label":"B","body":"Porque la palabra puntos no existe en portugués","is_correct":false,"position":2},{"id":"1ba9717a-2af2-4255-b117-95c011d19a12","label":"C","body":"Porque tiene más de 5 letras","is_correct":false,"position":3},{"id":"8ae3b8f4-c3f2-49b7-844e-f26c1ffd8e0c","label":"D","body":"Porque está escrito en minúsculas","is_correct":false,"position":4}],"correct_answer_ids":["8492f570-e344-4747-a74d-210f6a8db505"],"explanation":"¡Correcto! Los nombres de identificadores en Lua nunca pueden comenzar con un dígito numérico.","hints":[],"section_id":"905b546a-6ed8-4058-a1c3-59f69abfa1c4","lesson_id":"6990a044-18d7-4c21-81f3-b7fca21ffbac"}]},{"id":"7431bbea-d4fb-4e25-a150-ae8cb74304fc","title":"Repaso activo 7: Diagnóstico de fallos","slug":"repaso-activo-diagnostico-fallos","position":8,"concept_id":"lua-fund-repaso-diagnostico","explanation":"Conviértete en un detective implacable. Paso 1: Cuando salga un error, busca el número de línea entre los dos puntos (ej: `:7:`). Paso 2: Lee el motivo para saber si fue un error de sintaxis o de ejecución. Paso 3: Si no estás seguro, pon prints de control o comenta bloques con `--[[ ]]` para acorralar la causa.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Diagnóstico rápido","code":"-- main.lua:4: mensaje de error\n-- Vas directo al renglón 4 de main.lua","language":"lua","output":"","explanation":"El traceback te indica la línea exacta del fallo.","position":1}],"exercises":[{"id":"ab8a4015-91c7-468e-b633-db28871a510f","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"Si la terminal te muestra el mensaje `main.lua:8: unexpected symbol`, significa que en el renglón 8 de `main.lua` hay un error que debes revisar. ¿Es verdadero?","prompt_code":null,"score":10,"concept_ids":["lua-fund-repaso-diagnostico"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"e34af963-ac32-4c56-841c-fe08118964f1","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"74ed6bc3-c084-42f1-ae33-91abb6ad0198","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["74ed6bc3-c084-42f1-ae33-91abb6ad0198"],"explanation":"¡Verdadero! El mensaje te conduce directamente a la línea 8 del archivo para solucionar el problema.","hints":[],"section_id":"905b546a-6ed8-4058-a1c3-59f69abfa1c4","lesson_id":"7431bbea-d4fb-4e25-a150-ae8cb74304fc"}]},{"id":"48789aaa-ec24-4940-b2a0-4e812e2212ba","title":"Gran Desafío Práctico: Tu primer script firmado","slug":"gran-desafio-primer-script-firmado","position":9,"concept_id":"lua-fund-desafio-integrador","explanation":"En este desafío final pondrás a prueba todo lo aprendido. Imagina que estás creando tu primer script oficial de presentación. Paso 1: La primera línea debe ser una nota personal con tu nombre que la computadora no ejecute. Paso 2: Usas dos guiones `--`. Paso 3: Luego muestras tu saludo al mundo con print.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Script firmado","code":"-- Mi nombre es Estudiante y este es mi script\nprint(\"¡Módulo 01 completado!\")","language":"lua","output":"¡Módulo 01 completado!","explanation":"Comentario de firma al inicio y salida en pantalla.","position":1}],"exercises":[{"id":"198db4d2-4ec7-41b8-a72f-b347be15fdeb","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"fill_blank","difficulty":"easy","category":"fundamentos","prompt":"Escribe los dos símbolos necesarios para que la primera línea sea un comentario con tu firma y la computadora no intente ejecutarla como código:","prompt_code":"____ Autor: Tu Nombre - Programador en Lua\nprint(\"¡Código en marcha!\")","score":10,"concept_ids":["lua-fund-desafio-integrador"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"d214dacd-da1e-4887-bbd6-6fe21c519489","label":null,"body":"--","is_correct":true,"position":1}],"correct_answer_ids":["d214dacd-da1e-4887-bbd6-6fe21c519489"],"explanation":"¡Magnífico! Dos guiones seguidos `--` convierten el renglón en un comentario personal respetado por la máquina.","hints":[],"section_id":"90 // Estado reactivo y persistencia
const KEY = 'codequest_lua_m01_state';
const state = JSON.parse(localStorage.getItem(KEY) || '{"xp":0,"level":1,"streak":0,"secDone":{},"lesDone":{},"ans":{}}');
function saveState(){ localStorage.setItem(KEY, JSON.stringify(state)); }

function addXP(n){
  state.xp += n;
  state.level = Math.floor(state.xp/100) + 1;
  saveState();
  renderHeader();
  showToast('+'+n+' XP');
}

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.style.display='none', 1800);
}

// Modo Oscuro
const DARK_KEY = 'codequest_lua_dark';
function applyDark(v){
  document.documentElement.classList.toggle('dark', v);
  const b = document.getElementById('dark-toggle');
  if(b) b.textContent = v ? '☀️' : '🌙';
  localStorage.setItem(DARK_KEY, v ? 1 : 0);
}
(function(){
  const saved = localStorage.getItem(DARK_KEY);
  if(saved !== null) applyDark(saved === '1');
  else applyDark(true);
})();
document.addEventListener('click', e => {
  if(e.target && (e.target.id === 'dark-toggle' || e.target.closest('#dark-toggle'))) {
    applyDark(!document.documentElement.classList.contains('dark'));
  }
});

// Renderizar Header
function renderHeader(){
  document.getElementById('pill-xp').textContent = state.xp + ' XP';
  document.getElementById('sidebar-level').textContent = 'Nivel ' + state.level;
  document.getElementById('pill-level').textContent = 'Nv ' + state.level;
  document.getElementById('sidebar-streak').textContent = (state.streak||0) + ' 🔥 Días';
  document.getElementById('pill-streak').textContent = (state.streak||0) + ' 🔥';

  // Contar lecciones completadas (total 90)
  let totalLessons = 0;
  let doneLessons = 0;
  MOD.sections.forEach(s => {
    totalLessons += s.lessons.length;
    s.lessons.forEach(l => {
      if (l.exercises.every(q => !!state.ans[l.id+'::'+q.id])) doneLessons++;
    });
  });
  const pct = Math.round(doneLessons / totalLessons * 100) || 0;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-text').textContent = doneLessons + '/' + totalLessons + ' Lecciones (' + pct + '%)';
}

  MOD.sections.forEach((s, idx) => {

    `;

  html += '</div>';
  document.getElementById('view').innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });

function openLessonBySec(secId){
  currentSecId = secId;
  currentLesIdx = 0;
  const sec = MOD.sections.find(s=>s.id===secId) || MOD.sections[0];
  viewLeccion(sec, currentLesIdx);
}

      <div class="lesson-top-nav-btns">
        <button class="btn-nav-step" onclick="prevLes()" ${lesIdx === 0 ? 'disabled' : ''}>← Anterior</button>
        <button class="btn-nav-step" onclick="nextLes()" ${lesIdx === lessons.length - 1 ? 'disabled' : ''}>Siguiente →</button>
      </div>
    </div>

    <div class="lesson-workspace-grid">
      <div class="theory-panel">${theoryHtml}</div>
      <div class="practice-panel">${practiceHtml}</div>
    </div>
  </div>
  `;

  document.getElementById('view').innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function viewLeccionByIdx(i){
  const sec = MOD.sections.find(s=>s.id===currentSecId) || MOD.sections[0];
  viewLeccion(sec, i);
}

function prevLes(){
  const sec = MOD.sections.find(s=>s.id===currentSecId) || MOD.sections[0];
  if(currentLesIdx > 0) viewLeccion(sec, currentLesIdx - 1);
}

function nextLes(){
  const sec = MOD.sections.find(s=>s.id===currentSecId) || MOD.sections[0];
  if(currentLesIdx < sec.lessons.length - 1) {
    viewLeccion(sec, currentLesIdx + 1);
  } else {
    // Si es la última lección, pasar a la siguiente sección
    const sIdx = MOD.sections.findIndex(s=>s.id===currentSecId);
    if(sIdx < MOD.sections.length - 1) {
      openLessonBySec(MOD.sections[sIdx + 1].id);
    } else {
      showToast('¡Has llegado al final de todas las secciones! 🎉');
      viewRuta();
    }
  }
}

// Respuestas a ejercicios
function answerChoice(lesId, qId, aId){
  const sec = MOD.sections.find(s=>s.id===currentSecId);
  const les = sec?.lessons.find(l=>l.id===lesId);
  const q = les?.exercises.find(x=>x.id===qId);
  if(!q) return;

  const key = lesId + '::' + qId;
  if(state.ans[key]) return;

  const a = q.answers.find(x=>x.id===aId);
  const isOk = !!(a && a.is_correct);

  state.ans[key] = { aid: aId, correct: isOk, time: Date.now() };
  if(isOk) addXP(5);
  else saveState();

  viewLeccion(sec, currentLesIdx);
}

function answerFill(lesId, qId){
  const sec = MOD.sections.find(s=>s.id===currentSecId);
  const les = sec?.lessons.find(l=>l.id===lesId);
  const q = les?.exercises.find(x=>x.id===qId);
  if(!q) return;

  const key = lesId + '::' + qId;
  if(state.ans[key]) return;

  const inEl = document.getElementById('in-' + qId);
  const val = inEl ? inEl.value.trim() : '';
  const correctOpt = q.answers.find(a=>a.is_correct);
  const isOk = correctOpt && val.toLowerCase() === correctOpt.body.trim().toLowerCase();

  state.ans[key] = { aid: isOk ? correctOpt.id : 'wrong', given: val, correct: isOk, time: Date.now() };
  if(isOk) addXP(5);
  else saveState();

  viewLeccion(sec, currentLesIdx);
}

function completeSection(secId){
  const sec = MOD.sections.find(s=>s.id===secId);
  if(!sec) return;
  const isDone = sec.lessons.every(l => l.exercises.every(q => !!state.ans[l.id+'::'+q.id]));
  if(!isDone){
    showToast('⚠️ Completa todas las lecciones de la sección primero');
    return;
  }
  if(!state.secDone[secId]){
    state.secDone[secId] = true;
    state.streak = (state.streak||0) + 1;
    addXP(sec.xp_on_complete || 10);
    showToast('🎉 ¡Sección completada! +10 XP');
  }
  const sIdx = MOD.sections.findIndex(s=>s.id===secId);
  if(sIdx < MOD.sections.length - 1){
    openLessonBySec(MOD.sections[sIdx + 1].id);
  } else {
    viewRuta();
  }
}

      <div class="feedback-box ${answered ? (answered.correct ? 'ok' : 'no') : ''}" style="display:${answered ? 'block' : 'none'}">
        ${answered ? (answered.correct ? '🎉 ¡Correcto! ' : '❌ Incorrecto. ') + escapeHtml(q.explanation) : ''}

      <div class="exercise-footer-actions">
        <button class="btn-nav-step" style="flex:1;" onclick="prevQuiz()" ${currentQuizIdx === 0 ? 'disabled' : ''}>← Pregunta Anterior</button>
        <button class="btn-action-primary" style="flex:1;" onclick="nextQuiz()" ${currentQuizIdx === BANK.length - 1 ? 'disabled' : ''}>Siguiente Pregunta →</button>

function answerQuiz(qId, aId){
  const q = BANK.find(x=>x.id===qId);
  if(!q) return;
  const key = 'quiz::' + qId;
  if(state.ans[key]) return;

  const a = q.answers.find(x=>x.id===aId);
  const isOk = !!(a && a.is_correct);

  state.ans[key] = { aid: aId, correct: isOk, time: Date.now() };
  if(isOk) addXP(5);
  else saveState();

  viewQuiz();
}

function prevQuiz(){ if(currentQuizIdx > 0){ currentQuizIdx--; viewQuiz(); } }
function nextQuiz(){ if(currentQuizIdx < BANK.length - 1){ currentQuizIdx++; viewQuiz(); } }

// Resaltador de sintaxis Lua
function highlightLua(code){
  if(!code) return '';
  let esc = escapeHtml(code);
  const placeholders = [];
  const ph = s => { placeholders.push(s); return '__PH' + (placeholders.length-1) + '__'; };

  esc = esc.replace(/--[[[sS]*?]]/g, m=>ph('<span class="tok-comment">'+m+'</span>'));
  esc = esc.replace(/--.*$/gm, m=>ph('<span class="tok-comment">'+m+'</span>'));
  esc = esc.replace(/"([^"\\]|\\.)*"/g, m=>ph('<span class="tok-string">'+m+'</span>'));
  esc = esc.replace(/'([^'\\]|\\.)*'/g, m=>ph('<span class="tok-string">'+m+'</span>'));
  esc = esc.replace(/\b(and|break|do|else|elseif|end|false|for|function|goto|if|in|local|nil|not|or|repeat|return|then|true|until|while)\b/g, m=>ph('<span class="tok-keyword">'+m+'</span>'));
  esc = esc.replace(/\b(print|type|require|pairs|ipairs|tostring|tonumber|setmetatable|getmetatable|pcall|xpcall|error|assert|coroutine|table|string|io|os|math)\b/g, m=>ph('<span class="tok-func">'+m.trim()+'</span>'));
  esc = esc.replace(/\b(\d+(\.\d+)?)\b/g, m=>ph('<span class="tok-number">'+m+'</span>'));
  placeholders.forEach((html, i)=>{ esc = esc.replace('__PH'+i+'__', html); });
  return esc;
}

function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Event Listeners para navegación
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', ()=>{
    const nav = btn.dataset.nav;
    if(nav === 'ruta') viewRuta();
    else if(nav === 'leccion') openLessonBySec(currentSecId);
    else if(nav === 'quiz') viewQuiz();
    else if(nav === 'perfil') viewPerfil();

});

// Atajos de Teclado
window.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') {
    if (e.key === 'Enter') {
      const qid = e.target.id.replace('in-', '');
      const sec = MOD.sections.find(s=>s.id===currentSecId);
      const les = sec?.lessons[currentLesIdx];
      if (les && qid) answerFill(les.id, qid);
    }
    return;
  }

  const activeNav = document.querySelector('.nav-btn.active')?.dataset.nav;
  if (activeNav === 'leccion') {
    if (e.key === 'ArrowLeft') { prevLes(); return; }
    if (e.key === 'ArrowRight') { nextLes(); return; }

    const key = e.key.toLowerCase();
    const map = { '1':'A', '2':'B', '3':'C', '4':'D', 'a':'A', 'b':'B', 'c':'C', 'd':'D' };
    if (map[key]) {
      const label = map[key];
      const sec = MOD.sections.find(s=>s.id===currentSecId);
      const les = sec?.lessons[currentLesIdx];
      if (les) {
        const unanswered = les.exercises.find(x => !state.ans[les.id+'::'+x.id] && x.type !== 'fill_blank');
        if (unanswered) {
          const ans = unanswered.answers.find(a => a.label === label);
          if (ans) answerChoice(les.id, unanswered.id, ans.id);
        }
      }
    }
  } else if (activeNav === 'quiz') {
    if (e.key === 'ArrowLeft') { prevQuiz(); return; }
    if (e.key === 'ArrowRight') { nextQuiz(); return; }
    const key = e.key.toLowerCase();
    const map = { '1':'A', '2':'B', '3':'C', '4':'D', 'a':'A', 'b':'B', 'c':'C', 'd':'D' };
    if (map[key]) {
      const label = map[key];
      const q = BANK[currentQuizIdx];
      if (q && !state.ans['quiz::' + q.id]) {
        const ans = q.answers.find(a => a.label === label);
        if (ans) answerQuiz(q.id, ans.id);
      }
    }
  }
});

// Inicialización
renderHeader();
viewRuta();
