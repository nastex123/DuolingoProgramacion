 1","is_correct":false,"position":2},{"id":"e76ecc30-7c2a-4f5f-9dda-ef3b33cda54b","label":"C","body":"1 y luego 9","is_correct":true,"position":3},{"id":"42c8ed3a-78e8-45a0-880c-0418b6650a50","label":"D","body":"10","is_correct":false,"position":4}],"correct_answer_ids":["e76ecc30-7c2a-4f5f-9dda-ef3b33cda54b"],"explanation":"¡Exacto! Primero imprime 1 y luego, tras la reasignación, imprime 9.","hints":[]}]},{"id":"699de30c-207a-48ac-b430-f1438af15ef9","title":"Mini-repaso de la Sección 2","slug":"mini-repaso-seccion-dos-m02","position":10,"concept_id":"lua-var-s02-repaso","explanation":"¡Sección 2 superada! Paso 1: Reasignar es cambiar el contenido de la cajita. Paso 2: Los contadores usan x = x + 1. Paso 3: Las copias son independientes y Lua permite cambiar de número a texto sin problemas. ¡Ahora aprenderemos cómo clasifica Lua los tipos de datos!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Resumen S02","code":"score = 10\nscore = score + 5\nprint(\"Final:\", score)","language":"lua","output":"Final:\t15","explanation":"Reasignación y contadores dominados.","position":1}],"exercises":[{"id":"1d6341f7-e0fa-493c-8c0c-7427eb345c9f","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"Para sumarle 1 al valor actual de una variable llamada nivel, ¿cuál es la instrucción correcta?","prompt_code":null,"score":10,"concept_ids":["lua-var-s02-repaso"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"45c80066-1a91-45ec-ac24-9c9ace89e917","label":"A","body":"nivel = 1","is_correct":false,"position":1},{"id":"3f703200-7340-4d2a-8af0-2f855d2c79a7","label":"B","body":"nivel + 1","is_correct":false,"position":2},{"id":"c4dbc1ac-de09-45c6-be6c-1173b5b21dd9","label":"C","body":"print(nivel)","is_correct":false,"position":3},{"id":"4ed8e175-2407-42da-92c2-8cc722337791","label":"D","body":"nivel = nivel + 1","is_correct":true,"position":4}],"correct_answer_ids":["4ed8e175-2407-42da-92c2-8cc722337791"],"explanation":"¡Excelente! nivel = nivel + 1 toma el valor actual, le suma 1 y actualiza la variable.","hints":[]}]}]},{"id":"76af2ef4-72ef-458f-a5db-23a1fce8b521","title":"El sistema de tipos y la función type()","slug":"el-sistema-de-tipos-y-type","position":3,"type":"theory","status":"published","content_version":1,"estimated_minutes":15,"xp_on_complete":10,"lessons":[{"id":"e8e02fe1-a4d2-487d-b305-99dc7b08f7c4","title":"¿Qué es un 'tipo de dato'?","slug":"concepto-tipo-de-dato","position":1,"concept_id":"lua-type-concepto-tipo","explanation":"No todos los datos son iguales en la computadora. Paso 1: Una manzana es comida y una silla es mueble. Paso 2: De la misma manera, un número como 42 sirve para sumar, pero una palabra como \"hola\" sirve para leer. Paso 3: El 'tipo de dato' es la categoría natural a la que pertenece cada valor.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Categorías distintas","code":"edad = 20         -- Es un número\nnombre = \"Carlos\" -- Es un texto","language":"lua","output":"","explanation":"Cada dato tiene una naturaleza y reglas propias.","position":1}],"exercises":[{"id":"133cbe81-f3be-41bc-8be6-d900f1f24d9b","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"¿A qué nos referimos cuando hablamos del 'tipo de dato' en programación?","prompt_code":null,"score":10,"concept_ids":["lua-type-concepto-tipo"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"3554dd9d-ccd6-49e1-bda4-038149805391","label":"A","body":"A la categoría o naturaleza a la que pertenece un valor (como número o texto)","is_correct":true,"position":1},{"id":"da15f00c-d851-4539-8c6a-a29987045333","label":"B","body":"Al modelo físico del teclado","is_correct":false,"position":2},{"id":"4ef88c62-7430-4edf-a482-55f970536409","label":"C","body":"A la velocidad del ventilador del equipo","is_correct":false,"position":3},{"id":"2ea7ba64-2dac-426f-9bed-b74d14172970","label":"D","body":"Al color de fondo de la pantalla","is_correct":false,"position":4}],"correct_answer_ids":["3554dd9d-ccd6-49e1-bda4-038149805391"],"explanation":"¡Correcto! El tipo de dato define qué clase de información representa un valor y qué operaciones se pueden realizar con él.","hints":[]}]},{"id":"cda760e5-1911-4910-8b53-bc1e82b30e5c","title":"El catálogo completo: los 8 tipos de Lua","slug":"catalogo-ocho-tipos-lua","position":2,"concept_id":"lua-type-ocho-tipos","explanation":"Lua tiene exactamente 8 tipos nativos en todo su sistema. Paso 1: Los básicos son nil, boolean, number y string. Paso 2: Los avanzados son table, function, thread y userdata. Paso 3: ¡Solo 8! Ni uno más ni uno menos. Todo dato que exista en Lua pertenece a uno de estos 8 grupos.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Los 8 tipos","code":"-- nil, boolean, number, string\n-- table, function, thread, userdata\nprint(\"¡8 tipos en total!\")","language":"lua","output":"¡8 tipos en total!","explanation":"Lua mantiene su catálogo en solo 8 tipos elegantes.","position":1}],"exercises":[{"id":"e9a4dc42-70b3-425f-be87-7ef1760e61f5","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"¿Cuántos tipos de datos nativos existen en total en el lenguaje Lua?","prompt_code":null,"score":10,"concept_ids":["lua-type-ocho-tipos"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"a69e553e-50d7-4090-8d81-030fabf27ee6","label":"A","body":"Exactamente 2","is_correct":false,"position":1},{"id":"1cb5fd0c-ab8c-4b6d-92ba-4c51140cea20","label":"B","body":"Exactamente 8","is_correct":true,"position":2},{"id":"bf0c3910-6ee1-4600-b6a9-bfb64660ab46","label":"C","body":"Más de 500","is_correct":false,"position":3},{"id":"9b0d479d-ff30-4b1a-922e-ef3e2b49c757","label":"D","body":"Ninguno","is_correct":false,"position":4}],"correct_answer_ids":["1cb5fd0c-ab8c-4b6d-92ba-4c51140cea20"],"explanation":"¡Exacto! Lua es famoso por su minimalismo: tiene exactamente 8 tipos nativos.","hints":[]}]},{"id":"52a640e9-5326-4c4c-a3c2-07d4913fea88","title":"Conoce la función inspectora: type()","slug":"funcion-inspectora-type","position":3,"concept_id":"lua-type-funcion-inspectora","explanation":"¿Cómo saber de qué tipo es un dato? ¡Usa la función inspectora type()! Paso 1: Escribes type(). Paso 2: Adentro de los paréntesis colocas el dato o variable que quieres investigar. Paso 3: type() examina el valor y te dice exactamente a cuál de los 8 tipos pertenece.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Inspeccionar con type","code":"print(type(50))\nprint(type(\"Lua\"))","language":"lua","output":"number\nstring","explanation":"type() revela la categoría de cualquier dato.","position":1}],"exercises":[{"id":"f10323fe-e4a0-4244-b3d5-b1832cd84ee1","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué palabra mostrará la instrucción print(type(10))?","prompt_code":"print(type(10))","score":10,"concept_ids":["lua-type-funcion-inspectora"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"42d28495-0a1b-445d-b201-0e8be893f268","label":"A","body":"10","is_correct":false,"position":1},{"id":"77ffc235-3bce-4b19-b53b-de46bf952bd0","label":"B","body":"integer","is_correct":false,"position":2},{"id":"30f9fee1-08a7-4699-80b4-1632dbc426b3","label":"C","body":"number","is_correct":true,"position":3},{"id":"63b4d205-f917-4b87-8a45-386801a965f7","label":"D","body":"digito","is_correct":false,"position":4}],"correct_answer_ids":["30f9fee1-08a7-4699-80b4-1632dbc426b3"],"explanation":"¡Muy bien! Lua categoriza a todos los números bajo el tipo number.","hints":[]}]},{"id":"9dd60e71-9e22-4c62-8d0b-a5f2f1b2a50c","title":"type() siempre responde con una palabra de texto","slug":"type-retorna-string","position":4,"concept_id":"lua-type-retorna-string","explanation":"Una regla vital: la respuesta de type() siempre es una cadena de texto (string). Paso 1: Si preguntas type(50), no te responde un número; te responde el texto \"number\". Paso 2: Si preguntas type(true), te responde el texto \"boolean\". Paso 3: La inspectora siempre habla usando palabras entre comillas.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"La respuesta de type","code":"resultado = type(100)\nprint(resultado)\nprint(type(resultado)) -- ¡Es un string!","language":"lua","output":"number\nstring","explanation":"El resultado devuelto por type() siempre es de tipo string.","position":1}],"exercises":[{"id":"a2c48aa9-c9de-4772-955d-6d23f5aa6f9a","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"true_false","difficulty":"easy","category":"variables","prompt":"¿La función inspectora type() siempre devuelve como respuesta una cadena de texto (string) con el nombre del tipo?","prompt_code":null,"score":10,"concept_ids":["lua-type-retorna-string"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"b1c8ff57-fc13-4994-bbf6-436d7b05628f","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"a49f83fa-fe53-4597-a8e2-e7c5d694becc","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["a49f83fa-fe53-4597-a8e2-e7c5d694becc"],"explanation":"¡Verdadero! type(x) siempre entrega un string en minúsculas indicando la categoría.","hints":[]}]},{"id":"a4f10ac0-3e78-49a2-9f38-ff1523e52103","title":"Inspeccionar números: type(100) devuelve \"number\"","slug":"inspeccionar-number","position":5,"concept_id":"lua-type-test-number","explanation":"Tanto enteros como decimales son del tipo number. Paso 1: type(10) devuelve \"number\". Paso 2: type(3.14) devuelve \"number\". Paso 3: En Lua no hay categorías separadas para enteros y decimales en type(); ambos son felices bajo la gran sombrilla number.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Números en type","code":"print(type(42))\nprint(type(0.5))\nprint(type(-15))","language":"lua","output":"number\nnumber\nnumber","explanation":"Positivos, negativos y decimales son todos number.","position":1}],"exercises":[{"id":"4b2463b4-57ab-4c13-b827-f1ce536e86d5","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué devolverá type(-25.8)?","prompt_code":"print(type(-25.8))","score":10,"concept_ids":["lua-type-test-number"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"868812a0-27ac-4b28-b4f4-c3ae83a4cd47","label":"A","body":"decimal","is_correct":false,"position":1},{"id":"8cf9071c-083b-4219-869d-530ea7b5e0a0","label":"B","body":"float","is_correct":false,"position":2},{"id":"f130568a-530a-4fab-93de-9f1ccd27b2f7","label":"C","body":"negativo","is_correct":false,"position":3},{"id":"0b58eb29-b594-47e0-be0b-53a1d16bb9ef","label":"D","body":"number","is_correct":true,"position":4}],"correct_answer_ids":["0b58eb29-b594-47e0-be0b-53a1d16bb9ef"],"explanation":"¡Exacto! Cualquier cifra numérica se clasifica como number en Lua.","hints":[]}]},{"id":"54ba3032-dd3d-4a21-a12a-7858bd46ea52","title":"Inspeccionar textos: type(\"hola\") devuelve \"string\"","slug":"inspeccionar-string","position":6,"concept_id":"lua-type-test-string","explanation":"Cualquier texto entre comillas es un string. Paso 1: type(\"hola\") devuelve \"string\". Paso 2: type(\"123\") con comillas también devuelve \"string\", porque las comillas mandan. Paso 3: Incluso el texto vacío type(\"\") devuelve \"string\".","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Textos en type","code":"print(type(\"Guerrero\"))\nprint(type(\"999\")) -- Ojo: tiene comillas","language":"lua","output":"string\nstring","explanation":"Todo lo que esté entre comillas se clasifica como string.","position":1}],"exercises":[{"id":"29f45573-ac0f-4b5e-a244-2bf76b95a3c6","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"Cuidado con las comillas: ¿qué devuelve type(\"500\")?","prompt_code":"print(type(\"500\"))","score":10,"concept_ids":["lua-type-test-string"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"893c4a2e-7a12-4dd9-8741-72ff2fe9be42","label":"A","body":"string","is_correct":true,"position":1},{"id":"ea14256b-bdf4-4299-931c-ddffacb34214","label":"B","body":"cifra","is_correct":false,"position":2},{"id":"9e52f9e5-2832-44cf-b73b-f516e1f7cd3b","label":"C","body":"number","is_correct":false,"position":3},{"id":"c53e25a9-31d7-4bc2-9bfc-5ad067c69bea","label":"D","body":"Error","is_correct":false,"position":4}],"correct_answer_ids":["893c4a2e-7a12-4dd9-8741-72ff2fe9be42"],"explanation":"¡Excelente ojo! Al estar rodeado de comillas dobles, es un texto (string) y no un number.","hints":[]}]},{"id":"8b0a91e4-dd8e-47fd-a143-1c9575842190","title":"Inspeccionar booleanos: type(true) devuelve \"boolean\"","slug":"inspeccionar-boolean","position":7,"concept_id":"lua-type-test-boolean","explanation":"Los valores de verdad o mentira pertenecen a boolean. Paso 1: true significa verdadero y false significa falso. Paso 2: Si escribes type(true), la computadora responde \"boolean\". Paso 3: Si escribes type(false), también responde \"boolean\". Son los interruptores de la lógica.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Booleanos en type","code":"print(type(true))\nprint(type(false))","language":"lua","output":"boolean\nboolean","explanation":"true y false pertenecen a la categoría boolean.","position":1}],"exercises":[{"id":"273a6697-2583-4439-bee0-0dd597c85370","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué salida exacta producirá la siguiente instrucción?","prompt_code":"print(type(false))","score":10,"concept_ids":["lua-type-test-boolean"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"6d7dad59-0f96-4eca-b593-580bdc6fa59d","label":"A","body":"false","is_correct":false,"position":1},{"id":"76e0d8ae-d60a-4c09-b7c6-484c890d7015","label":"B","body":"boolean","is_correct":true,"position":2},{"id":"6525c113-4529-4bf4-be5c-6beef0246c57","label":"C","body":"0","is_correct":false,"position":3},{"id":"c0c3b9eb-dcfd-4a66-b883-3983d6940fae","label":"D","body":"mentira","is_correct":false,"position":4}],"correct_answer_ids":["76e0d8ae-d60a-4c09-b7c6-484c890d7015"],"explanation":"¡Correcto! false es un valor booleano, por lo que su tipo es boolean.","hints":[]}]},{"id":"dadf9aab-e8d3-483a-866a-40b37c3a1ced","title":"Inspeccionar variables: type(vidas)","slug":"inspeccionar-variable","position":8,"concept_id":"lua-type-test-variable","explanation":"Puedes pasarle una variable a type() para saber qué contiene. Paso 1: Creas vidas = 3. Paso 2: Escribes type(vidas). Paso 3: Lua mira adentro de vidas, ve el número 3 y responde \"number\". La variable no tiene tipo fijo; el tipo lo tiene el valor que lleva adentro.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Tipo de una variable","code":"arma = \"Espada\"\nprint(type(arma))","language":"lua","output":"string","explanation":"type consulta el valor dentro de arma ('Espada').","position":1}],"exercises":[{"id":"b07951d6-502c-4f06-97ce-fde4aba15078","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué imprimirá este código?","prompt_code":"salud = 100\nprint(type(salud))","score":10,"concept_ids":["lua-type-test-variable"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"edcc9838-793a-406b-94b5-7cd02f3a9996","label":"A","body":"salud","is_correct":false,"position":1},{"id":"4b16f047-0f22-4a97-88c0-16fd23245a83","label":"B","body":"100","is_correct":false,"position":2},{"id":"2ac5a723-e450-4f3a-bf2d-88d6d0db90a3","label":"C","body":"number","is_correct":true,"position":3},{"id":"a31c3bd3-62b2-4852-b5a8-5956533cf142","label":"D","body":"vida","is_correct":false,"position":4}],"correct_answer_ids":["2ac5a723-e450-4f3a-bf2d-88d6d0db90a3"],"explanation":"¡Exacto! Como salud guarda el número 100, su tipo es number.","hints":[]}]},{"id":"2005b1af-08f6-4f39-8285-873a53bf8d3b","title":"Errores comunes al comparar el resultado de type()","slug":"errores-comparar-type","position":9,"concept_id":"lua-type-errores-comparar","explanation":"Un error frecuente es olvidar que type() responde con comillas. Paso 1: Si quieres saber si x es número, debes compararlo con \"number\" (con comillas). Paso 2: Si escribes x == number sin comillas, Lua busca una variable llamada number que no existe. Paso 3: Recuerda siempre: ¡la inspectora type() responde con palabras entre comillas!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Comparación correcta","code":"nivel = 10\n-- Bien: type(nivel) == \"number\"\n-- Mal:  type(nivel) == number\nprint(type(nivel) == \"number\")","language":"lua","output":"true","explanation":"Compara siempre contra la palabra entre comillas.","position":1}],"exercises":[{"id":"7921677c-a473-4f4f-8128-9b7c5a57232c","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"true_false","difficulty":"easy","category":"variables","prompt":"Para verificar si una variable x es un número, ¿debemos comparar type(x) == \"number\" usando comillas en la palabra number?","prompt_code":null,"score":10,"concept_ids":["lua-type-errores-comparar"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"d68ab8c4-2348-4b38-adbf-ca4cd76c729e","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"f71dbc59-9039-4487-b154-412e4360982e","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["f71dbc59-9039-4487-b154-412e4360982e"],"explanation":"¡Verdadero! Como type() retorna una cadena de texto, debemos comparar contra \"number\" entre comillas.","hints":[]}]},{"id":"8afa7026-22e4-4a16-a63c-529c796151b0","title":"Mini-repaso de la Sección 3","slug":"mini-repaso-seccion-tres-m02","position":10,"concept_id":"lua-type-s03-repaso","explanation":"¡Sección 3 dominada! Paso 1: Los tipos agrupan a los valores según su naturaleza. Paso 2: Lua tiene 8 tipos nativos en total. Paso 3: Usamos type(x) para inspeccionar y siempre nos responde con un string como \"number\", \"string\" o \"boolean\". ¡Ahora exploraremos a fondo los números!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Resumen S03","code":"print(type(50), type(\"hola\"), type(true))","language":"lua","output":"number\tstring\tboolean","explanation":"Los 3 tipos más cotidianos identificados con éxito.","position":1}],"exercises":[{"id":"a199cb2f-fdf7-4925-a2d8-2bc486568d95","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"Si ejecutas type(type(100)), ¿cuál será el resultado final?","prompt_code":null,"score":10,"concept_ids":["lua-type-s03-repaso"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"eef8863d-da9d-4fdc-9c43-28acff920fe6","label":"A","body":"100","is_correct":false,"position":1},{"id":"a08f353f-df8d-497b-9d90-2d2763eb985f","label":"B","body":"number","is_correct":false,"position":2},{"id":"1d2144b8-aa81-4aae-b4bf-816c4ec69aaf","label":"C","body":"Error","is_correct":false,"position":3},{"id":"c19a92eb-fa91-4308-850c-d3041b58e58d","label":"D","body":"string","is_correct":true,"position":4}],"correct_answer_ids":["c19a92eb-fa91-4308-850c-d3041b58e58d"],"explanation":"¡Ojo de maestro! type(100) da \"number\", y luego type(\"number\") devuelve \"string\" porque es una palabra de texto.","hints":[]}]}]},{"id":"21016f2e-0fa7-4169-a03d-5a725bc28bae","title":"El tipo number: Enteros y decimales","slug":"el-tipo-number","position":4,"type":"example","status":"published","content_version":1,"estimated_minutes":15,"xp_on_complete":10,"lessons":[{"id":"84f1ea0d-8ae3-4772-9a2d-5593a064a771","title":"Números enteros (integer) en Lua","slug":"numeros-enteros-lua","position":1,"concept_id":"lua-num-enteros","explanation":"Los números enteros son los que no tienen partes fraccionarias ni comas. Paso 1: Ejemplos: 1, 5, 42, 1000. Paso 2: Se usan para contar cosas exactas: vidas, monedas, niveles o enemigos vencidos. Paso 3: Lua moderno los procesa en 64 bits de altísima velocidad.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Enteros puros","code":"monedas = 25\nenemigos = 4\nprint(\"Monedas:\", monedas, \"Enemigos:\", enemigos)","language":"lua","output":"Monedas:\t25\tEnemigos:\t4","explanation":"Cifras enteras para cantidades exactas.","position":1}],"exercises":[{"id":"f04900b6-1d63-4f94-9bfc-9b9ce2350f8e","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué mostrará este código?","prompt_code":"puntos = 150\nprint(puntos)","score":10,"concept_ids":["lua-num-enteros"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"20b4ff7c-db2f-495f-b12b-b86c7924e593","label":"A","body":"150","is_correct":true,"position":1},{"id":"9d322a7f-8cd1-4045-8974-33f1a381875e","label":"B","body":"puntos","is_correct":false,"position":2},{"id":"a5b69403-4ca2-4f51-a068-471a9d18152a","label":"C","body":"0","is_correct":false,"position":3},{"id":"62af1cee-e009-4112-9b17-361789d3e2f5","label":"D","body":"150.0","is_correct":false,"position":4}],"correct_answer_ids":["20b4ff7c-db2f-495f-b12b-b86c7924e593"],"explanation":"¡Correcto! Los enteros se imprimen limpios sin decimales innecesarios.","hints":[]}]},{"id":"104cd02d-c6e0-4873-bdf7-67b30cebebb6","title":"Números decimales (float) con punto .","slug":"numeros-decimales-float","position":2,"concept_id":"lua-num-decimales","explanation":"Para números con fracciones, usamos siempre el punto . y nunca la coma. Paso 1: Si escribes 3.14, Lua reconoce tres unidades y catorce centésimas. Paso 2: Si pusieras 3,14 con coma, Lua creería que le estás pasando dos números separados. Paso 3: Se usan para porcentajes, coordenadas del mapa y velocidades.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Decimales con punto","code":"velocidad = 4.5\ngravedad = 9.8\nprint(velocidad, gravedad)","language":"lua","output":"4.5\t9.8","explanation":"El punto . es el separador decimal universal en programación.","position":1}],"exercises":[{"id":"76ddc677-a708-4ef7-915d-b4caa798163a","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"true_false","difficulty":"easy","category":"variables","prompt":"En Lua, para escribir un número con decimales (como tres y medio), ¿debemos escribir obligatoriamente 3.5 con punto y no 3,5 con coma?","prompt_code":null,"score":10,"concept_ids":["lua-num-decimales"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"381857ae-fa95-4915-b9da-80f4b71494c1","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"f457459a-f899-4092-a323-747a9a22923f","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["f457459a-f899-4092-a323-747a9a22923f"],"explanation":"¡Verdadero! En casi todos los lenguajes de programación, el punto `.` es el separador decimal reglamentario.","hints":[]}]},{"id":"e1ffe4dc-c305-4339-bbbf-aba33556930f","title":"Números negativos con el signo menos -","slug":"numeros-negativos-lua","position":3,"concept_id":"lua-num-negativos","explanation":"Puedes representar valores bajo cero anteponiendo el signo menos -. Paso 1: Escribes -10 para menos diez. Paso 2: Se usan para temperaturas heladas, penalizaciones de puntos o movimiento hacia la izquierda en la pantalla. Paso 3: Lua los trata con las mismas reglas matemáticas que aprendiste en la escuela.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Cifras bajo cero","code":"temperatura = -5\npenalizacion = -20\nprint(temperatura, penalizacion)","language":"lua","output":"-5\t-20","explanation":"El signo menos - crea valores negativos.","position":1}],"exercises":[{"id":"708d30f3-369f-45d1-be68-ca3c5eb923c7","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué resultado dará print(-5 + 10)?","prompt_code":"print(-5 + 10)","score":10,"concept_ids":["lua-num-negativos"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"6aaf65ec-6dd4-40c3-b31b-6a5e4daf3f15","label":"A","body":"-15","is_correct":false,"position":1},{"id":"865b2e21-20c3-435f-aca8-ae22666c841c","label":"B","body":"5","is_correct":true,"position":2},{"id":"91b107e9-347c-416a-986c-d3d3cba1ef73","label":"C","body":"-510","is_correct":false,"position":3},{"id":"37d2d57b-4a93-4d1b-abac-d8b24b20eba1","label":"D","body":"Error","is_correct":false,"position":4}],"correct_answer_ids":["865b2e21-20c3-435f-aca8-ae22666c841c"],"explanation":"¡Exacto! Menos 5 más 10 da como resultado positivo 5.","hints":[]}]},{"id":"5baf8357-6e10-4fdf-b1b3-967c1420b99b","title":"Notación científica para números gigantes (1e6)","slug":"notacion-cientifica-lua","position":4,"concept_id":"lua-num-cientifica","explanation":"¿Y si quieres escribir un millón sin teclear tantos ceros? ¡Usa la letra e! Paso 1: Escribes 1e6. Paso 2: La letra e significa 'multiplicado por 10 elevado a'. Paso 3: 1e6 equivale exactamente a 1 seguido de seis ceros: 1000000. ¡Es la forma más compacta de escribir cifras astronómicas!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Millones compactos","code":"millon = 1e6\nprint(millon)","language":"lua","output":"1000000.0","explanation":"1e6 representa un millón.","position":1}],"exercises":[{"id":"d50b32ff-577e-4bc8-8ef1-1f4b35a66a1e","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿A qué número equivale la expresión 2e3?","prompt_code":"print(2e3)","score":10,"concept_ids":["lua-num-cientifica"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"5765436e-2cea-4f8d-b341-e7fb51a79859","label":"A","body":"23","is_correct":false,"position":1},{"id":"72ff873b-6d2c-4109-9f01-4bb908d3249f","label":"B","body":"200","is_correct":false,"position":2},{"id":"f6b6db8c-3c89-492d-bd0a-f6425d79ea05","label":"C","body":"2000.0","is_correct":true,"position":3},{"id":"5a4d1a96-44cd-4bb2-ad01-a80f384ba1eb","label":"D","body":"6","is_correct":false,"position":4}],"correct_answer_ids":["f6b6db8c-3c89-492d-bd0a-f6425d79ea05"],"explanation":"¡Muy bien! 2e3 significa 2 por 10 al cubo, es decir, dos mil.","hints":[]}]},{"id":"6ae57172-f2df-4b46-ad33-d5bb9119682c","title":"Números hexadecimales con 0x","slug":"numeros-hexadecimales-lua","position":5,"concept_id":"lua-num-hexadecimal","explanation":"Los programadores de videojuegos aman los números en base 16 (hexadecimal). Paso 1: Se escriben empezando con 0x. Paso 2: Usan dígitos del 0 al 9 y letras de la A a la F. Paso 3: Por ejemplo, 0xFF equivale al número 255 (el valor máximo de un color RGB). Lua lo convierte a decimal al instante.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Colores en Hex","code":"blanco = 0xFF\nprint(blanco)","language":"lua","output":"255","explanation":"0xFF en base 16 equivale a 255 en base 10.","position":1}],"exercises":[{"id":"ac6b0277-1291-415d-9bd3-873ebb175867","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿A qué número decimal equivale 0x10 en Lua?","prompt_code":"print(0x10)","score":10,"concept_ids":["lua-num-hexadecimal"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"01167527-de02-4ea5-8f35-d8c0e9777f72","label":"A","body":"10","is_correct":false,"position":1},{"id":"8b233e01-e679-41ce-9158-ff521707c912","label":"B","body":"0","is_correct":false,"position":2},{"id":"fcf9aba1-5062-43ee-a836-02661fc7578d","label":"C","body":"100","is_correct":false,"position":3},{"id":"40ff4f5b-4b15-421d-a52e-009abdfae671","label":"D","body":"16","is_correct":true,"position":4}],"correct_answer_ids":["40ff4f5b-4b15-421d-a52e-009abdfae671"],"explanation":"¡Correcto! En base 16, 0x10 equivale a dieciséis unidades.","hints":[]}]},{"id":"20ba058d-ccef-4af7-ad30-112ee8cd8237","title":"Precisión y límites de 64 bits","slug":"limites-numeros-64bit","position":6,"concept_id":"lua-num-limites-64bit","explanation":"En Lua 5.3+, los enteros tienen 64 bits de precisión. Paso 1: Pueden llegar hasta más de 9 trillones (9,223,372,036,854,775,807). Paso 2: No tienes que preocuparte de que tu puntaje de juego se quede sin espacio para contar. Paso 3: Es una capacidad enorme y ultra veloz.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Entero colosal","code":"maximo = 9223372036854775807\nprint(maximo)","language":"lua","output":"9223372036854775807","explanation":"Lua maneja enteros gigantes con total precisión nativa.","position":1}],"exercises":[{"id":"d04b6a13-0a88-4653-a0b2-f144ed18d94c","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"true_false","difficulty":"easy","category":"variables","prompt":"¿Lua moderno permite manejar números enteros inmensos de hasta 64 bits sin perder precisión?","prompt_code":null,"score":10,"concept_ids":["lua-num-limites-64bit"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"7e965359-4704-469b-be48-9cda04a34aed","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"cbbd3846-27e2-4680-be94-f0634cf7f5fd","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["cbbd3846-27e2-4680-be94-f0634cf7f5fd"],"explanation":"¡Verdadero! Desde Lua 5.3 los enteros son de 64 bits por defecto en sistemas estándar.","hints":[]}]},{"id":"dc247e16-0fcb-4feb-b3f5-4c201bacb245","title":"División entera // vs división decimal /","slug":"division-entera-vs-decimal","position":7,"concept_id":"lua-num-division-entera","explanation":"Lua tiene dos signos para dividir. Paso 1: La barra simple / hace división decimal normal: 7 / 2 da 3.5. Paso 2: La doble barra // hace división entera descartando los decimales: 7 // 2 da 3. Paso 3: La división entera es perfecta para repartir cartas o cuadrículas de un mapa sin partes fraccionarias.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Dos formas de dividir","code":"print(7 / 2)  -- 3.5 con decimales\nprint(7 // 2) -- 3 división entera","language":"lua","output":"3.5\n3","explanation":"// descarta la fracción y deja el número entero.","position":1}],"exercises":[{"id":"5e72bce7-76f7-4ff9-97b2-0fe8af1f2626","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué número mostrará la división entera 9 // 2?","prompt_code":"print(9 // 2)","score":10,"concept_ids":["lua-num-division-entera"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"aafbf587-bf77-4002-97fc-a680fda98e92","label":"A","body":"4","is_correct":true,"position":1},{"id":"6300cb5a-088c-4b37-bedd-68bb24aed0e9","label":"B","body":"5","is_correct":false,"position":2},{"id":"067cb312-e857-46cf-8630-df79ad141be2","label":"C","body":"4.5","is_correct":false,"position":3},{"id":"f6d6de76-fe54-4704-b28f-d279c4a8ac7f","label":"D","body":"4.0","is_correct":false,"position":4}],"correct_answer_ids":["aafbf587-bf77-4002-97fc-a680fda98e92"],"explanation":"¡Exacto! 9 entre 2 cabe 4 veces enteras; // desecha el .5.","hints":[]}]},{"id":"812ce406-a751-497f-b896-b4abd1d1df40","title":"El operador módulo % para residuos","slug":"operador-modulo-residuo","position":8,"concept_id":"lua-num-modulo-residuo","explanation":"El signo de porcentaje % calcula el 'residuo' o sobrante de una división. Paso 1: Si repartes 7 manzanas entre 3 amigos, le das 2 a cada uno y sobra 1. Paso 2: 7 % 3 da 1. Paso 3: El truco mágico: cualquier número % 2 da 0 si es par, y da 1 si es impar. ¡Es vital en programación!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Sobrante matemático","code":"print(7 % 3) -- Sobra 1\nprint(10 % 2) -- Da 0 (es par)","language":"lua","output":"1\n0","explanation":"% te entrega el residuo exacto que no cupo en la división.","position":1}],"exercises":[{"id":"cfa5c354-1a86-4fe4-ba16-80d4dd434438","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué resultado dará 8 % 3?","prompt_code":"print(8 % 3)","score":10,"concept_ids":["lua-num-modulo-residuo"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"db8ce872-5939-494e-8f7b-579f38821f2d","label":"A","body":"2.66","is_correct":false,"position":1},{"id":"9e7180cc-3ad2-4634-89d5-044ae9b26af0","label":"B","body":"2","is_correct":true,"position":2},{"id":"f6fb099e-46f9-4c32-9c56-88fc2b68aa6e","label":"C","body":"0","is_correct":false,"position":3},{"id":"81346570-a3fe-439e-9a5b-8de8652fc10b","label":"D","body":"1","is_correct":false,"position":4}],"correct_answer_ids":["9e7180cc-3ad2-4634-89d5-044ae9b26af0"],"explanation":"¡Correcto! 8 dividido 3 cabe 2 veces (6) y sobran 2.","hints":[]}]},{"id":"5193ab5d-c832-4c84-83c4-dbee0fbb6d88","title":"La potencia con el acento circunflejo ^","slug":"potencia-acento-circunflejo","position":9,"concept_id":"lua-num-potencia","explanation":"Para elevar un número a una potencia usamos el sombrerito ^. Paso 1: 2 ^ 3 significa 'dos multiplicado por sí mismo tres veces' (2 * 2 * 2). Paso 2: 2 ^ 3 da 8. Paso 3: 5 ^ 2 significa cinco al cuadrado y da 25. ¡Potencias limpias sin funciones raras!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Potencias en Lua","code":"print(2 ^ 3)\nprint(10 ^ 2)","language":"lua","output":"8.0\n100.0","explanation":"El operador ^ eleva el número a la potencia indicada.","position":1}],"exercises":[{"id":"009d6504-0534-42fb-8bec-069cf2ef91de","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué resultado mostrará la instrucción print(3 ^ 2)?","prompt_code":"print(3 ^ 2)","score":10,"concept_ids":["lua-num-potencia"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"0a0f1e1a-2304-4477-b486-5e56baac8fcd","label":"A","body":"6","is_correct":false,"position":1},{"id":"b9e567a1-0ff5-4bb8-bef1-e2ae55aa28e5","label":"B","body":"32","is_correct":false,"position":2},{"id":"00891df3-0474-4a61-8457-f1ede20e6537","label":"C","body":"9.0","is_correct":true,"position":3},{"id":"8f7589de-9087-42ee-b301-ecb467d1fc02","label":"D","body":"1","is_correct":false,"position":4}],"correct_answer_ids":["00891df3-0474-4a61-8457-f1ede20e6537"],"explanation":"¡Muy bien! Tres al cuadrado (3 * 3) da como resultado 9.","hints":[]}]},{"id":"1605af8a-65e6-4d5f-96d8-465c54062cd7","title":"Mini-repaso de la Sección 4","slug":"mini-repaso-seccion-cuatro-m02","position":10,"concept_id":"lua-num-s04-repaso","explanation":"¡Números dominados al 100%! Paso 1: Enteros para contar, punto . para decimales. Paso 2: 1e6 para millones y 0xFF para hexadecimales. Paso 3: // para división entera, % para residuos y ^ para potencias. ¡Ahora entraremos al universo de los textos y cadenas!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Resumen S04","code":"a = 10\nb = 3\nprint(\"División:\", a // b, \"Residuo:\", a % b)","language":"lua","output":"División:\t3\tResiduo:\t1","explanation":"Todas las herramientas numéricas aprendidas.","position":1}],"exercises":[{"id":"ff16ebe3-946e-4ee0-9d44-79b1f1ff302f","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"¿Cuál de los siguientes operadores en Lua calcula el residuo o sobrante de una división?","prompt_code":null,"score":10,"concept_ids":["lua-num-s04-repaso"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"c5ee19e8-75ac-4211-87d9-f46182b6e78c","label":"A","body":"//","is_correct":false,"position":1},{"id":"1e1846d1-202b-4500-b1bd-25057818b6a3","label":"B","body":"/","is_correct":false,"position":2},{"id":"02435fcd-fa09-485b-88a3-0f3779ec7c93","label":"C","body":"^","is_correct":false,"position":3},{"id":"61a48527-6a5e-4579-9c58-756a27e4bf31","label":"D","body":"%","is_correct":true,"position":4}],"correct_answer_ids":["61a48527-6a5e-4579-9c58-756a27e4bf31"],"explanation":"¡Excelente! El operador % (módulo) obtiene el residuo de la división.","hints":[]}]}]},{"id":"3f6eed30-28a6-4764-8051-32979679948b","title":"El tipo string: Textos y bloques","slug":"el-tipo-string","position":5,"type":"example","status":"published","content_version":1,"estimated_minutes":15,"xp_on_complete":10,"lessons":[{"id":"b7acf65c-de03-49bc-9462-ace8bd4e5bf8","title":"Qué es una cadena o string","slug":"concepto-string-cadena","position":1,"concept_id":"lua-str-concepto","explanation":"Una cadena (string) es una secuencia ordenada de caracteres: letras, números, espacios o símbolos. Paso 1: Se llama 'cadena' porque cada letra va enlazada como eslabones de una cadena. Paso 2: Todo lo que esté envuelto entre comillas es un string. Paso 3: Es la materia prima de nombres, diálogos y descripciones.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Cadena simple","code":"mensaje = \"Bienvenido al calabozo\"\nprint(mensaje)","language":"lua","output":"Bienvenido al calabozo","explanation":"La cadena almacena la frase entera.","position":1}],"exercises":[{"id":"d4bcc515-a21b-4f6c-8cfe-0a8b5109bb16","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"En Lua, ¿a qué nos referimos cuando hablamos de un valor tipo string?","prompt_code":null,"score":10,"concept_ids":["lua-str-concepto"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"d2a0b27c-b434-47fa-9aa3-8ba9d7fdeca6","label":"A","body":"A una secuencia de caracteres o texto envuelta entre comillas","is_correct":true,"position":1},{"id":"0ca7949d-f68d-4ff0-9668-adf27ffee122","label":"B","body":"A una tarjeta gráfica","is_correct":false,"position":2},{"id":"194bae6a-9b74-4dd5-90ab-b59f4fbe3300","label":"C","body":"Al cable de corriente","is_correct":false,"position":3},{"id":"f0b3f85e-fd6f-4da2-b841-5047985b5941","label":"D","body":"A un número decimal con coma","is_correct":false,"position":4}],"correct_answer_ids":["d2a0b27c-b434-47fa-9aa3-8ba9d7fdeca6"],"explanation":"¡Correcto! Un string es cualquier texto plano delimitado por comillas o corchetes.","hints":[]}]},{"id":"4db15e3e-e5d9-42d7-8fae-36a557f6e52b","title":"Comillas dobles \"\" para textos directos","slug":"comillas-dobles-string","position":2,"concept_id":"lua-str-comillas-dobles","explanation":"Las comillas dobles \"\" son el estándar más común en Lua. Paso 1: Abres con \" y cierras con \". Paso 2: Adentro puedes poner cualquier frase: \"Guerrero Nivel 1\". Paso 3: Si adentro del texto necesitas usar comillas simples, puedes hacerlo sin problemas: \"El arma se llama 'Excalibur'\".","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Comillas dobles con simples adentro","code":"frase = \"El héroe dijo: '¡Adelante!'\"\nprint(frase)","language":"lua","output":"El héroe dijo: '¡Adelante!'","explanation":"Las comillas dobles permiten incluir comillas simples adentro sin conflicto.","position":1}],"exercises":[{"id":"87b6278e-cf89-4928-af69-13aa5abab686","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Cómo se verá este texto en pantalla?","prompt_code":"t = \"Nivel 'Experto'\"\nprint(t)","score":10,"concept_ids":["lua-str-comillas-dobles"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"d24fe808-9f4b-40f9-8ccb-e90c42cc9b52","label":"A","body":"Nivel Experto (sin comillas)","is_correct":false,"position":1},{"id":"7b5f3ce4-cb70-41c4-84ef-db9d473a1351","label":"B","body":"Nivel 'Experto'","is_correct":true,"position":2},{"id":"e38ee1bc-0216-4bf1-a416-f6a7656c6b6f","label":"C","body":"\"Nivel 'Experto'\"","is_correct":false,"position":3},{"id":"90910d20-315f-4403-a5d4-f47034608472","label":"D","body":"Error","is_correct":false,"position":4}],"correct_answer_ids":["7b5f3ce4-cb70-41c4-84ef-db9d473a1351"],"explanation":"¡Exacto! Las comillas dobles exteriores no se imprimen, pero las simples interiores sí se muestran.","hints":[]}]},{"id":"ba4aa3b0-07ef-47ab-869f-2319fb0699d8","title":"Comillas simples '' para textos con comillas dobles","slug":"comillas-simples-string","position":3,"concept_id":"lua-str-comillas-simples","explanation":"A la inversa, las comillas simples '' son perfectas para envolver textos que llevan comillas dobles adentro. Paso 1: Abres con ' y cierras con '. Paso 2: Escribes: 'Ella gritó: \"¡Cuidado!\"'. Paso 3: Como abriste con simple, la comilla doble de adentro no rompe la cadena. ¡Tienes total versatilidad!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Comillas simples con dobles adentro","code":"cita = 'El libro dice: \"Aprende Lua\"'\nprint(cita)","language":"lua","output":"El libro dice: \"Aprende Lua\"","explanation":"Las comillas simples envuelven sin romper las dobles interiores.","position":1}],"exercises":[{"id":"1f9ad69a-f676-4f34-9702-5b3a3d2b2f0f","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"true_false","difficulty":"easy","category":"variables","prompt":"En Lua, ¿puedes usar comillas simples '' para crear un texto que contenga comillas dobles \"\" en su interior?","prompt_code":null,"score":10,"concept_ids":["lua-str-comillas-simples"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"78cde370-a428-44e9-b654-9949279437a8","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"67209f9e-5a57-4310-9e4b-a6044c9452da","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["67209f9e-5a57-4310-9e4b-a6044c9452da"],"explanation":"¡Verdadero! Alternar entre comillas dobles y simples evita tener que escapar caracteres.","hints":[]}]},{"id":"cc16fa60-88fe-4b2b-ac1b-495c53e47ada","title":"Salto de línea con \\n","slug":"salto-de-linea-escape","position":4,"concept_id":"lua-str-escape-newline","explanation":"¿Cómo escribes dos renglones en una sola línea de código? ¡Usa la barra invertida y n: \\n! Paso 1: En inglés 'n' significa newline (nueva línea). Paso 2: Si escribes \"Línea 1\\nLínea 2\", la computadora baja de renglón en ese punto exacto. Paso 3: No necesitas llamar a print dos veces.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Salto de renglón","code":"poema = \"Rosas rojas\\nCielo azul\"\nprint(poema)","language":"lua","output":"Rosas rojas\nCielo azul","explanation":"\\n baja inmediatamente al siguiente renglón en pantalla.","position":1}],"exercises":[{"id":"5bdb4166-7d3c-462b-86db-5391410bc9f4","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿En cuántos renglones aparecerá este mensaje al imprimirse?","prompt_code":"print(\"Uno\\nDos\\nTres\")","score":10,"concept_ids":["lua-str-escape-newline"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"aa52b4c1-43d8-49b6-aae7-5f21c779981d","label":"A","body":"En 1 solo renglón largo","is_correct":false,"position":1},{"id":"0c628c80-db91-4291-a99a-f4bea803c47b","label":"B","body":"En 2 renglones","is_correct":false,"position":2},{"id":"34dcd3c5-d1bf-4e8a-a9d2-3a7353f9023e","label":"C","body":"En 3 renglones separados","is_correct":true,"position":3},{"id":"2fb3ea09-fc35-451b-9451-3b2d07ac871f","label":"D","body":"En 0 renglones","is_correct":false,"position":4}],"correct_answer_ids":["34dcd3c5-d1bf-4e8a-a9d2-3a7353f9023e"],"explanation":"¡Muy bien! Cada \\n genera un salto de renglón, distribuyendo el texto en 3 líneas.","hints":[]}]},{"id":"501bbdac-be5c-4cb9-9691-09c9485e3ca6","title":"Tabulador con \\t para columnas limpias","slug":"tabulador-escape-columna","position":5,"concept_id":"lua-str-escape-tab","explanation":"Para alinear columnas como en una tabla usamos \\t. Paso 1: La letra 't' significa tabulador. Paso 2: Da un salto horizontal de 4 a 8 espacios. Paso 3: Si escribes \"Nombre:\\tArturo\\nClase:\\tGuerrero\", los datos quedarán perfectamente alineados como en una tabla de Excel.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Columnas con tabulador","code":"print(\"Héroe\\tNivel\\nAna\\t10\\nBeto\\t12\")","language":"lua","output":"Héroe\tNivel\nAna\t10\nBeto\t12","explanation":"\\t alinea los datos horizontalmente en columnas.","position":1}],"exercises":[{"id":"97814329-7214-41d6-b841-90fc64551147","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"¿Qué secuencia de escape debes usar dentro de un texto para insertar una separación por tabulador?","prompt_code":null,"score":10,"concept_ids":["lua-str-escape-tab"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"43bc2ace-5ec6-46c9-9b53-48303abdd6c1","label":"A","body":"\\n","is_correct":false,"position":1},{"id":"4fdf47f3-5499-4605-8985-22f4f9a7970d","label":"B","body":"\\s","is_correct":false,"position":2},{"id":"424389ca-f1f8-4b84-b976-8e616f585c31","label":"C","body":"\\b","is_correct":false,"position":3},{"id":"d6f6d500-95cb-4822-a247-02d6b23202ba","label":"D","body":"\\t","is_correct":true,"position":4}],"correct_answer_ids":["d6f6d500-95cb-4822-a247-02d6b23202ba"],"explanation":"¡Exacto! \\t representa el tabulador horizontal.","hints":[]}]},{"id":"b9d8c2ab-f922-4011-985f-bec0e77380f5","title":"Escapar comillas con barra invertida \\\"","slug":"escapar-comillas-barra","position":6,"concept_id":"lua-str-escape-comilla","explanation":"¿Y si abriste con comillas dobles y quieres poner OTRA comilla doble adentro? Paso 1: Si pones \"Lua \"genial\"\" fallará porque Lua cree que la cadena se cerró. Paso 2: Antepón una barra invertida a la comilla interna: \\\"genial\\\". Paso 3: La barra avisa: 'No cierres el texto, solo dibuja esta comilla'. A esto se le llama 'escapar'.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Escapar comillas","code":"print(\"El juego se llama \\\"Aventura Lunar\\\"\")","language":"lua","output":"El juego se llama \"Aventura Lunar\"","explanation":"La barra \\ permite incluir comillas del mismo tipo adentro.","position":1}],"exercises":[{"id":"805dd1f4-ede8-47f5-b578-670d89710644","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué salida exacta producirá este print?","prompt_code":"print(\"Dijo: \\\"Hola\\\"\")","score":10,"concept_ids":["lua-str-escape-comilla"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"3c5a066b-255d-48ab-8441-844fa560b5b2","label":"A","body":"Dijo: \"Hola\"","is_correct":true,"position":1},{"id":"2422bc0a-5833-4883-b031-9953b3268bbd","label":"B","body":"Dijo: Hola","is_correct":false,"position":2},{"id":"56a8d78b-d7aa-46ee-9b40-2ed483a12664","label":"C","body":"Error de sintaxis","is_correct":false,"position":3},{"id":"4fe9c1a4-ce69-4b74-b1d3-e5662d10d6ef","label":"D","body":"Dijo: \\\"Hola\\\"","is_correct":false,"position":4}],"correct_answer_ids":["3c5a066b-255d-48ab-8441-844fa560b5b2"],"explanation":"¡Correcto! Las barras invertidas escapan las comillas y permiten dibujarlas en pantalla.","hints":[]}]},{"id":"e1eef2ea-8e8e-4a0c-bf60-09e96627a6ec","title":"Cadenas multilínea con corchetes dobles [[ ]]","slug":"bloques-multilinea-corchetes","position":7,"concept_id":"lua-str-bloque-multilinea","explanation":"Lua tiene una súper función: textos de varias líneas con corchetes dobles [[ ]]. Paso 1: Abres con [[ y cierras con ]]. Paso 2: Todo lo que escribas adentro puede abarcar 5, 10 o 50 renglones reales. Paso 3: ¡No necesitas poner \\n en ningún lado! Puedes dar saltos con la tecla Enter normalmente.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Bloque multilínea","code":"carta = [[\nQuerido aventurero:\nTu misión comienza en el bosque.\n¡Buena suerte!\n]]\nprint(carta)","language":"lua","output":"Querido aventurero:\nTu misión comienza en el bosque.\n¡Buena suerte!","explanation":"Los corchetes [[ ]] capturan párrafos enteros con saltos naturales.","position":1}],"exercises":[{"id":"3dca904b-5391-410d-b58f-de6d40787218","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"true_false","difficulty":"easy","category":"variables","prompt":"En Lua, ¿puedes envolver un texto largo entre corchetes dobles [[ ]] para escribir múltiples renglones sin usar \\n?","prompt_code":null,"score":10,"concept_ids":["lua-str-bloque-multilinea"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"e915ed3b-c382-459c-bdaa-689ab69b1125","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"07b9000c-bc62-43a3-a309-1767ec08d1e6","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["07b9000c-bc62-43a3-a309-1767ec08d1e6"],"explanation":"¡Verdadero! Los corchetes dobles [[ ]] delimitan literales de cadena multilínea.","hints":[]}]},{"id":"b19e7047-b627-474a-843e-c10f945e90ae","title":"Conservar saltos exactos en bloques [[ ]]","slug":"arte-ascii-bloques","position":8,"concept_id":"lua-str-bloque-saltos","explanation":"Los bloques [[ ]] respetan cada espacio y cada enter al milímetro. Paso 1: Son la herramienta favorita para dibujar arte ASCII en la consola (como espadas, dragones o logos). Paso 2: También sirven para escribir mapas enteros de juego usando letras: '#####'. Paso 3: Lo que ves en el editor es exactamente lo que sale en la pantalla.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Dibujo ASCII","code":"espada = [[\n  /|\n / |\n | |\n |/ \n]]\nprint(espada)","language":"lua","output":"  /|\n / |\n | |\n |/ ","explanation":"Mantiene la geometría y espacios del dibujo con total fidelidad.","position":1}],"exercises":[{"id":"771ae976-2c45-45dd-bd0d-f0d2dc7f8af9","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"¿Cuál de las siguientes opciones es la forma más limpia en Lua para almacenar un mapa de juego de 10 líneas de texto?","prompt_code":null,"score":10,"concept_ids":["lua-str-bloque-saltos"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"d01784ac-b2d3-4825-b5e7-556a93cb0613","label":"A","body":"Escribir 10 prints separados","is_correct":false,"position":1},{"id":"1afbcb81-d79d-499c-8f35-12db78106b22","label":"B","body":"Usar corchetes dobles [[ ]] para un bloque multilínea limpio","is_correct":true,"position":2},{"id":"3a026cb9-9f6e-44bc-b87b-0a722a32a8b6","label":"C","body":"Poner diez veces \\n en una línea larguísima","is_correct":false,"position":3},{"id":"548d7317-ac9a-4473-933c-be8a78266cc0","label":"D","body":"Guardar el texto en 10 computadoras distintas","is_correct":false,"position":4}],"correct_answer_ids":["1afbcb81-d79d-499c-8f35-12db78106b22"],"explanation":"¡Excelente! [[ ]] permite escribir bloques grandes de texto con formato visual idéntico.","hints":[]}]},{"id":"80c112d7-eea3-4135-8c3c-a8f68914a757","title":"El operador longitud # para contar letras","slug":"operador-longitud-hash","position":9,"concept_id":"lua-str-longitud-hash","explanation":"¿Quieres saber cuántas letras tiene una palabra? ¡Usa el símbolo numeral #! Paso 1: El operador # se coloca antes del texto o variable: #\"hola\". Paso 2: Lua cuenta los caracteres y te responde un número. Paso 3: #\"hola\" devuelve 4, porque 'h-o-l-a' tiene 4 letras. ¡Es súper útil para validar contraseñas!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Contar letras","code":"usuario = \"Goku\"\nprint(\"Letras:\", #usuario)","language":"lua","output":"Letras:\t4","explanation":"El operador # calcula la longitud de la cadena.","position":1}],"exercises":[{"id":"11350da3-26e2-4831-b06a-c964a4e74b04","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué número mostrará la instrucción print(#\"Lua\")?","prompt_code":"print(#\"Lua\")","score":10,"concept_ids":["lua-str-longitud-hash"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"51b7e359-4184-48b2-b069-066c40b31dba","label":"A","body":"#Lua","is_correct":false,"position":1},{"id":"e7b50a25-d5e7-46ac-8a1a-323710d03cba","label":"B","body":"1","is_correct":false,"position":2},{"id":"bf6d2a21-241b-46a1-ba6d-2dede031e3d1","label":"C","body":"3","is_correct":true,"position":3},{"id":"ca6adbb7-ed3e-4ff8-9712-14aee0cec972","label":"D","body":"Error","is_correct":false,"position":4}],"correct_answer_ids":["bf6d2a21-241b-46a1-ba6d-2dede031e3d1"],"explanation":"¡Exacto! 'L-u-a' tiene 3 caracteres; # devuelve 3.","hints":[]}]},{"id":"de6620ad-8cfa-47ce-b86f-a48e5dd82e9e","title":"Mini-repaso de la Sección 5","slug":"mini-repaso-seccion-cinco-m02","position":10,"concept_id":"lua-str-s05-repaso","explanation":"¡Cadenas dominadas! Paso 1: Usamos \"\" o '' según convenga. Paso 2: \\n salta de renglón y \\t da espacios de tabulador. Paso 3: [[ ]] guarda bloques multilínea sin esfuerzo y # cuenta las letras. ¡Ahora entraremos al mundo de la verdad con los booleanos!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Resumen S05","code":"palabra = \"Aventura\"\nprint(palabra, \"mide\", #palabra, \"letras\")","language":"lua","output":"Aventura\tmide\t8\tletras","explanation":"Textos y operadores de cadena consolidados.","position":1}],"exercises":[{"id":"587a5854-a729-497d-add9-f20d56049304","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué número dará print(#\"abc\\n\")?","prompt_code":"print(#\"abc\\n\")","score":10,"concept_ids":["lua-str-s05-repaso"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"37f9f56a-571d-4672-81f8-f8e3c641895e","label":"A","body":"5","is_correct":false,"position":1},{"id":"8e8baa9e-0721-4e79-a557-af6afbf7b81b","label":"B","body":"3","is_correct":false,"position":2},{"id":"980ad4d2-67aa-4c06-88f9-0e2b66999405","label":"C","body":"2","is_correct":false,"position":3},{"id":"76895407-7f88-47ab-9380-e57098ad1836","label":"D","body":"4","is_correct":true,"position":4}],"correct_answer_ids":["76895407-7f88-47ab-9380-e57098ad1836"],"explanation":"¡Ojo fino! Son 3 letras (a, b, c) más 1 carácter especial de salto (\\n), dando un total de 4 bytes.","hints":[]}]}]},{"id":"5733cafc-e6f6-46ef-9818-fb3c45da08da","title":"El tipo boolean: La lógica de la verdad","slug":"el-tipo-boolean","position":6,"type":"exercise","status":"published","content_version":1,"estimated_minutes":15,"xp_on_complete":10,"lessons":[{"id":"d1a4e285-b13b-4cdf-9f79-e4a171e6c43a","title":"Qué es un valor booleano","slug":"concepto-booleano","position":1,"concept_id":"lua-bool-concepto","explanation":"En la vida tomamos decisiones con sí o no. En la computadora usamos booleanos. Paso 1: Se llaman así por George Boole, el matemático que inventó la lógica binaria. Paso 2: Solo pueden tener dos estados posibles: encendido o apagado. Paso 3: Son el motor detrás de cada 'si el jugador tiene vidas, continúa jugando'.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Decisión booleana","code":"en_partida = true\nprint(\"¿Jugando?:\", en_partida)","language":"lua","output":"¿Jugando?:\ttrue","explanation":"Un booleano almacena verdad o falsedad.","position":1}],"exercises":[{"id":"4ab9e869-7c2b-4398-a14b-6cd7a8733f8b","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"¿Cuál es el propósito de los valores booleanos en programación?","prompt_code":null,"score":10,"concept_ids":["lua-bool-concepto"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"160b6bec-416d-4916-99b5-1fb93a045094","label":"A","body":"Representar estados lógicos de verdad o falsedad para tomar decisiones","is_correct":true,"position":1},{"id":"85698fbc-ba54-430c-a4e6-ff6f2d5449e4","label":"B","body":"Medir distancias en metros","is_correct":false,"position":2},{"id":"b072d749-74cc-4d35-bf8d-fc36f1619044","label":"C","body":"Aumentar el volumen del sonido","is_correct":false,"position":3},{"id":"e3a82788-9f49-498d-b6de-d6767fd4a0e5","label":"D","body":"Guardar fotos de alta resolución","is_correct":false,"position":4}],"correct_answer_ids":["160b6bec-416d-4916-99b5-1fb93a045094"],"explanation":"¡Correcto! Los booleanos representan estados de verdad (true) o mentira (false).","hints":[]}]},{"id":"e146a03b-185c-4c16-bfc2-07766014e55f","title":"Los únicos dos estados: true y false","slug":"estados-true-false","position":2,"concept_id":"lua-bool-estados","explanation":"A diferencia de los números que son infinitos, en boolean solo existen dos palabras sagradas: true y false. Paso 1: true significa 'verdadero' o sí. Paso 2: false significa 'falso' o no. Paso 3: Se escriben en minúsculas y SIN comillas. Si les pones comillas, ¡se vuelven textos!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Los dos hermanos","code":"activo = true\npausado = false\nprint(activo, pausado)","language":"lua","output":"true\tfalse","explanation":"true y false son palabras clave directas sin comillas.","position":1}],"exercises":[{"id":"2fd4e56d-cad6-4c5a-9872-c438c25f1f2a","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"Cuidado: ¿cuál es el tipo de dato de dato = \"true\" con comillas?","prompt_code":"dato = \"true\"\nprint(type(dato))","score":10,"concept_ids":["lua-bool-estados"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"8096a8c8-ec15-4b3f-8ee1-d7b0da10da0f","label":"A","body":"boolean","is_correct":false,"position":1},{"id":"3dcba0f6-1a1f-4d6e-ba0b-dcdefb9f2082","label":"B","body":"string","is_correct":true,"position":2},{"id":"87098c18-1777-4c0b-87b4-95d0f8a19837","label":"C","body":"verdad","is_correct":false,"position":3},{"id":"0c10cdea-f519-4896-910a-fad751213f7f","label":"D","body":"Error","is_correct":false,"position":4}],"correct_answer_ids":["3dcba0f6-1a1f-4d6e-ba0b-dcdefb9f2082"],"explanation":"¡Excelente! Al tener comillas, es una cadena de texto (string) y no un booleano.","hints":[]}]},{"id":"7e7a6b76-1697-4e3c-b3fb-8a48d5a33d46","title":"La regla de oro: los únicos dos falsos son false y nil","slug":"regla-oro-falsy-lua","position":3,"concept_id":"lua-bool-regla-falsy","explanation":"Esta es la regla más importante de Lua: solo false y nil cuentan como 'mentira' o falso. Paso 1: false es el booleano negativo. Paso 2: nil es la ausencia de dato. Paso 3: Absolutamente TODO lo demás en el universo de Lua cuenta como verdadero. ¡Recuerda esta regla siempre!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Solo false y nil son falsos","code":"-- En Lua:\n-- false => falso\n-- nil   => falso\n-- TODO LO DEMÁS => VERDADERO","language":"lua","output":"","explanation":"La regla universal de condiciones en Lua.","position":1}],"exercises":[{"id":"8f491508-e33d-462d-ac1a-c63d4ea21814","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"En Lua, ¿cuáles son las ÚNICAS dos cosas que se consideran falsas en una condición?","prompt_code":null,"score":10,"concept_ids":["lua-bool-regla-falsy"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"33f6a0c7-f346-4ee5-afd9-4f21b53a94a9","label":"A","body":"El número 0 y el texto vacío","is_correct":false,"position":1},{"id":"5fac7af5-50ce-48bb-ae53-41ae6d221d42","label":"B","body":"Cualquier número negativo","is_correct":false,"position":2},{"id":"e3fc064b-153f-44f5-9157-f450ab2c7492","label":"C","body":"Únicamente false y nil","is_correct":true,"position":3},{"id":"b319f1ad-c87d-4ca6-a99c-1917d5e6df1d","label":"D","body":"Todos los números impares","is_correct":false,"position":4}],"correct_answer_ids":["e3fc064b-153f-44f5-9157-f450ab2c7492"],"explanation":"¡Exacto! Solo false y nil se evalúan como falsos; todo lo demás es verdadero.","hints":[]}]},{"id":"dcd82910-80b6-4f0b-bfcf-7174d7cf089e","title":"El número 0 cuenta como verdadero en Lua","slug":"cero-es-verdadero-en-lua","position":4,"concept_id":"lua-bool-cero-es-true","explanation":"En otros lenguajes viejos como C o Python, el número 0 se considera falso. ¡En Lua NO! Paso 1: En Lua, 0 es un número real perfectamente válido. Paso 2: Como no es false ni es nil, 0 cuenta como VERDADERO. Paso 3: Tener 0 monedas no significa que la caja no exista.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Cero es verdad","code":"monedas = 0\nprint(\"En Lua, el número 0 es verdadero\")","language":"lua","output":"En Lua, el número 0 es verdadero","explanation":"0 no apaga condiciones en Lua.","position":1}],"exercises":[{"id":"02d63b01-e6e0-4f86-8b3f-6899deb367d4","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"true_false","difficulty":"easy","category":"variables","prompt":"En Lua, ¿el número 0 se evalúa como falso al igual que en otros lenguajes de programación?","prompt_code":null,"score":10,"concept_ids":["lua-bool-cero-es-true"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"bc261728-e4ba-49b3-bd11-1a7e86a0c82e","label":"A","body":"Verdadero","is_correct":false,"position":1},{"id":"35078fe9-6842-4ae6-bc3e-a3bf60100144","label":"B","body":"Falso","is_correct":true,"position":2}],"correct_answer_ids":["35078fe9-6842-4ae6-bc3e-a3bf60100144"],"explanation":"¡Falso! En Lua el número 0 es VERDADERO. Solo false y nil son falsos.","hints":[]}]},{"id":"4a4ee929-0721-432a-862f-3466cf602d8c","title":"El texto vacío \"\" cuenta como verdadero en Lua","slug":"vacio-es-verdadero-en-lua","position":5,"concept_id":"lua-bool-vacio-es-true","explanation":"Lo mismo ocurre con una cadena de texto sin letras: \"\". Paso 1: En Python o JavaScript, un texto vacío \"\" cuenta como falso. Paso 2: ¡En Lua cuenta como VERDADERO! Paso 3: ¿Por qué? Porque la cadena existe en memoria, aunque no tenga caracteres adentro. ¡Recuerda: solo false y nil!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Texto vacío es verdad","code":"texto = \"\"\nprint(\"El texto vacío existe, por tanto es verdadero\")","language":"lua","output":"El texto vacío existe, por tanto es verdadero","explanation":"Las cadenas vacías son verdaderas en Lua.","position":1}],"exercises":[{"id":"4715fa78-7692-4cec-9526-a923193dfc7d","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"¿Cómo evalúa Lua a una cadena de texto vacía \"\"?","prompt_code":null,"score":10,"concept_ids":["lua-bool-vacio-es-true"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"f14011a3-08bc-4e58-8045-a244f4ef0f30","label":"A","body":"Como falsa","is_correct":false,"position":1},{"id":"307c868b-96b2-4859-a13f-204a97d3826d","label":"B","body":"Como error de sistema","is_correct":false,"position":2},{"id":"6b5f2d31-3e44-4bfd-b8dd-563a6ca68612","label":"C","body":"Como número cero","is_correct":false,"position":3},{"id":"51b5105c-77e2-4517-8877-201a28778779","label":"D","body":"Como verdadera, porque en Lua solo false y nil son falsos","is_correct":true,"position":4}],"correct_answer_ids":["51b5105c-77e2-4517-8877-201a28778779"],"explanation":"¡Muy bien! \"\" es verdadero porque solo false y nil son falsos en Lua.","hints":[]}]},{"id":"a6c68d3b-c1db-4b03-a5bf-bfaf26b2157e","title":"El operador lógico not para invertir verdades","slug":"operador-logico-not","position":6,"concept_id":"lua-bool-operador-not","explanation":"La palabra not actúa como un espejo que invierte cualquier verdad. Paso 1: Si tienes true y le pones not al frente: not true se convierte en false. Paso 2: Si tienes false y le pones not al frente: not false se convierte en true. Paso 3: Es el interruptor que cambia el estado al opuesto.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Invertir con not","code":"print(not true)  -- Muestra false\nprint(not false) -- Muestra true","language":"lua","output":"false\ntrue","explanation":"not invierte la verdad al instante.","position":1}],"exercises":[{"id":"19d07d45-af13-4551-a69f-14ca3aa9663f","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué salida mostrará print(not false)?","prompt_code":"print(not false)","score":10,"concept_ids":["lua-bool-operador-not"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"a02d674b-0102-4031-8644-fbe10b7292c1","label":"A","body":"true","is_correct":true,"position":1},{"id":"7194056c-6f4f-434b-a84f-b1e93de6eb43","label":"B","body":"nil","is_correct":false,"position":2},{"id":"e8fd7558-5f6b-420f-8d95-66bb4ba6c256","label":"C","body":"false","is_correct":false,"position":3},{"id":"4292fa88-6266-451a-bd1d-50b7f4f1d262","label":"D","body":"0","is_correct":false,"position":4}],"correct_answer_ids":["a02d674b-0102-4031-8644-fbe10b7292c1"],"explanation":"¡Exacto! not false se convierte en true.","hints":[]}]},{"id":"baf3c439-2d0a-49cb-a657-e68d4ddec0e8","title":"Doble negación: not not x","slug":"doble-negacion-booleana","position":7,"concept_id":"lua-bool-doble-not","explanation":"Un truco de profesional: usar not dos veces para extraer el booleano puro. Paso 1: Si tienes un número como 42. Paso 2: not 42 da false (porque 42 es verdad). Paso 3: not not 42 vuelve a invertir y da true. ¡Así puedes transformar cualquier dato en un true o false limpio!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Doble negación","code":"print(not not 100)   -- Da true\nprint(not not nil)   -- Da false","language":"lua","output":"true\nfalse","explanation":"not not convierte cualquier valor a su booleano equivalente.","position":1}],"exercises":[{"id":"b7dcdde7-be03-4a3c-b58f-cda6abfbff6f","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué dará la expresión print(not not 0)?","prompt_code":"print(not not 0)","score":10,"concept_ids":["lua-bool-doble-not"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"511f768f-0b33-4ecb-9ce6-94c42dc7f650","label":"A","body":"false","is_correct":false,"position":1},{"id":"93a97fed-f2d4-4c1e-9c89-1db0963f54a5","label":"B","body":"true","is_correct":true,"position":2},{"id":"d1507a1a-3288-4fe1-8313-e4f3e85a6c07","label":"C","body":"0","is_correct":false,"position":3},{"id":"ad935930-0ba8-4c37-b241-26a296cba99d","label":"D","body":"Error","is_correct":false,"position":4}],"correct_answer_ids":["93a97fed-f2d4-4c1e-9c89-1db0963f54a5"],"explanation":"¡Correcto! Como 0 es verdadero en Lua, not not 0 devuelve true.","hints":[]}]},{"id":"a8ebcb10-8aa2-474b-bfa4-25559d8fc841","title":"Comparaciones directas que producen booleanos","slug":"comparaciones-producen-booleanos","position":8,"concept_id":"lua-bool-comparacion-resultado","explanation":"Cada vez que haces una pregunta matemática con signos de comparación, el resultado es un booleano. Paso 1: ¿5 es mayor que 3? Escribes 5 > 3. Paso 2: Como es cierto, Lua calcula y responde true. Paso 3: Si preguntas 10 == 20 (¿son iguales?), responde false.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Comparar produce booleanos","code":"vidas = 3\nvivo = (vidas > 0)\nprint(\"¿Está vivo?:\", vivo)","language":"lua","output":"¿Está vivo?:\ttrue","explanation":"Las comparaciones generan un valor de tipo boolean.","position":1}],"exercises":[{"id":"b298ac97-1a9f-4b40-82ef-273a639afe02","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué mostrará print(10 > 50)?","prompt_code":"print(10 > 50)","score":10,"concept_ids":["lua-bool-comparacion-resultado"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"0bd7399e-22e4-407c-99d5-621c67cd980a","label":"A","body":"10","is_correct":false,"position":1},{"id":"6b443e8d-2abf-4d9b-a978-7cea53da038c","label":"B","body":"50","is_correct":false,"position":2},{"id":"ff01ae8b-ba21-4935-8e8a-f06bb2164461","label":"C","body":"false","is_correct":true,"position":3},{"id":"e672331e-df45-43ff-8246-019d6aac9ef9","label":"D","body":"true","is_correct":false,"position":4}],"correct_answer_ids":["ff01ae8b-ba21-4935-8e8a-f06bb2164461"],"explanation":"¡Muy bien! 10 no es mayor que 50, por lo que la comparación devuelve false.","hints":[]}]},{"id":"7e630c3a-90bd-4b59-a89b-acb8a7168e10","title":"Errores clásicos de los que vienen de Python/JS","slug":"errores-comparativa-lenguajes","position":9,"concept_id":"lua-bool-comparativa-lenguajes","explanation":"Los programadores que vienen de JavaScript o Python caen en esta trampa: creen que if x then con x = 0 no se ejecutará. Paso 1: En Lua, 0 siempre se ejecuta porque es true. Paso 2: Tampoco hay conversiones engañosas de palabras a false. Paso 3: Grábate el lema: en Lua, la lógica es limpia, predecible y sin sorpresas.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Lógica pura","code":"-- En Lua:\n-- 0  => true\n-- \"\" => true\n-- Solo false y nil apagan la luz","language":"lua","output":"","explanation":"Lua tiene el sistema booleano más coherente y limpio.","position":1}],"exercises":[{"id":"4a4d572d-0c29-4458-8ad9-5fe7b955e749","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"true_false","difficulty":"easy","category":"variables","prompt":"Si un programador novato asume que el valor 0 es falso en Lua, ¿cometerá un error de lógica en su código?","prompt_code":null,"score":10,"concept_ids":["lua-bool-comparativa-lenguajes"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"8d840269-b8c5-4bc3-b61f-4c845dc6327a","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"bd60560b-c4f3-424a-a32d-17b44d372986","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["bd60560b-c4f3-424a-a32d-17b44d372986"],"explanation":"¡Verdadero! En Lua 0 es verdadero, por lo que asumir que es falso causará errores lógicos.","hints":[]}]},{"id":"7692fd31-852a-42b3-abeb-dc1b40471eb0","title":"Mini-repaso de la Sección 6","slug":"mini-repaso-seccion-seis-m02","position":10,"concept_id":"lua-bool-s06-repaso","explanation":"¡Booleanos dominados con honores! Paso 1: Solo existen true y false. Paso 2: Solo false y nil son falsos (0 y \"\" son verdaderos). Paso 3: not invierte la verdad y las comparaciones devuelven booleanos. ¡Ahora conoceremos al misterioso nil y a la palabra local!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Resumen S06","code":"activo = true\nprint(\"Estado:\", activo, \"Inverso:\", not activo)","language":"lua","output":"Estado:\ttrue\tInverso:\tfalse","explanation":"Lógica booleana dominada.","position":1}],"exercises":[{"id":"642c7df4-dbd5-439a-aeb0-4bfc6ea94a28","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué imprimirá print(not not \"hola\")?","prompt_code":"print(not not \"hola\")","score":10,"concept_ids":["lua-bool-s06-repaso"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"32b14846-038c-4e3b-b5d0-4d98c54c24eb","label":"A","body":"hola","is_correct":false,"position":1},{"id":"1cb5bc71-ed29-4bc4-8f4b-4c7f9236687f","label":"B","body":"false","is_correct":false,"position":2},{"id":"3305b506-4907-41f7-9222-f56fcf9cc6b0","label":"C","body":"string","is_correct":false,"position":3},{"id":"271cfb18-d026-4742-a5a7-6dc49694c142","label":"D","body":"true","is_correct":true,"position":4}],"correct_answer_ids":["271cfb18-d026-4742-a5a7-6dc49694c142"],"explanation":"¡Exacto! El texto 'hola' es verdadero, por lo que not not 'hola' entrega true.","hints":[]}]}]},{"id":"521ca065-c676-459c-aa4b-14c5c5391057","title":"El tipo nil y la llegada de local","slug":"el-tipo-nil-y-local","position":7,"type":"exercise","status":"published","content_version":1,"estimated_minutes":15,"xp_on_complete":10,"lessons":[{"id":"aac00720-ba5b-49b3-a962-99c88751041d","title":"¿Qué es nil? La ausencia total de valor","slug":"concepto-nil-vacio","position":1,"concept_id":"lua-nil-concepto-vacio","explanation":"En Lua existe un valor muy especial llamado nil. Paso 1: nil significa literalmente 'la nada' o 'ausencia de dato'. Paso 2: No es el número cero, ni es una palabra vacía; es una cajita que no tiene nada adentro. Paso 3: Si buscas algo que no existe en Lua, la respuesta es siempre nil.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"La nada","code":"print(caja_inexistente)","language":"lua","output":"nil","explanation":"Consultar algo que no tiene valor devuelve nil.","position":1}],"exercises":[{"id":"3189e6ee-c417-492c-8c80-b88a6b4dc085","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"¿Qué representa el valor nil en Lua?","prompt_code":null,"score":10,"concept_ids":["lua-nil-concepto-vacio"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"743483cf-7eb5-46fd-ae14-46c1d3e26f4b","label":"A","body":"La ausencia total de valor o la nada","is_correct":true,"position":1},{"id":"bf64caa8-ff04-4f83-a762-efb720e708f6","label":"B","body":"Una palabra en portugués que significa hola","is_correct":false,"position":2},{"id":"f738c81b-0274-4c1f-b951-56129cbf8ad1","label":"C","body":"Un error que destruye el programa","is_correct":false,"position":3},{"id":"ddab2c59-b76a-4a16-b224-ef1d2b5cdf31","label":"D","body":"El número 0","is_correct":false,"position":4}],"correct_answer_ids":["743483cf-7eb5-46fd-ae14-46c1d3e26f4b"],"explanation":"¡Exacto! nil representa la ausencia de valor o un dato no existente.","hints":[]}]},{"id":"d9cfe2a0-75e2-43e0-a9e1-1bc2960f21d6","title":"Presentando a local: la palabra clave segura","slug":"intro-palabra-local","position":2,"concept_id":"lua-var-intro-local","explanation":"¡Llegó el momento de conocer la palabra más importante de Lua: local! Paso 1: Hasta ahora escribíamos vidas = 3 directamente. Paso 2: A partir de hoy, le agregamos local adelante: local vidas = 3. Paso 3: local crea una cajita protegida y segura que solo vive dentro de tu archivo, evitando que otros programas la alteren por error.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Variable local","code":"local vidas = 3\nprint(\"Vidas seguras:\", vidas)","language":"lua","output":"Vidas seguras:\t3","explanation":"local declara variables seguras y aisladas.","position":1}],"exercises":[{"id":"450d8344-f604-41b1-b7bb-ba320abe7471","version":1,"lang
