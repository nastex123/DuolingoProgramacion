e asustes! Paso 1: Todo programador profesional comete decenas de errores todos los días. Paso 2: Un error no significa que seas malo; significa que la computadora te está dando una pista para afinar tu lógica. Paso 3: Los errores son tus mejores maestros.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Equivocarse es aprender","code":"-- Un error no rompe tu computadora; solo te da una pista para mejorar.\nprint(\"¡Sin miedo al éxito!\")","language":"lua","output":"¡Sin miedo al éxito!","explanation":"Aprender a leer los errores te da superpoderes en programación.","position":1}],"exercises":[{"id":"9abfd0a5-0d7b-4cae-ba68-aa8a658cc08d","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"En programación, ¿recibir un mensaje de error en la terminal es algo normal del proceso de aprendizaje y te brinda pistas para corregir tu código?","prompt_code":null,"score":10,"concept_ids":["lua-fund-perder-miedo-error"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"347250ab-b773-4720-a6b6-2bcf0e37bdeb","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"f10a6b28-1fbb-4726-96d1-e341b562c7d6","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["f10a6b28-1fbb-4726-96d1-e341b562c7d6"],"explanation":"¡Verdadero! Los errores son avisos informativos diseñados para ayudarte a encontrar y corregir desajustes lógicos.","hints":[],"section_id":"d35989c6-0c4c-4b6d-a46b-e0980f17f147","lesson_id":"ef4f9aa3-062d-4f47-b02f-21c5b7f8633e"}]},{"id":"7b1810b5-9bd6-465f-b3d0-afb338ab3b34","title":"¿Qué es un traceback?","slug":"que-es-un-traceback","position":2,"concept_id":"lua-fund-traceback-concepto","explanation":"Cuando algo sale mal, Lua te muestra un mensaje llamado 'traceback'. Paso 1: 'Traceback' significa 'rastreo hacia atrás'. Paso 2: Es como las huellas de un detective en la nieve que te muestran exactamente por qué camino venía el programa. Paso 3: Te lleva directo al renglón del crimen para que no tengas que buscar a ciegas.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Huellas de error","code":"lua: main.lua:3: attempt to perform arithmetic\nstack traceback:\n\tmain.lua:3: in main chunk","language":"lua","output":"","explanation":"El traceback te indica el archivo y la línea donde ocurrió el tropiezo.","position":1}],"exercises":[{"id":"2d9c7521-b88b-4073-92ad-5a0cedfba3d6","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Qué es el 'traceback' que muestra Lua cuando ocurre una falla en el programa?","prompt_code":null,"score":10,"concept_ids":["lua-fund-traceback-concepto"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"c850414c-e070-4996-87e5-153836d5742b","label":"A","body":"Un reporte detectivesco que rastrea en qué archivo y en qué línea ocurrió el problema","is_correct":true,"position":1},{"id":"e55d480c-a058-45d1-b8cf-ad6a6f041394","label":"B","body":"Una factura que debes pagar por internet","is_correct":false,"position":2},{"id":"16d8fc29-8521-4c88-b007-1e6a2756da6f","label":"C","body":"Una lista de los mejores videojuegos del año","is_correct":false,"position":3},{"id":"1bfda265-e9e5-4944-8a08-513e01415c35","label":"D","body":"El nombre de tu tarjeta gráfica","is_correct":false,"position":4}],"correct_answer_ids":["c850414c-e070-4996-87e5-153836d5742b"],"explanation":"¡Exacto! El traceback rastrea la pila de ejecución y te señala la línea exacta donde ocurrió la falla.","hints":[],"section_id":"d35989c6-0c4c-4b6d-a46b-e0980f17f147","lesson_id":"7b1810b5-9bd6-465f-b3d0-afb338ab3b34"}]},{"id":"1e87e102-1c84-4abc-89c2-65fc1db46774","title":"La anatomía del mensaje de error","slug":"anatomia-del-mensaje-de-error","position":3,"concept_id":"lua-fund-anatomia-error","explanation":"Los mensajes de error de Lua tienen una estructura matemática muy predecible: `archivo.lua:línea: descripción`. Paso 1: La primera parte te da el nombre del archivo (ej: `main.lua`). Paso 2: El número entre dos puntos te da el renglón exacto (ej: `:5:` significa línea 5). Paso 3: El texto final te dice qué salió mal. ¡Sabiendo leer esto, solucionas cualquier problema en 10 segundos!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Estructura del error","code":"main.lua:5: 'end' expected\n-- [Archivo] [Línea] [Motivo de la falla]","language":"lua","output":"","explanation":"main.lua en línea 5 necesita un 'end'.","position":1}],"exercises":[{"id":"32b0d492-c94c-4442-a770-ec98cc12e3b1","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"Si la terminal te muestra el mensaje `main.lua:12: unexpected symbol`, ¿en qué número de renglón debes buscar el problema?","prompt_code":null,"score":10,"concept_ids":["lua-fund-anatomia-error"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"dfe977e8-cdfb-4729-addc-2e82a671de46","label":"A","body":"En el renglón 1","is_correct":false,"position":1},{"id":"cae75bba-2951-4a6f-a0e5-a041ec66a0c3","label":"B","body":"En el renglón 12","is_correct":true,"position":2},{"id":"c5c414e6-bf9b-4ff6-9127-2055cc0b9b4e","label":"C","body":"En el renglón 100","is_correct":false,"position":3},{"id":"7d20dec7-fae4-43e1-8249-bbb0c938030a","label":"D","body":"En ningún renglón","is_correct":false,"position":4}],"correct_answer_ids":["cae75bba-2951-4a6f-a0e5-a041ec66a0c3"],"explanation":"¡Muy bien! El número entre dos puntos (`:12:`) te indica con total precisión el número de línea del archivo.","hints":[],"section_id":"d35989c6-0c4c-4b6d-a46b-e0980f17f147","lesson_id":"1e87e102-1c84-4abc-89c2-65fc1db46774"}]},{"id":"3ca6cc0d-5b91-4865-a982-c7d0f5919730","title":"Error al escribir (Syntax Error)","slug":"error-al-escribir-syntax-error","position":4,"concept_id":"lua-fund-syntax-error","explanation":"Existen dos grandes familias de errores. La primera es el error de sintaxis (Syntax Error). Paso 1: Ocurre cuando cometes una falta de ortografía en el código antes de que empiece a correr. Paso 2: Olvidar cerrar una comilla, olvidar cerrar un paréntesis o escribir mal una palabra. Paso 3: Lua detecta esto al instante y te avisa antes de hacer nada.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Error de sintaxis","code":"-- print(\"Falta comilla de cierre)\n-- syntax error: unfinished string near '\"Falta...'","language":"lua","output":"syntax error","explanation":"Una comilla sin cerrar es un error clásico de sintaxis.","position":1}],"exercises":[{"id":"49607e6d-aea0-4144-97d7-b96e90768851","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Qué es un 'Syntax Error' (error de sintaxis) en Lua?","prompt_code":null,"score":10,"concept_ids":["lua-fund-syntax-error"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"0ef160e9-b97f-438e-9ca7-c0bc79d96e56","label":"A","body":"Que el teclado está desconectado","is_correct":false,"position":1},{"id":"187f28f3-5a0f-4ad7-a800-9f08e422145a","label":"B","body":"Un corte de energía eléctrica en tu ciudad","is_correct":false,"position":2},{"id":"6b3c3e71-5788-4a3c-9b7b-b6464216eb48","label":"C","body":"Que el monitor se quedó sin brillo","is_correct":false,"position":3},{"id":"c695d7d7-3e3c-47c8-9d7f-f8044faf3e44","label":"D","body":"Una falla al escribir las reglas del lenguaje, como olvidar cerrar una comilla o un paréntesis","is_correct":true,"position":4}],"correct_answer_ids":["c695d7d7-3e3c-47c8-9d7f-f8044faf3e44"],"explanation":"¡Correcto! Los errores de sintaxis ocurren cuando el código viola las reglas gramaticales del lenguaje.","hints":[],"section_id":"d35989c6-0c4c-4b6d-a46b-e0980f17f147","lesson_id":"3ca6cc0d-5b91-4865-a982-c7d0f5919730"}]},{"id":"cc0c844a-5148-42d4-95a7-2ecaaae98e32","title":"Error al ejecutar (Runtime Error)","slug":"error-al-ejecutar-runtime-error","position":5,"concept_id":"lua-fund-runtime-error","explanation":"La segunda familia es el error de ejecución (Runtime Error). Paso 1: Tu código está perfectamente escrito sin faltas de ortografía. Paso 2: Pero cuando empieza a correr, le pides a la computadora algo imposible (como dividir entre cero o usar un dato vacío). Paso 3: El programa arranca bien y se estrella a mitad del camino al toparse con esa orden imposible.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Error de ejecución","code":"print(\"Paso 1 funcionando\")\n-- Luego intentas algo imposible y tropieza en tiempo de ejecución","language":"lua","output":"Paso 1 funcionando\nerror...","explanation":"El programa arranca pero se detiene al encontrar una operación imposible.","position":1}],"exercises":[{"id":"74eea3ad-69ab-4cb8-9aed-689477d38677","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"Un 'Runtime Error' ocurre mientras el programa ya se está ejecutando, cuando se intenta realizar una operación que resulta imposible o inválida en ese momento. ¿Es verdadero?","prompt_code":null,"score":10,"concept_ids":["lua-fund-runtime-error"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"1d0d836f-5d04-4d36-9190-30df5cfbc869","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"b24ed872-6970-4b55-bc16-e688b5d77843","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["b24ed872-6970-4b55-bc16-e688b5d77843"],"explanation":"¡Verdadero! A diferencia de los errores de sintaxis que se detectan al leer el texto, los runtime errors ocurren durante la ejecución dinámica.","hints":[],"section_id":"d35989c6-0c4c-4b6d-a46b-e0980f17f147","lesson_id":"cc0c844a-5148-42d4-95a7-2ecaaae98e32"}]},{"id":"854695aa-2c32-429d-a93e-6e50992d8eee","title":"El error attempt to index a nil value","slug":"error-attempt-to-index-nil","position":6,"concept_id":"lua-fund-error-nil-index","explanation":"Este es el error más temido por los que no lo conocen: `attempt to index a nil value`. ¡Pero es una tontería de entender! Paso 1: `nil` significa 'vacío', o sea que no hay nada ahí. Paso 2: `attempt to index` significa que intentaste abrir una cajita para buscar algo adentro. Paso 3: ¡Intentaste abrir una caja que ni siquiera existe! Solo verifica que la variable esté creada y se soluciona.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Caja vacía","code":"local jugador = nil\n-- print(jugador.puntos) => Error: attempt to index a nil value","language":"lua","output":"error: attempt to index a nil value","explanation":"No puedes buscar propiedades dentro de algo que está completamente vacío (nil).","position":1}],"exercises":[{"id":"171387bc-4729-4970-9b17-d21b4466c7b7","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"En Lua, ¿qué significa en palabras sencillas el error `attempt to index a nil value`?","prompt_code":null,"score":10,"concept_ids":["lua-fund-error-nil-index"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"ecf24888-6aba-4ac7-adb2-4725aa290177","label":"A","body":"Que intentaste acceder a los datos de una variable que está vacía o que no existe todavía","is_correct":true,"position":1},{"id":"e047a608-03f9-4e25-9646-8dcedbe16ab5","label":"B","body":"Que el disco duro está lleno","is_correct":false,"position":2},{"id":"64cae5a9-f3ce-49f0-b94d-058e4e1b562a","label":"C","body":"Que tu juego tiene demasiados colores","is_correct":false,"position":3},{"id":"100aaa64-8551-4243-83db-6f91617269d0","label":"D","body":"Que debes comprar una computadora nueva","is_correct":false,"position":4}],"correct_answer_ids":["ecf24888-6aba-4ac7-adb2-4725aa290177"],"explanation":"¡Exacto! Ocurre cuando intentas acceder a campos o métodos de un valor nulo (`nil`).","hints":[],"section_id":"d35989c6-0c4c-4b6d-a46b-e0980f17f147","lesson_id":"854695aa-2c32-429d-a93e-6e50992d8eee"}]},{"id":"4b8efd14-7334-4b08-83b2-c0f9c7b157c6","title":"La técnica detectivesca de apagar líneas con --[[ ]]","slug":"tecnica-apagar-lineas-para-debug","position":7,"concept_id":"lua-fund-debug-aislar-error","explanation":"Si tienes un error y no sabes cuál línea es la culpable, usa el método del cerco. Paso 1: Encierra la mitad de tu archivo entre `--[[` y `]]`. Paso 2: Ejecuta tu programa. Paso 3: Si ya no falla, la línea culpable estaba en la mitad que apagaste. Destapa poco a poco hasta acorralarla. ¡Es el truco más rápido del mundo!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Aislar con comentarios","code":"--[[\n  -- Si apagas este bloque y el error desaparece,\n  -- el fallo estaba aquí adentro.\n]]","language":"lua","output":"","explanation":"Comentar bloques te permite aislar fallos sin perder tu código.","position":1}],"exercises":[{"id":"a805e1fa-fe40-4b90-ba83-cf1540be2733","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"Si tu programa falla y sospechas de un bloque de 5 líneas, ¿cuál es la mejor técnica para comprobarlo sin perder tu trabajo?","prompt_code":null,"score":10,"concept_ids":["lua-fund-debug-aislar-error"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"05716a45-eec9-481f-9403-802d483977b7","label":"A","body":"Borrar las 5 líneas para siempre del archivo","is_correct":false,"position":1},{"id":"6e3e755a-8771-4798-a73b-9ce000b8f451","label":"B","body":"Encerrar las 5 líneas entre `--[[` y `]]` para desactivarlas temporalmente","is_correct":true,"position":2},{"id":"6395feed-2ba1-4bc1-8f16-84c5bd076a11","label":"C","body":"Apagar la pantalla","is_correct":false,"position":3},{"id":"0c45a2e2-e345-4b33-8e20-f9f2419107a6","label":"D","body":"Cambiarle el nombre a la computadora","is_correct":false,"position":4}],"correct_answer_ids":["6e3e755a-8771-4798-a73b-9ce000b8f451"],"explanation":"¡Muy bien! Comentar el bloque te permite probar el programa sin destruir el código original.","hints":[],"section_id":"d35989c6-0c4c-4b6d-a46b-e0980f17f147","lesson_id":"4b8efd14-7334-4b08-83b2-c0f9c7b157c6"}]},{"id":"ece25307-0fb8-4554-8be6-a8560ef59f7a","title":"Depuración con print","slug":"depuracion-con-print","position":8,"concept_id":"lua-fund-debug-con-print","explanation":"¿Cómo saber hasta dónde llegó tu programa antes de fallar? ¡Ponle miguitas de pan con print! Paso 1: Escribes `print(\"Punto 1\")` arriba, `print(\"Punto 2\")` en medio y `print(\"Punto 3\")` abajo. Paso 2: Ejecutas tu archivo. Paso 3: Si en pantalla sale Punto 1 y Punto 2, pero NO sale Punto 3, ¡sabes con exactitud milimétrica que el tropiezo ocurrió entre el 2 y el 3!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Migas de pan","code":"print(\"1. Inicio\")\n-- aquí ocurre algo misterioso\nprint(\"2. Llegó hasta aquí\")","language":"lua","output":"1. Inicio\n2. Llegó hasta aquí","explanation":"Los prints te muestran en qué punto exacto se detiene el flujo de ejecución.","position":1}],"exercises":[{"id":"101b9de8-8fec-448d-9bd7-7e8d6e96bb74","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"¿Colocar instrucciones `print()` provisionales a lo largo de tu código te ayuda a descubrir hasta qué punto exacto avanzó tu programa antes de fallar?","prompt_code":null,"score":10,"concept_ids":["lua-fund-debug-con-print"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"7950b14a-6454-4670-ad84-f87503182196","label":"A","body":"Verdadero","is_correct":true,"position":1},{"id":"22a9a36d-a1c1-48c4-825b-09cc6d248b3b","label":"B","body":"Falso","is_correct":false,"position":2}],"correct_answer_ids":["7950b14a-6454-4670-ad84-f87503182196"],"explanation":"¡Verdadero! El 'print debugging' es una de las técnicas de diagnóstico más universales y efectivas de la historia de la programación.","hints":[],"section_id":"d35989c6-0c4c-4b6d-a46b-e0980f17f147","lesson_id":"ece25307-0fb8-4554-8be6-a8560ef59f7a"}]},{"id":"3fa4d2ec-197f-4974-b8d2-7055fd2ff55e","title":"Probar la sospecha en la consola lua -i","slug":"probar-sospecha-en-repl","position":9,"concept_id":"lua-fund-debug-repl","explanation":"Si dudas de cómo se comporta una instrucción específica, no toques tu archivo grande todavía. Paso 1: Abre la consola interactiva con `lua -i`. Paso 2: Escribe esa única línea solita para ver cómo reacciona Lua. Paso 3: Una vez que entiendas cómo responde y esté corregida, la copias con seguridad en tu archivo.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Ensayar antes de editar","code":"$ lua -i\n> print(5 + 5) -- Ensayas en el REPL\n10","language":"lua","output":"10","explanation":"Probar líneas dudosas en el REPL evita romper archivos grandes.","position":1}],"exercises":[{"id":"2018db00-5585-4018-81d4-86ebf03ea6ce","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"Si tienes dudas sobre cómo funciona una sola orden antes de ponerla en tu juego, ¿qué herramienta te permite probarla aisladamente en 10 segundos?","prompt_code":null,"score":10,"concept_ids":["lua-fund-debug-repl"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"cdb0d2b1-74b3-47fa-96c1-9ce77c18e8fe","label":"A","body":"La consola interactiva `lua -i`","is_correct":true,"position":1},{"id":"1d1cc4ee-08fa-4557-bde8-15652c6b07fb","label":"B","body":"Una llamada telefónica al soporte técnico","is_correct":false,"position":2},{"id":"239bbabf-b170-42e4-8c48-1455a2da6c9a","label":"C","body":"Reiniciar el módem de internet","is_correct":false,"position":3},{"id":"267ffc3a-b9f1-40dd-94de-643b3da56bb9","label":"D","body":"Formatear el disco duro","is_correct":false,"position":4}],"correct_answer_ids":["cdb0d2b1-74b3-47fa-96c1-9ce77c18e8fe"],"explanation":"¡Exacto! El modo interactivo es el laboratorio de pruebas perfecto para comprobar expresiones al instante.","hints":[],"section_id":"d35989c6-0c4c-4b6d-a46b-e0980f17f147","lesson_id":"3fa4d2ec-197f-4974-b8d2-7055fd2ff55e"}]},{"id":"108abaf6-8d72-41c7-abf1-2839eb586d03","title":"Mini-repaso de la Sección 8","slug":"mini-repaso-seccion-ocho","position":10,"concept_id":"lua-fund-s08-repaso","explanation":"¡Tienes el botiquín de primeros auxilios completo! Paso 1: Ya no le temes a los errores. Paso 2: Sabes leer la línea del problema en el traceback. Paso 3: Sabes usar comentarios para aislar fallos y prints para rastrear el camino. ¡Estás preparado para el gran proyecto de graduación del Módulo 1!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Resumen S08","code":"print(\"¡Kit de supervivencia completado!\")","language":"lua","output":"¡Kit de supervivencia completado!","explanation":"Ya tienes mentalidad y herramientas de programador maduro.","position":1}],"exercises":[{"id":"149b4931-314b-4519-a33a-bcc93f1fdb86","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"Para solucionar un error en Lua, leemos el archivo y la línea en el traceback, y podemos usar comentarios y `print()` para aislar la causa. ¿Es verdadero?","prompt_code":null,"score":10,"concept_ids":["lua-fund-s08-repaso"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"2b78c9b8-eba4-4889-9130-3b733cc7cabe","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"823151db-91d9-4f65-b705-d47b27d8cb1c","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["823151db-91d9-4f65-b705-d47b27d8cb1c"],"explanation":"¡Verdadero! Has dominado las estrategias esenciales para resolver cualquier problema de código.","hints":[],"section_id":"d35989c6-0c4c-4b6d-a46b-e0980f17f147","lesson_id":"108abaf6-8d72-41c7-abf1-2839eb586d03"}]}]},{"id":"905b546a-6ed8-4058-a1c3-59f69abfa1c4","title":"Checkpoint y Proyecto Integrador","slug":"checkpoint","position":9,"type":"review","status":"published","content_version":2,"estimated_minutes":15,"xp_on_complete":10,"lessons":[{"id":"08926b6f-951f-4d05-9c76-44642ca97ebb","title":"Mapa mental general de Fundamentos","slug":"mapa-mental-general","position":1,"concept_id":"lua-fund-mapa-mental","explanation":"¡Mira todo lo que has aprendido en este módulo! Paso 1: Qué es Lua, su ligereza en Roblox y contar en 1. Paso 2: Instrucciones secuenciales, chunks y la consola `lua -i`. Paso 3: print con textos, comillas, números y comas. Paso 4: Comentarios `--` y `--[[ ]]`. Paso 5: Archivos `.lua`. Paso 6: Ejecución y la regla del `end`. Paso 7: Estilo sin `;`. Paso 8: Depuración con tracebacks. ¡8 pilares sólidos!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Mapa de poder","code":"-- Lua -> Chunks -> Print -> Comentarios -> Archivos -> End -> Estilo -> Debug\nprint(\"¡8 pilares asimilados!\")","language":"lua","output":"¡8 pilares asimilados!","explanation":"El mapa completo de fundamentos que dominas hoy.","position":1}],"exercises":[{"id":"1caef95d-f774-496f-ac46-0630930e6473","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"¿El Módulo 01 te ha enseñado desde qué es Lua hasta cómo ejecutar archivos `.lua`, imprimir datos, usar comentarios y resolver errores?","prompt_code":null,"score":10,"concept_ids":["lua-fund-mapa-mental"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"4e47d45c-4773-4c31-9c31-18b4ece76203","label":"A","body":"Verdadero","is_correct":true,"position":1},{"id":"bc9798c0-d897-47a1-afa4-e899bb800c9f","label":"B","body":"Falso","is_correct":false,"position":2}],"correct_answer_ids":["4e47d45c-4773-4c31-9c31-18b4ece76203"],"explanation":"¡Verdadero! Tienes una base sólida y completa para seguir creciendo en programación.","hints":[],"section_id":"905b546a-6ed8-4058-a1c3-59f69abfa1c4","lesson_id":"08926b6f-951f-4d05-9c76-44642ca97ebb"}]},{"id":"cd986c15-c7a6-4f67-8c9d-7f64e040c632","title":"Repaso activo 1: La naturaleza de Lua","slug":"repaso-activo-naturaleza-lua","position":2,"concept_id":"lua-fund-repaso-naturaleza","explanation":"Pongamos a prueba tu memoria rápida. Pregúntate: ¿dónde brilla Lua? Paso 1: En videojuegos como Roblox y motores como LÖVE. Paso 2: En servidores como NGINX por ser ultra veloz y ligero (menos de 300 KB). Paso 3: Nació en Brasil en 1993 y sus listas empiezan en la posición 1.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Lua al natural","code":"print(\"Ligero, veloz, incrustado y natural\")","language":"lua","output":"Ligero, veloz, incrustado y natural","explanation":"Las virtudes de Lua resumidas en una línea.","position":1}],"exercises":[{"id":"c9394ff4-e080-4d89-801f-72592d49c41a","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Cuál es la razón principal por la que plataformas como Roblox eligen Lua para sus mundos interactivos?","prompt_code":null,"score":10,"concept_ids":["lua-fund-repaso-naturaleza"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"024559a3-9a6a-42d6-81fc-6b0fb93d2070","label":"A","body":"Porque es liviano, arranca veloz y ejecuta las reglas del juego sin consumir casi memoria","is_correct":true,"position":1},{"id":"5f26cf8a-562d-400d-b6a0-49dea7750a60","label":"B","body":"Porque es el único lenguaje que viene en color verde","is_correct":false,"position":2},{"id":"0bc7b170-db86-463d-9d70-3186391378cd","label":"C","body":"Porque borra los archivos innecesarios de Windows","is_correct":false,"position":3},{"id":"084843dc-1a9c-4a87-aa70-7814d161f8eb","label":"D","body":"Porque solo funciona si no hay conexión a internet","is_correct":false,"position":4}],"correct_answer_ids":["024559a3-9a6a-42d6-81fc-6b0fb93d2070"],"explanation":"¡Correcto! Su velocidad, ligereza y facilidad de integración son insuperables.","hints":[],"section_id":"905b546a-6ed8-4058-a1c3-59f69abfa1c4","lesson_id":"cd986c15-c7a6-4f67-8c9d-7f64e040c632"}]},{"id":"a4cd99bf-da21-49c2-9e54-b7d7c98bef34","title":"Repaso activo 2: De la terminal al archivo","slug":"repaso-activo-archivos-repl","position":3,"concept_id":"lua-fund-repaso-archivos","explanation":"Recuerda la dualidad entre probar y construir. Paso 1: La consola `lua -i` te da el cursor `>` para ensayar una línea en 5 segundos. Paso 2: El archivo con extensión `.lua` (como `main.lua`) guarda tu software de forma permanente en tu disco. Paso 3: Siempre pulsas Ctrl + S para guardar antes de ejecutar.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"De la prueba a la obra","code":"-- Guardado en main.lua y probado con 'lua main.lua'\nprint(\"¡Flujo dominado!\")","language":"lua","output":"¡Flujo dominado!","explanation":"Dominar el flujo de archivos es ser un programador autónomo.","position":1}],"exercises":[{"id":"f3053367-a434-47aa-b82f-9a63435a48e4","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"Tienes un archivo guardado llamado `main.lua`. ¿Qué comando escribes en la terminal para que Lua lo ponga en marcha?","prompt_code":null,"score":10,"concept_ids":["lua-fund-repaso-archivos"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"873d17a6-7232-4ef4-b4a6-9a07ff6f9d27","label":"A","body":"iniciar main","is_correct":false,"position":1},{"id":"f3c81971-fbc6-4b4b-be8b-5fa544f90d62","label":"B","body":"abrir main.lua","is_correct":false,"position":2},{"id":"efcc710a-caf9-4b44-a10c-70d55fa92056","label":"C","body":"play main","is_correct":false,"position":3},{"id":"ca73a940-696b-4623-8aa5-36010b508eb7","label":"D","body":"lua main.lua","is_correct":true,"position":4}],"correct_answer_ids":["ca73a940-696b-4623-8aa5-36010b508eb7"],"explanation":"¡Exacto! El comando es `lua main.lua`.","hints":[],"section_id":"905b546a-6ed8-4058-a1c3-59f69abfa1c4","lesson_id":"a4cd99bf-da21-49c2-9e54-b7d7c98bef34"}]},{"id":"420cad7a-89d5-4a61-8aa3-f8790f216c19","title":"Repaso activo 3: La salida con print","slug":"repaso-activo-salida-print","position":4,"concept_id":"lua-fund-repaso-print","explanation":"Aseguremos que la salida en pantalla no tenga secretos para ti. Paso 1: `print(\"Texto\")` muestra el mensaje limpio sin comillas. Paso 2: `print(50)` muestra el número directamente. Paso 3: Las comas dentro de print separan los elementos automáticamente con un espacio.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Salida maestra","code":"print(\"Nivel:\", 10, \"Puntos:\", 500)","language":"lua","output":"Nivel:\t10\tPuntos:\t500","explanation":"Combinación de textos, números y comas en un solo renglón.","position":1}],"exercises":[{"id":"01065c1f-9e06-4f2d-8493-06d0d33cb2b7","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"predict_output","difficulty":"easy","category":"fundamentos","prompt":"¿Qué mensaje exacto aparecerá en la pantalla al ejecutar este código?","prompt_code":"print(\"Vidas restantes:\", 3)","score":10,"concept_ids":["lua-fund-repaso-print"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"33587073-5bc1-436c-9aca-df170e9f75b5","label":"A","body":"Vidas restantes: 3 (con un espacio de separación)","is_correct":true,"position":1},{"id":"1433089d-4892-4d5c-b069-cbb55c9690c6","label":"B","body":"\"Vidas restantes:\" 3 (con las comillas visibles)","is_correct":false,"position":2},{"id":"56a6f071-9df7-4d6a-a80f-6379df833edf","label":"C","body":"Vidas restantes:3 (pegado sin separación)","is_correct":false,"position":3},{"id":"5742cd70-102f-400f-8a89-b862c453d2d0","label":"D","body":"Error por mezclar texto con número","is_correct":false,"position":4}],"correct_answer_ids":["33587073-5bc1-436c-9aca-df170e9f75b5"],"explanation":"¡Correcto! En Lua la coma separa los argumentos automáticamente con un espacio limpio.","hints":[],"section_id":"905b546a-6ed8-4058-a1c3-59f69abfa1c4","lesson_id":"420cad7a-89d5-4a61-8aa3-f8790f216c19"}]},{"id":"b557dedd-acb9-4e33-baf2-bb7d9a82ef81","title":"Repaso activo 4: El valor de las notas","slug":"repaso-activo-comentarios","position":5,"concept_id":"lua-fund-repaso-comentarios","explanation":"Recuerda las dos herramientas para dejarte notas. Paso 1: Dos guiones `--` al inicio apagan un renglón individual. Paso 2: `--[[` abre un bloque multilínea y `]]` lo cierra. Paso 3: Los comentarios te permiten documentar el por qué de tus ideas y apagar código sospechoso durante tus pruebas.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Notas completas","code":"-- Nota simple\n--[[\n  Nota larga\n]]\nprint(\"Visible\")","language":"lua","output":"Visible","explanation":"Las notas no se ejecutan ni hacen más lento tu programa.","position":1}],"exercises":[{"id":"8e42c3ec-c6bd-42b7-95eb-0f09a5abe0ed","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"Si quieres escribir una nota personal de varias líneas que la computadora ignore, ¿qué símbolos usas al inicio y al final?","prompt_code":null,"score":10,"concept_ids":["lua-fund-repaso-comentarios"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"df0e8de5-b839-4591-8845-ad4cd57d9087","label":"A","body":"--[[ al inicio y ]] al final","is_correct":true,"position":1},{"id":"7f0cbd64-0e9e-40ff-890e-67da8f42e930","label":"B","body":"/* al inicio y */ al final","is_correct":false,"position":2},{"id":"97e4357a-7949-428d-8e94-089ed37bb1fb","label":"C","body":"(( al inicio y )) al final","is_correct":false,"position":3},{"id":"52722212-53a5-4ee3-b1b2-fe8d6db9fa23","label":"D","body":"-- al inicio y -- al final","is_correct":false,"position":4}],"correct_answer_ids":["df0e8de5-b839-4591-8845-ad4cd57d9087"],"explanation":"¡Muy bien! `--[[` y `]]` delimitan comentarios multilínea en Lua.","hints":[],"section_id":"905b546a-6ed8-4058-a1c3-59f69abfa1c4","lesson_id":"b557dedd-acb9-4e33-baf2-bb7d9a82ef81"}]},{"id":"cb3377d6-725c-405a-af74-64a363c69018","title":"Repaso activo 5: La regla del cierre con end","slug":"repaso-activo-cierre-end","position":6,"concept_id":"lua-fund-repaso-cierre-end","explanation":"La regla sagrada de los bloques en Lua: Paso 1: Todo bloque abierto con `if`, `while` o `function` debe cerrarse con la palabra `end`. Paso 2: Si olvidas el `end`, Lua buscará hasta el final del archivo y marcará `'end' expected`. Paso 3: Acostúmbrate a escribir el `end` de cierre en cuanto abras la condición.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Cierre seguro","code":"if true then\n  print(\"Bloque cerrado correctamente\")\nend","language":"lua","output":"Bloque cerrado correctamente","explanation":"El bloque se cierra con llave usando la palabra end.","position":1}],"exercises":[{"id":"384eaa77-6979-4db7-8c50-7ee4bd34a522","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"find_error","difficulty":"easy","category":"fundamentos","prompt":"En este código, ¿qué palabra clave obligatoria falta para que Lua pueda ejecutarlo sin error?","prompt_code":"if true then\n  print(\"Todo listo\")","score":10,"concept_ids":["lua-fund-repaso-cierre-end"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"eb2d7de1-44e7-45ce-88ea-b5dd51689e5f","label":"A","body":"Falta un punto y coma","is_correct":false,"position":1},{"id":"d5dd4de0-9732-4ac3-bd2b-e5a7c663ac33","label":"B","body":"Falta la palabra 'end' al final del bloque","is_correct":true,"position":2},{"id":"2a111f23-0bf0-4a94-8813-06c70dd5aa99","label":"C","body":"Falta una coma","is_correct":false,"position":3},{"id":"09584b42-7020-430d-ba31-cb96ccdbe5dc","label":"D","body":"No falta nada","is_correct":false,"position":4}],"correct_answer_ids":["d5dd4de0-9732-4ac3-bd2b-e5a7c663ac33"],"explanation":"¡Exacto! Olvidar `end` es el error más clásico del principiante; ahora ya sabes detectarlo al instante.","hints":[],"section_id":"905b546a-6ed8-4058-a1c3-59f69abfa1c4","lesson_id":"cb3377d6-725c-405a-af74-64a363c69018"}]},{"id":"6990a044-18d7-4c21-81f3-b7fca21ffbac","title":"Repaso activo 6: Nombres legales y estilo","slug":"repaso-activo-nombres-estilo","position":7,"concept_id":"lua-fund-repaso-estilo","explanation":"Repasemos las normas de elegancia en Lua. Paso 1: Nombres con letras, números y guión bajo; nunca empezar con número. Paso 2: Nunca usar las 21 palabras reservadas como `local` o `if`. Paso 3: Sangría de 2 espacios para ver escalones visuales y nada de punto y coma `;` innecesario.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Estilo puro","code":"local nombre_heroe = \"Arturo\"\nif true then\n  print(nombre_heroe)\nend","language":"lua","output":"Arturo","explanation":"Nombre legal, indentación de 2 espacios y sin punto y coma.","position":1}],"exercises":[{"id":"24b156bc-4943-40fc-9c90-d215d10c0b1d","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Por qué el nombre de variable `1puntos` causa un error en Lua?","prompt_code":null,"score":10,"concept_ids":["lua-fund-repaso-estilo"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"8492f570-e344-4747-a74d-210f6a8db505","label":"A","body":"Porque empieza con un número, lo cual está prohibido en las reglas de Lua","is_correct":true,"position":1},{"id":"cb07d110-b1b6-4733-ad89-1590c58a31d1","label":"B","body":"Porque la palabra puntos no existe en portugués","is_correct":false,"position":2},{"id":"1ba9717a-2af2-4255-b117-95c011d19a12","label":"C","body":"Porque tiene más de 5 letras","is_correct":false,"position":3},{"id":"8ae3b8f4-c3f2-49b7-844e-f26c1ffd8e0c","label":"D","body":"Porque está escrito en minúsculas","is_correct":false,"position":4}],"correct_answer_ids":["8492f570-e344-4747-a74d-210f6a8db505"],"explanation":"¡Correcto! Los nombres de identificadores en Lua nunca pueden comenzar con un dígito numérico.","hints":[],"section_id":"905b546a-6ed8-4058-a1c3-59f69abfa1c4","lesson_id":"6990a044-18d7-4c21-81f3-b7fca21ffbac"}]},{"id":"7431bbea-d4fb-4e25-a150-ae8cb74304fc","title":"Repaso activo 7: Diagnóstico de fallos","slug":"repaso-activo-diagnostico-fallos","position":8,"concept_id":"lua-fund-repaso-diagnostico","explanation":"Conviértete en un detective implacable. Paso 1: Cuando salga un error, busca el número de línea entre los dos puntos (ej: `:7:`). Paso 2: Lee el motivo para saber si fue un error de sintaxis o de ejecución. Paso 3: Si no estás seguro, pon prints de control o comenta bloques con `--[[ ]]` para acorralar la causa.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Diagnóstico rápido","code":"-- main.lua:4: mensaje de error\n-- Vas directo al renglón 4 de main.lua","language":"lua","output":"","explanation":"El traceback te indica la línea exacta del fallo.","position":1}],"exercises":[{"id":"ab8a4015-91c7-468e-b633-db28871a510f","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"Si la terminal te muestra el mensaje `main.lua:8: unexpected symbol`, significa que en el renglón 8 de `main.lua` hay un error que debes revisar. ¿Es verdadero?","prompt_code":null,"score":10,"concept_ids":["lua-fund-repaso-diagnostico"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"e34af963-ac32-4c56-841c-fe08118964f1","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"74ed6bc3-c084-42f1-ae33-91abb6ad0198","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["74ed6bc3-c084-42f1-ae33-91abb6ad0198"],"explanation":"¡Verdadero! El mensaje te conduce directamente a la línea 8 del archivo para solucionar el problema.","hints":[],"section_id":"905b546a-6ed8-4058-a1c3-59f69abfa1c4","lesson_id":"7431bbea-d4fb-4e25-a150-ae8cb74304fc"}]},{"id":"48789aaa-ec24-4940-b2a0-4e812e2212ba","title":"Gran Desafío Práctico: Tu primer script firmado","slug":"gran-desafio-primer-script-firmado","position":9,"concept_id":"lua-fund-desafio-integrador","explanation":"En este desafío final pondrás a prueba todo lo aprendido. Imagina que estás creando tu primer script oficial de presentación. Paso 1: La primera línea debe ser una nota personal con tu nombre que la computadora no ejecute. Paso 2: Usas dos guiones `--`. Paso 3: Luego muestras tu saludo al mundo con print.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Script firmado","code":"-- Mi nombre es Estudiante y este es mi script\nprint(\"¡Módulo 01 completado!\")","language":"lua","output":"¡Módulo 01 completado!","explanation":"Comentario de firma al inicio y salida en pantalla.","position":1}],"exercises":[{"id":"198db4d2-4ec7-41b8-a72f-b347be15fdeb","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"fill_blank","difficulty":"easy","category":"fundamentos","prompt":"Escribe los dos símbolos necesarios para que la primera línea sea un comentario con tu firma y la computadora no intente ejecutarla como código:","prompt_code":"____ Autor: Tu Nombre - Programador en Lua\nprint(\"¡Código en marcha!\")","score":10,"concept_ids":["lua-fund-desafio-integrador"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"d214dacd-da1e-4887-bbd6-6fe21c519489","label":null,"body":"--","is_correct":true,"position":1}],"correct_answer_ids":["d214dacd-da1e-4887-bbd6-6fe21c519489"],"explanation":"¡Magnífico! Dos guiones seguidos `--` convierten el renglón en un comentario personal respetado por la máquina.","hints":[],"section_id":"905b546a-6ed8-4058-a1c3-59f69abfa1c4","lesson_id":"48789aaa-ec24-4940-b2a0-4e812e2212ba"}]},{"id":"a011ad7f-4c93-4d5e-96a9-142424a3a2be","title":"Graduación del Módulo 01 y bienvenida al Módulo 02","slug":"graduacion-del-modulo-uno","position":10,"concept_id":"lua-fund-graduacion-m01","explanation":"¡LO LOGRASTE! (ﾉ◕ヮ◕)ﾉ*:･ﾟ✧ Has completado las 90 lecciones del Módulo 01: Fundamentos de Lua. Paso 1: Llegaste sin saber nada de programación y hoy sabes cómo piensa una computadora, cómo se estructuran las instrucciones y cómo resolver errores. Paso 2: En el Módulo 02 aprenderás a guardar datos en variables con nombre y dominarás los 8 tipos de Lua. ¡Eres oficialmente un estudiante de programación!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Graduación M01","code":"print(\"=====================================\")\nprint(\"¡GRADUADO DE FUNDAMENTOS DE LUA!\")\nprint(\"Próxima parada: Módulo 02 - Variables\")\nprint(\"=====================================\")","language":"lua","output":"=====================================\n¡GRADUADO DE FUNDAMENTOS DE LUA!\nPróxima parada: Módulo 02 - Variables\n=====================================","explanation":"¡Felicitaciones por completar las 90 lecciones de Fundamentos de Lua!","position":1}],"exercises":[{"id":"d5be7a9c-852c-4b42-8c2f-40469856ec49","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"¿Has completado oficialmente las 90 lecciones de Fundamentos de Lua y estás listo para avanzar al Módulo 02 (Variables y Tipos de Datos)?","prompt_code":null,"score":10,"concept_ids":["lua-fund-graduacion-m01"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"e3fd7420-0bc6-4ae3-9cf7-6717d0f314ba","label":"A","body":"Verdadero (¡Totalmente listo para el Módulo 2!)","is_correct":true,"position":1},{"id":"887fa0e9-1122-4153-977d-a68346fa7420","label":"B","body":"Falso","is_correct":false,"position":2}],"correct_answer_ids":["e3fd7420-0bc6-4ae3-9cf7-6717d0f314ba"],"explanation":"¡Enhorabuena, programador! Has conquistado con éxito los 9 bloques fundamentales de Lua. ¡Bienvenido al siguiente nivel!","hints":[],"section_id":"905b546a-6ed8-4058-a1c3-59f69abfa1c4","lesson_id":"a011ad7f-4c93-4d5e-96a9-142424a3a2be"}]}]}]},
  '02_variables': {"id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","code":"LUA_MOD_02","slug":"variables-y-tipos-de-datos","title":"Variables y Tipos de Datos","objective":"Dominar el almacenamiento de datos en memoria, asignación, reasignación, el sistema completo de 8 tipos nativos de Lua, la inspectora type(), la regla de oro de falsy, la palabra clave obligatoria local en S07, y conversiones seguras.","description":"100 lecciones atómicas diseñadas para aprender variables y tipos de datos paso a paso. Desde tu primera asignación hasta el catálogo completo de los 8 tipos y buenas prácticas con local.","position":2,"status":"published","content_version":1,"prerequisite_module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","thresholds":{"quiz":70,"exam":80},"xp":{"on_pass":150},"sections":[{"id":"89f086b4-718a-4e37-9159-75b0fe27e70e","title":"¿Qué es una variable y cómo guardar datos?","slug":"que-es-una-variable","position":1,"type":"theory","status":"published","content_version":1,"estimated_minutes":15,"xp_on_complete":10,"lessons":[{"id":"f4f46ea5-a548-4c51-b878-2412e88df886","title":"¿Qué es una variable? La cajita con etiqueta","slug":"que-es-una-variable-cajita","position":1,"concept_id":"lua-var-concepto","explanation":"Una variable es como una cajita en la memoria de la computadora donde guardas un dato. Paso 1: Le pegas una etiqueta con un nombre para encontrarla fácilmente. Paso 2: Metes adentro un valor, como un número o una palabra. Paso 3: Cada vez que escribes el nombre de la variable, la máquina busca y usa su contenido.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Tu primera variable","code":"vidas = 3\nprint(vidas)","language":"lua","output":"3","explanation":"Guardamos el 3 en vidas y lo mostramos en pantalla.","position":1}],"exercises":[{"id":"c5b2b433-2af4-4a70-a9af-25cd605e53f5","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"¿Cuál es la mejor definición de lo que es una variable en programación?","prompt_code":null,"score":10,"concept_ids":["lua-var-concepto"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"a289282d-f606-484c-a9c0-0d6766ce239a","label":"A","body":"Un espacio en la memoria con nombre donde guardamos un dato para usarlo luego","is_correct":true,"position":1},{"id":"323acb33-6f7c-46f4-b3f5-803e2c818fa6","label":"B","body":"Un programa que dibuja figuras","is_correct":false,"position":2},{"id":"a67ee287-dc2b-4de0-a423-f87b3b79d2db","label":"C","body":"Un tipo de cable para conectar internet","is_correct":false,"position":3},{"id":"aeeef30e-3e58-4ae6-ab61-2d064723d362","label":"D","body":"El botón de apagar el monitor","is_correct":false,"position":4}],"correct_answer_ids":["a289282d-f606-484c-a9c0-0d6766ce239a"],"explanation":"¡Exacto! Una variable es un contenedor con nombre en memoria para almacenar y recuperar información.","hints":[]}]},{"id":"c1c05475-6a83-4348-b10a-858e6cf5d51f","title":"Guardar un número en una variable: vidas = 3","slug":"guardar-numero-variable","position":2,"concept_id":"lua-var-guardar-numero","explanation":"Para guardar un número en una variable, escribes el nombre de la cajita, el signo igual y la cifra. Paso 1: Escribes el nombre a la izquierda, por ejemplo vidas. Paso 2: Pones el signo =. Paso 3: Escribes el número a la derecha: vidas = 3. A partir de esa línea, la variable vidas vale 3.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Guardar cifras","code":"puntos = 100\nprint(puntos)","language":"lua","output":"100","explanation":"La variable puntos almacena el número 100.","position":1}],"exercises":[{"id":"d73a5a2d-b43c-4f73-9ebe-fcddc5b3102b","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"Observa este código. ¿Qué número exacto aparecerá en la pantalla?","prompt_code":"oro = 50\nprint(oro)","score":10,"concept_ids":["lua-var-guardar-numero"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"da706693-5568-4ed9-aa28-7e2092cc7dc8","label":"A","body":"oro","is_correct":false,"position":1},{"id":"a201623f-0a62-4613-9d25-e67069983626","label":"B","body":"50","is_correct":true,"position":2},{"id":"323f7115-aae4-4ce6-b367-498cfc225b3a","label":"C","body":"0","is_correct":false,"position":3},{"id":"25bbaf19-b158-463b-b9ca-dfbcd43a79bd","label":"D","body":"Error","is_correct":false,"position":4}],"correct_answer_ids":["a201623f-0a62-4613-9d25-e67069983626"],"explanation":"¡Correcto! print(oro) busca el valor dentro de la variable oro y muestra 50.","hints":[]}]},{"id":"88709b24-8c8d-454b-ad8b-4bd8769fa02d","title":"El operador de asignación =","slug":"operador-asignacion-igual","position":3,"concept_id":"lua-var-operador-asignacion","explanation":"En programación, el signo = no significa igualdad matemática; significa asignación. Paso 1: Piensa en = como una flecha hacia la izquierda. Paso 2: La computadora calcula lo que está a la derecha del signo. Paso 3: Toma ese resultado y lo deposita adentro de la cajita que está a la izquierda.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Asignar valores","code":"nivel = 1\n-- Significa: 'guarda el valor 1 en la variable nivel'","language":"lua","output":"","explanation":"El valor de la derecha se almacena en la variable de la izquierda.","position":1}],"exercises":[{"id":"d53c0f8f-23d4-404f-982c-3f79f3836ab2","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"En la instrucción puntos = 10, ¿qué función cumple exactamente el signo =?","prompt_code":null,"score":10,"concept_ids":["lua-var-operador-asignacion"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"e5b6c956-ae37-4ab8-8fa3-fd55232c3089","label":"A","body":"Comprobar si puntos es idéntico a 10","is_correct":false,"position":1},{"id":"561c5f40-4a66-4bd7-8b34-8d59bcb934a3","label":"B","body":"Borrar el valor de puntos","is_correct":false,"position":2},{"id":"5a3de476-f659-40c4-9c4e-d7b5ad13cc75","label":"C","body":"Asignar y guardar el valor 10 dentro de la variable puntos","is_correct":true,"position":3},{"id":"575e6546-52a2-44ce-b0d9-2ad13766ae32","label":"D","body":"Sumar 10 puntos automáticamente","is_correct":false,"position":4}],"correct_answer_ids":["5a3de476-f659-40c4-9c4e-d7b5ad13cc75"],"explanation":"¡Muy bien! El signo = es el operador de asignación que guarda el valor derecho en la variable izquierda.","hints":[]}]},{"id":"5bdf5460-c95c-45e7-81ae-b4aee09d9570","title":"Leer el valor guardado con print(vidas)","slug":"leer-valor-print","position":4,"concept_id":"lua-var-leer-print","explanation":"Para mirar qué hay adentro de una variable, solo pásale su nombre a print(). Paso 1: Escribes print(). Paso 2: Adentro de los paréntesis pones el nombre de la variable SIN comillas. Paso 3: Lua busca en la memoria qué valor tiene guardado y lo dibuja en pantalla de inmediato.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Mirar adentro de la caja","code":"velocidad = 80\nprint(velocidad)","language":"lua","output":"80","explanation":"print(velocidad) muestra el contenido 80.","position":1}],"exercises":[{"id":"556161f3-4ae5-4a13-b724-647f363cda7c","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"true_false","difficulty":"easy","category":"variables","prompt":"Para mostrar en pantalla el valor que contiene una variable llamada energia, ¿debemos escribir print(energia) sin comillas?","prompt_code":null,"score":10,"concept_ids":["lua-var-leer-print"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"61e5f416-c590-4958-977b-689626a2429d","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"8316e3e4-d061-41c3-9c57-8fc8fa43b4be","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["8316e3e4-d061-41c3-9c57-8fc8fa43b4be"],"explanation":"¡Verdadero! Escribir el nombre sin comillas le indica a Lua que lea el valor de la variable.","hints":[]}]},{"id":"7b827c70-c772-49c5-8d2c-ecb6ebc4f9f8","title":"Guardar texto en una variable: nombre = \"Ana\"","slug":"guardar-texto-variable","position":5,"concept_id":"lua-var-guardar-texto","explanation":"Las variables también pueden guardar palabras y mensajes de texto. Paso 1: Escribes el nombre de la variable a la izquierda. Paso 2: Pones el signo =. Paso 3: Escribes el texto a la derecha PROTEGIDO con comillas: nombre = \"Ana\". Ahora tu variable guarda una palabra.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Variable con texto","code":"heroe = \"Arturo\"\nprint(heroe)","language":"lua","output":"Arturo","explanation":"heroe almacena el texto protegido 'Arturo'.","position":1}],"exercises":[{"id":"36472ae6-8752-4937-bef0-3155fa5a5a1e","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué mensaje aparecerá en pantalla al ejecutar estas dos líneas?","prompt_code":"clan = \"Dragones\"\nprint(clan)","score":10,"concept_ids":["lua-var-guardar-texto"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"3caf203e-e0d9-4ca3-b004-79324e2c1891","label":"A","body":"\"Dragones\" con comillas","is_correct":false,"position":1},{"id":"9ab3744f-37b7-4f8f-8685-bb62b94662b0","label":"B","body":"clan","is_correct":false,"position":2},{"id":"17e2c8bb-1fc4-4cc6-a542-8d41cb012079","label":"C","body":"Error","is_correct":false,"position":3},{"id":"b30722b8-13a0-471d-92c5-f995f18cd6a5","label":"D","body":"Dragones","is_correct":true,"position":4}],"correct_answer_ids":["b30722b8-13a0-471d-92c5-f995f18cd6a5"],"explanation":"¡Exacto! Muestra el texto limpio Dragones sin las comillas delimitadoras.","hints":[]}]},{"id":"1fb16ac6-efe3-4de9-b834-eeefbae56b3e","title":"La diferencia entre \"palabra\" y palabra","slug":"diferencia-comillas-y-variable","position":6,"concept_id":"lua-var-vs-string","explanation":"Esta es la mayor confusión del principiante: comillas vs sin comillas. Paso 1: Si escribes \"vidas\" con comillas, es una palabra literal de texto. Paso 2: Si escribes vidas sin comillas, es el nombre de tu variable. Paso 3: print(\"vidas\") muestra la palabra vidas, pero print(vidas) muestra el número 3.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Comillas vs Variable","code":"vidas = 3\nprint(\"vidas\") -- Muestra la palabra\nprint(vidas)   -- Muestra el número 3","language":"lua","output":"vidas\n3","explanation":"Con comillas es texto puro; sin comillas es la variable.","position":1}],"exercises":[{"id":"4c09e68e-4331-42eb-abdf-be13d8621b86","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"Si tenemos oro = 100, ¿qué mostrará exactamente la instrucción print(\"oro\") con comillas?","prompt_code":"oro = 100\nprint(\"oro\")","score":10,"concept_ids":["lua-var-vs-string"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"89bd4cf5-13a9-46e3-9e4e-fb8221ab6c1b","label":"A","body":"oro","is_correct":true,"position":1},{"id":"c26cb320-3f1b-4a95-8cf4-818095cb1887","label":"B","body":"100","is_correct":false,"position":2},{"id":"9ce394bc-145d-40e9-98a4-0294ec0f6d74","label":"C","body":"oro = 100","is_correct":false,"position":3},{"id":"c2c3b2bd-568c-47a5-b25e-0d728f60620a","label":"D","body":"Error","is_correct":false,"position":4}],"correct_answer_ids":["89bd4cf5-13a9-46e3-9e4e-fb8221ab6c1b"],"explanation":"¡Correcto! Al estar entre comillas, Lua muestra la palabra literal oro e ignora la variable.","hints":[]}]},{"id":"35892add-a48f-4b4e-94c5-1f853c5f0631","title":"Nombres de variables descriptivos y claros","slug":"nombres-variables-claros","position":7,"concept_id":"lua-var-nombres-descriptivos","explanation":"Bautizar tus variables con buenos nombres hace que tu código se entienda solo. Paso 1: Evita letras perezosas como a = 3 o x = 100. Paso 2: Usa nombres expresivos que expliquen su contenido: vidas_restantes = 3 o monedas_oro = 100. Paso 3: Así cualquier persona (y tú en el futuro) comprenderán el programa al instante.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Nombres limpios","code":"pociones_curacion = 5\nprint(\"Pociones disponibles:\", pociones_curacion)","language":"lua","output":"Pociones disponibles:\t5","explanation":"Los nombres expresivos hacen el código autoexplicativo.","position":1}],"exercises":[{"id":"bd3b865b-0a12-4053-b147-3c6bfad406f3","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"¿Cuál de los siguientes nombres de variable es el más claro y descriptivo para guardar la puntuación más alta de un jugador?","prompt_code":null,"score":10,"concept_ids":["lua-var-nombres-descriptivos"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"077870d9-c934-4b54-b5d0-0087d4d7d863","label":"A","body":"p","is_correct":false,"position":1},{"id":"5697ed79-cc9b-492d-8cbe-0464098ccfdb","label":"B","body":"record_puntos","is_correct":true,"position":2},{"id":"30fd6d1e-80b3-41ee-b622-7158a358abe6","label":"C","body":"x_temp","is_correct":false,"position":3},{"id":"9e35f874-7e28-43eb-84c2-cdfd016a52fc","label":"D","body":"cosa1","is_correct":false,"position":4}],"correct_answer_ids":["5697ed79-cc9b-492d-8cbe-0464098ccfdb"],"explanation":"¡Excelente! record_puntos comunica con total claridad qué dato almacena.","hints":[]}]},{"id":"cd57aaea-eb5c-4e66-a4a4-99ef8f54663c","title":"Crear varias variables en renglones separados","slug":"varias-variables-renglones","position":8,"concept_id":"lua-var-varias-lineas","explanation":"En un videojuego o programa real, necesitas guardar muchos datos distintos a la vez. Paso 1: Crea cada variable en su propio renglón limpio. Paso 2: Renglón 1: jugador = \"Kael\". Paso 3: Renglón 2: nivel = 5. Renglón 3: salud = 100. Cada variable vive en su espacio y juntas forman el estado del juego.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Ficha básica","code":"jugador = \"Kael\"\nnivel = 5\nsalud = 100\nprint(jugador, \"Nivel:\", nivel)","language":"lua","output":"Kael\tNivel:\t5","explanation":"Varias variables organizadas renglón por renglón.","position":1}],"exercises":[{"id":"5723ecd3-61a0-4884-b64a-a6a7fcdc5c19","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué salida mostrará este programa?","prompt_code":"heroe = \"Lina\"\nescudo = 40\nprint(heroe, escudo)","score":10,"concept_ids":["lua-var-varias-lineas"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"67fd430d-584c-45f2-84b3-7c0ac62fabdc","label":"A","body":"heroe escudo","is_correct":false,"position":1},{"id":"de6d29fd-b6a9-485e-ae79-2ed02bf43740","label":"B","body":"Linaescudo","is_correct":false,"position":2},{"id":"effa5453-0062-4546-9845-6a15714d06c4","label":"C","body":"Lina 40","is_correct":true,"position":3},{"id":"ef3bfcd2-07a7-4a19-bbce-94cc604b2f33","label":"D","body":"40 Lina","is_correct":false,"position":4}],"correct_answer_ids":["effa5453-0062-4546-9845-6a15714d06c4"],"explanation":"¡Exacto! Muestra el contenido de heroe (Lina) y el contenido de escudo (40) con un espacio.","hints":[]}]},{"id":"2c8377d2-acad-426c-b33f-5085f44ab292","title":"Usar el valor de una variable en cálculos","slug":"usar-variables-en-calculos","position":9,"concept_id":"lua-var-usar-calculos","explanation":"Puedes operar con el valor de una variable igual que si fuera un número. Paso 1: Creas puntos = 50. Paso 2: Escribes print(puntos + 10). Paso 3: Lua mira cuánto vale puntos (50), le suma 10 y muestra 60 en pantalla. ¡Tus variables participan activamente en las matemáticas!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Cálculo con variable","code":"ataque = 25\nbono = 5\nprint(\"Ataque total:\", ataque + bono)","language":"lua","output":"Ataque total:\t30","explanation":"Lua suma 25 + 5 y muestra 30.","position":1}],"exercises":[{"id":"47085f39-8021-42a2-a041-792dcc84190f","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"Si ejecutamos este código, ¿qué número exacto se mostrará?","prompt_code":"monedas = 20\nprint(monedas * 2)","score":10,"concept_ids":["lua-var-usar-calculos"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"eb935da5-cd72-4871-aa2b-7328c25623de","label":"A","body":"202","is_correct":false,"position":1},{"id":"aa3d6e6c-6c78-48cb-bd86-9a59efbfef60","label":"B","body":"22","is_correct":false,"position":2},{"id":"62f881b3-af86-4fca-afdb-6fa23a509f34","label":"C","body":"monedas * 2","is_correct":false,"position":3},{"id":"eb1adca1-23de-4692-8759-eb1a74a7ed3f","label":"D","body":"40","is_correct":true,"position":4}],"correct_answer_ids":["eb1adca1-23de-4692-8759-eb1a74a7ed3f"],"explanation":"¡Correcto! Lua toma el valor 20 y lo multiplica por 2, obteniendo 40.","hints":[]}]},{"id":"d589c549-bf95-4093-b96e-dcaa5a513c7d","title":"Mini-repaso de la Sección 1","slug":"mini-repaso-seccion-uno-m02","position":10,"concept_id":"lua-var-s01-repaso","explanation":"¡Felicidades por dominar tus primeras 9 lecciones de variables! Paso 1: Una variable es una cajita con nombre en memoria. Paso 2: Usamos = para asignar valores numéricos o de texto. Paso 3: Las leemos con print() sin comillas y podemos usarlas en cálculos matemáticos. ¡Ahora aprenderemos a cambiar su valor en el tiempo!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Resumen S01","code":"vidas = 3\nprint(\"Vidas iniciales:\", vidas)","language":"lua","output":"Vidas iniciales:\t3","explanation":"Variables directas aprendidas con éxito.","position":1}],"exercises":[{"id":"0388035b-25e5-435b-8d9f-03ff383a9377","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"true_false","difficulty":"easy","category":"variables","prompt":"Una variable en Lua se crea asignándole un valor con el operador =, se consulta pasando su nombre sin comillas a print(), y puede almacenar números o textos. ¿Es verdadero?","prompt_code":null,"score":10,"concept_ids":["lua-var-s01-repaso"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"9a01918e-a265-42b2-814b-3709635a55bf","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"2857a441-cb84-4aea-9efa-2591e1f2f850","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["2857a441-cb84-4aea-9efa-2591e1f2f850"],"explanation":"¡Verdadero! Has comprendido los fundamentos esenciales de las variables en Lua.","hints":[]}]}]},{"id":"f70ef023-397b-46e7-90da-04d9cac212d8","title":"Reasignación y cambio de valores","slug":"reasignacion-de-variables","position":2,"type":"example","status":"published","content_version":1,"estimated_minutes":15,"xp_on_complete":10,"lessons":[{"id":"ec9523de-5748-4fe3-ab69-021fdfd5980a","title":"¿Qué significa reasignar una variable?","slug":"que-es-reasignar","position":1,"concept_id":"lua-var-reasignar-concepto","explanation":"Reasignar significa cambiar el dato que está adentro de la cajita. Paso 1: Una variable se llama variable porque su valor puede variar. Paso 2: Para cambiar su contenido, vuelves a usar el signo = con el nuevo dato. Paso 3: La computadora saca el valor viejo y guarda el nuevo sin quejarse.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Reasignación","code":"puntos = 10\npuntos = 20\nprint(puntos)","language":"lua","output":"20","explanation":"El valor 10 se reemplazó por el 20.","position":1}],"exercises":[{"id":"092e8660-00d0-45ea-81b7-06270861a0a6","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué número mostrará este código al final?","prompt_code":"vidas = 3\nvidas = 5\nprint(vidas)","score":10,"concept_ids":["lua-var-reasignar-concepto"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"6f8feb56-fe38-440c-9c62-98e1440b421c","label":"A","body":"5","is_correct":true,"position":1},{"id":"be46c21e-c9e9-4aab-9a05-26c38789bec2","label":"B","body":"8","is_correct":false,"position":2},{"id":"889f8195-58a5-4d63-a986-dcfa6bf4fae8","label":"C","body":"35","is_correct":false,"position":3},{"id":"d3a82236-9bf6-42c6-8130-b4d94e549089","label":"D","body":"3","is_correct":false,"position":4}],"correct_answer_ids":["6f8feb56-fe38-440c-9c62-98e1440b421c"],"explanation":"¡Correcto! El valor 3 fue reemplazado por el 5.","hints":[]}]},{"id":"c7cee97b-26b0-41f2-b3d0-aa842b68592c","title":"Cambiar el valor: de vidas = 3 a vidas = 2","slug":"cambiar-valor-vidas","position":2,"concept_id":"lua-var-cambiar-valor","explanation":"Imagina que tu personaje recibe daño en el juego. Paso 1: Inicias la partida con vidas = 3. Paso 2: Un monstruo te golpea, así que escribes vidas = 2. Paso 3: Si ahora llamas a print(vidas), la pantalla mostrará el número 2. Tu juego reacciona al tiempo real.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Daño al héroe","code":"vidas = 3\nprint(\"Inicio:\", vidas)\nvidas = 2\nprint(\"Tras recibir golpe:\", vidas)","language":"lua","output":"Inicio:\t3\nTras recibir golpe:\t2","explanation":"El valor cambió de 3 a 2.","position":1}],"exercises":[{"id":"752783f8-b32b-4c6b-b9bd-c4cfd42a394a","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"true_false","difficulty":"easy","category":"variables","prompt":"¿Una variable puede cambiar su valor tantas veces como sea necesario a lo largo de un programa?","prompt_code":null,"score":10,"concept_ids":["lua-var-cambiar-valor"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"4c0017b9-7ab5-459e-af57-96b7a4aa9ae1","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"48643d46-2b8b-4e5f-9da6-3b7838225ab2","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["48643d46-2b8b-4e5f-9da6-3b7838225ab2"],"explanation":"¡Verdadero! Las variables están diseñadas para actualizarse dinámicamente durante la ejecución.","hints":[]}]},{"id":"3a3e6ce9-aeea-48e8-8ae4-6a375a4356c5","title":"Las variables solo recuerdan su último valor","slug":"ultimo-valor-guardado","position":3,"concept_id":"lua-var-ultimo-valor","explanation":"La memoria de una variable es simple: solo recuerda lo último que le metiste. Paso 1: Si le pones monedas = 10, luego monedas = 20, y luego monedas = 30. Paso 2: Los valores 10 y 20 se han borrado para siempre. Paso 3: Solo el número 30 sobrevive adentro de la cajita.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Último estado","code":"oro = 10\noro = 20\noro = 30\nprint(oro)","language":"lua","output":"30","explanation":"Solo el último valor asignado permanece.","position":1}],"exercises":[{"id":"9f075ed4-a400-4c27-8120-c19e9f29ff55","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"Observa este código con 3 asignaciones. ¿Qué número quedará grabado en la variable?","prompt_code":"nivel = 1\nnivel = 2\nnivel = 3\nprint(nivel)","score":10,"concept_ids":["lua-var-ultimo-valor"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"3816f3f4-28b6-4993-83cf-c375c91d8b82","label":"A","body":"1","is_correct":false,"position":1},{"id":"22590a67-0d7f-41f3-87ca-aa72d4f947fa","label":"B","body":"3","is_correct":true,"position":2},{"id":"12b538b3-dfe6-4d02-a17d-9de7e9078df2","label":"C","body":"6","is_correct":false,"position":3},{"id":"67f36918-3d47-4559-b083-0e79c258d03d","label":"D","body":"Error","is_correct":false,"position":4}],"correct_answer_ids":["22590a67-0d7f-41f3-87ca-aa72d4f947fa"],"explanation":"¡Exacto! El último valor asignado (3) es el que permanece en la variable.","hints":[]}]},{"id":"c38a6e3d-953a-452c-95eb-92dcf36ba935","title":"Incrementar un contador: puntos = puntos + 1","slug":"contador-incrementar","position":4,"concept_id":"lua-var-contador-incrementar","explanation":"Este es el truco más famoso de los videojuegos: el contador. Paso 1: Escribes puntos = puntos + 1. Paso 2: Recuerda que Lua primero calcula lo de la derecha: puntos (que vale 10) + 1 = 11. Paso 3: Luego deposita ese 11 de vuelta en la variable. ¡Así sumas puntos cada vez que el héroe recoge una moneda!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Subir puntos","code":"puntos = 10\npuntos = puntos + 1\nprint(puntos)","language":"lua","output":"11","explanation":"Toma el valor actual y le suma 1.","position":1}],"exercises":[{"id":"fcc02b8f-4001-43fc-b2b9-f2a99b4f6f55","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"Si puntos vale 5 y ejecutamos puntos = puntos + 5, ¿cuánto valdrá puntos al final?","prompt_code":"puntos = 5\npuntos = puntos + 5\nprint(puntos)","score":10,"concept_ids":["lua-var-contador-incrementar"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"65784570-958b-4aa6-8f7c-6847c3cf4fad","label":"A","body":"5","is_correct":false,"position":1},{"id":"fe30ea5c-0f35-4444-99d1-998622bb2480","label":"B","body":"55","is_correct":false,"position":2},{"id":"d378eb77-f6ff-4b44-a71b-b10918791f70","label":"C","body":"10","is_correct":true,"position":3},{"id":"1f13c0e4-f12e-43d2-8364-2c4c0ab58bb8","label":"D","body":"Error","is_correct":false,"position":4}],"correct_answer_ids":["d378eb77-f6ff-4b44-a71b-b10918791f70"],"explanation":"¡Correcto! 5 + 5 se calcula a la derecha y se almacena en puntos, resultando en 10.","hints":[]}]},{"id":"6c04d498-3570-483e-b2cd-323d27ac4ce1","title":"Reducir un contador: vidas = vidas - 1","slug":"contador-reducir","position":5,"concept_id":"lua-var-contador-reducir","explanation":"Lo mismo puedes hacer para restar. Paso 1: Tienes vidas = 3. Paso 2: Al caer en una trampa ejecutas vidas = vidas - 1. Paso 3: Lua calcula 3 - 1 = 2 y lo guarda en vidas. ¡Es la fórmula matemática detrás de cualquier barra de salud!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Perder vida","code":"vidas = 3\nvidas = vidas - 1\nprint(\"Vidas restantes:\", vidas)","language":"lua","output":"Vidas restantes:\t2","explanation":"Resta 1 al valor anterior.","position":1}],"exercises":[{"id":"4a173ab2-e6c5-4e06-99a1-264e4f4dc00f","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué número se mostrará al ejecutar este código?","prompt_code":"salud = 100\nsalud = salud - 20\nprint(salud)","score":10,"concept_ids":["lua-var-contador-reducir"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"d0d9dde5-3b7e-4e62-a612-41be6948e912","label":"A","body":"100","is_correct":false,"position":1},{"id":"17c67e16-7954-4ab6-9fa0-a2738d2f6ab3","label":"B","body":"20","is_correct":false,"position":2},{"id":"68a4fee6-a9b6-40a8-aa76-e958d9a84ca0","label":"C","body":"120","is_correct":false,"position":3},{"id":"5e782071-8d45-4e46-a0f3-e12c78677e3c","label":"D","body":"80","is_correct":true,"position":4}],"correct_answer_ids":["5e782071-8d45-4e46-a0f3-e12c78677e3c"],"explanation":"¡Exacto! 100 - 20 = 80 queda almacenado en salud.","hints":[]}]},{"id":"c3de25f7-b7d4-44d5-9a56-b412247b0d93","title":"Copiar el valor de una variable en otra","slug":"copiar-valor-variable","position":6,"concept_id":"lua-var-copiar-variable","explanation":"Puedes pasarle el contenido de una cajita a otra cajita. Paso 1: Creas original = 50. Paso 2: Creas copia = original. Paso 3: Lua mira cuánto vale original (50) y hace un duplicado exacto dentro de copia. ¡Ahora ambas cajitas tienen el número 50!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Duplicar valor","code":"oro_jugador = 50\noro_guardado = oro_jugador\nprint(oro_guardado)","language":"lua","output":"50","explanation":"copia recibe el valor actual de original.","position":1}],"exercises":[{"id":"911aa247-ed86-4651-8481-179ccb2d0c63","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué mostrará este código al final?","prompt_code":"a = 7\nb = a\nprint(b)","score":10,"concept_ids":["lua-var-copiar-variable"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"111343dd-f6c1-47d4-86ce-de5cf6488d26","label":"A","body":"7","is_correct":true,"position":1},{"id":"ae1404a3-4f2a-4e25-94a4-f60f9e3390e9","label":"B","body":"0","is_correct":false,"position":2},{"id":"4f1baa47-75b5-438a-9407-767b3f734c90","label":"C","body":"a","is_correct":false,"position":3},{"id":"3fee66cb-937c-4e62-8f99-70e8c2f407cc","label":"D","body":"b","is_correct":false,"position":4}],"correct_answer_ids":["111343dd-f6c1-47d4-86ce-de5cf6488d26"],"explanation":"¡Muy bien! b recibe una copia del valor de a (7).","hints":[]}]},{"id":"cba75d22-b4d7-4588-bc3a-52ca4027d6c7","title":"Las variables copiadas son independientes","slug":"independencia-copias","position":7,"concept_id":"lua-var-independencia-copias","explanation":"Cuando copias un número o texto, las cajitas quedan totalmente separadas. Paso 1: Tienes a = 10 y b = a. Paso 2: Si luego cambias a = 99, la cajita b NO cambia. Paso 3: b sigue valiendo 10 porque tiene su propia copia independiente. ¡Cambiar una no afecta a la otra!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Copias separadas","code":"a = 10\nb = a\na = 99\nprint(\"a:\", a, \"b:\", b)","language":"lua","output":"a:\t99\tb:\t10","explanation":"Modificar a no altera la copia en b.","position":1}],"exercises":[{"id":"54e86a0a-76b2-44e4-80b3-882b51e735d2","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"Observa con atención: x = 5, y = x, y luego x = 20. ¿Cuánto vale la variable y?","prompt_code":"x = 5\ny = x\nx = 20\nprint(y)","score":10,"concept_ids":["lua-var-independencia-copias"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"a046aa2b-47e0-49c6-b638-6e969c3e877b","label":"A","body":"20","is_correct":false,"position":1},{"id":"8d11b4e8-5e50-4ac4-976e-1da723eb10f0","label":"B","body":"5","is_correct":true,"position":2},{"id":"5a12f6b6-9a80-4736-82ea-55799999d4a5","label":"C","body":"0","is_correct":false,"position":3},{"id":"368ecaeb-140a-4f1c-85d7-9621938e4bc6","label":"D","body":"25","is_correct":false,"position":4}],"correct_answer_ids":["8d11b4e8-5e50-4ac4-976e-1da723eb10f0"],"explanation":"¡Correcto! y conservó su copia de 5 intacta.","hints":[]}]},{"id":"f16ab106-9bdc-43ae-9eba-ab648811a4e9","title":"Cambiar de tipo de dato sobre la marcha","slug":"cambio-tipo-dinamico","position":8,"concept_id":"lua-var-cambio-tipo-dinamico","explanation":"Lua es un lenguaje de 'tipado dinámico'. Paso 1: Una misma variable puede guardar un número hoy: dato = 42. Paso 2: Y mañana puede guardar una palabra: dato = \"Hola\". Paso 3: A Lua no le importa el cambio; las cajitas se adaptan automáticamente a lo que metas.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Cambio dinámico","code":"dato = 100\nprint(dato)\ndato = \"ahora soy texto\"\nprint(dato)","language":"lua","output":"100\nahora soy texto","explanation":"Una misma variable puede cambiar de número a texto.","position":1}],"exercises":[{"id":"1e9c4fac-d2c4-48f0-9d2b-0c30570424f5","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"true_false","difficulty":"easy","category":"variables","prompt":"En Lua, ¿una variable que comenzó guardando un número puede ser reasignada más adelante con un texto?","prompt_code":null,"score":10,"concept_ids":["lua-var-cambio-tipo-dinamico"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"f989fb8c-3342-4263-9cf2-970fd7a4fc00","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"33c76b78-4b6d-44c3-8982-e4f81a6bd0d9","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["33c76b78-4b6d-44c3-8982-e4f81a6bd0d9"],"explanation":"¡Verdadero! Lua tiene tipado dinámico; los tipos pertenecen a los valores, no a los nombres de las variables.","hints":[]}]},{"id":"3f1245a6-41d9-4a6f-b0f2-1fdc5c1f1a35","title":"El orden secuencial importa al leer y reasignar","slug":"secuencia-reasignar","position":9,"concept_id":"lua-var-secuencia-reasignar","explanation":"Recuerda que la computadora lee de arriba hacia abajo. Paso 1: Si muestras print(vidas) en la línea 2, mostrará el valor de ese momento. Paso 2: Si cambias vidas en la línea 3 y vuelves a imprimir en la línea 4, mostrará el nuevo valor. Paso 3: La foto que toma print depende del instante en que la ejecutes.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Evolución secuencial","code":"monedas = 0\nprint(monedas) -- Muestra 0\nmonedas = 5\nprint(monedas) -- Muestra 5","language":"lua","output":"0\n5","explanation":"Cada print muestra el estado en ese renglón exacto.","position":1}],"exercises":[{"id":"4e97c9e8-17f6-47ff-b2ca-a9def579fae5","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué dos números mostrará este código en orden?","prompt_code":"x = 1\nprint(x)\nx = 9\nprint(x)","score":10,"concept_ids":["lua-var-secuencia-reasignar"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"d1b1168a-1255-4857-b9a1-19d636f1b977","label":"A","body":"9 y luego 9","is_correct":false,"position":1},{"id":"eb5c84bc-2c4e-4478-991e-1710c2d3ccef","label":"B","body":"1 y luego
