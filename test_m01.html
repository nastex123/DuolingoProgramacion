<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lua M01 — Fundamentos (CodeQuest Desktop)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2563EB;
    --primary-hover: #1D4ED8;
    --primary-light: #EFF6FF;
    --primary-border: #DBEAFE;
    --success: #16A34A;
    --success-light: #DCFCE7;
    --success-border: #86EFAC;
    --danger: #DC2626;
    --danger-light: #FEE2E2;
    --danger-border: #FCA5A5;
    --warning: #D97706;
    --warning-light: #FEF3C7;
    --bg: #F8FAFC;
    --bg-card: #FFFFFF;
    --bg-card-alt: #F1F5F9;
    --text: #0F172A;
    --muted: #64748B;
    --border: #E2E8F0;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 25px rgba(0,0,0,0.08);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --sidebar-w: 260px;
    --font-code: 'Fira Code', ui-monospace, Menlo, monospace;
  }

  html.dark {
    --bg: #0B0F19;
    --bg-card: #151D2E;
    --bg-card-alt: #1E293B;
    --text: #F8FAFC;
    --muted: #94A3B8;
    --border: #243048;
    --primary: #3B82F6;
    --primary-hover: #60A5FA;
    --primary-light: #1E293B;
    --primary-border: #2563EB;
    --success-light: #064E3B;
    --success-border: #059669;
    --danger-light: #450A0A;
    --danger-border: #DC2626;
    --warning-light: #78350F;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
  }

  /* =========================================================
     LAYOUT DE ESCRITORIO (Sidebar + Main Viewport)
     ========================================================= */
  .app-sidebar {
    width: var(--sidebar-w);
    height: 100vh;
    position: fixed;
    top: 0;
    left: 0;
    background: var(--bg-card);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 100;
    transition: transform 0.2s ease;
  }

  .sidebar-brand {
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .brand-logo-badge {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, #3B82F6, #1D4ED8);
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 22px;
    box-shadow: 0 4px 10px rgba(37,99,235,0.3);
  }
  .brand-text h1 {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.3px;
    line-height: 1.2;
  }
  .brand-text span {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }

  .sidebar-nav {
    flex: 1;
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
  }
  .nav-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s ease;
    width: 100%;
  }
  .nav-btn span.icon {
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
  }
  .nav-btn:hover {
    background: var(--bg-card-alt);
    color: var(--text);
  }
  .nav-btn.active {
    background: var(--primary-light);
    color: var(--primary);
    border-color: var(--primary-border);
  }
  html.dark .nav-btn.active {
    background: #1E293B;
    color: #60A5FA;
    border-color: #3B82F6;
  }

  .sidebar-footer {
    padding: 18px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .user-badge-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-card-alt);
    padding: 10px 14px;
    border-radius: var(--radius-md);
  }
  .user-badge-row .streak-badge {
    color: var(--warning);
    font-weight: 700;
    font-size: 13px;
  }
  .user-badge-row .level-badge {
    color: var(--primary);
    font-weight: 700;
    font-size: 13px;
  }

  /* =========================================================
     ÁREA PRINCIPAL (Header + Viewport)
     ========================================================= */
  .app-main {
    margin-left: var(--sidebar-w);
    width: calc(100% - var(--sidebar-w));
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .app-header {
    height: 70px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 90;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    backdrop-filter: blur(10px);
  }
  .header-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .header-crumb {
    font-size: 13px;
    color: var(--muted);
  }
  .header-crumb b {
    color: var(--text);
  }
  .header-progress-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-progress-bar {
    width: 220px;
    height: 8px;
    background: var(--bg-card-alt);
    border-radius: 999px;
    overflow: hidden;
  }
  .header-progress-bar i {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, #3B82F6, #10B981);
    width: 0%;
    transition: width 0.3s ease;
  }
  .header-progress-text {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .stat-pill {
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    border: 1px solid var(--border);
    background: var(--bg-card-alt);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .stat-pill.xp { background: #ECFDF5; color: #065F46; border-color: #A7F3D0; }
  .stat-pill.streak { background: #FFFBEB; color: #92400E; border-color: #FDE68A; }
  html.dark .stat-pill.xp { background: #064E3B; color: #6EE7B7; border-color: #059669; }
  html.dark .stat-pill.streak { background: #78350F; color: #FCD34D; border-color: #B45309; }

  .theme-toggle-btn {
    width: 40px;
    height: 40px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-card-alt);
    color: var(--text);
    cursor: pointer;
    font-size: 18px;
    display: grid;
    place-items: center;
    transition: background 0.15s;
  }
  .theme-toggle-btn:hover {
    background: var(--border);
  }

  /* =========================================================
     CONTENEDOR DE VISTAS (Max-width amplio)
     ========================================================= */
  main#view {
    flex: 1;
    padding: 28px 36px;
    max-width: 1440px;
    width: 100%;
    margin: 0 auto;
  }

  /* =========================================================
     VISTA: LECCIÓN (DESKTOP SPLIT VIEW 2 COLUMNAS)
     ========================================================= */
  .lesson-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Barra superior de navegación de la sección */
  .lesson-topbar-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
  }
  .sec-info-col h3 {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }
  .sec-info-col .meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* Stepper de 10 píldoras de lección */
  .stepper-pills {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .pill-dot {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-card-alt);
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.15s ease;
  }
  .pill-dot:hover {
    border-color: var(--primary);
    color: var(--text);
    transform: translateY(-1px);
  }
  .pill-dot.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-border);
  }
  .pill-dot.done {
    background: var(--success);
    color: #fff;
    border-color: var(--success);
  }

  .lesson-top-nav-btns {
    display: flex;
    gap: 10px;
  }
  .btn-nav-step {
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
  }
  .btn-nav-step:hover:not(:disabled) {
    background: var(--bg-card-alt);
    border-color: var(--primary);
  }
  .btn-nav-step:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* GRID PRINCIPAL: 2 COLUMNAS PERFECTAS */
  .lesson-workspace-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    align-items: stretch;
  }

  /* Panel izquierdo: Teoría y Código */
  .theory-panel {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .card-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px 24px;
    box-shadow: var(--shadow-sm);
  }
  .card-badge-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .badge-tag {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 4px 10px;
    border-radius: 6px;
    background: var(--primary-light);
    color: var(--primary);
  }
  .badge-tag.code-tag {
    background: #F1F5F9;
    color: #475569;
  }
  html.dark .badge-tag.code-tag {
    background: #1E293B;
    color: #94A3B8;
  }
  .badge-concept-id {
    font-size: 11px;
    font-family: var(--font-code);
    color: var(--muted);
  }
  .theory-heading {
    font-size: 20px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 14px;
    line-height: 1.3;
  }
  .theory-text {
    font-size: 15px;
    line-height: 1.65;
    color: #334155;
  }
  html.dark .theory-text {
    color: #E2E8F0;
  }

  /* Editor de código y consola */
  .code-block-wrapper {
    margin-top: 10px;
    background: #0D1117;
    border: 1px solid #30363D;
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .code-block-header {
    background: #161B22;
    padding: 8px 16px;
    border-bottom: 1px solid #30363D;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .code-block-header span {
    font-size: 12px;
    color: #8B949E;
    font-family: var(--font-code);
  }
  .code-pre {
    padding: 16px;
    font-family: var(--font-code);
    font-size: 13.5px;
    color: #E6EDF3;
    line-height: 1.6;
    overflow-x: auto;
  }
  .console-output {
    background: #040D1A;
    border-top: 1px solid #1F2937;
    padding: 12px 16px;
  }
  .console-label {
    font-size: 11px;
    font-weight: 700;
    color: #6EE7B7;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
    font-family: var(--font-code);
  }
  .console-text {
    font-family: var(--font-code);
    font-size: 13px;
    color: #A7F3D0;
    white-space: pre-wrap;
  }
  .example-explanation {
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
  }

  /* Panel derecho: Ejercicio Interactivo */
  .practice-panel {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .exercise-card {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .exercise-question h3 {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.45;
    color: var(--text);
    margin-bottom: 16px;
  }
  .exercise-snippet {
    background: #0D1117;
    border: 1px solid #30363D;
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-family: var(--font-code);
    font-size: 13px;
    color: #F0F6FC;
    margin-bottom: 16px;
    white-space: pre-wrap;
  }

  /* Lista de opciones de respuesta */
  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-radius: var(--radius-md);
    border: 1.5px solid var(--border);
    background: var(--bg-card);
    color: var(--text);
    font-size: 14.5px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s ease;
    line-height: 1.4;
  }
  .option-btn:hover:not(:disabled) {
    border-color: var(--primary);
    background: var(--primary-light);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  .option-btn b.opt-letter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--bg-card-alt);
    margin-right: 12px;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .option-btn .kbd-key {
    font-size: 11px;
    font-family: var(--font-code);
    padding: 3px 7px;
    border-radius: 6px;
    background: var(--bg-card-alt);
    border: 1px solid var(--border);
    color: var(--muted);
    margin-left: 12px;
    flex-shrink: 0;
  }
  .option-btn.correct {
    background: #052E16 !important;
    border-color: #10B981 !important;
    color: #DCFCE7 !important;
  }
  .option-btn.wrong {
    background: #450A0A !important;
    border-color: #EF4444 !important;
    color: #FEE2E2 !important;
  }

  /* Feedback contextual */
  .feedback-box {
    margin-top: 18px;
    padding: 16px;
    border-radius: var(--radius-md);
    font-size: 14px;
    line-height: 1.5;
  }
  .feedback-box.ok {
    background: #064E3B;
    border: 1px solid #059669;
    color: #D1FAE5;
  }
  .feedback-box.no {
    background: #7F1D1D;
    border: 1px solid #DC2626;
    color: #FEE2E2;
  }
  .feedback-hint {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed rgba(255,255,255,0.2);
    font-size: 13px;
  }

  /* Botones de acción del ejercicio */
  .exercise-footer-actions {
    margin-top: 24px;
    display: flex;
    gap: 12px;
  }
  .btn-action-primary {
    flex: 1;
    padding: 14px 20px;
    border-radius: var(--radius-md);
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.15s;
  }
  .btn-action-primary:hover {
    background: var(--primary-hover);
  }
  .btn-action-success {
    background: var(--success) !important;
  }

  /* =========================================================
     VISTA: RUTA (DESKTOP GRID 3 COLUMNAS)
     ========================================================= */
  .ruta-hero-card {
    background: linear-gradient(135deg, #1E293B, #0F172A);
    color: #F8FAFC;
    border-radius: var(--radius-lg);
    padding: 32px 36px;
    margin-bottom: 28px;
    border: 1px solid #334155;
    box-shadow: var(--shadow-md);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ruta-hero-info h2 {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .ruta-hero-info p {
    font-size: 15px;
    color: #94A3B8;
    max-width: 650px;
    line-height: 1.5;
  }
  .ruta-hero-stats {
    display: flex;
    gap: 16px;
  }
  .hero-stat-box {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius-md);
    padding: 16px 20px;
    text-align: center;
    min-width: 110px;
  }
  .hero-stat-box .stat-num {
    font-size: 22px;
    font-weight: 800;
    color: #60A5FA;
  }
  .hero-stat-box .stat-lbl {
    font-size: 12px;
    color: #94A3B8;
    margin-top: 4px;
  }

  .sections-desktop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
  }
  .section-card {
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
  }
  .section-card:hover {
    border-color: var(--primary);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .section-card.active {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-border);
  }
  .sec-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .sec-num-badge {
    font-size: 12px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--primary-light);
    color: var(--primary);
  }
  .sec-check-icon {
    font-size: 16px;
    font-weight: bold;
    color: var(--success);
  }
  .sec-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 12px;
    line-height: 1.35;
  }
  .sec-meta-row {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }
  .sec-progress-bar {
    height: 6px;
    background: var(--bg-card-alt);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .sec-progress-bar i {
    display: block;
    height: 100%;
    background: var(--primary);
    width: 0%;
  }
  .sec-btn-enter {
    width: 100%;
    padding: 10px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--bg-card-alt);
    color: var(--text);
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .section-card:hover .sec-btn-enter {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  /* =========================================================
     VISTA: QUIZ Y PERFIL
     ========================================================= */
  .focus-container {
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Syntax Highlighting */
  .tok-comment { color: #8B949E; font-style: italic; }
  .tok-string { color: #7EE787; }
  .tok-keyword { color: #FF7B72; font-weight: 600; }
  .tok-func { color: #D2A8FF; font-weight: 600; }
  .tok-number { color: #79C0FF; }
  .tok-op { color: #FFA657; }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: #0F172A;
    color: #F8FAFC;
    border: 1px solid #334155;
    padding: 12px 20px;
    border-radius: var(--radius-md);
    font-weight: 600;
    box-shadow: var(--shadow-lg);
    display: none;
    z-index: 1000;
  }

  /* =========================================================

d) puedes crear juegos 2D independientes enteros desde cero.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Juegos famosos","code":"print(\"World of Warcraft\")\nprint(\"Angry Birds\")","language":"lua","output":"World of Warcraft\nAngry Birds","explanation":"Grandes estudios de videojuegos eligen Lua para dar vida a sus proyectos.","position":1}],"exercises":[{"id":"ed3d9725-eb51-4177-b8d4-aa136b18895e","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"¿Grandes videojuegos de la industria como World of Warcraft o Angry Birds han utilizado Lua en sus desarrollos?","prompt_code":null,"score":10,"concept_ids":["lua-fund-juegos-famosos"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"ad8208c5-80c6-4337-9c55-b02d91116a60","label":"A","body":"Verdadero","is_correct":true,"position":1},{"id":"8b771927-fc52-49a3-a00a-cc6c8bf50808","label":"B","body":"Falso","is_correct":false,"position":2}],"correct_answer_ids":["ad8208c5-80c6-4337-9c55-b02d91116a60"],"explanation":"¡Verdadero! Lua es el lenguaje rey de la industria del videojuego para añadir lógica a los motores gráficos.","hints":[],"section_id":"9ce3363b-9d43-4f42-8245-d69a4af22823","lesson_id":"66851abf-114c-4e29-98e2-76008f96b936"}]},{"id":"e50ec83b-e882-4388-ba0c-a11a5ffceeef","title":"¿Qué significa que Lua es 'incrustado'?","slug":"que-significa-lua-incrustado","position":6,"concept_id":"lua-fund-incrustado","explanation":"Decimos que Lua es un lenguaje 'incrustado' (embedded en inglés) porque vive dentro de otros programas. Paso 1: Imagina el motor de un coche dentro de la carrocería. Paso 2: Un juego puede estar hecho en C++ para gráficos pesados, pero lleva Lua adentro para las reglas. Paso 3: Así los diseñadores cambian reglas sin tener que recompilar el juego entero.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Motor incrustado","code":"-- Lua vive dentro del motor del juego\nprint(\"Lógica dentro del motor\")","language":"lua","output":"Lógica dentro del motor","explanation":"Lua actúa como un motor interno de reglas dentro de otra aplicación mayor.","position":1}],"exercises":[{"id":"94949960-cd50-4c0c-9784-281bb377835b","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"Cuando decimos que Lua es un lenguaje 'incrustado', ¿a qué nos referimos?","prompt_code":null,"score":10,"concept_ids":["lua-fund-incrustado"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"34465e41-7226-42d9-bcd7-42352040a017","label":"A","body":"A que viene grabado en piedras antiguas","is_correct":false,"position":1},{"id":"0a9f1634-5a13-4040-93de-9ba3f1440897","label":"B","body":"A que solo funciona dentro de microondas","is_correct":false,"position":2},{"id":"5ab0d0b1-3fac-4d4c-8edb-da057d2aa74c","label":"C","body":"A que está diseñado para vivir e integrarse dentro de otros programas mayores","is_correct":true,"position":3},{"id":"12ff4fc1-32e2-4229-a625-240698ac8ae7","label":"D","body":"A que no se puede conectar a internet","is_correct":false,"position":4}],"correct_answer_ids":["5ab0d0b1-3fac-4d4c-8edb-da057d2aa74c"],"explanation":"¡Exacto! Lua fue diseñado específicamente para incrustarse como motor de scripting dentro de aplicaciones escritas en C, C++, Rust o Java.","hints":[],"section_id":"9ce3363b-9d43-4f42-8245-d69a4af22823","lesson_id":"e50ec83b-e882-4388-ba0c-a11a5ffceeef"}]},{"id":"704505ce-9432-47e8-b5e6-536d0ec995fd","title":"Lua en servidores web de alta velocidad","slug":"lua-en-servidores-web","position":7,"concept_id":"lua-fund-servidores-web","explanation":"Lua no solo sirve para juegos; también sostiene internet. Paso 1: Servidores gigantes como Cloudflare y NGINX usan Lua para proteger y acelerar páginas web. Paso 2: La base de datos ultra rápida Redis permite ejecutar scripts en Lua para procesar datos en microsegundos. Paso 3: Aprender Lua te da habilidades tanto para juegos como para infraestructura web.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Servidores rápidos","code":"print(\"Petición web procesada en microsegundos\")","language":"lua","output":"Petición web procesada en microsegundos","explanation":"Empresas globales usan Lua para atender millones de visitas por segundo.","position":1}],"exercises":[{"id":"ab0e4a5b-b0b2-41e4-a4f6-b7196fc2dd11","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"¿Lua también se utiliza en servidores web y sistemas de internet de alto rendimiento como NGINX o Cloudflare?","prompt_code":null,"score":10,"concept_ids":["lua-fund-servidores-web"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"955394c3-499f-43d7-8ee9-55f6521831f6","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"2b10b630-b20d-4589-bc5b-fc0fef7274f3","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["2b10b630-b20d-4589-bc5b-fc0fef7274f3"],"explanation":"¡Verdadero! Gracias a su velocidad vertiginosa, Lua es una pieza clave en servidores de internet modernos.","hints":[],"section_id":"9ce3363b-9d43-4f42-8245-d69a4af22823","lesson_id":"704505ce-9432-47e8-b5e6-536d0ec995fd"}]},{"id":"26b35215-a94a-4acd-b120-d22273776baf","title":"La primera regla especial de Lua: contamos desde el 1","slug":"contamos-desde-el-uno","position":8,"concept_id":"lua-fund-indice-uno","explanation":"En casi todos los lenguajes de programación raros, la primera casilla de una lista es la número 0. ¡En Lua no! Paso 1: En Lua contamos de forma natural como los seres humanos: 1, 2, 3... Paso 2: La primera posición de una lista es siempre la casilla 1. Paso 3: Esto hace que aprender Lua sea mucho más intuitivo y libre de confusiones.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Contar natural","code":"local colores = {\"rojo\", \"azul\"}\nprint(colores[1]) -- Muestra: rojo","language":"lua","output":"rojo","explanation":"En Lua la primera casilla es la 1, tal como contamos en la vida real.","position":1}],"exercises":[{"id":"463346a7-50a5-4ef4-98c6-1b4fc804b8d6","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"En Lua, ¿cuál es el número de la primera posición o casilla cuando tenemos una lista de elementos?","prompt_code":null,"score":10,"concept_ids":["lua-fund-indice-uno"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"93981b21-1c5c-49ab-995d-bc92b46b7f55","label":"A","body":"El número 0","is_correct":false,"position":1},{"id":"74293b9a-d2c6-4d3f-99bc-99501cabed5e","label":"B","body":"El número -1","is_correct":false,"position":2},{"id":"23332259-22de-4aca-8648-42136986300e","label":"C","body":"El número 1","is_correct":true,"position":3},{"id":"6e298d89-739d-42d4-80db-f85b9d6b2211","label":"D","body":"El número 10","is_correct":false,"position":4}],"correct_answer_ids":["23332259-22de-4aca-8648-42136986300e"],"explanation":"¡Correcto! En Lua las listas y tablas empiezan en el índice 1, a diferencia de otros lenguajes como Python o C.","hints":[],"section_id":"9ce3363b-9d43-4f42-8245-d69a4af22823","lesson_id":"26b35215-a94a-4acd-b120-d22273776baf"}]},{"id":"d8505109-56a0-40fe-b520-c6248c20d689","title":"Lo que es verdad y lo que es mentira en Lua","slug":"lo-que-es-verdad-y-mentira","position":9,"concept_id":"lua-fund-falsy-intro","explanation":"En la computadora tomamos decisiones con 'verdadero' o 'falso'. Paso 1: En Lua, únicamente dos cosas significan 'no' o falso: la palabra 'false' y la palabra 'nil' (que significa vacío). Paso 2: Todo lo demás cuenta como verdadero. Paso 3: El número 0 y el texto vacío \"\" cuentan como verdadero en Lua. ¡Grábate esto y nunca te equivocarás!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Solo false y nil","code":"-- Solo false y nil son falsos en Lua\nprint(\"0 cuenta como verdadero en Lua\")","language":"lua","output":"0 cuenta como verdadero en Lua","explanation":"A diferencia de otros lenguajes, en Lua el número 0 no se considera falso.","position":1}],"exercises":[{"id":"e5b429af-fecc-4c58-a786-9e9c3416fdd2","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"En Lua, ¿cuáles son las ÚNICAS dos cosas que el lenguaje considera como 'falsas' al evaluar condiciones?","prompt_code":null,"score":10,"concept_ids":["lua-fund-falsy-intro"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"0c122464-de39-43d1-aa1d-b01cad63de91","label":"A","body":"El número 0 y el número 1","is_correct":false,"position":1},{"id":"55ae82f1-6197-4653-802d-51802bdfb8e1","label":"B","body":"El texto vacío y el espacio","is_correct":false,"position":2},{"id":"83c53ff7-7998-4ca3-a58f-fb6150e1f22e","label":"C","body":"Únicamente false y nil","is_correct":true,"position":3},{"id":"f7301af9-0c2a-4843-b1fa-9f20341d129b","label":"D","body":"Cualquier número par","is_correct":false,"position":4}],"correct_answer_ids":["83c53ff7-7998-4ca3-a58f-fb6150e1f22e"],"explanation":"¡Exacto! En Lua, solo el booleano `false` y el valor nulo `nil` se consideran falsos. Todo lo demás se evalúa como verdadero.","hints":[],"section_id":"9ce3363b-9d43-4f42-8245-d69a4af22823","lesson_id":"d8505109-56a0-40fe-b520-c6248c20d689"}]},{"id":"545c6d78-a381-4c63-abd4-cd871fa1c0bb","title":"Mini-repaso de la Sección 1","slug":"mini-repaso-seccion-uno","position":10,"concept_id":"lua-fund-s01-repaso","explanation":"¡Felicitaciones por completar tus primeras 9 lecciones! Paso 1: Ya sabes que Lua nació en Brasil y significa Luna. Paso 2: Sabes que es súper ligero (menos de 300 KB) y reina en Roblox y videojuegos. Paso 3: Sabes que sus listas empiezan en 1. ¡Estás listo para aprender cómo se organiza y ejecuta el código!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Resumen S01","code":"print(\"¡Sección 1 dominada!\")","language":"lua","output":"¡Sección 1 dominada!","explanation":"Has sentado las bases para entender el mundo de Lua.","position":1}],"exercises":[{"id":"530d6884-7920-4532-80a1-e8721f98b4b9","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"Lua es un lenguaje ligero, nacido en Brasil, que se utiliza en videojuegos como Roblox y cuyas posiciones de lista comienzan en 1. ¿Es esto verdadero?","prompt_code":null,"score":10,"concept_ids":["lua-fund-s01-repaso"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"aee836dc-b868-42be-9f50-f0cd0366e35f","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"027ffb6c-49b6-4f96-9a35-78dc5461c0f0","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["027ffb6c-49b6-4f96-9a35-78dc5461c0f0"],"explanation":"¡Verdadero! Has resumido a la perfección las características esenciales de Lua aprendidas en esta sección.","hints":[],"section_id":"9ce3363b-9d43-4f42-8245-d69a4af22823","lesson_id":"545c6d78-a381-4c63-abd4-cd871fa1c0bb"}]}]},{"id":"4136e84f-9683-4d7f-998b-246848474b84","title":"Cómo se organiza y prueba tu código","slug":"chunk-y-repl","position":2,"type":"example","status":"published","content_version":2,"estimated_minutes":15,"xp_on_complete":10,"lessons":[{"id":"422ed829-8f7e-4d89-b56f-45e8c8a501a1","title":"¿Qué es una instrucción o comando?","slug":"que-es-una-instruccion","position":1,"concept_id":"lua-fund-instruccion","explanation":"Una instrucción es una orden concreta que le das a la computadora. Paso 1: Piensa en una receta de cocina: 'bate los huevos', 'agrega sal'. Paso 2: Cada renglón de tu código suele ser una orden que la computadora debe realizar. Paso 3: Cuando combinas varias instrucciones ordenadas, creas un programa de verdad.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Dos instrucciones","code":"print(\"Paso 1: Encender\")\nprint(\"Paso 2: Jugar\")","language":"lua","output":"Paso 1: Encender\nPaso 2: Jugar","explanation":"Dos instrucciones sencillas ejecutadas una tras otra.","position":1}],"exercises":[{"id":"859c7d66-8fd7-4301-9987-e4ec7d54037e","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Qué es una instrucción en un programa de Lua?","prompt_code":null,"score":10,"concept_ids":["lua-fund-instruccion"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"6a75475a-df78-4093-b5f5-8233736b69c8","label":"A","body":"Una orden precisa que le dice a la computadora qué acción realizar","is_correct":true,"position":1},{"id":"ed9aca32-44a6-4aac-99b4-e0f60ec69914","label":"B","body":"Un correo electrónico que llega a tu bandeja de entrada","is_correct":false,"position":2},{"id":"45b5e336-a682-4180-a9a3-02cdad1ffc8e","label":"C","body":"El cable de alimentación de la computadora","is_correct":false,"position":3},{"id":"0b051299-3609-49f1-bc72-c8c2fd1958ef","label":"D","body":"Una foto guardada en el escritorio","is_correct":false,"position":4}],"correct_answer_ids":["6a75475a-df78-4093-b5f5-8233736b69c8"],"explanation":"¡Correcto! Una instrucción o sentencia es una orden individual escrita en código para que la máquina la ejecute.","hints":[],"section_id":"4136e84f-9683-4d7f-998b-246848474b84","lesson_id":"422ed829-8f7e-4d89-b56f-45e8c8a501a1"}]},{"id":"e4396ffd-8829-4101-bb07-04b5fcf49257","title":"La computadora lee en orden secuencial","slug":"la-computadora-lee-en-orden","position":2,"concept_id":"lua-fund-secuencia","explanation":"La computadora es muy ordenada y disciplinada. Paso 1: Lee tu archivo siempre de arriba hacia abajo, renglón por renglón. Paso 2: Nunca se salta una orden ni intenta adivinar el final antes de leer el principio. Paso 3: Esto se llama 'ejecución secuencial', como leer un libro línea por línea.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Secuencia estricta","code":"print(\"Primero\")\nprint(\"Segundo\")\nprint(\"Tercero\")","language":"lua","output":"Primero\nSegundo\nTercero","explanation":"Las órdenes se ejecutan estrictamente en el orden en que las escribiste.","position":1}],"exercises":[{"id":"3b582e35-c4c0-45e5-9ba9-946da34b2824","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"predict_output","difficulty":"easy","category":"fundamentos","prompt":"Observa este código. ¿En qué orden exacto aparecerán los mensajes en la pantalla?","prompt_code":"print(\"Inicio\")\nprint(\"Fin\")","score":10,"concept_ids":["lua-fund-secuencia"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"c49ae8bf-c677-484c-aa4c-62030e3a6258","label":"A","body":"Fin y luego Inicio","is_correct":false,"position":1},{"id":"ed44b90a-a2f9-4874-a84b-70f56fd45438","label":"B","body":"Los dos al mismo tiempo en la misma palabra","is_correct":false,"position":2},{"id":"1b09c4ca-c84e-42af-b5dd-d95910101bc5","label":"C","body":"Inicio y luego Fin","is_correct":true,"position":3},{"id":"08d1cb73-25f4-4713-b5db-496c7aeed2e4","label":"D","body":"Solo aparecerá Fin","is_correct":false,"position":4}],"correct_answer_ids":["1b09c4ca-c84e-42af-b5dd-d95910101bc5"],"explanation":"¡Exacto! Lua procesa las instrucciones en orden secuencial de arriba a abajo.","hints":[],"section_id":"4136e84f-9683-4d7f-998b-246848474b84","lesson_id":"e4396ffd-8829-4101-bb07-04b5fcf49257"}]},{"id":"e314ceb8-19dd-4696-8c4f-230b41538928","title":"¿Qué es un bloque de código (chunk)?","slug":"que-es-un-chunk","position":3,"concept_id":"lua-fund-chunk","explanation":"En Lua existe una palabra técnica muy famosa: 'chunk'. Paso 1: No te asustes por la palabra; chunk significa simplemente un paquete o bloque de instrucciones que se evalúan juntas. Paso 2: Puede ser una sola línea o un archivo entero de mil líneas. Paso 3: Lua toma ese bloque completo y lo prepara para ejecutarlo sin interrupciones.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Un chunk simple","code":"-- Este bloque de 2 líneas es un chunk\nlocal vidas = 3\nprint(vidas)","language":"lua","output":"3","explanation":"Todo el bloque se ejecuta junto como una unidad de trabajo.","position":1}],"exercises":[{"id":"2a1842b9-6b2f-413f-9b6f-b721aa0456c9","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"En el mundo de Lua, ¿a qué se refiere el término 'chunk'?","prompt_code":null,"score":10,"concept_ids":["lua-fund-chunk"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"0c8da6fc-eabe-4d99-88cf-e0a688964a89","label":"A","body":"A un pedazo de queso que le gusta a la computadora","is_correct":false,"position":1},{"id":"17a25d44-3ca3-435b-8efe-f1447819df90","label":"B","body":"A un virus informático peligroso","is_correct":false,"position":2},{"id":"7ead48cf-79a5-41db-b05c-91f7d42a6391","label":"C","body":"A un bloque o paquete de instrucciones que Lua lee y ejecuta juntas","is_correct":true,"position":3},{"id":"04232650-afd9-41ac-ad42-433c530be751","label":"D","body":"Al botón de apagar la pantalla","is_correct":false,"position":4}],"correct_answer_ids":["7ead48cf-79a5-41db-b05c-91f7d42a6391"],"explanation":"¡Muy bien! Un 'chunk' es cualquier porción o archivo de código que Lua procesa como una unidad.","hints":[],"section_id":"4136e84f-9683-4d7f-998b-246848474b84","lesson_id":"e314ceb8-19dd-4696-8c4f-230b41538928"}]},{"id":"bb9e24ba-6fcc-4b38-91ae-0c89c94af419","title":"Tu archivo completo es un chunk","slug":"tu-archivo-es-un-chunk","position":4,"concept_id":"lua-fund-archivo-chunk","explanation":"Cuando creas un archivo de texto con código Lua, todo ese archivo es considerado por Lua como un gran chunk. Paso 1: Todo lo que esté adentro comparte el mismo espacio de trabajo inicial. Paso 2: Si creas variables locales dentro del archivo, vivirán seguras dentro de ese archivo. Paso 3: Es como tener tu propia habitación cerrada y ordenada.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Archivo cerrado","code":"-- Todo el archivo forma un chunk único\nlocal secreto = 42\nprint(secreto)","language":"lua","output":"42","explanation":"Las instrucciones dentro de este archivo forman un chunk independiente.","position":1}],"exercises":[{"id":"315d7e78-13df-4726-8739-423539b8222f","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"Cuando guardas instrucciones en un archivo de Lua y lo ejecutas, ¿todo ese archivo funciona como un chunk completo?","prompt_code":null,"score":10,"concept_ids":["lua-fund-archivo-chunk"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"dbf43933-ee46-453e-bff6-c65366529687","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"b3aa991e-d492-487c-9ea3-e2808a1b9079","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["b3aa991e-d492-487c-9ea3-e2808a1b9079"],"explanation":"¡Verdadero! Cada archivo que ejecutas con Lua es tratado por el intérprete como un chunk individual.","hints":[],"section_id":"4136e84f-9683-4d7f-998b-246848474b84","lesson_id":"bb9e24ba-6fcc-4b38-91ae-0c89c94af419"}]},{"id":"3c5d71f4-0d74-458d-ad3e-a5af5c6a0ccf","title":"¿Qué es la consola interactiva (REPL)?","slug":"que-es-la-consola-interactiva","position":5,"concept_id":"lua-fund-repl-intro","explanation":"Imagina un cuaderno borrador donde escribes una idea y se evalúa al instante. Eso es la consola interactiva. Paso 1: Se le conoce como REPL (Leer, Evaluar, Imprimir, Repetir). Paso 2: Te permite probar una orden sin tener que crear ni guardar ningún archivo en el disco. Paso 3: Es la herramienta favorita para quitarte dudas rápidas.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Idea rápida en REPL","code":"> print(\"probando\")\nprobando","language":"lua","output":"probando","explanation":"Escribes una línea, pulsas Enter y ves la respuesta inmediata.","position":1}],"exercises":[{"id":"ab72aa04-9d62-4447-8483-34ad48e2bdc6","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Para qué sirve principalmente la consola interactiva (REPL) de Lua?","prompt_code":null,"score":10,"concept_ids":["lua-fund-repl-intro"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"5eeda126-ef34-45d5-99a5-c7fc826c74fb","label":"A","body":"Para probar órdenes rápidas de código al instante sin necesidad de guardar archivos","is_correct":true,"position":1},{"id":"9b2df52c-6cb9-40d4-8fae-1b745fe21fb8","label":"B","body":"Para jugar partidas multijugador online","is_correct":false,"position":2},{"id":"8b79da97-120d-411e-aa9b-3509560d5952","label":"C","body":"Para reparar teclados rotos","is_correct":false,"position":3},{"id":"2d47512f-4b14-4e63-86e8-8024a1b520ee","label":"D","body":"Para enviar mensajes por WhatsApp","is_correct":false,"position":4}],"correct_answer_ids":["5eeda126-ef34-45d5-99a5-c7fc826c74fb"],"explanation":"¡Exacto! La consola interactiva te permite experimentar de inmediato línea por línea.","hints":[],"section_id":"4136e84f-9683-4d7f-998b-246848474b84","lesson_id":"3c5d71f4-0d74-458d-ad3e-a5af5c6a0ccf"}]},{"id":"b6608013-3d50-44e4-ad78-29fa76f63c6a","title":"Abrir el modo interactivo con lua -i","slug":"abrir-modo-interactivo-lua-i","position":6,"concept_id":"lua-fund-repl-comando","explanation":"Para entrar a este modo borrador interactivo, usas la terminal de tu computadora. Paso 1: Abres la terminal (o símbolo del sistema). Paso 2: Escribes exactamente 'lua -i' (la letra -i significa 'interactivo'). Paso 3: Pulsas Enter y verás el mensaje de bienvenida de Lua listo para recibir tus órdenes.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Comando terminal","code":"$ lua -i\nLua 5.4.4  Copyright (C) 1994-2022 Lua.org, PUC-Rio\n>","language":"lua","output":">","explanation":"Escribir 'lua -i' abre la puerta mágica de la consola interactiva.","position":1}],"exercises":[{"id":"3fea5078-69d2-438f-bf0d-bdec7a121536","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Qué comando debes escribir en la terminal para abrir el modo interactivo de Lua?","prompt_code":null,"score":10,"concept_ids":["lua-fund-repl-comando"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"eaf11475-b2ff-470d-b8d8-bb372faf8300","label":"A","body":"lua entrar","is_correct":false,"position":1},{"id":"7f8d6c21-7d83-4a58-bdd9-d23d319f6cf4","label":"B","body":"abrir lua","is_correct":false,"position":2},{"id":"436a63b4-9049-4039-9491-61cd150de6a6","label":"C","body":"iniciar juego","is_correct":false,"position":3},{"id":"3abd7e16-7697-44e5-b900-83c15cb89e01","label":"D","body":"lua -i","is_correct":true,"position":4}],"correct_answer_ids":["3abd7e16-7697-44e5-b900-83c15cb89e01"],"explanation":"¡Muy bien! La opción `-i` le indica al ejecutable de Lua que inicie en modo interactivo.","hints":[],"section_id":"4136e84f-9683-4d7f-998b-246848474b84","lesson_id":"b6608013-3d50-44e4-ad78-29fa76f63c6a"}]},{"id":"a1fa8eb2-a525-4e0e-a23e-e40eede21275","title":"El símbolo de espera >","slug":"el-simbolo-de-espera-prompt","position":7,"concept_id":"lua-fund-prompt-simbolo","explanation":"Cuando entras al modo interactivo, notarás un pequeño signo mayor que '>'. Paso 1: A este símbolo se le llama 'prompt' o cursor de espera. Paso 2: Es la forma en que Lua te dice: 'Estoy listo y escuchándote, escribe tu orden'. Paso 3: Cada vez que veas '>' sabes que la computadora no está trabada, sino esperando por ti.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"El símbolo >","code":"> print(\"hola\")\nhola\n>","language":"lua","output":"hola","explanation":"El símbolo > te invita a escribir una orden tras otra.","position":1}],"exercises":[{"id":"e93f42b0-ae05-40cc-a514-9aeb3f90f4c2","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"En la consola interactiva de Lua, ¿el símbolo '>' indica que el programa está listo esperando que escribas tu siguiente orden?","prompt_code":null,"score":10,"concept_ids":["lua-fund-prompt-simbolo"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"f8691f03-b83e-4e1e-a7a3-ee3861e25e2d","label":"A","body":"Verdadero","is_correct":true,"position":1},{"id":"d0c37809-3d78-43fe-af40-5ec8ec412723","label":"B","body":"Falso","is_correct":false,"position":2}],"correct_answer_ids":["f8691f03-b83e-4e1e-a7a3-ee3861e25e2d"],"explanation":"¡Verdadero! El símbolo `>` es la señal de que la consola interactiva espera tu entrada de texto.","hints":[],"section_id":"4136e84f-9683-4d7f-998b-246848474b84","lesson_id":"a1fa8eb2-a525-4e0e-a23e-e40eede21275"}]},{"id":"23262297-9511-4bd4-89c7-e4e3a45d5c5d","title":"Tu primera orden en vivo en la consola","slug":"primera-orden-en-vivo","position":8,"concept_id":"lua-fund-repl-en-vivo","explanation":"Hagamos la prueba mental de una orden en vivo. Paso 1: En el símbolo '>', escribes: print(5 + 5). Paso 2: Pulsas la tecla Enter de tu teclado. Paso 3: En el renglón de abajo, Lua te responde inmediatamente con el número 10, y vuelve a mostrar el símbolo '>' para que sigas jugando. ¡Es inmediato y mágico!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Cálculo en vivo","code":"> print(5 + 5)\n10\n>","language":"lua","output":"10","explanation":"La consola calcula y muestra el resultado en menos de un parpadeo.","position":1}],"exercises":[{"id":"2bc2b561-7037-40d9-9143-92b65c0e8451","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"predict_output","difficulty":"easy","category":"fundamentos","prompt":"Si en la consola interactiva escribes `print(2 + 2)` y pulsas Enter, ¿qué número verás como respuesta?","prompt_code":"print(2 + 2)","score":10,"concept_ids":["lua-fund-repl-en-vivo"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"4a812c9e-9936-4a81-b8ca-2dd234d7d21e","label":"A","body":"22","is_correct":false,"position":1},{"id":"55b08865-e36f-4f0a-98c4-f92b875dc7c9","label":"B","body":"2 + 2","is_correct":false,"position":2},{"id":"79cd8af8-50eb-4f17-9881-b001d85f172e","label":"C","body":"4","is_correct":true,"position":3},{"id":"5157199e-f7e0-4219-821f-f170a136a2a2","label":"D","body":"Error","is_correct":false,"position":4}],"correct_answer_ids":["79cd8af8-50eb-4f17-9881-b001d85f172e"],"explanation":"¡Exacto! Lua realiza la suma matemática y muestra el resultado 4 en pantalla.","hints":[],"section_id":"4136e84f-9683-4d7f-998b-246848474b84","lesson_id":"23262297-9511-4bd4-89c7-e4e3a45d5c5d"}]},{"id":"00381755-ce32-4d57-b42b-90087eabb723","title":"Cómo salir de la consola sin miedo","slug":"como-salir-de-la-consola","position":9,"concept_id":"lua-fund-repl-salir","explanation":"Muchos novatos entran a la consola y luego se asustan porque no saben cómo cerrarla. ¡Es súper fácil! Paso 1: Puedes escribir la orden: os.exit() y pulsar Enter. Paso 2: O puedes usar el atajo de teclado: Ctrl + D (en Mac/Linux) o Ctrl + Z seguido de Enter (en Windows). Paso 3: Con eso sales limpiamente y regresas a tu terminal normal.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Salir limpio","code":"> os.exit()\n-- Regresas a la terminal normal","language":"lua","output":"","explanation":"La orden os.exit() cierra la sesión interactiva con total seguridad.","position":1}],"exercises":[{"id":"590fbc3e-c411-427f-97c9-5f83fbbade02","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Cuál de las siguientes opciones te permite salir limpiamente de la consola interactiva de Lua?","prompt_code":null,"score":10,"concept_ids":["lua-fund-repl-salir"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"de10927d-6e11-4355-bda5-25192a44f7d7","label":"A","body":"Desconectar la computadora de la pared","is_correct":false,"position":1},{"id":"84784a60-32f5-4b57-ab4b-39aa26cbf309","label":"B","body":"Escribir la orden os.exit()","is_correct":true,"position":2},{"id":"85f2028b-a341-4dc4-a24f-527c3c79b2d1","label":"C","body":"Gritarle a la pantalla","is_correct":false,"position":3},{"id":"ffdde668-74be-4219-89df-023e0c393d2a","label":"D","body":"Escribir la palabra 'ayuda por favor'","is_correct":false,"position":4}],"correct_answer_ids":["84784a60-32f5-4b57-ab4b-39aa26cbf309"],"explanation":"¡Correcto! `os.exit()` es la función estándar de Lua para terminar el programa y salir.","hints":[],"section_id":"4136e84f-9683-4d7f-998b-246848474b84","lesson_id":"00381755-ce32-4d57-b42b-90087eabb723"}]},{"id":"4fa4ae04-b051-428d-bcb8-0696a861bc7e","title":"Mini-repaso de la Sección 2","slug":"mini-repaso-seccion-dos","position":10,"concept_id":"lua-fund-s02-repaso","explanation":"¡Excelente trabajo en la Sección 2! Paso 1: Aprendiste que el código se ejecuta en orden secuencial de arriba a abajo. Paso 2: Descubriste que un chunk es un bloque o archivo de instrucciones que Lua lee juntas. Paso 3: Dominaste el modo interactivo `lua -i` y cómo cerrarlo con `os.exit()`. ¡Ahora aprenderemos a hacer hablar a tu programa!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Resumen S02","code":"print(\"¡Sección 2 completada!\")","language":"lua","output":"¡Sección 2 completada!","explanation":"Ya entiendes el ciclo de vida de una instrucción en Lua.","position":1}],"exercises":[{"id":"186f1614-3409-4506-8e53-b3593c8317df","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"En Lua, las instrucciones se leen secuencialmente de arriba a abajo, forman chunks y se pueden ensayar rápidamente con 'lua -i'. ¿Es verdadero?","prompt_code":null,"score":10,"concept_ids":["lua-fund-s02-repaso"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"46e149eb-faac-4cab-a1cc-4f9dfda134ab","label":"A","body":"Verdadero","is_correct":true,"position":1},{"id":"ecf1e842-b0d3-4473-8d0e-d9f20023ab58","label":"B","body":"Falso","is_correct":false,"position":2}],"correct_answer_ids":["46e149eb-faac-4cab-a1cc-4f9dfda134ab"],"explanation":"¡Verdadero! Has dominado los conceptos de secuencia, chunk y REPL.","hints":[],"section_id":"4136e84f-9683-4d7f-998b-246848474b84","lesson_id":"4fa4ae04-b051-428d-bcb8-0696a861bc7e"}]}]},{"id":"45fcbbf2-bbf7-453e-8f85-cc80041839a5","title":"Tu primer print","slug":"tu-primer-print","position":3,"type":"example","status":"published","content_version":2,"estimated_minutes":15,"xp_on_complete":10,"lessons":[{"id":"066aec07-885e-4bb3-aa8d-90ede2f00173","title":"¿Para qué sirve print?","slug":"para-que-sirve-print","position":1,"concept_id":"lua-fund-print-para-que","explanation":"La instrucción 'print' es la voz de tu programa. Paso 1: Las computadoras calculan cosas en silencio dentro de sus chips. Paso 2: Si no usas print, el programa hace su trabajo pero tú no ves nada en pantalla. Paso 3: print toma cualquier mensaje o número y lo dibuja en la terminal para que puedas leerlo con tus ojos.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"La voz del programa","code":"print(\"Puedo hablar en la pantalla\")","language":"lua","output":"Puedo hablar en la pantalla","explanation":"Sin print, la computadora trabajaría en total silencio.","position":1}],"exercises":[{"id":"7815ec9e-5101-47f0-84c2-a60320c87076","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Cuál es la función principal de la orden `print` en Lua?","prompt_code":null,"score":10,"concept_ids":["lua-fund-print-para-que"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"ddf68ea3-0c0a-4532-8270-10c1ab33bbb5","label":"A","body":"Enviar un documento a una impresora con tinta en papel","is_correct":false,"position":1},{"id":"40eb510c-fb79-4f0d-a940-c9bcc800ab19","label":"B","body":"Borrar los archivos del disco duro","is_correct":false,"position":2},{"id":"54da6533-3f9a-4945-85e6-16732032d9c8","label":"C","body":"Apagar los altavoces de la computadora","is_correct":false,"position":3},{"id":"f84fd83d-afd3-4fc3-9689-ad8bae8bde0e","label":"D","body":"Mostrar mensajes, textos o datos visibles en la pantalla","is_correct":true,"position":4}],"correct_answer_ids":["f84fd83d-afd3-4fc3-9689-ad8bae8bde0e"],"explanation":"¡Correcto! En programación, `print` muestra información en la pantalla o consola para que el usuario pueda verla.","hints":[],"section_id":"45fcbbf2-bbf7-453e-8f85-cc80041839a5","lesson_id":"066aec07-885e-4bb3-aa8d-90ede2f00173"}]},{"id":"fc2914a7-bf17-4f13-85a8-16f232fc9618","title":"Los paréntesis () en las órdenes","slug":"los-parentesis-en-las-ordenes","position":2,"concept_id":"lua-fund-print-parentesis","explanation":"Observa que después de la palabra print siempre ponemos paréntesis `()`. Paso 1: Los paréntesis le dicen a Lua: 'ejecuta esta acción ya mismo'. Paso 2: Todo lo que pongas adentro de los paréntesis es lo que quieres que print muestre. Paso 3: Si olvidas cerrar el paréntesis al final, Lua no sabrá dónde termina tu orden y marcará error.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Paréntesis obligatorios","code":"print(\"Abro y cierro paréntesis\")","language":"lua","output":"Abro y cierro paréntesis","explanation":"Los paréntesis abrazan el contenido que vas a mostrar.","position":1}],"exercises":[{"id":"5191a075-53a4-4d25-9984-a6a10e557071","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"find_error","difficulty":"easy","category":"fundamentos","prompt":"Observa este código con atención. ¿Por qué Lua marcará un error de sintaxis?","prompt_code":"print(\"Hola mundo\"","score":10,"concept_ids":["lua-fund-print-parentesis"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"4567bcf7-97f8-41e3-b175-12e131080d89","label":"A","body":"La palabra print está prohibida","is_correct":false,"position":1},{"id":"a4e8b697-789b-4c39-86ef-e450be577f45","label":"B","body":"Falta cerrar el paréntesis al final de la orden","is_correct":true,"position":2},{"id":"04ad4830-f7e8-4818-9da9-e1249b756f82","label":"C","body":"No se puede usar la palabra mundo","is_correct":false,"position":3},{"id":"c226e11d-b82f-4c0a-8cfa-d9ba7552a1fc","label":"D","body":"Falta poner una coma al inicio","is_correct":false,"position":4}],"correct_answer_ids":["a4e8b697-789b-4c39-86ef-e450be577f45"],"explanation":"¡Muy bien! Todo paréntesis que se abre `(` debe cerrarse obligatoriamente `)`.","hints":[],"section_id":"45fcbbf2-bbf7-453e-8f85-cc80041839a5","lesson_id":"fc2914a7-bf17-4f13-85a8-16f232fc9618"}]},{"id":"27987d4c-3d3b-4ae1-bd9c-e97fa613445f","title":"Mostrar tu primer mensaje: 'Hola, mundo'","slug":"mostrar-primer-mensaje-hola-mundo","position":3,"concept_id":"lua-fund-print-hola","explanation":"Desde los años 70, existe una tradición sagrada entre todos los programadores del planeta: lo primero que creas en un lenguaje nuevo es un saludo al mundo. Paso 1: Escribes print. Paso 2: Abres paréntesis y comillas. Paso 3: Escribes: print(\"¡Hola, mundo!\"). ¡Acabas de unirte a la hermandad mundial de programadores!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"La tradición","code":"print(\"¡Hola, mundo!\")","language":"lua","output":"¡Hola, mundo!","explanation":"El clásico saludo universal de todo programador.","position":1}],"exercises":[{"id":"baae8577-5bf3-4421-9490-d429ad8c3e32","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"predict_output","difficulty":"easy","category":"fundamentos","prompt":"Al ejecutar `print(\"¡Hola, mundo!\")`, ¿qué texto limpio aparecerá en la pantalla?","prompt_code":"print(\"¡Hola, mundo!\")","score":10,"concept_ids":["lua-fund-print-hola"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"4091294f-7625-4d43-a9c5-431d271e90e6","label":"A","body":"\"¡Hola, mundo!\" con las comillas dibujadas","is_correct":false,"position":1},{"id":"c4c7e965-49d9-43f7-9cf1-6b57aa947141","label":"B","body":"print(¡Hola, mundo!)","is_correct":false,"position":2},{"id":"8e9d91fb-1226-484a-b242-f7eb12f799f2","label":"C","body":"¡Hola, mundo! (limpio, sin comillas)","is_correct":true,"position":3},{"id":"a7d9e831-037d-42aa-a07a-1e6676f20826","label":"D","body":"Nada, la pantalla se queda negra","is_correct":false,"position":4}],"correct_answer_ids":["8e9d91fb-1226-484a-b242-f7eb12f799f2"],"explanation":"¡Exacto! Las comillas le indican a Lua dónde inicia y termina el texto, pero no se dibujan en la salida final.","hints":[],"section_id":"45fcbbf2-bbf7-453e-8f85-cc80041839a5","lesson_id":"27987d4c-3d3b-4ae1-bd9c-e97fa613445f"}]},{"id":"30bdaf91-6a3d-4a81-a242-d298f3c4a08e","title":"Por qué usamos comillas en los textos","slug":"por-que-usamos-comillas","position":4,"concept_id":"lua-fund-print-comillas","explanation":"Las comillas son el escudo protector de tus palabras. Paso 1: Si escribes print(Hola) sin comillas, Lua creerá que 'Hola' es una variable o una orden de su sistema. Paso 2: Al no encontrar ninguna orden llamada 'Hola', se confundirá y marcará nil o error. Paso 3: Las comillas le avisan: 'Tranquilo Lua, esto es solo texto para leer, no intentes ejecutarlo'.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Con comillas vs sin comillas","code":"print(\"Hola\") -- Correcto: texto seguro\n-- print(Hola)  => Error o nil","language":"lua","output":"Hola","explanation":"Las comillas protegen al texto para que no se confunda con código.","position":1}],"exercises":[{"id":"993be3d6-c355-4d09-84b0-40380720ac31","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Por qué es obligatorio encerrar las palabras entre comillas dentro de un print al mostrar texto?","prompt_code":null,"score":10,"concept_ids":["lua-fund-print-comillas"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"19160894-1f95-4a5c-b847-7bc98f2641a1","label":"A","body":"Porque la computadora necesita saber que se trata de texto plano y no de órdenes de código","is_correct":true,"position":1},{"id":"9ec64256-d949-4a91-b273-cb8b38829607","label":"B","body":"Porque las comillas hacen que las letras se vean de color azul","is_correct":false,"position":2},{"id":"c65ea679-6f61-4daf-9ed5-cf6846296642","label":"C","body":"Porque si no hay comillas la computadora se reinicia","is_correct":false,"position":3},{"id":"ffbcdf16-2d38-486a-8570-cc3d98fdc93b","label":"D","body":"Es opcional, las comillas nunca hacen falta","is_correct":false,"position":4}],"correct_answer_ids":["19160894-1f95-4a5c-b847-7bc98f2641a1"],"explanation":"¡Exacto! Las comillas delimitan las cadenas de texto (strings) para que Lua no intente interpretarlas como nombres de variables.","hints":[],"section_id":"45fcbbf2-bbf7-453e-8f85-cc80041839a5","lesson_id":"30bdaf91-6a3d-4a81-a242-d298f3c4a08e"}]},{"id":"8aaf4a6e-b8fc-4a5d-818c-9d1a6ab5e0e4","title":"Comillas dobles \"\" vs comillas simples ''","slug":"comillas-dobles-vs-simples","position":5,"concept_id":"lua-fund-comillas-tipos","explanation":"En Lua tienes total libertad de elección con las comillas. Paso 1: Puedes usar comillas dobles: \"Hola\". Paso 2: O puedes usar comillas simples: 'Hola'. Paso 3: Ambas son 100% idénticas para Lua. Lo único importante es que si abres con doble, cierres con doble; y si abres con simple, cierres con simple.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Ambas son válidas","code":"print(\"Texto con dobles\")\nprint('Texto con simples')","language":"lua","output":"Texto con dobles\nTexto con simples","explanation":"Tanto las comillas dobles como las simples son válidas en Lua.","position":1}],"exercises":[{"id":"7ec22912-247b-4d99-b20b-6c5986c71a2f","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"En Lua, ¿puedes usar tanto comillas dobles `\"\"` como comillas simples `''` para envolver textos?","prompt_code":null,"score":10,"concept_ids":["lua-fund-comillas-tipos"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"88ec3731-d284-4c30-b385-3e3cd4e2ce16","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"57d62190-3ba8-4f93-86d6-d31ad4effb7e","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["57d62190-3ba8-4f93-86d6-d31ad4effb7e"],"explanation":"¡Verdadero! Lua acepta comillas simples y dobles por igual, facilitando anidar unas dentro de otras.","hints":[],"section_id":"45fcbbf2-bbf7-453e-8f85-cc80041839a5","lesson_id":"8aaf4a6e-b8fc-4a5d-818c-9d1a6ab5e0e4"}]},{"id":"57ad2bf0-821e-4aa7-9580-e44062a6cad5","title":"Mostrar números sin comillas: print(100)","slug":"mostrar-numeros-sin-comillas","position":6,"concept_id":"lua-fund-print-numeros","explanation":"A diferencia de las palabras, los números en Lua NO necesitan comillas. Paso 1: Si escribes print(100), Lua reconoce de inmediato que es una cifra matemática. Paso 2: No le pongas comillas a los números cuando vayas a hacer cuentas. Paso 3: Lua muestra los números tal como son de forma instantánea.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Números directos","code":"print(100)\nprint(3.14)","language":"lua","output":"100\n3.14","explanation":"Los números enteros y decimales se escriben directos sin comillas.","position":1}],"exercises":[{"id":"88ede313-3719-4c78-9d76-1639d2882809","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"predict_output","difficulty":"easy","category":"fundamentos","prompt":"¿Qué salida exacta producirá la siguiente instrucción en Lua?","prompt_code":"print(500)","score":10,"concept_ids":["lua-fund-print-numeros"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"43a5faa3-2105-4607-9b98-3158d92a30ba","label":"A","body":"\"500\" con comillas","is_correct":false,"position":1},{"id":"14c05089-bd62-4ed4-b44d-ee437fad705a","label":"B","body":"Error porque le faltan comillas","is_correct":false,"position":2},{"id":"ea6be073-ba50-4544-b861-b58a607bd493","label":"C","body":"500","is_correct":true,"position":3},{"id":"7c38cb96-6a15-4272-b905-db0099f7ab1b","label":"D","body":"0","is_correct":false,"position":4}],"correct_answer_ids":["ea6be073-ba50-4544-b861-b58a607bd493"],"explanation":"¡Correcto! Los números se imprimen directamente sin requerir comillas.","hints":[],"section_id":"45fcbbf2-bbf7-453e-8f85-cc80041839a5","lesson_id":"57ad2bf0-821e-4aa7-9580-e44062a6cad5"}]},{"id":"8338f4cc-df89-4411-99e1-77e35f1d0776","title":"La computadora calculadora: print(10 + 5)","slug":"la-computadora-calculadora","position":7,"concept_id":"lua-fund-print-calculo","explanation":"Lua puede hacer matemáticas por ti dentro del propio print. Paso 1: Si escribes print(10 + 5), Lua primero resuelve la suma interna. Paso 2: 10 más 5 son 15. Paso 3: Luego le entrega el resultado final a print para mostrarlo. ¡Tienes una calculadora súper potente en cada línea!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Cálculo directo","code":"print(10 + 5)\nprint(20 * 2)","language":"lua","output":"15\n40","explanation":"Lua resuelve la operación aritmética antes de mostrarla.","position":1}],"exercises":[{"id":"31ca18d4-6ce5-4a75-8b28-f4075fc41a55","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"predict_output","difficulty":"easy","category":"fundamentos","prompt":"Si ejecutas la instrucción `print(7 + 3)`, ¿qué número aparecerá en pantalla?","prompt_code":"print(7 + 3)","score":10,"concept_ids":["lua-fund-print-calculo"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"1987da5b-f936-4e8f-805c-7dff54802daf","label":"A","body":"7 + 3","is_correct":false,"position":1},{"id":"72c14e39-fe27-4cdf-b8e0-22cffb23c2e2","label":"B","body":"73","is_correct":false,"position":2},{"id":"4eb3a00c-b8f5-4956-9a56-5fad3d1ad4e3","label":"C","body":"10","is_correct":true,"position":3},{"id":"9b3949e5-1f92-4cad-8037-d4224badb4dc","label":"D","body":"Error","is_correct":false,"position":4}],"correct_answer_ids":["4eb3a00c-b8f5-4956-9a56-5fad3d1ad4e3"],"explanation":"¡Exacto! Al no haber comillas, Lua evalúa la suma matemática `7 + 3` y muestra el resultado `10`.","hints":[],"section_id":"45fcbbf2-bbf7-453e-8f85-cc80041839a5","lesson_id":"8338f4cc-df89-4411-99e1-77e35f1d0776"}]},{"id":"efd18fc5-e333-41b7-9fdf-28385a7d96fe","title":"Mostrar varios datos juntos usando comas","slug":"mostrar-varios-datos-con-comas","position":8,"concept_id":"lua-fund-print-multiples","explanation":"¿Y si quieres mostrar un texto y un número en el mismo renglón? ¡Usa comas! Paso 1: Escribe print(\"Puntos:\", 100). Paso 2: La coma actúa como un separador de datos. Paso 3: Puedes poner tantos datos como quieras: print(\"Jugador\", 1, \"Vidas:\", 3). Todo aparecerá en una sola línea.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Múltiples datos","code":"print(\"Vidas:\", 3)\nprint(\"Nivel:\", 1, \"Puntos:\", 50)","language":"lua","output":"Vidas:\t3\nNivel:\t1\tPuntos:\t50","explanation":"La coma permite enviar múltiples valores a la vez a print.","position":1}],"exercises":[{"id":"f2677c19-2bd0-4361-9db2-320dd28eb10d","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"predict_output","difficulty":"easy","category":"fundamentos","prompt":"Observa este código con dos datos separados por coma. ¿Cómo se mostrará en pantalla?","prompt_code":"print(\"Nivel:\", 5)","score":10,"concept_ids":["lua-fund-print-multiples"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"51f5dd78-e8a4-4d08-ac83-c7f76cad7a02","label":"A","body":"Nivel:5 (pegado sin espacio)","is_correct":false,"position":1},{"id":"5d4511e4-35db-406e-b687-5e2001e0a5b0","label":"B","body":"Nivel:, 5 (con la coma visible)","is_correct":false,"position":2},{"id":"2ff4a914-5278-4286-99ee-ae0d8cd819d6","label":"C","body":"Nivel: 5 (separado por un espacio)","is_correct":true,"position":3},{"id":"bd74cf94-34f8-43dd-896d-ad81a25ca88e","label":"D","body":"Error de sintaxis","is_correct":false,"position":4}],"correct_answer_ids":["2ff4a914-5278-4286-99ee-ae0d8cd819d6"],"explanation":"¡Correcto! En Lua, los datos separados por comas dentro de print se muestran en el mismo renglón con una separación automática.","hints":[],"section_id":"45fcbbf2-bbf7-453e-8f85-cc80041839a5","lesson_id":"efd18fc5-e333-41b7-9fdf-28385a7d96fe"}]},{"id":"92bd83cb-50d0-4186-b3f4-e7639ae6e4a2","title":"El espacio automático que crea la coma","slug":"el-espacio-automatico-de-la-coma","position":9,"concept_id":"lua-fund-print-espacios","explanation":"Una gran ventaja de la coma en print es que te ahorra trabajo. Paso 1: Lua coloca automáticamente un espacio de separación entre cada argumento. Paso 2: Así no tienes que preocuparte por añadir espacios manualmente al final de cada palabra. Paso 3: Tus mensajes quedan legibles y ordenados sin esfuerzo.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Separación automática","code":"print(\"A\", \"B\", \"C\")","language":"lua","output":"A\tB\tC","explanation":"Cada coma introduce una separación para que no se amontonen las palabras.","position":1}],"exercises":[{"id":"d446841f-1ee3-4eb6-b6b2-bc6e7f308d30","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"Al separar elementos con comas dentro de `print()`, ¿Lua coloca automáticamente un espacio de separación entre ellos al mostrarlos?","prompt_code":null,"score":10,"concept_ids":["lua-fund-print-espacios"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"8a76fd24-7c54-497c-8355-5a91795f72f2","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"3a8b3926-f18c-485e-8424-8b88502d8822","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["3a8b3926-f18c-485e-8424-8b88502d8822"],"explanation":"¡Verdadero! La función print de Lua formatea automáticamente los argumentos separándolos por un tabulador o espacio en pantalla.","hints":[],"section_id":"45fcbbf2-bbf7-453e-8f85-cc80041839a5","lesson_id":"92bd83cb-50d0-4186-b3f4-e7639ae6e4a2"}]},{"id":"27b8d46e-8403-4cb3-82f9-85f1012e024b","title":"Mini-repaso de la Sección 3","slug":"mini-repaso-seccion-tres","position":10,"concept_id":"lua-fund-s03-repaso","explanation":"¡Fantástico! Ya dominas la salida en pantalla con Lua. Paso 1: Sabes que print muestra información visible. Paso 2: Sabes que los textos van con comillas y los números sin comillas. Paso 3: Sabes que las comas unen varios datos con espacios en la misma línea. ¡Ahora aprenderás a dejar notas personales en tu código!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Resumen S03","code":"print(\"Sección\", 3, \"Superada\")","language":"lua","output":"Sección\t3\tSuperada","explanation":"Texto, números y comas dominados al 100%.","position":1}],"exercises":[{"id":"e9b57c23-a15e-456c-8bf3-81e69846757e","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"fill_blank","difficulty":"easy","category":"fundamentos","prompt":"Escribe la palabra clave de Lua para mostrar un mensaje en la pantalla:","prompt_code":"_____(\"Aprendiendo con éxito\")","score":10,"concept_ids":["lua-fund-s03-repaso"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"9d30a59f-b298-4eee-97b5-e3f9252f1fba","label":null,"body":"print","is_correct":true,"position":1}],"correct_answer_ids":["9d30a59f-b298-4eee-97b5-e3f9252f1fba"],"explanation":"¡Excelente! `print` es la instrucción elemental de salida en Lua.","hints":[],"section_id":"45fcbbf2-bbf7-453e-8f85-cc80041839a5","lesson_id":"27b8d46e-8403-4cb3-82f9-85f1012e024b"}]}]},{"id":"77f1181d-c778-4de5-aaf4-27492c974acd","title":"Comentarios","slug":"comentarios","position":4,"type":"exercise","status":"published","content_version":2,"estimated_minutes":15,"xp_on_complete":10,"lessons":[{"id":"cf354457-b591-4634-bc97-e666b073202c","title":"¿Qué es un comentario en programación?","slug":"que-es-un-comentario","position":1,"concept_id":"lua-fund-comentario-que-es","explanation":"Un comentario es una nota escrita en tu código exclusivamente para ojos humanos. Paso 1: La computadora es ciega a los comentarios; cuando ve uno, lo ignora completamente. Paso 2: No se ejecuta ni produce ningún resultado en pantalla. Paso 3: Es el bloc de notas secreto donde explicas cómo funciona tu programa.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Nota invisible","code":"-- Esto es un comentario para ti\nprint(\"Esto sí lo lee la máquina\")","language":"lua","output":"Esto sí lo lee la máquina","explanation":"La primera línea no produce salida; la segunda sí.","position":1}],"exercises":[{"id":"18591462-48b7-4f17-8713-44ef56acbfca","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Qué hace la computadora cuando encuentra un comentario en tu código de Lua?","prompt_code":null,"score":10,"concept_ids":["lua-fund-comentario-que-es"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"523cb39b-5c30-4bfa-8d52-23215efaff3c","label":"A","body":"Lo imprime en voz alta por los altavoces","is_correct":false,"position":1},{"id":"d5236e49-6849-4409-abd9-89fafcb9db84","label":"B","body":"Lo ignora por completo y pasa a la siguiente instrucción","is_correct":true,"position":2},{"id":"d298f549-aeb5-433d-a9b3-fff37363e273","label":"C","body":"Lo envía a internet automáticamente","is_correct":false,"position":3},{"id":"b5aeb0d0-5eb3-4e86-a186-11b4bc17fefd","label":"D","body":"Marca un error de sintaxis","is_correct":false,"position":4}],"correct_answer_ids":["d5236e49-6849-4409-abd9-89fafcb9db84"],"explanation":"¡Correcto! Los comentarios son completamente ignorados por el intérprete de Lua durante la ejecución.","hints":[],"section_id":"77f1181d-c778-4de5-aaf4-27492c974acd","lesson_id":"cf354457-b591-4634-bc97-e666b073202c"}]},{"id":"f1bd647a-0aa9-4d6a-a8da-dfc0aebb8bcd","title":"Escribir notas para tu 'yo del futuro'","slug":"escribir-para-tu-yo-del-futuro","position":2,"concept_id":"lua-fund-comentario-empatia","explanation":"Cuando escribes código hoy, todo parece obvio en tu cabeza. Pero cuando vuelvas a ver ese mismo archivo dentro de 3 meses, ¡no recordarás nada! Paso 1: Los comentarios son un acto de bondad hacia ti mismo en el futuro. Paso 2: Te ayudan a recordar por qué tomaste una decisión difícil. Paso 3: También ayudan a tus compañeros de equipo a entenderte.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Nota de recuerdo","code":"-- Este valor es 100 porque el jefe final da doble puntaje\nlocal bono = 100","language":"lua","output":"","explanation":"Explicar el motivo ayuda enormemente cuando retomes el proyecto más adelante.","position":1}],"exercises":[{"id":"33cb5b23-9686-4e80-b0e2-996972fd61b4","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"¿El propósito de los comentarios es ayudar a los programadores humanos a comprender el código y recordar por qué se tomaron ciertas decisiones?","prompt_code":null,"score":10,"concept_ids":["lua-fund-comentario-empatia"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"c1e107ca-638b-4b37-b8b1-7c53780fc4d1","label":"A","body":"Verdadero","is_correct":true,"position":1},{"id":"9f8a0c42-e24f-410b-a13d-e1ef8f48eca4","label":"B","body":"Falso","is_correct":false,"position":2}],"correct_answer_ids":["c1e107ca-638b-4b37-b8b1-7c53780fc4d1"],"explanation":"¡Verdadero! Los comentarios existen para comunicar intenciones entre humanos que leen el código.","hints":[],"section_id":"77f1181d-c778-4de5-aaf4-27492c974acd","lesson_id":"f1bd647a-0aa9-4d6a-a8da-dfc0aebb8bcd"}]},{"id":"a6eb4aa7-e1ff-4fe4-a023-273c658325c2","title":"Tu primer comentario de una línea con --","slug":"comentario-de-una-linea","position":3,"concept_id":"lua-fund-comentario-linea","explanation":"En Lua, para escribir un comentario de un solo renglón usamos dos guiones seguidos `--`. Paso 1: Escribes `--`. Paso 2: Todo lo que escribas a la derecha de esos dos guiones en ese mismo renglón se vuelve un comentario. Paso 3: No necesitas cerrarlo; al bajar al siguiente renglón, Lua vuelve a leer código normal.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Dos guiones","code":"-- Dos guiones apagan esta línea entera\nprint(\"Línea activa\")","language":"lua","output":"Línea activa","explanation":"Los dos guiones `--` desactivan únicamente el renglón donde se encuentran.","position":1}],"exercises":[{"id":"a9697917-818a-49b3-823c-f3caf98865f8","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Qué símbolos debes poner al inicio de un renglón en Lua para convertirlo en un comentario?","prompt_code":null,"score":10,"concept_ids":["lua-fund-comentario-linea"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"e98efdb7-4955-4256-8bec-c35c192889af","label":"A","body":"//","is_correct":false,"position":1},{"id":"964fc239-1cb2-49cc-95b0-847dac036c75","label":"B","body":"#","is_correct":false,"position":2},{"id":"18bc4d56-1ec2-4fef-b78b-b1c13d474026","label":"C","body":"/*","is_correct":false,"position":3},{"id":"1e361bd9-31a6-4378-bf0e-ea1c0109bf3f","label":"D","body":"--","is_correct":true,"position":4}],"correct_answer_ids":["1e361bd9-31a6-4378-bf0e-ea1c0109bf3f"],"explanation":"¡Exacto! Dos guiones seguidos `--` representan un comentario de una sola línea en Lua.","hints":[],"section_id":"77f1181d-c778-4de5-aaf4-27492c974acd","lesson_id":"a6eb4aa7-e1ff-4fe4-a023-273c658325c2"}]},{"id":"abee50ad-e201-4274-ae8f-6eddf6aca473","title":"Comentarios al final de una línea","slug":"comentarios-al-final-de-linea","position":4,"concept_id":"lua-fund-comentario-inline","explanation":"Puedes combinar código activo y notas en el mismo renglón. Paso 1: Escribes tu orden normal a la izquierda. Paso 2: Añades `--` a la derecha. Paso 3: Escribes tu nota al final. Lua ejecutará la orden de la izquierda e ignorará la nota de la derecha.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Comenta
