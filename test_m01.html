<style>

  @media (prefers-color-scheme: dark){
    :root{--bg:#0F172A;--text:#F8FAFC;--muted:#CBD5E1;--border:#334155}

  *{box-sizing:border-box} html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;line-height:1.5}

  .brand{font-weight:700;letter-spacing:.2px}

  .progress{height:6px;background:#EEF2FF;border-radius:999px;overflow:hidden;margin:0 16px 12px}

  .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}

  .grid{display:grid;grid-template-columns:1fr;gap:10px}
  .stepper{display:flex;flex-direction:column;gap:8px}
  .step{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:12px;background:#fff}
  .step.locked{opacity:.6}
  .num{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;background:#EEF2FF;color:#1D4ED8;font-weight:700;flex:none}

  .step.active{border-color:var(--primary);box-shadow:0 0 0 3px #DBEAFE}
  .meta{font-size:12px;color:var(--muted)}
  .btn{appearance:none;border:none;border-radius:12px;padding:14px 16px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}

  .feedback.no{background:#FEF2F2;border:1px solid #FECACA;color:#7F1D1D}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:999px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.2);display:none;z-index:30}

  .tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px}
  .tab{padding:8px 12px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:13px;white-space:nowrap}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .bottom{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:25}
  .nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;color:var(--muted);font-size:11px;border:none;background:transparent;min-width:44px}
  .nav.active{color:var(--primary);background:#EFF6FF}
  .nav span{font-size:18px;line-height:1}
  .badge{font-size:10px;background:var(--primary);color:#fff;padding:2px 6px;border-radius:999px}
  .tok-comment{color:#6A737D;font-style:italic}
.tok-string{color:#0A7D32}
.tok-keyword{color:#D73A49;font-weight:600}
.tok-func{color:#6F42C1;font-weight:600}
.tok-number{color:#005CC5}
.tok-op{color:#032F62}
html.dark .tok-comment{color:#8B949E}
html.dark .tok-string{color:#9ECBFF}
html.dark .tok-keyword{color:#FF7B72}
html.dark .tok-func{color:#D2A8FF}
html.dark .tok-number{color:#79C0FF}
html.dark .tok-op{color:#FFA657}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
  .skeleton{height:14px;background:#F3F4F6;border-radius:8px;animation:pulse 1.2s infinite}
  @keyframes pulse{0%{opacity:.6}50%{opacity:1}100%{opacity:.6}}
  @media(min-width:480px){.shell{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
</style>
</head>

es"], "status": "published", "content_version": 1, "is_diagnostic": false, "time_estimated_seconds": 30, "answers": [{"id": "570fd0ef-e780-4061-a1fd-86142506987b", "question_id": "0e2069ea-7181-4243-abae-c02b0a7981cf", "question_version": 1, "label": "A", "body": "Verdadero", "is_correct": false, "position": 1}, {"id": "4cd2ad6b-2af8-4461-97f6-69af25d22786", "question_id": "0e2069ea-7181-4243-abae-c02b0a7981cf", "question_version": 1, "label": "B", "body": "Falso", "is_correct": true, "position": 2}], "correct_answer_ids": ["4cd2ad6b-2af8-4461-97f6-69af25d22786"], "explanation": "Falso. Lua es ligero y embebido, pensado para incrustarse en juegos y servidores, no para sistemas operativos.", "hints": [], "section_id": "9ce3363b-9d43-4f42-8245-d69a4af22823", "lesson_id": "3075f007-d5e7-4b4a-a71a-550b7a635ec3"}]}, {"id": "85f7dc84-3464-406a-8099-6e316bf4738e", "title": "Lua vs otros lenguajes", "slug": "lua-vs-otros-lenguajes", "position": 2, "concept_id": "lua-fund-vs", "explanation": "Diferencia 1: Lua cuenta desde 1. t[1] es el primero. En Python es t[0]. Diferencia 2: Comentario es --, no #. Diferencia 3: Solo nil y false son falsos. En Lua, 0 y \"\" cuentan como verdaderos. Recuerda esto y no mezclarás reglas.", "is_required": true, "status": "published", "content_version": 1, "examples": [{"title": "Índices diferentes", "code": "local t = {\"a\", \"b\", \"c\"}\nprint(t[1]) -- Lua: a\n-- En Python sería t[0]", "language": "lua", "output": "a", "explanation": "Lua empieza en 1, no en 0.", "position": 1}], "exercises": [{"id": "848c6a7f-55b0-40f3-bd9f-d5baa4220f36", "version": 1, "language_id": "a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c", "module_id": "b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d", "type": "single_choice", "difficulty": "easy", "category": "fundamentos", "prompt": "¿Para qué fue diseñado principalmente Lua?", "prompt_code": null, "score": 10, "concept_ids": ["lua-fund-que-es"], "status": "published", "content_version": 1, "is_diagnostic": false, "time_estimated_ ished", "content_version": 1, "examples": [{"title": "Reservada", "code": "local = 5 -- Error: unexpected symbol near 'local'", "language": "lua", "output": "error", "explanation": "local es reservada, no puede ser variable.", "position": 1}], "exercises": [{"id": "afe8d297-3147-4064-8c1d-9f3cbcc9842d", "version": 1, "language_id": "a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c", "module_id": "b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d", "type": "single_choice", "difficulty": "medium", "category": "fundamentos", "prompt": "¿Cuál NO es palabra reservada de Lua?", "prompt_code": null, "score": 10, "concept_ids": ["lua-fund-reservadas"], "status": "published", "content_version": 1, "is_diagnostic": false, "time_estimated_seconds": 60, "answers": [{"id": "affa8d39-dfea-4a18-b6e7-7543a90b19c1", "question_id": "afe8d297-3147-4064-8c1d-9f3cbcc9842d", "question_version": 1, "label": "A", "body": "and", "is_correct": false, "position": 1}, {"id": "beb3c544-5c4f-48f5-a786-ff141d9e8ea2", "question_id": "afe8d297-3147-4064-8c1d-9f3cbcc9842d", "question_version": 1, "label": "B", "body": "local", "is_correct": false, "position": 2}, {"id": "2b129d54-34a8-4f57-9ed5-73888bfca5b2", "question_id": "afe8d297-3147-4064-8c1d-9f3cbcc9842d", "question_version": 1, "label": "C", "body": "print", "is_correct": true, "position": 3}, {"id": "b7267af8-9b05-4925-a647-0b09d348438e", "question_id": "afe8d297-3147-4064-8c1d-9f3cbcc9842d", "question_version": 1, "label": "D", "body": "while", "is_correct": false, "position": 4}], "correct_answer_ids": ["2b129d54-34a8-4f57-9ed5-73888bfca5b2"], "explanation": "print es una función de la librería, no una palabra reservada. Puedes redefinirla aunque no debes.", "hints": [], "section_id": "bb82c06d-c86c-4177-807f-fc07386dc5a2", "lesson_id": "22f3f3a4-e294-47a3-930f-e071c324dbef"}]}, {"id": "90e007b3-8ebb-4187-891a-9fce3df19b04", "title": "Estilo e indentación", "slug": "estilo-e-indentacion", "position": 2, "concept_id": "lua-fund-estilo", "explanation": "Estilo legi function calcLevel(xp){
  let n=1, acc=0; const base=100, factor=1.65, offset=20;
  while(true){
    const need=Math.floor(base*Math.pow(n, factor)+offset*n);
    if(xp < acc+need) break;
    acc+=need; n++;
  }
  return n;
}
function addXP(v, reason){
  state.xp += v;
  state.level = calcLevel(state.xp);
  toast(`+${v} XP · ${reason}`);
  save();
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.display='block';
  clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none', 1800);
}
const DARK_KEY='lua_m01_dark';
function applyDark(v){ document.documentElement.classList.toggle('dark', v); const b=document.getElementById('dark-toggle'); if(b) b.textContent=v?'☀️':'🌙'; localStorage.setItem(DARK_KEY, v?1:0); }
(function(){ const saved=localStorage.getItem(DARK_KEY); if(saved!==null) applyDark(saved==='1'); else applyDark(true); })();
document.addEventListener('click', e=>{ if(e.target && e.target.id==='dark-toggle') applyDark(!document.documentElement.classList.contains('dark')); });
function renderHeader(){
  document.getElementById('pill-xp').textContent = state.xp + ' XP';
  document.getElementById('pill-level').textContent = 'Nv ' + state.level;
  document.getElementById('pill-streak').textContent = (state.streak||0) + ' 🔥';
  const totalSec = MOD.sections.length;
  const done = Object.keys(state.secDone).length;
  const pct = Math.round(done/totalSec*100);
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('crumb').innerHTML = `Biblioteca › <b>Lua</b> › M01 Fundamentos · ${done}/${totalSec} · ${pct}%`;
}

let currentSecId = MOD.sections[0].id;
let currentLesIdx = 0;

function viewRuta(){
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active', b.dataset.nav==='ruta'));
  const totalSec = MOD.sections.length;
  let html = `<div class="card">
    <h2>M01 — ${MOD.title}</h2>
    <p>${MOD.objective}</p>
    <div class="meta" style="margin-top:8px">${totalSec} secciones · 18 lecciones · 20+60 banco · Quiz 70% · Examen 80%</div>
    <div class="row" style="margin-top:12px">
      <button class="btn btn-primary" onclick="openLessonBySec(currentSecId)">Continuar →</button>
      <button class="btn btn-ghost" onclick="resetProgress()">Reiniciar</button>
    </div>
  </div><div class="stepper">`;
  MOD.sections.forEach((s,i)=>{
    const done = !!state.secDone[s.id];
    const active = s.id===currentSecId;
    const lessons = s.lessons.length;
    const typeIcon = s.type==='theory'?'📘': s.type==='example'?'💡': s.type==='review'?'🔁':'✏️';
    html += `<div class="step ${done?'done':''} ${active?'active':''}" onclick="openLessonBySec('${s.id}')">
      <div class="num">${done?'✓': i+1}</div>
      <div style="flex:1">
        <div style="font-weight:600">${typeIcon} S${String(s.position).padStart(2,'0')} — ${s.title}</div>
        <div class="meta">${lessons} lecciones · ${s.estimated_minutes} min · ${s.xp_on_complete||10} XP · ${s.type}</div>
      </div>
      <div class="meta">${done?'✓':''}</div>
    </div>`;
  });
  html += `</div>
  <div class="card" style="margin-top:12px">
    <h2>Cómo probar en móvil</h2>
    <p>1) Toca una sección para abrir la primera lección.<br>2) Lee explicación → ejemplo → responde.<br>3) Al completar la sección ganas +10 XP y racha.<br>4) Quiz tras S05 y Examen al final (20 preguntas).</p>
    <div class="meta">Diseño 360px first, touch ≥44px, sin dependencias externas, todo en este archivo.</div>
  </div>`;
  document.getElementById('view').innerHTML = html;
}

function openLessonBySec(secId){
  currentSecId = secId;
  const sec = MOD.sections.find(s=>s.id===secId);
  currentLesIdx = 0;
  viewLeccion(sec, currentLesIdx);
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active', b.dataset.nav==='leccion'));
}

function viewLeccion(sec, lesIdx){
  if(!sec) sec = MOD.sections.find(s=>s.id===currentSecId) || MOD.sections[0];
  const lessons = sec.lessons;
  const les = lessons[lesIdx] || lessons[0];
  currentLesIdx = lesIdx;
  let html = `<div class="card">
    <div class="meta">M01 › S${String(sec.position).padStart(2,'0')} ${sec.title}</div>
    <h2>${les.title}</h2>
    <p style="white-space:pre-wrap">${les.explanation}</p>
  </div>`;
  // examples
  (les.examples||[]).forEach(ex=>{
    html += `<div class="card"><div class="meta" style="margin-bottom:6px">${ex.title||'Ejemplo'}</div>
      <div class="example">${highlightLua(ex.code)}<span class="out">\n# ${escapeHtml(ex.output||'')}</span></div>
      ${ex.explanation?`<p style="margin-top:8px;font-size:13px;color:#374151">${escapeHtml(ex.explanation)}</p>`:''}
    </div>`;
  });
  // exercises
  (les.exercises||[]).forEach((q,qi)=>{
    const key = les.id+'::'+q.id;
    const answered = state.ans[key];
    html += `<div class="q" id="q-${q.id}">
      <h3>${qi+1}. ${escapeHtml(q.prompt)}</h3>
      ${q.prompt_code?`<div class="code">${highlightLua(q.prompt_code)}</div>`:''}
      <div class="opts" role="group">`;
    if(q.type==='fill_blank'){
      const isDone = !!answered;
      html += `<div style="display:flex;gap:8px"><input id="in-${q.id}" placeholder="Escribe tu respuesta" style="flex:1;padding:12px;border:1px solid var(--border);border-radius:10px;min-height:44px" ${isDone?'disabled value="'+escapeHtml(answered.given||'')+'"':''}><button class="btn btn-primary" style="width:auto;padding:0 16px" ${isDone?'disabled':''} onclick="answerFill('${les.id}','${q.id}')">Enviar</button></div>`;
    } else {
      q.answers.forEach(a=>{
        const chosen = answered && answered.aid===a.id;
        const cls = answered ? (a.is_correct ? 'opt correct' : (chosen ? 'opt wrong' : 'opt')) : 'opt';
        html += `<button class="${cls}" ${answered?'disabled':''} onclick="answerChoice('${les.id}','${q.id}','${a.id}')">${a.label? `<b>${a.label}.</b> `:''}${escapeHtml(a.body)}</button>`;
      });
    }
    html += `</div>
      <div class="feedback ${answered ? (answered.correct?'ok':'no') : ''}" style="display:${answered?'block':'none'}">
        ${answered ? (answered.correct ? '✅ ' : '❌ ')+ escapeHtml(q.explanation) : ''}
        ${answered && !answered.correct ? `<div style="margin-top:6px"><b>Siguiente paso:</b> ${hintFor(q)}</div>`:''}
      </div>
    </div>`;
  });

  // nav leccion
  const isLastLes = lesIdx === lessons.length-1;
  const nextLes = isLastLes ? null : lessons[lesIdx+1];
  const isSecDone = lessons.every(l=> l.exercises.every(q=> !!state.ans[l.id+'::'+q.id]));
  html += `<div class="card">
    <div class="row">
      <button class="btn btn-ghost" onclick="prevLes()">← Anterior</button>
      <button class="btn ${isSecDone?'btn-success':'btn-primary'}" onclick="${isLastLes? `completeSection('${sec.id}')` : `nextLes()`}">
        ${isLastLes ? (isSecDone?'Completar sección +10 XP':'Responder todo para completar') : 'Siguiente →'}
      </button>
    </div>
    <div class="meta" style="margin-top:8px">Lección ${lesIdx+1}/${lessons.length} · ${sec.lessons.length} lecciones en esta sección · XP lección: +${les.exercises.length*5} aprox.</div>
    <div class="tabs" style="margin-top:10px">
      ${lessons.map((l,i)=>`<button class="tab ${i===lesIdx?'active':''}" onclick="viewLeccionByIdx(${i})">${i+1}. ${escapeHtml(l.title)}</button>`).join('')}
    </div>
  </div>`;
  document.getElementById('view').innerHTML = html;
  window.scrollTo({top:0, behavior:'smooth'});
}

function hintFor(q){
  if(q.concept_ids.includes('lua-fund-comentario-linea')) return 'Recuerda -- para una línea.';
  if(q.concept_ids.includes('lua-fund-error-end')) return 'Todo if/for/function necesita end.';
  return 'Revisa la explicación y el ejemplo de esta lección.';
}

function viewLeccionByIdx(i){ const sec = MOD.sections.find(s=>s.id===currentSecId); viewLeccion(sec,i); }
function prevLes(){ if(currentLesIdx>0) viewLeccionByIdx(currentLesIdx-1); else toast('Ya estás al inicio'); }
function nextLes(){ const sec = MOD.sections.find(s=>s.id===currentSecId); if(currentLesIdx < sec.lessons.length-1) viewLeccionByIdx(currentLesIdx+1); }

function answerChoice(lesId, qId, aid){
  const sec = MOD.sections.find(s=>s.lessons.some(l=>l.id===lesId));
  const les = sec.lessons.find(l=>l.id===lesId);
  const q = les.exercises.find(x=>x.id===qId);
  const ans = q.answers.find(a=>a.id===aid);
  const correct = ans.is_correct;
  const key = lesId+'::'+qId;
  if(state.ans[key]) return;
  state.ans[key] = {aid, correct, given: ans.body};
  if(correct){ addXP(5, 'ejercicio correcto'); } else { /* +0, pero mostrar recuperación posible */ }
  save();
  // re-render feedback quickly (<100ms)
  const el = document.getElementById('q-'+qId);
  if(el){
    el.querySelectorAll('.opt').forEach(b=>{
      const isCorrect = q.answers.find(a=>a.body===b.textContent.slice(2).trim())?.is_correct;
    });
  }
  // Re-render leccion to show feedback (simple)
  viewLeccion(sec, currentLesIdx);
}

function answerFill(lesId, qId){
  const sec = MOD.sections.find(s=>s.lessons.some(l=>l.id===lesId));
  const les = sec.lessons.find(l=>l.id===lesId);
  const q = les.exercises.find(x=>x.id===qId);
  const input = document.getElementById('in-'+qId);
  const val = (input.value||'').trim();
  if(!val) return toast('Escribe una respuesta');
  const correctBodies = q.answers.filter(a=>a.is_correct).map(a=>a.body.trim().toLowerCase());
  const isCorrect = correctBodies.includes(val.toLowerCase());
  const key = lesId+'::'+qId;
  if(state.ans[key]) return;
  state.ans[key] = {aid: null, correct:isCorrect, given: val};
  if(isCorrect) addXP(5, 'ejercicio correcto');
  save();
  viewLeccion(sec, currentLesIdx);
}

function completeSection(secId){
  const sec = MOD.sections.find(s=>s.id===secId);
  const allDone = sec.lessons.every(l=> l.exercises.every(q=> !!state.ans[l.id+'::'+q.id]));
  if(!allDone) return toast('Responde todos los ejercicios obligatorios');
  if(state.secDone[secId]) return toast('Sección ya completada');
  state.secDone[secId]=true;
  state.streak = (state.streak||0)+1; // +1 por sección como actividad válida
  addXP(sec.xp_on_complete||10, 'sección completada');
  save();
  // Intersticial simulado si gratuito (siempre gratuito en demo)
  const isPremium = false;
  if(!isPremium){
    showSheet(`<h2 style="margin:0 0 6px">¡Sección completada! +${sec.xp_on_complete||10} XP</h2>
      <p style="color:#374151">Recompensa desbloqueada. En plan gratuito aquí aparecería el intersticial <b>Recompensa → Publicidad → Siguiente</b> (nunca intra-ejercicio, <code>23</code> RF-ADS-002). En esta demo no bloquea.</p>
      <div class="example" style="background:#FFFBEB;color:#92400E;border:1px solid #FDE68A">Anuncio simulado (gratuito) — 5s — cerrable con X</div>
      <div class="row" style="margin-top:12px">
        <button class="btn btn-primary" onclick="closeSheet(); nextSection()">Siguiente sección →</button>
        <button class="btn btn-ghost" onclick="closeSheet()">Cerrar</button>
      </div>
      <div class="meta" style="margin-top:8px">Premium $1/mes elimina este paso (ver <code>18</code>).</div>`);
  } else {
    nextSection();
  }
  renderHeader();
}

function nextSection(){
  const idx = MOD.sections.findIndex(s=>s.id===currentSecId);
  if(idx < MOD.sections.length-1){
    openLessonBySec(MOD.sections[idx+1].id);
  } else {
    viewQuiz();
  }
}

function showSheet(html){
  const s=document.getElementById('sheet');
  document.getElementById('sheet-panel').innerHTML = html;
  s.style.display='grid';
  s.onclick = (e)=>{ if(e.target===s) closeSheet(); };
}
function closeSheet(){ document.getElementById('sheet').style.display='none'; }

function viewQuiz(){
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active', b.dataset.nav==='quiz'));
  // Build quiz: 10 random from BANK + lesson pool, stratified simple random for demo
  const pool = [...BANK];
  shuffle(pool);
  const quiz = pool.slice(0,10);
  let html = `<div class="card">
    <h2>Quiz — Fundamentos (10 preguntas, 70% para aprobar)</h2>
    <p>Generado con Fisher-Yates + semilla local. En prod el servidor califica en &lt;2s (<code>15</code> §6.2, <code>06</code> RNF-012).</p>
  </div>`;
  quiz.forEach((q,i)=>{
    html += `<div class="q" id="quiz-${q.id}">
      <h3>${i+1}. ${escapeHtml(q.prompt)} ${q.difficulty?`<span class="meta">[${q.difficulty}]</span>`:''}</h3>
      ${q.prompt_code?`<div class="code">${highlightLua(q.prompt_code)}</div>`:''}
      <div class="opts">` + q.answers.map(a=>`<button class="opt" onclick="answerQuiz('${q.id}','${a.id}')">${a.label?`<b>${a.label}.</b> `:''}${escapeHtml(a.body)}</button>`).join('') + `</div>
      <div class="feedback" id="fb-${q.id}"></div>
    </div>`;
  });
  html += `<div class="card"><div class="row"><button class="btn btn-primary" onclick="gradeQuiz()">Enviar quiz</button><button class="btn btn-ghost" onclick="viewRuta()">Volver a Ruta</button></div><div class="meta" id="quiz-result" style="margin-top:8px"></div></div>`;
  document.getElementById('view').innerHTML = html;
  window._quiz = quiz;
  window._quizAns = {};
}
function answerQuiz(qid, aid){
  window._quizAns[qid]=aid;
  // highlight selection
  const q = window._quiz.find(x=>x.id===qid);
  const card = document.getElementById('quiz-'+qid);
  if(!card) return;
  card.querySelectorAll('.opt').forEach(btn=>{
    btn.style.borderColor = 'var(--border)';
    btn.style.background = '#fff';
  });
  const btns = card.querySelectorAll('.opt');
  const idx = q.answers.findIndex(a=>a.id===aid);
  if(btns[idx]){ btns[idx].style.borderColor='#3B82F6'; btns[idx].style.background='#EFF6FF'; }
}
function gradeQuiz(){
  if(!window._quiz) return;
  let correct=0;
  window._quiz.forEach(q=>{
    const aid = window._quizAns[q.id];
    const ans = q.answers.find(a=>a.id===aid);
    const ok = !!(ans && ans.is_correct);
    if(ok) correct++;
    const fb = document.getElementById('fb-'+q.id);
    if(fb){
      fb.style.display='block';
      fb.className='feedback '+(ok?'ok':'no');
      fb.textContent = ok ? '✅ ' + q.explanation : '❌ ' + q.explanation;
    }
  });
  const pct = Math.round(correct/window._quiz.length*100);
  const passed = pct>=70;
  const resEl = document.getElementById('quiz-result');
  resEl.innerHTML = `<b>${correct}/${window._quiz.length} · ${pct}% · ${passed?'✅ Aprobado':'❌ Reprobado (≥70%)'}</b> · ${passed?'+25 XP (5+20 bono)':' +5 XP por intento'}`;
  if(passed) addXP(25, 'quiz aprobado'); else addXP(5, 'quiz intento');
  save();
  toast(passed?'Quiz aprobado':'Quiz reprobado — repasa y reintenta');
}

  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active', b.dataset.nav==='perfil'));
  const totalSec = MOD.sections.length;
  const done = Object.keys(state.secDone).length;
  const pct = Math.round(done/totalSec*100);
  const lessonsDone = Object.keys(state.ans).length;
  const secList = MOD.sections.map(s=>`${s.title}: ${state.secDone[s.id]?'✅':'◻️'}`).join('<br>');
  let html = `<div class="card">
    <h2>Perfil — Tú</h2>
    <p><b>Nivel ${state.level}</b> · <b>${state.xp} XP</b> · Racha ${state.streak||0} días 🔥</p>
    <div class="meta">M01 Fundamentos · ${pct}% · ${done}/${totalSec} secciones · ${lessonsDone} ejercicios respondidos</div>
    <div class="progress" style="margin:12px 0 0"><i style="width:${pct}%"></i></div>
  </div>
  <div class="card">
    <h2>Progreso por sección</h2>
    <p style="font-size:13px">${secList}</p>
  </div>
  <div class="card">
    <h2>Recompensas</h2>
    <p>XP: sección +10 · ejercicio +5 · quiz +25 · examen +100 · módulo +50 (<code>16</code> §5.2)</p>
    <div class="meta">Nivel con curva <code>100×N<sup>1.65</sup>+20×N</code> (<code>16</code> §6.1)</div>
  </div>
  <div class="card">
    <h2>Acciones</h2>
    <div class="row"><button class="btn btn-ghost" onclick="viewRuta()">Volver a Ruta</button><button class="btn btn-ghost" onclick="resetProgress()">Reiniciar progreso</button></div>
  </div>`;
  document.getElementById('view').innerHTML = html;
}

function resetProgress(){
  if(!confirm('¿Reiniciar progreso local de M01?')) return;
  localStorage.removeItem(KEY);
  location.reload();
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}
function highlightLua(code){
  let esc = String(code).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const placeholders=[];
  function ph(html){ const k="__PH"+placeholders.length+"__"; placeholders.push(html); return k; }
  esc = esc.replace(/--\[\[.*?\]\]/gs, m=>ph('<span class="tok-comment">'+m+'</span>'));
  esc = esc.replace(/--[^\n]*/g, m=>ph('<span class="tok-comment">'+m+'</span>'));
  esc = esc.replace(/&quot;.*?&quot;/g, m=>ph('<span class="tok-string">'+m+'</span>'));
  esc = esc.replace(/&#39;.*?&#39;/g, m=>ph('<span class="tok-string">'+m+'</span>'));
  esc = esc.replace(/\b(local|function|if|then|else|elseif|end|for|while|repeat|until|do|return|break|in|and|or|not|nil|true|false|goto)\b/g, m=>ph('<span class="tok-keyword">'+m+'</span>'));
  esc = esc.replace(/\b(print|type|require|pairs|ipairs|tostring|tonumber|setmetatable|getmetatable|pcall|xpcall|error|assert|coroutine|table|string|io|os|math)\b/g, m=>ph('<span class="tok-func">'+m.trim()+'</span>'));
  esc = esc.replace(/\b(\d+(\.\d+)?)\b/g, m=>ph('<span class="tok-number">'+m+'</span>'));
  placeholders.forEach((html,i)=>{ esc=esc.replace('__PH'+i+'__', html); });
  return esc;
}
function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Nav
document.querySelectorAll('.nav').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const nav=btn.dataset.nav;
    if(nav==='ruta') viewRuta();
    else if(nav==='leccion') openLessonBySec(currentSecId);
    else if(nav==='quiz') viewQuiz();
    else if(nav==='perfil') viewPerfil();
  });
});

// Init
renderHeader();
viewRuta();
