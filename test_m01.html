  const hasNext = sIdx < MOD.sections.length - 1;
  const nextSec = hasNext ? MOD.sections[sIdx + 1] : null;

  modal.innerHTML = `
    <div class="celebration-modal-card">
      <div style="font-size:44px;margin-bottom:4px;">🦊</div>
      <h3 style="font-size:22px;font-weight:800;color:var(--text);margin-bottom:4px;">¡Sección ${sec.position} Superada!</h3>
      <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">${escapeHtml(sec.title)}</p>
      
      <div class="modal-stars-row">
        ${starsHtml}
      </div>
      <div style="font-size:14px;font-weight:800;color:#F59E0B;margin-bottom:12px;">${starsEarned} de 3 Estrellas Obtenidas</div>
      
      <div class="modal-feedback-box">
        ${feedbackTxt}
      </div>

      <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 16px;text-align:left;margin-bottom:18px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:6px;">
          <span>Estrellas en ${escapeHtml(MOD.title)}:</span>
          <span style="color:${mStats.earned >= mStats.minReq ? 'var(--success)' : '#F59E0B'};">${mStats.earned} / ${mStats.max} ⭐ (Mín. ${mStats.minReq} ⭐)</span>
        </div>
        <div class="stars-bar-track">
          <div class="stars-bar-fill" style="width:${Math.min(100, Math.round((mStats.earned / mStats.max) * 100))}%;"></div>
        </div>
      </div>

      <div style="display:flex;gap:10px;justify-content:center;">
        <button class="btn-step" style="background:var(--bg-card-alt);border:1px solid var(--border);color:var(--text);" onclick="closeCelebrationModal(true)">Ver Ruta 🗺️</button>
        ${hasNext ? `<button class="btn-step" style="background:var(--primary);color:#fff;border:none;font-weight:800;" onclick="closeCelebrationModal(false, '${nextSec.id}')">Siguiente Sección 🚀</button>` : `<button class="btn-step" style="background:var(--success);color:#fff;border:none;font-weight:800;" onclick="closeCelebrationModal(true)">¡Módulo Finalizado! 🏆</button>`}
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

function closeCelebrationModal(goToRuta, nextSecId) {
  const modal = document.getElementById('celebration-modal');
  if(modal) modal.remove();
  if(goToRuta || !nextSecId) {
    viewRuta();
  } else {
    openLessonBySec(nextSecId);
  }
}

// =========================================================
// VISTA: RONDA DE REPASO CON OPCIONES BARAJADAS
// =========================================================
let currentReviewSecId = null;
let currentReviewIdx = 0;
let currentShuffledAnswers = null;
let currentReviewAns = null;

function startSectionReview(secId) {
  currentReviewSecId = secId;
  currentReviewIdx = 0;
  currentShuffledAnswers = null;
  currentReviewAns = null;
  renderReviewScreen();
}

function renderReviewScreen() {
  const sec = MOD.sections.find(s => s.id === currentReviewSecId);
  if(!sec) return viewRuta();

  const modPending = (state.pendingReviews && state.pendingReviews[currentModKey]) || {};
  const queue = modPending[sec.id] || [];

  if(queue.length === 0) {
    completeSection(sec.id);
    return;
  }

  const item = queue[currentReviewIdx % queue.length];
  const les = sec.lessons.find(l => l.id === item.lesId);
  const q = les?.exercises.find(x => x.id === item.qId);

  if(!q) {
    queue.splice(currentReviewIdx, 1);
    renderReviewScreen();
    return;
  }

  if(!currentShuffledAnswers) {
    currentShuffledAnswers = shuffleArray(q.answers);
  }

  document.getElementById('crumb').innerHTML = `Biblioteca › ${escapeHtml(MOD.title)} › ${escapeHtml(sec.title)} › <b>Ronda de Repaso Final</b>`;

  let html = `
  <div style="max-width:800px;margin:0 auto;">
    <div style="background:linear-gradient(135deg,rgba(217,119,6,0.15),rgba(245,158,11,0.05));border:1.5px solid #D97706;border-radius:var(--radius-lg);padding:20px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;">
      <div>
        <span class="badge-tag" style="background:#D97706;color:#fff;">🔁 Ronda de Repaso Activa</span>
        <h3 style="font-size:16px;margin:4px 0;">Pregunta ${(currentReviewIdx % queue.length) + 1} de ${queue.length} por dominar</h3>
        <p style="font-size:13px;color:var(--muted);margin:0;">Opciones barajadas. Al acertar recuperarás +2 XP de recuperación.</p>
      </div>
      <button class="btn-step" onclick="openLessonBySec('${sec.id}')">Volver a la Sección</button>
    </div>

    <div class="card-box practice-card">
      <div>
        <span class="badge-tag" style="background:#3B82F6;color:#fff;">Concepto: ${escapeHtml(les.title)}</span>
        <h4 class="question-title">${escapeHtml(q.prompt)}</h4>
        ${q.prompt_code ? `<pre class="question-snippet"><code>${escapeHtml(q.prompt_code)}</code></pre>` : ''}

        <div class="options-stack">
  `;

  currentShuffledAnswers.forEach((a, aIdx) => {
    let cls = 'opt-btn';
    const chosen = currentReviewAns && currentReviewAns.aid === a.id;
    if(currentReviewAns) {
      if(currentReviewAns.correct && a.is_correct) cls = 'opt-btn correct';
      else if(!currentReviewAns.correct && chosen) cls = 'opt-btn wrong';
    }
    const keyLetter = String.fromCharCode(65 + aIdx);

    html += `
      <button class="${cls}" ${currentReviewAns ? 'disabled' : ''} onclick="answerReviewChoice('${a.id}')">
        <span class="opt-letter">${keyLetter}</span>
        <span>${escapeHtml(a.body)}</span>
      </button>
    `;
  });

  html += `
        </div>

        <div class="feedback-box ${currentReviewAns ? (currentReviewAns.correct ? 'ok' : 'no') : ''}" style="display:${currentReviewAns ? 'block' : 'none'}">
          ${currentReviewAns ? (currentReviewAns.correct ? '🎉 ¡Magnífica deducción! Error dominado (+2 XP).' : '❌ Sigue intentando sin rendirte.') : ''}
          ${currentReviewAns && !currentReviewAns.correct ? `<div class="feedback-hint">${hintFor(q)}</div>` : ''}
        </div>
      </div>

      <div class="action-footer">
        ${currentReviewAns ? `
          <button class="btn-primary-action btn-action-success" onclick="advanceReviewQueue()">
            ${queue.length === 1 && currentReviewAns.correct ? '¡Ronda Completada! Terminar Sección 🏆' : 'Siguiente Pregunta →'}
          </button>
        ` : ''}
      </div>
    </div>
  </div>
  `;

  document.getElementById('view').innerHTML = html;
}

function answerReviewChoice(aId) {
  const sec = MOD.sections.find(s => s.id === currentReviewSecId);
  const modPending = (state.pendingReviews && state.pendingReviews[currentModKey]) || {};
  const queue = modPending[sec.id] || [];
  const item = queue[currentReviewIdx % queue.length];
  const les = sec.lessons.find(l => l.id === item.lesId);
  const q = les.exercises.find(x => x.id === item.qId);

  const a = q.answers.find(x => x.id === aId);
  const isOk = !!(a && a.is_correct);

  currentReviewAns = { aid: aId, correct: isOk };

  if(isOk) {
    addXP(2);
    triggerMascotReaction('correct');
    if(state.mistakes && state.mistakes[q.id]) {
      state.mistakes[q.id].resolved = true;
    }
    queue.splice(currentReviewIdx % queue.length, 1);
    saveState();
  } else {
    triggerMascotReaction('wrong');
  }

  renderReviewScreen();
}

function advanceReviewQueue() {
  currentShuffledAnswers = null;
  currentReviewAns = null;
  renderReviewScreen();
}

// =========================================================
// VISTA: CUADERNO DE REPASO GLOBAL
// =========================================================
function viewCuadernoRepaso() {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.nav === 'notebook'));
  document.getElementById('crumb').innerHTML = `Biblioteca › <b>Cuaderno de Repaso y Errores</b>`;

  const allMistakes = Object.values(state.mistakes || {});
  const pending = allMistakes.filter(m => !m.resolved);

  let html = `
  <div class="ruta-hero" style="background:linear-gradient(135deg,#7F1D1D,#1E293B);">
    <div>
      <span class="badge-tag" style="background:#EF4444;color:#fff;">Cuaderno Inteligente</span>
      <h2 style="font-size:24px;font-weight:800;margin:6px 0;">📓 Cuaderno de Repaso de Errores</h2>
      <p style="font-size:14px;color:#FCA5A5;max-width:600px;">Repasa todos tus fallos acumulados en cualquier momento y gana +2 XP al corregirlos.</p>
    </div>
    <div style="text-align:right;">
      <div style="font-size:28px;font-weight:800;color:#FCA5A5;">${pending.length}</div>
      <div style="font-size:12px;color:#FEE2E2;">Por repasar</div>
    </div>
  </div>
  `;

  if(pending.length === 0) {
    html += `
      <div class="card-box" style="text-align:center;padding:60px 20px;">
        <div style="font-size:48px;margin-bottom:12px;">🌟</div>
        <h3 style="font-size:18px;font-weight:800;margin-bottom:8px;">¡Tu cuaderno de errores está al día!</h3>
        <p style="color:var(--muted);margin-bottom:20px;">Has dominado todas tus preguntas y no tienes fallos pendientes.</p>
        <button class="btn-step" style="background:var(--primary);color:#fff;border:none;padding:10px 24px;font-weight:700;" onclick="viewRuta()">Volver a la Ruta</button>
      </div>
    `;
  } else {
    html += `<div class="sections-grid-3col">`;
    pending.forEach(m => {
      const modObj = ALL_MODULES[m.modKey] || MOD;
      const sec = modObj.sections.find(s => s.id === m.secId);
      const les = sec?.lessons.find(l => l.id === m.lesId);

      html += `
        <div class="sec-card-box" style="cursor:default;">
          <div>
            <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:6px;">
              <span>${escapeHtml(modObj.title)}</span>
              <span>${sec ? 'Sec ' + sec.position : ''}</span>
            </div>
            <h4 style="font-size:15px;font-weight:700;margin-bottom:6px;">${escapeHtml(les ? les.title : 'Concepto')}</h4>
            <p style="font-size:13px;color:var(--muted);line-height:1.5;">${escapeHtml(m.prompt)}</p>
          </div>
          <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:12px;color:var(--success);font-weight:700;">+2 XP al corregir</span>
            <button class="btn-step" style="background:var(--primary);color:#fff;border:none;font-weight:700;padding:6px 14px;" onclick="startSingleMistakePractice('${m.modKey}', '${m.secId}', '${m.lesId}', '${m.qId}')">Repasar ⚡</button>
          </div>
        </div>
      `;
    });
    html += `</div>`;
  }

  document.getElementById('view').innerHTML = html;
}

function startSingleMistakePractice(modKey, secId, lesId, qId) {
  switchModule(modKey);
  currentReviewSecId = secId;
  const modPending = (state.pendingReviews && state.pendingReviews[modKey]) || {};
  modPending[secId] = modPending[secId] || [];
  if(!modPending[secId].some(item => item.qId === qId)) {
    modPending[secId].push({ lesId, qId });
  }
  startSectionReview(secId);
}

// =========================================================
// VISTA 3: BANCO DE QUIZ
// =========================================================
let currentQuizIdx = 0;
function viewQuiz() {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.nav === 'quiz'));
  document.getElementById('crumb').innerHTML = `Biblioteca › ${escapeHtml(MOD.title)} › <b>Banco de Quiz</b> › Pregunta ${currentQuizIdx+1} de ${BANK.length}`;

  const q = BANK[currentQuizIdx] || BANK[0];
  const answered = state.ans['quiz::' + q.id];

  let html = `
  <div style="max-width:800px;margin:0 auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <span class="badge-tag">Examen de Certificación</span>
      <span style="font-size:13px;color:var(--muted);font-weight:700;">Pregunta ${currentQuizIdx+1} de ${BANK.length}</span>
    </div>

    <div class="card-box practice-card">
      <div>
        <h4 class="question-title">${escapeHtml(q.prompt)}</h4>
        ${q.prompt_code ? `<pre class="question-snippet"><code>${escapeHtml(q.prompt_code)}</code></pre>` : ''}

        <div class="options-stack">
  `;

  q.answers.forEach((a, aIdx) => {
    const chosen = answered && answered.aid === a.id;
    let cls = 'opt-btn';
    if(answered) {
      if(answered.correct && a.is_correct) cls = 'opt-btn correct';
      else if(!answered.correct && chosen) cls = 'opt-btn wrong';
    }
    const keyLetter = String.fromCharCode(65 + aIdx);

    html += `
      <button class="${cls}" ${answered ? 'disabled' : ''} onclick="answerQuizChoice('${q.id}', '${a.id}')">
        <span class="opt-letter">${keyLetter}</span>
        <span>${escapeHtml(a.body)}</span>
      </button>
    `;
  });

  html += `
        </div>

        <div class="feedback-box ${answered ? (answered.correct ? 'ok' : 'no') : ''}" style="display:${answered ? 'block' : 'none'}">
          ${answered ? (answered.correct ? '🎉 ¡Correcto! ' : '❌ No exactamente. ') + escapeHtml(q.explanation) : ''}
        </div>
      </div>

      <div class="action-footer">
        <button class="btn-step" onclick="prevQuiz()" ${currentQuizIdx === 0 ? 'disabled' : ''}>← Anterior</button>
        <button class="btn-primary-action" onclick="nextQuiz()" ${currentQuizIdx === BANK.length - 1 ? 'disabled' : ''}>Siguiente Pregunta →</button>
      </div>
    </div>
  </div>
  `;

  document.getElementById('view').innerHTML = html;
}

function answerQuizChoice(qId, aId) {
  const q = BANK.find(x => x.id === qId);
  if(!q) return;
  const key = 'quiz::' + qId;
  if(state.ans[key]) return;

  const a = q.answers.find(x => x.id === aId);
  const isOk = !!(a && a.is_correct);

  state.ans[key] = { aid: aId, correct: isOk, time: Date.now() };
  if(isOk) {
    addXP(10);
    triggerMascotReaction('correct');
  } else {
    triggerMascotReaction('wrong');
    saveState();
  }

  viewQuiz();
}

function prevQuiz() {
  if(currentQuizIdx > 0) { currentQuizIdx--; viewQuiz(); }
}
function nextQuiz() {
  if(currentQuizIdx < BANK.length - 1) { currentQuizIdx++; viewQuiz(); }
}

        <span style="font-size:12px;color:var(--muted);font-weight:700;">Experiencia Total</span>

        <span style="font-size:12px;color:var(--muted);font-weight:700;">Lecciones Globales</span>

    </div>

    <div class="card-box" style="margin-top:24px;text-align:center;">
      <h4 style="margin-bottom:6px;">Reiniciar Progreso de Aprendizaje</h4>
      <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">Borra todos tus puntos de experiencia, respuestas y progreso para comenzar desde cero.</p>
      <button class="btn-step" style="color:#EF4444;border-color:#EF4444;" onclick="resetAllProgress()">Reiniciar Progreso</button>
    </div>
  </div>
  `;

  document.getElementById('view').innerHTML = html;
}

function resetAllProgress() {
  if(confirm('¿Seguro que deseas reiniciar todo tu progreso de estudio?')) {
    localStorage.removeItem(STORAGE_KEY);
    state = { xp: 0, streak: 0, ans: {}, secDone: {}, pendingReviews: {}, mistakes: {} };
    saveState();
    showToast('Progreso reiniciado con éxito.');
    viewRuta();
  }
}

// ATAJOS DE TECLADO
document.addEventListener('keydown', e => {
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  const k = e.key.toUpperCase();
  const options = document.querySelectorAll('.opt-btn:not([disabled])');

  if(k >= '1' && k <= '4') {
    const idx = parseInt(k) - 1;
    if(options[idx]) options[idx].click();
  } else if(k >= 'A' && k <= 'D') {
    const idx = k.charCodeAt(0) - 65;
    if(options[idx]) options[idx].click();
  } else if(e.key === 'ArrowRight') {
    nextLes();
  } else if(e.key === 'ArrowLeft') {
    prevLes();
  } else if(e.key === 'Enter') {
    const nextBtn = document.querySelector('.action-footer button.btn-primary-action:not([disabled])');
    if(nextBtn) nextBtn.click();
  }
});

// MODO OSCURO
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('codequest_theme', next);
}

window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('codequest_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);

  const sel = document.getElementById('module-select');
  if(sel) sel.value = currentModKey;

  initPixiMascot();

  updateMistakesBadge();

});
