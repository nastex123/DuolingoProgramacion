uage_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"¿Por qué los programadores profesionales usan siempre la palabra local al declarar variables?","prompt_code":null,"score":10,"concept_ids":["lua-var-intro-local"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"100adfb5-a97b-4feb-9abe-c14fad6920ae","label":"A","body":"Porque hace que el texto se pinte de azul","is_correct":false,"position":1},{"id":"86d3601a-82dc-4478-b2ee-30939bfdcb80","label":"B","body":"Para crear variables seguras, aisladas y de alto rendimiento que no interfieran con otros scripts","is_correct":true,"position":2},{"id":"07df7be4-1de7-41f9-995a-98ae336070fd","label":"C","body":"Porque es una contraseña de internet","is_correct":false,"position":3},{"id":"de01fdbc-4448-4525-b0b2-9755912c5e93","label":"D","body":"Es obligatorio por ley","is_correct":false,"position":4}],"correct_answer_ids":["86d3601a-82dc-4478-b2ee-30939bfdcb80"],"explanation":"¡Correcto! local aísla la variable a su ámbito y evita la contaminación de variables globales.","hints":[]}]},{"id":"42973819-f983-489c-8c5b-e0eda8cf412d","title":"Declarar local x sin valor inicial: ¡adentro hay nil!","slug":"local-sin-valor-inicial","position":3,"concept_id":"lua-nil-local-sin-valor","explanation":"Mira la conexión mágica entre local y nil. Paso 1: Si escribes local puntos sin poner el signo = ni ningún número. Paso 2: La computadora crea la cajita puntos en memoria, pero está vacía. Paso 3: Si imprimes print(puntos), ¿qué crees que sale? ¡Sale nil! Una variable local sin valor inicial siempre vale nil.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Caja vacía con nil","code":"local premio\nprint(premio) -- Muestra nil","language":"lua","output":"nil","explanation":"Declarar local sin asignar guarda nil por defecto.","position":1}],"exercises":[{"id":"5ec15ce9-d121-40ae-b2d4-9913b177be25","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"Si escribes local cofre sin asignarle nada, ¿qué mostrará print(cofre)?","prompt_code":"local cofre\nprint(cofre)","score":10,"concept_ids":["lua-nil-local-sin-valor"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"197bb3d2-1e03-4fee-9768-9f7f2382dd55","label":"A","body":"0","is_correct":false,"position":1},{"id":"5ef56f7c-6313-42d4-a903-64b8389b9141","label":"B","body":"cofre","is_correct":false,"position":2},{"id":"316a6a29-5e7b-4365-8305-602a026d4b63","label":"C","body":"nil","is_correct":true,"position":3},{"id":"da34ce30-b01e-4c57-ac9e-fe241905297b","label":"D","body":"Error","is_correct":false,"position":4}],"correct_answer_ids":["316a6a29-5e7b-4365-8305-602a026d4b63"],"explanation":"¡Exacto! Toda variable local declarada sin valor inicial contiene nil por defecto.","hints":[]}]},{"id":"953ecfdd-3b6c-4b3f-bbc6-d645c660bbd7","title":"type(nil) devuelve la palabra \"nil\"","slug":"type-inspeccionar-nil","position":4,"concept_id":"lua-nil-type-inspect","explanation":"nil es tan especial que tiene su propio tipo de dato en la inspectora. Paso 1: Si escribes type(nil), la computadora responde \"nil\". Paso 2: Es el único valor en todo Lua que pertenece a su propio tipo. Paso 3: ¡nil es su propio tipo!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Tipo nil","code":"print(type(nil))","language":"lua","output":"nil","explanation":"type(nil) devuelve la palabra 'nil'.","position":1}],"exercises":[{"id":"ae3c0adc-c456-4916-b8bd-85a598d2bef9","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué devolverá type(variable_no_creada)?","prompt_code":"print(type(variable_no_creada))","score":10,"concept_ids":["lua-nil-type-inspect"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"4df7adad-df24-4907-bc8f-aca0a0c81bfa","label":"A","body":"undefined","is_correct":false,"position":1},{"id":"ffb30b00-6e37-4c55-8438-ba0cc2e13f0b","label":"B","body":"none","is_correct":false,"position":2},{"id":"024215fe-9d8c-4497-8321-54666249cb06","label":"C","body":"0","is_correct":false,"position":3},{"id":"e4cec2bd-94f0-4492-9670-c799a56b92d2","label":"D","body":"nil","is_correct":true,"position":4}],"correct_answer_ids":["e4cec2bd-94f0-4492-9670-c799a56b92d2"],"explanation":"¡Excelente! Como la variable no existe, su valor es nil y su type es \"nil\".","hints":[]}]},{"id":"010b659b-efdd-4e78-9e83-30cba5cf0c44","title":"nil no es el número 0 ni el texto vacío \"\"","slug":"nil-vs-cero-y-vacio","position":5,"concept_id":"lua-nil-vs-cero-y-vacio","explanation":"No confundas tener cero con no tener nada. Paso 1: Si tu billetera tiene 0 monedas, tienes billetera y sabes que hay cero pesos. Paso 2: Si tu billetera es nil, ¡ni siquiera tienes billetera! Paso 3: El número 0 y el texto \"\" son cosas que existen; nil es la ausencia absoluta de existencia.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"La nada vs existir vacío","code":"saldo = 0\nnada = nil\nprint(saldo == nil) -- Da false, 0 NO es nil","language":"lua","output":"false","explanation":"0 y nil son cosas completamente distintas.","position":1}],"exercises":[{"id":"b33919de-2cf8-423d-a2bf-f4a573b388fb","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"true_false","difficulty":"easy","category":"variables","prompt":"¿En Lua el valor nil es idéntico al número 0?","prompt_code":null,"score":10,"concept_ids":["lua-nil-vs-cero-y-vacio"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"b7e0980a-4c5a-4c59-8d26-1d621625d7e2","label":"A","body":"Verdadero","is_correct":false,"position":1},{"id":"7b08f03f-6072-4bdc-9fd5-ca50e4a71b34","label":"B","body":"Falso","is_correct":true,"position":2}],"correct_answer_ids":["7b08f03f-6072-4bdc-9fd5-ca50e4a71b34"],"explanation":"¡Falso! nil representa ausencia de valor, mientras que 0 es un valor numérico real.","hints":[]}]},{"id":"5734ab5d-8172-477d-94ae-573cea2bb2e4","title":"Conexión con booleanos: false y nil como los únicos falsos","slug":"nil-falsy-conexion","position":6,"concept_id":"lua-nil-falsy-conexion","explanation":"Ahora entiendes la regla que aprendimos en la Sección 6. Paso 1: En las condiciones de Lua, solo hay dos cosas que apagan la luz: false y nil. Paso 2: Si una variable contiene nil, la computadora la tratará como 'no existe / falso'. Paso 3: Es por esto que los programadores usan nil para indicar que algo está apagado o ausente.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Unidos en falsy","code":"print(not nil)   -- nil se invierte a true\nprint(not false) -- false se invierte a true","language":"lua","output":"true\ntrue","explanation":"Ambos son los únicos dos valores considerados falsos en Lua.","position":1}],"exercises":[{"id":"c2d6ba5e-b051-4090-abc0-eb907b27c0cb","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué mostrará la instrucción print(not nil)?","prompt_code":"print(not nil)","score":10,"concept_ids":["lua-nil-falsy-conexion"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"9e5cd5b2-ace2-40f0-8a2b-930410f86785","label":"A","body":"true","is_correct":true,"position":1},{"id":"d046a7cd-125d-42d2-8353-2de9149dec07","label":"B","body":"false","is_correct":false,"position":2},{"id":"870bc658-a163-49ba-9e6d-0009ff980e5e","label":"C","body":"nil","is_correct":false,"position":3},{"id":"7e06f654-c0d4-430e-8458-bc92be718a42","label":"D","body":"0","is_correct":false,"position":4}],"correct_answer_ids":["9e5cd5b2-ace2-40f0-8a2b-930410f86785"],"explanation":"¡Correcto! Como nil cuenta como falso, invertirlo con not produce true.","hints":[]}]},{"id":"1e594642-056c-48db-b143-3424b99de123","title":"Borrar una variable asignándole nil","slug":"borrar-variable-con-nil","position":7,"concept_id":"lua-nil-borrar-variable","explanation":"¿Cómo se borra una variable en Lua? ¡Metiéndole nil adentro! Paso 1: Tienes local tesoro = 1000. Paso 2: Cuando el cofre se vacía, escribes tesoro = nil. Paso 3: Al ponerle nil, Lua libera la memoria y la variable queda como si nunca hubiera existido. ¡Es el borrador oficial de Lua!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Borrador mágico","code":"local objeto = \"Espada\"\nobjeto = nil -- Borrado\nprint(objeto)","language":"lua","output":"nil","explanation":"Asignar nil borra el contenido de la variable.","position":1}],"exercises":[{"id":"613b6610-9ca6-4dc6-b692-5275631e36ed","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"Si tienes una variable llamada dato y quieres eliminar su contenido por completo en Lua, ¿qué debes hacer?","prompt_code":null,"score":10,"concept_ids":["lua-nil-borrar-variable"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"3d650fd5-7cf2-45ba-9752-dcf2c961fc48","label":"A","body":"Escribir dato = 0","is_correct":false,"position":1},{"id":"8003a70e-a604-4c15-93f1-a07a8dab2388","label":"B","body":"Escribir dato = nil","is_correct":true,"position":2},{"id":"5500d90d-3d4e-4dab-a4eb-374b81aaea3a","label":"C","body":"Escribir dato = \"borrar\"","is_correct":false,"position":3},{"id":"f2990442-e6b7-42d3-801d-484e81eaffcd","label":"D","body":"Apagar el teclado","is_correct":false,"position":4}],"correct_answer_ids":["8003a70e-a604-4c15-93f1-a07a8dab2388"],"explanation":"¡Muy bien! Asignar nil elimina el valor almacenado en la variable.","hints":[]}]},{"id":"a3f91029-821d-4f8d-b484-318b4a882250","title":"Por qué a partir de ahora siempre usaremos local","slug":"por-que-local-siempre","position":8,"concept_id":"lua-var-por-que-local-siempre","explanation":"En Lua, si no pones local, la variable se vuelve 'global'. Paso 1: Una variable global es visible por cualquier parte del juego entero. Paso 2: Si otro programador crea una variable con el mismo nombre, ¡sobrescribirá la tuya sin que te des cuenta! Paso 3: Con local, tu cajita tiene candado y solo tú puedes usarla. Es la regla #1 de la industria.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Seguridad con local","code":"local salud = 100 -- Segura y aislada\n-- salud = 100    => Peligrosa: global desprotegida","language":"lua","output":"","explanation":"local es el estándar profesional indispensable.","position":1}],"exercises":[{"id":"6b3e1a67-d210-4f49-8b5e-639739c8fefd","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"true_false","difficulty":"easy","category":"variables","prompt":"En proyectos reales de Lua, ¿se recomienda declarar siempre las variables con la palabra clave local para protegerlas de modificaciones accidentales?","prompt_code":null,"score":10,"concept_ids":["lua-var-por-que-local-siempre"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"29848387-4fad-4616-8ca3-302459092afd","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"80cd26ec-d524-4f96-a15c-02614b490c46","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["80cd26ec-d524-4f96-a15c-02614b490c46"],"explanation":"¡Verdadero! El uso de local por defecto es la mejor práctica universal en Lua.","hints":[]}]},{"id":"ac67f710-3823-4f4c-afb9-7bfad76334d5","title":"El peligro de olvidar local (fugas en _G)","slug":"peligro-globales-tabla-g","position":9,"concept_id":"lua-var-peligro-global-intro","explanation":"Lua guarda todas las variables sin local en una tabla gigante del sistema llamada _G (Entorno Global). Paso 1: Si olvidas local en 50 variables, atascas esa tabla global. Paso 2: Tu juego se vuelve lento y los errores son casi imposibles de rastrear. Paso 3: Acostumbra tus dedos a escribir local automáticamente.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Tabla global","code":"local segura = 10 -- Vive protegida\n-- global_suelta = 10 => Se va a _G y contamina el juego","language":"lua","output":"","explanation":"Evitar ensuciar _G mantiene tu código rápido y limpio.","position":1}],"exercises":[{"id":"4b42e416-e91b-41c3-ad74-e3dac3876a26","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"Si omites la palabra local al declarar una variable en Lua, ¿qué ocurre?","prompt_code":null,"score":10,"concept_ids":["lua-var-peligro-global-intro"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"35fb225d-c91d-44a3-8ee5-da4c99276877","label":"A","body":"La variable se borra al instante","is_correct":false,"position":1},{"id":"f91a33c6-5dbc-4240-adfc-0c86bdce7113","label":"B","body":"El texto se pinta de color rojo","is_correct":false,"position":2},{"id":"2faf9f14-3706-41c1-9f82-60b127c07527","label":"C","body":"Se crea como variable global desprotegida que puede interferir con otros scripts","is_correct":true,"position":3},{"id":"19a630d3-36b5-4979-b3dc-b9d53f3a06a0","label":"D","body":"La computadora se reinicia","is_correct":false,"position":4}],"correct_answer_ids":["2faf9f14-3706-41c1-9f82-60b127c07527"],"explanation":"¡Exacto! Sin local, la variable queda expuesta en el entorno global como un anti-patrón peligroso.","hints":[]}]},{"id":"aa08e4c4-f9bc-4cbd-bd9f-e89f2346da2f","title":"Mini-repaso de la Sección 7","slug":"mini-repaso-seccion-siete-m02","position":10,"concept_id":"lua-nil-s07-repaso","explanation":"¡Has descubierto los dos secretos mayores de Lua! Paso 1: nil significa la nada ytype(nil) es \"nil\". Paso 2: Declarar local x sin valor contiene nil. Paso 3: A partir de hoy, todas nuestras variables se declaran con local para máxima seguridad. ¡Ahora aprenderemos a convertir datos de un tipo a otro!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Resumen S07","code":"local heroe = \"Aria\"\nlocal clan -- Vale nil\nprint(heroe, clan)","language":"lua","output":"Aria\tnil","explanation":"local y nil dominados al 100%.","position":1}],"exercises":[{"id":"8ebba25e-7aa6-4f90-b3b5-1b53646cb9ad","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué dos palabras imprimirá este código?","prompt_code":"local x\nprint(type(x))","score":10,"concept_ids":["lua-nil-s07-repaso"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"9571cf41-51fa-4e15-9f51-551f1e59481b","label":"A","body":"0","is_correct":false,"position":1},{"id":"3152fbd0-a7f7-4089-b91b-26ad7203b9c2","label":"B","body":"variable","is_correct":false,"position":2},{"id":"3191e2c8-95c2-4eab-a147-8f086aee8de4","label":"C","body":"Error","is_correct":false,"position":3},{"id":"3515b77c-c51c-41ef-bcad-8f4f71e3a206","label":"D","body":"nil","is_correct":true,"position":4}],"correct_answer_ids":["3515b77c-c51c-41ef-bcad-8f4f71e3a206"],"explanation":"¡Excelente! Como x no tiene valor, contiene nil, y type(nil) devuelve la palabra 'nil'.","hints":[]}]}]},{"id":"374208e0-914c-4964-b66c-d3965371f587","title":"Conversión de tipos y Coerción","slug":"conversion-de-tipos","position":8,"type":"exercise","status":"published","content_version":1,"estimated_minutes":15,"xp_on_complete":10,"lessons":[{"id":"f5231147-3b0b-4786-a0a2-87537287e4b6","title":"Por qué necesitamos convertir tipos","slug":"por-que-convertir-tipos","position":1,"concept_id":"lua-conv-por-que-convertir","explanation":"A veces un dato llega en un formato que no puedes operar directamente. Paso 1: Si el usuario escribe su edad en el teclado, la computadora la recibe como texto: \"25\". Paso 2: No puedes calcular \"25\" + 5 directamente sin antes transformarlo a número. Paso 3: Convertir tipos es traducir datos para poder usarlos con seguridad.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Texto a número","code":"-- \"25\" es texto\n-- 25 es número\n-- Necesitamos pasar de uno a otro","language":"lua","output":"","explanation":"La conversión asegura que los datos sean compatibles.","position":1}],"exercises":[{"id":"1eaef12b-f03c-4146-ade7-f3fde40faec9","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"¿Por qué es necesario convertir tipos de datos en un programa?","prompt_code":null,"score":10,"concept_ids":["lua-conv-por-que-convertir"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"6441c3d4-9244-4e67-8ebe-7bb13093cae5","label":"A","body":"Para transformar datos (como un texto \"50\" en un número 50) y poder operar con ellos","is_correct":true,"position":1},{"id":"322560a4-3ed8-4023-8e3d-b95b5c8488ba","label":"B","body":"No es necesario, todos los tipos son idénticos","is_correct":false,"position":2},{"id":"57b3741c-984c-4e7c-a574-3e68ce9aa478","label":"C","body":"Para que la pantalla no se apague","is_correct":false,"position":3},{"id":"a2e716f5-89a2-46db-b05c-300ebefc748d","label":"D","body":"Para cambiarle el idioma a Windows","is_correct":false,"position":4}],"correct_answer_ids":["6441c3d4-9244-4e67-8ebe-7bb13093cae5"],"explanation":"¡Correcto! Convertir tipos permite compatibilizar datos recibidos con las operaciones necesarias.","hints":[]}]},{"id":"579cc4e1-9c09-4b81-9e22-3ed88e16285a","title":"De número a texto con tostring()","slug":"de-numero-a-texto-tostring","position":2,"concept_id":"lua-conv-tostring","explanation":"Para transformar cualquier número en texto usamos la función tostring(). Paso 1: Escribes tostring(). Paso 2: Le pasas el número adentro: tostring(100). Paso 3: Lua toma el 100 numérico y te devuelve el texto \"100\". ¡Listo para unir con otras palabras!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Uso de tostring","code":"local nivel = 5\nlocal texto_nivel = tostring(nivel)\nprint(type(texto_nivel))","language":"lua","output":"string","explanation":"tostring transforma cualquier valor en cadena de texto.","position":1}],"exercises":[{"id":"24cbcf45-dde2-49d5-a0e0-a7a5169a0bfe","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué tipo de dato devuelve la función tostring(42)?","prompt_code":"print(type(tostring(42)))","score":10,"concept_ids":["lua-conv-tostring"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"7b5c168d-9563-41c8-8a95-c70009f5ac4b","label":"A","body":"number","is_correct":false,"position":1},{"id":"90490e9e-37d6-4b1f-8218-0cf00bab6175","label":"B","body":"string","is_correct":true,"position":2},{"id":"0f1aad27-46b0-48b9-8e30-66a2e5d88967","label":"C","body":"cifra","is_correct":false,"position":3},{"id":"b286d108-b000-4581-8721-7f156b49ddd8","label":"D","body":"42","is_correct":false,"position":4}],"correct_answer_ids":["90490e9e-37d6-4b1f-8218-0cf00bab6175"],"explanation":"¡Exacto! tostring convierte el valor a una cadena de texto (string).","hints":[]}]},{"id":"5fe6e537-cb37-434f-81e8-3f5f49a11215","title":"De texto a número con tonumber()","slug":"de-texto-a-numero-tonumber","position":3,"concept_id":"lua-conv-tonumber","explanation":"Para el camino opuesto usamos tonumber(). Paso 1: Tienes un texto que lleva dígitos adentro: \"50\". Paso 2: Ejecutas tonumber(\"50\"). Paso 3: Lua lee los dígitos y te devuelve el número 50 real con el que puedes sumar, restar y multiplicar.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Uso de tonumber","code":"local entrada = \"50\"\nlocal numero = tonumber(entrada)\nprint(numero + 10)","language":"lua","output":"60","explanation":"tonumber extrae la cifra y permite hacer matemáticas.","position":1}],"exercises":[{"id":"1306c0c1-25b7-4de7-bea8-c55bdf282978","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué resultado dará print(tonumber(\"20\") + 5)?","prompt_code":"print(tonumber(\"20\") + 5)","score":10,"concept_ids":["lua-conv-tonumber"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"3bc191fd-e344-49f4-9c76-dc2d0c1cd0a9","label":"A","body":"205","is_correct":false,"position":1},{"id":"47d28255-62ab-42ff-99a6-8c981505e1ef","label":"B","body":"20","is_correct":false,"position":2},{"id":"a6f786de-1f17-4f35-b4b2-37f2d0b05ef2","label":"C","body":"25","is_correct":true,"position":3},{"id":"12e2ac01-2f74-4e40-bc8b-344f57fe499f","label":"D","body":"Error","is_correct":false,"position":4}],"correct_answer_ids":["a6f786de-1f17-4f35-b4b2-37f2d0b05ef2"],"explanation":"¡Muy bien! \"20\" se convierte en 20 y al sumarle 5 resulta 25.","hints":[]}]},{"id":"eadaf302-3b1f-4291-98ed-3fc1c9776f36","title":"Qué pasa si tonumber() no puede convertir","slug":"tonumber-falla-devuelve-nil","position":4,"concept_id":"lua-conv-tonumber-falla-nil","explanation":"¿Qué pasa si intentas convertir una palabra como \"hola\" a número? ¡La palabra \"hola\" no tiene ninguna cifra matemática adentro! Paso 1: Lua no entra en pánico ni rompe tu juego. Paso 2: Simplemente responde con nil. Paso 3: nil significa: 'lo intenté, pero ahí no había ningún número válido'.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Conversión fallida","code":"local intento = tonumber(\"manzana\")\nprint(intento)","language":"lua","output":"nil","explanation":"tonumber devuelve nil si el texto no contiene cifras válidas.","position":1}],"exercises":[{"id":"077b7fc8-5ba1-41a8-89b9-1e568468e2ee","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué valor devolverá la instrucción tonumber(\"dragón\")?","prompt_code":"print(tonumber(\"dragón\"))","score":10,"concept_ids":["lua-conv-tonumber-falla-nil"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"c72e69d1-8d99-48be-bcbd-687cb056669f","label":"A","body":"0","is_correct":false,"position":1},{"id":"658470da-f290-404c-bf99-edd314c52aa6","label":"B","body":"dragón","is_correct":false,"position":2},{"id":"ee18b3a8-df6c-4453-89e8-87cc196cd174","label":"C","body":"Error fatal","is_correct":false,"position":3},{"id":"62d0bb09-b4fc-4876-88d8-6ec1f4d35bfa","label":"D","body":"nil","is_correct":true,"position":4}],"correct_answer_ids":["62d0bb09-b4fc-4876-88d8-6ec1f4d35bfa"],"explanation":"¡Correcto! Como 'dragón' no es un número, tonumber devuelve nil.","hints":[]}]},{"id":"6dae36ac-938c-49dc-95d1-209d6133d00b","title":"Conversión en bases numéricas con tonumber(str, base)","slug":"tonumber-bases-numericas","position":5,"concept_id":"lua-conv-tonumber-bases","explanation":"tonumber tiene un superpoder oculto: convertir números en binario o hex. Paso 1: Le pasas el texto y la base como segundo argumento: tonumber(\"101\", 2). Paso 2: El 2 le indica base binaria: 101 en binario vale 5. Paso 3: Si usas base 16, puedes convertir hexadecimales como \"FF\" a 255.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Bases numéricas","code":"local binario = tonumber(\"111\", 2)\nprint(\"111 en binario es:\", binario)","language":"lua","output":"111 en binario es:\t7","explanation":"tonumber(str, 2) traduce binario a decimal.","position":1}],"exercises":[{"id":"33efa732-ae89-440b-b068-78226ca5a31d","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué número decimal devolverá tonumber(\"10\", 2)?","prompt_code":"print(tonumber(\"10\", 2))","score":10,"concept_ids":["lua-conv-tonumber-bases"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"70a3c0ad-6b15-4992-b848-843a03ef0cbb","label":"A","body":"2","is_correct":true,"position":1},{"id":"a9fee3a5-ce29-4ce1-8cdb-0369849933dd","label":"B","body":"1","is_correct":false,"position":2},{"id":"72b96c4c-aa4e-4317-83b6-f10f3241871c","label":"C","body":"10","is_correct":false,"position":3},{"id":"3ef2bf90-cf12-430e-aabf-c98ae7dfffc1","label":"D","body":"0","is_correct":false,"position":4}],"correct_answer_ids":["70a3c0ad-6b15-4992-b848-843a03ef0cbb"],"explanation":"¡Excelente! '10' en base 2 equivale a dos unidades decimales.","hints":[]}]},{"id":"cc5c7581-3658-4c2b-a341-e718ea8d0fc5","title":"La coerción implícita: Lua intenta adivinar","slug":"coercion-implicita-lua","position":6,"concept_id":"lua-conv-coercion-implicita","explanation":"Lua es tan complaciente que a veces convierte tipos por sí solo. A esto se le llama 'coerción implícita'. Paso 1: Si escribes \"10\" + 5 con un texto y un número. Paso 2: Lua ve el signo + y dice: 'el usuario quiere sumar, intentaré convertir \"10\" en número'. Paso 3: Lo convierte y te da 15. Parece magia, pero... ¡es peligrosa!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Coerción mágica","code":"print(\"20\" + 10)","language":"lua","output":"30","explanation":"Lua convierte '20' a número automáticamente al ver el operador +.","position":1}],"exercises":[{"id":"bbd58370-5896-478c-a130-81551325796b","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué resultado mostrará la expresión print(\"5\" + 5)?","prompt_code":"print(\"5\" + 5)","score":10,"concept_ids":["lua-conv-coercion-implicita"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"5e872098-7666-4c23-afe8-aea7bcea4fe8","label":"A","body":"\"55\"","is_correct":false,"position":1},{"id":"215787f6-2787-4d90-82ae-256ae5166017","label":"B","body":"10","is_correct":true,"position":2},{"id":"e1b75b9b-0272-42a6-9de1-b1c6a0db3448","label":"C","body":"55","is_correct":false,"position":3},{"id":"5ab9e98f-ced7-4198-b359-c4614a9db65a","label":"D","body":"Error","is_correct":false,"position":4}],"correct_answer_ids":["215787f6-2787-4d90-82ae-256ae5166017"],"explanation":"¡Exacto! El operador + fuerza la coerción matemática convirtiendo \"5\" en 5.","hints":[]}]},{"id":"cdf56e6c-e6bd-40ba-819b-885f94f2aebf","title":"El peligro de la coerción automática","slug":"peligro-coercion-automatica","position":7,"concept_id":"lua-conv-peligro-coercion","explanation":"¿Por qué no debemos confiar en la coerción mágica? Paso 1: Si el texto contiene letras por accidente (ej: \"10a\" + 5), ¡tu programa se estrellará con un error en plena partida! Paso 2: Además es difícil de leer y otros programadores se confundirán. Paso 3: El código profesional usa conversiones explícitas.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Fallo de coerción","code":"-- print(\"10monedas\" + 5) => Error: attempt to perform arithmetic on a string\nlocal seguro = tonumber(\"10\") + 5\nprint(seguro)","language":"lua","output":"15","explanation":"Convertir explícitamente evita errores inesperados.","position":1}],"exercises":[{"id":"7edec181-ce2e-4c6b-ac83-73899a28f10a","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"true_false","difficulty":"easy","category":"variables","prompt":"¿Depender de que Lua convierta textos a números automáticamente con el signo + puede provocar errores de ejecución si el texto no es numérico?","prompt_code":null,"score":10,"concept_ids":["lua-conv-peligro-coercion"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"73e88cdb-de3a-4e69-80ad-a8927086102c","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"e7c46edf-7cdc-484f-8882-c7e845abeccb","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["e7c46edf-7cdc-484f-8882-c7e845abeccb"],"explanation":"¡Verdadero! Si la cadena contiene caracteres no válidos, la coerción fallará y causará un runtime error.","hints":[]}]},{"id":"52d8d517-e66f-460b-8633-efb4b56b97df","title":"Diferencia entre sumar + y concatenar ..","slug":"diferencia-suma-y-concatenacion","position":8,"concept_id":"lua-conv-suma-vs-concat","explanation":"Esta es una regla de oro en Lua: el signo + es SOLO para matemáticas; para unir textos se usan dos puntos seguidos ... Paso 1: 5 + 5 da 10 (suma matemática). Paso 2: \"Hola \" .. \"Mundo\" da \"Hola Mundo\" (unión de textos). Paso 3: En Lua nunca uses + para unir palabras; el pegamento de textos es siempre ...","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Sumar vs Unir","code":"print(5 + 5)        -- Da 10 (suma)\nprint(\"Nivel: \" .. 5) -- Da Nivel: 5 (unión)","language":"lua","output":"10\nNivel: 5","explanation":"+ suma cifras; .. une cadenas de texto.","position":1}],"exercises":[{"id":"d068236f-2c9c-4ca0-b4ef-dd4271ffe50c","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué mostrará la instrucción print(\"Puntos: \" .. 100)?","prompt_code":"print(\"Puntos: \" .. 100)","score":10,"concept_ids":["lua-conv-suma-vs-concat"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"dec972f5-845a-4965-bdd3-c660a34f140f","label":"A","body":"100","is_correct":false,"position":1},{"id":"5a88169c-cb5c-4488-a96a-41c799cef260","label":"B","body":"Error por mezclar tipos","is_correct":false,"position":2},{"id":"0bc08ef7-a04f-4bfb-8b86-dfc759963f60","label":"C","body":"Puntos: 100","is_correct":true,"position":3},{"id":"cd2f4736-01fc-49d5-872b-08df1b283092","label":"D","body":"Puntos: + 100","is_correct":false,"position":4}],"correct_answer_ids":["0bc08ef7-a04f-4bfb-8b86-dfc759963f60"],"explanation":"¡Correcto! Los dos puntos .. concatenan y convierten el número a texto limpiamente.","hints":[]}]},{"id":"b63074b4-ecce-475f-b57b-34c952f77e89","title":"Buenas prácticas: conversiones explícitas","slug":"buenas-practicas-conversion","position":9,"concept_id":"lua-conv-buenas-practicas","explanation":"Los ingenieros sénior siguen una regla: sé explícito. Paso 1: Si necesitas convertir texto a número, usa tonumber() con intención clara. Paso 2: Si necesitas mostrar un número junto a un mensaje, usa comas en print() o los dos puntos ... Paso 3: Tu código será robusto, a prueba de fallos y un placer de mantener.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Código robusto","code":"local entrada = \"45\"\nlocal valor = tonumber(entrada) or 0\nprint(\"Valor seguro:\", valor)","language":"lua","output":"Valor seguro:\t45","explanation":"El patrón tonumber(x) or 0 garantiza que nunca haya nil.","position":1}],"exercises":[{"id":"812833c8-11a1-4c6b-b9f4-4aa53f38ffdc","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"¿Cuál es la forma más segura y recomendada de sumar un texto numérico como entrada = \"10\" con una cifra?","prompt_code":null,"score":10,"concept_ids":["lua-conv-buenas-practicas"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"f7e9e5e6-f8bd-4289-8e36-d6f75d4be690","label":"A","body":"entrada + 5 directamente confiando en la suerte","is_correct":false,"position":1},{"id":"9a1efae5-613e-4b27-81b1-4ca895677a92","label":"B","body":"Borrar la variable","is_correct":false,"position":2},{"id":"f9dceeaa-1f06-4f96-9985-77dcbc013ca4","label":"C","body":"Escribir entrada .. 5","is_correct":false,"position":3},{"id":"f2822712-f28d-4413-802c-aaf678a9a6d8","label":"D","body":"Convertir explícitamente con tonumber(entrada) + 5","is_correct":true,"position":4}],"correct_answer_ids":["f2822712-f28d-4413-802c-aaf678a9a6d8"],"explanation":"¡Excelente! La conversión explícita con tonumber() es la práctica profesional recomendada.","hints":[]}]},{"id":"3f70f9ef-a78d-4dd2-a0fa-d14f8b1c6172","title":"Mini-repaso de la Sección 8","slug":"mini-repaso-seccion-ocho-m02","position":10,"concept_id":"lua-conv-s08-repaso","explanation":"¡Conversiones dominadas! Paso 1: tostring() pasa a texto y tonumber() pasa a número (o devuelve nil si falla). Paso 2: + calcula cifras y .. une cadenas de texto. Paso 3: Ser explícito evita dolores de cabeza. ¡Ahora daremos un vistazo a los 4 tipos avanzados de Lua!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Resumen S08","code":"local str = \"80\"\nlocal num = tonumber(str)\nprint(\"Sumado:\", num + 20)","language":"lua","output":"Sumado:\t100","explanation":"Conversión y operaciones seguras consolidadas.","position":1}],"exercises":[{"id":"7932ea44-1645-4d96-bf6a-1be67c11f9c5","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué dará la instrucción print(tostring(5) .. \"0\")?","prompt_code":"print(tostring(5) .. \"0\")","score":10,"concept_ids":["lua-conv-s08-repaso"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"b857f67b-c09b-4d36-95d4-0b211eb33941","label":"A","body":"50","is_correct":true,"position":1},{"id":"639ffb87-1cc2-4016-8b16-f86dbe7e51fe","label":"B","body":"5","is_correct":false,"position":2},{"id":"42a4b75d-8007-4148-8c4d-b3e0df9fdaa2","label":"C","body":"55","is_correct":false,"position":3},{"id":"503c0ee8-f1bb-44b7-8143-3234f93b5978","label":"D","body":"0","is_correct":false,"position":4}],"correct_answer_ids":["b857f67b-c09b-4d36-95d4-0b211eb33941"],"explanation":"¡Exacto! tostring(5) es \"5\", y al concatenarle \"0\" con .. resulta el texto \"50\".","hints":[]}]}]},{"id":"ed04236b-e14c-4d65-a662-8f5adae30752","title":"Vistazo a los 4 tipos avanzados","slug":"tipos-avanzados-en-lua","position":9,"type":"theory","status":"published","content_version":1,"estimated_minutes":15,"xp_on_complete":10,"lessons":[{"id":"5a0622ad-c6bf-47e4-b86c-dd5f594d4a31","title":"Los tipos simples vs los tipos contenedores","slug":"simples-vs-contenedores","position":1,"concept_id":"lua-adv-simples-vs-complejos","explanation":"Los primeros 4 tipos que aprendiste (nil, boolean, number y string) guardan un solo dato simple. Paso 1: Un número es solo un número; una palabra es solo una palabra. Paso 2: Pero en un juego real necesitas guardar inventarios de 50 objetos o listas de jugadores. Paso 3: Para eso existen los tipos contenedores avanzados de Lua.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Tipos contenedores","code":"-- number, string => Valores simples\n-- table, function => Estructuras avanzadas","language":"lua","output":"","explanation":"Los tipos avanzados agrupan lógica y colecciones complejas.","position":1}],"exercises":[{"id":"35653fee-5877-4ee8-a563-5baad9b93efe","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"¿Cuál es la diferencia principal entre un tipo simple (como number) y un tipo contenedor (como table)?","prompt_code":null,"score":10,"concept_ids":["lua-adv-simples-vs-complejos"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"f905fc3d-1b92-403a-a979-0e633c42d2d2","label":"A","body":"Los simples son más lentos","is_correct":false,"position":1},{"id":"921aa053-8078-4e07-b214-787d2984f02c","label":"B","body":"Un tipo simple guarda un valor atómico individual, mientras que un contenedor puede almacenar múltiples datos juntos","is_correct":true,"position":2},{"id":"55031673-c504-4c56-90cb-87110f3d720a","label":"C","body":"Los contenedores solo funcionan de noche","is_correct":false,"position":3},{"id":"fdbcf0b2-9c84-497f-ab2c-3af8735f6561","label":"D","body":"No hay ninguna diferencia","is_correct":false,"position":4}],"correct_answer_ids":["921aa053-8078-4e07-b214-787d2984f02c"],"explanation":"¡Correcto! Los tipos complejos o contenedores permiten estructurar múltiples valores y comportamientos juntos.","hints":[]}]},{"id":"18769a32-f10a-4474-b123-09e1b8759a77","title":"table: La estructura reina de Lua","slug":"intro-tipo-table","position":2,"concept_id":"lua-adv-intro-table","explanation":"¡Conoce a la reina absoluta de Lua: table! Paso 1: Lua no tiene arrays, ni diccionarios, ni objetos separados; tiene una sola súper-estructura llamada tabla. Paso 2: Con tablas puedes crear listas de compras, inventarios de RPG, matrices 3D y sistemas enteros. Paso 3: Se crean usando llaves: {}.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Tabla reina","code":"local inventario = {\"espada\", \"escudo\", \"pocion\"}\nprint(inventario[1])","language":"lua","output":"espada","explanation":"table es el único contenedor nativo y todopoderoso de Lua.","position":1}],"exercises":[{"id":"8c080c25-3395-4697-b7d0-ff0916ec9dbe","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"single_choice","difficulty":"easy","category":"variables","prompt":"¿Cuál es la estructura de datos principal y universal que utiliza Lua para manejar listas, mapas y objetos?","prompt_code":null,"score":10,"concept_ids":["lua-adv-intro-table"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"c3f54690-a843-4ca4-af0c-cda350ebdadd","label":"A","body":"arraylist","is_correct":false,"position":1},{"id":"5f9459f4-a706-4e38-9224-8cfc9c3e26ca","label":"B","body":"struct","is_correct":false,"position":2},{"id":"a58b8055-f595-4ea2-87ba-e5d7d04d028e","label":"C","body":"table (tabla)","is_correct":true,"position":3},{"id":"7f13e20a-94a9-4a57-90b9-b1eccfc280bf","label":"D","body":"dictionary","is_correct":false,"position":4}],"correct_answer_ids":["a58b8055-f595-4ea2-87ba-e5d7d04d028e"],"explanation":"¡Exacto! En Lua, `table` es el único contenedor nativo y sirve para todo.","hints":[]}]},{"id":"9701dd0d-be5b-4914-b75e-ef42aac186f1","title":"Una tabla vacía {} y qué dice type({})","slug":"tabla-vacia-type","position":3,"concept_id":"lua-adv-tabla-vacia","explanation":"Crear una tabla vacía es tan fácil como abrir y cerrar llaves {}. Paso 1: Escribes local cofre = {}. Paso 2: Tienes una cajita organizadora lista para llenarse. Paso 3: Si le preguntas a la inspectora type(cofre), ¿qué te responde? Te responderá con orgullo la palabra \"table\".","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Tabla en type","code":"local datos = {}\nprint(type(datos))","language":"lua","output":"table","explanation":"Las llaves {} crean una tabla y type reconoce 'table'.","position":1}],"exercises":[{"id":"f13a3f34-ddbc-4345-acac-1aa02b9bb9c7","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué palabra devolverá print(type({1, 2, 3}))?","prompt_code":"print(type({1, 2, 3}))","score":10,"concept_ids":["lua-adv-tabla-vacia"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"b2a3595c-965e-4940-a654-e3b1b2a3b973","label":"A","body":"list","is_correct":false,"position":1},{"id":"82d6ad5d-e6a8-4a58-aa46-f5c44bcccd7b","label":"B","body":"array","is_correct":false,"position":2},{"id":"bcc50cdb-10b9-45e4-8eea-45db5201031e","label":"C","body":"numbers","is_correct":false,"position":3},{"id":"20da5de1-4a7d-406d-abe8-1df5e82875cb","label":"D","body":"table","is_correct":true,"position":4}],"correct_answer_ids":["20da5de1-4a7d-406d-abe8-1df5e82875cb"],"explanation":"¡Muy bien! Cualquier colección entre llaves {} se identifica como de tipo table.","hints":[]}]},{"id":"2df4b2a2-0228-472e-874b-c910a1118b81","title":"function: El código como valor de primera clase","slug":"funcion-valor-primera-clase","position":4,"concept_id":"lua-adv-intro-function","explanation":"En Lua, las funciones son 'valores de primera clase'. Paso 1: Eso suena elegante, pero significa algo muy simple: una función es un dato igual que un número. Paso 2: Puedes guardar una función adentro de una variable, pasarla como argumento o guardarla en una tabla. Paso 3: El código en sí mismo tiene su propio tipo: function.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Función como dato","code":"local saludar = function()\n  print(\"¡Hola desde una variable!\")\nend\nsaludar()","language":"lua","output":"¡Hola desde una variable!","explanation":"En Lua las funciones se pueden asignar a variables.","position":1}],"exercises":[{"id":"cf9ca940-fb9d-4619-be5d-1ef85b18adb0","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"true_false","difficulty":"easy","category":"variables","prompt":"En Lua, ¿las funciones son tratadas como valores de primera clase que pueden guardarse en variables igual que números o textos?","prompt_code":null,"score":10,"concept_ids":["lua-adv-intro-function"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"2a6e71df-2614-45a5-9b98-b7ffeea9f0e6","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"e1e3fe41-ba68-4df2-ac0e-f0b7f46cbb67","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["e1e3fe41-ba68-4df2-ac0e-f0b7f46cbb67"],"explanation":"¡Verdadero! En Lua las funciones son valores de primera clase (first-class citizens).","hints":[]}]},{"id":"f63beef2-43c5-4600-8bdf-df171f02e8e5","title":"Guardar una función en una variable local","slug":"guardar-funcion-en-variable","position":5,"concept_id":"lua-adv-funcion-en-variable","explanation":"Mira cómo cobra sentido todo lo que aprendiste. Paso 1: Usas local para crear una variable segura. Paso 2: Le pones de nombre atacar. Paso 3: Escribes = function() ... end. Ahora la variable atacar contiene la lógica de un golpe. Para dispararla, solo escribes su nombre con paréntesis: atacar().","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Acción en variable","code":"local saltar = function()\n  print(\"¡El personaje salta!\")\nend\nsaltar()","language":"lua","output":"¡El personaje salta!","explanation":"La variable saltar ejecuta su bloque de código al llevar paréntesis ().","position":1}],"exercises":[{"id":"2d858452-c6f7-4105-8f4b-935994af68b3","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"Si ejecutamos este código, ¿qué mensaje se verá en pantalla?","prompt_code":"local rugir = function() print(\"¡ROAR!\") end\nrugir()","score":10,"concept_ids":["lua-adv-funcion-en-variable"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"adc711ce-91f0-4b39-a384-864136b628d9","label":"A","body":"¡ROAR!","is_correct":true,"position":1},{"id":"eb3a6e4d-8148-4440-a001-b370f9fed362","label":"B","body":"function","is_correct":false,"position":2},{"id":"2ac7bc54-43ea-48c4-a30b-448fee62817b","label":"C","body":"rugir","is_correct":false,"position":3},{"id":"9ee9238d-b0ed-4888-a21b-fd703bcefcfc","label":"D","body":"nil","is_correct":false,"position":4}],"correct_answer_ids":["adc711ce-91f0-4b39-a384-864136b628d9"],"explanation":"¡Exacto! Al escribir rugir(), la función guardada en la variable se ejecuta y muestra el rugido.","hints":[]}]},{"id":"08f07202-3334-4e08-9540-4bbe5ada15be","title":"Qué dice type() sobre una función","slug":"inspectora-type-function","position":6,"concept_id":"lua-adv-type-function","explanation":"¿Qué ocurre si le pasas una función a la inspectora type()? Paso 1: Creas local f = function() end. Paso 2: Escribes type(f). Paso 3: Lua reconoce el sexto tipo nativo y te responde la palabra \"function\". ¡La inspectora nunca miente!","is_required":true,"status":"published","content_version":1,"examples":[{"title":"type en funciones","code":"local f = function() end\nprint(type(f))","language":"lua","ou ":[{"id":"6746f650-8d1d-4e83-8e2d-0bd974a810cb","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"true_false","difficulty":"easy","category":"variables","prompt":"¿El Módulo 02 te ha enseñado a crear y reasignar variables, inspeccionar tipos, proteger datos con local y dominar los 8 tipos nativos de Lua?","prompt_code":null,"score":10,"concept_ids":["lua-mod02-mapa-mental"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"103aaf4b-b1ae-4abf-bcfc-34859632a922","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"74eef984-c6ed-44b5-9a20-f6dec8619559","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["74eef984-c6ed-44b5-9a20-f6dec8619559"],"explanation":"¡Verdadero! Tienes una comprensión sólida y profunda de cómo se maneja la memoria en Lua.","hints":[]}]},{"id":"ae56f75a-94e0-488f-9c5f-a05c828de91e","title":"Repaso activo 1: Asignaciones y nombres claros","slug":"repaso-asignacion-nombres","position":2,"concept_id":"lua-mod02-repaso-asignacion","explanation":"Reforcemos la memoria activa. Paso 1: Una variable se crea con nombre = valor. Paso 2: Los nombres limpios no llevan espacios ni empiezan con números (vidas_oro en vez de v). Paso 3: El signo = deposita lo calculado a la derecha dentro de la cajita de la izquierda.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Repaso asignación","code":"local score = 500\nprint(\"Puntaje:\", score)","language":"lua","output":"Puntaje:\t500","explanation":"Asignación directa y limpia.","position":1}],"exercises":[{"id":"a0f6f5db-6fda-4bed-a658-cd5353e28e08","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué mostrará este código?","prompt_code":"local xp = 30\nprint(xp ]},{"id":"42d354de-c4fc-4e64-b9ed-c12bc602630b","title":"Repaso activo 5: Números y cadenas","slug":"repaso-numeros-cadenas","position":6,"concept_id":"lua-mod02-repaso-num-str","explanation":"Los dos tipos de combate diario. Paso 1: Decimales con punto 3.14. Paso 2: División entera // y residuo %. Paso 3: Cadenas multilínea con [[ ]] y conteo de letras con #.","is_required":true,"status":"published","content_version":1,"examples":[{"title":"Repaso num y str","code":"local texto = \"Lua\"\nprint(#texto, 10 // 3)","language":"lua","output":"3\t3","explanation":"# cuenta letras y // descarta decimales.","position":1}],"exercises":[{"id":"42370801-eaa5-4957-952d-040e1362b15d","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"c2f3e4d5-a6b7-4c8d-9e0f-1a2b3c4d5e6f","type":"predict_output","difficulty":"easy","category":"variables","prompt":"¿Qué imprimirá print(#\"Code\")?","prompt_code":"print(#\"Code\")","score":10,"concept_ids":["lua-mod02-repaso-num-str"],"status":"published","content_version":1,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"2409e557-06bd-4510-bd36-0a60c3829899","label":"A","body":"Code","is_correct":false,"position":1},{"id":"7af1e951-6e85-46bc-9147-55dde40e557a","label":"B","body":"4","is_correct":true,"position":2},{"id":"ad94304b-23a8-4a71-8914-39357511340e","label":"C","body":"3","is_correct":false,"position":3},{"id":"283df21d-7d50-4484-bb44-c6f7ce408928","label":"D","body":"#4","is_correct":false,"position":4}],"correct_answer_ids":["7af1e951-6e85-46bc-9147-55dde40e557a"],"explanation":"¡Correcto! 'C-o-d-e' tiene 4 letras.","hints":[]}]},{"id":"80d747d3-befc-4387-a9e5-81998aa765f2","title":"Repaso activo 6: Booleanos y la regla falsy","slug":"repaso-booleanos-regla-falsy","position":7,"concept_id":"lua-mod02-repaso-bool","explanation":"La ley de la lógica en Lua. Paso 1: Solo false y nil apagan la condición. Paso 2: 0 y \"\" son verdaderos. Paso 3: not invierte la verdad.","is_required":true,"sta // ESTADO GLOBAL Y PERSISTENCIA
// =========================================================
const STORAGE_KEY = 'codequest_unified_state_v3';
let state = {
  xp: 0,
  streak: 0,
  ans: {},
  secDone: {},
  pendingReviews: {},
  mistakes: {},
  stars: {},
  secErrors: {}
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) {
      state = { ...state, ...JSON.parse(raw) };
      state.pendingReviews = state.pendingReviews || {};
      state.mistakes = state.mistakes || {};
      state.stars = state.stars || {};
      state.secErrors = state.secErrors || {};
    }
  } catch(e) { console.error(e); }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    updateHeaderStats();
    updateMistakesBadge();
  } catch(e) { console.error(e); }
}

function addXP(n) {
  state.xp = (state.xp || 0) + n;
  saveState();
}

function getModuleStars(modKey) {
  const targetMod = ALL_MODULES[modKey];
  const meta = LUA_ROADMAP_12_MODULES.find(m => m.key === modKey);
  if(!targetMod) {
    return {
      earned: 0,
      max: meta ? meta.maxStars : 27,
      minReq: meta ? meta.minStars : 22,
      pct: 0,
      allSecsDone: false
    };
  }
  let earned = 0;
  let allSecsDone = true;
  targetMod.sections.forEach(s => {
    earned += (state.stars && state.stars[s.id]) || 0;
    if(!state.secDone || !state.secDone[s.id]) allSecsDone = false;
  });
  const max = targetMod.sections.length * 3;
  const minReq = meta ? meta.minStars : Math.ceil(max * 0.8);
  const pct = max > 0 ? Math.round((earned / max) * 100) : 0;
  return { earned, max, minReq, pct, allSecsDone };
}

function isModuleUnlocked(modKey) {
  if(modKey === '01_fundamentos') return true;
  if(modKey === '02_variables') {
    const m01Stats = getModuleStars('01_fundamentos');
    return m01Stats.allSecsDone && m01Stats.earned >= m01Stats.minReq;
  }
  return false;
}

function isSectionUnlocked(modKey, secPosition) {
  if(secPosition === 1) return true;
  const targetMod = ALL_MODULES[modKey];
  if(!targetMod) return false;
  const prevSec = targetMod.sections.find(s => s.position === secPosition - 1);
  if(!prevSec) return false;
  return !!(state.secDone && state.secDone[prevSec.id]);
}

function updateHeaderStats() {
  const mStats = getModuleStars(currentModKey);
  const starsEl = document.getElementById('stat-stars');
  if(starsEl) starsEl.textContent = `${mStats.earned}/${mStats.max}`;
  document.getElementById('stat-xp').textContent = state.xp || 0;
  document.getElementById('stat-streak').textContent = state.streak || 0;
  document.getElementById('stat-level').textContent = Math.floor((state.xp || 0) / 100) + 1;
}

function updateMistakesBadge() {
  const badge = document.getElementById('nav-mistakes-badge');
  if(!badge) return;
  const count = Object.values(state.mistakes || {}).filter(m => !m.resolved).length;
  if(count > 0) {
    badge.textContent = count;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function switchModule(modKey) {
  const targetMod = ALL_MODULES[modKey];
  const meta = LUA_ROADMAP_12_MODULES.find(m => m.key === modKey);
  
  if(!targetMod) {
    triggerMascotReaction('wrong');
    showToast(`🔒 ${meta ? meta.name : 'Módulo'} en desarrollo. ¡Pronto disponible!`);
    return;
  }

  if(!isModuleUnlocked(modKey)) {
    const sel = document.getElementById('module-select');
    if(sel) sel.value = currentModKey;
    const m01Stats = getModuleStars('01_fundamentos');
    triggerMascotReaction('wrong');
    showToast(`🔒 ${targetMod.title} Bloqueado: Requiere completar todas las secciones de M01 y tener al menos ${m01Stats.minReq} ⭐ (Tienes ${m01Stats.earned}/${m01Stats.minReq} ⭐).`);
    return;
  }

  currentModKey = modKey;
  localStorage.setItem('codequest_active_mod', modKey);
  MOD = ALL_MODULES[modKey];
  BANK = ALL_BANKS[modKey];

  const sel = document.getElementById('module-select');
  if(sel) sel.value = modKey;

  showToast(`Cambiando a ${MOD.title} 📚`);
  viewRuta();
}

// Pistas contextuales
function hintFor(q) {
  const cid = (q.concept_ids && q.concept_ids[0]) || '';
  if (cid.includes('concepto') || cid.includes('cajita')) return '💡 Recuerda: Una variable es una cajita en la memoria con un nombre donde guardamos un dato para reutilizarlo.';
  if (cid.includes('asignacion') || cid.includes('operador')) return '💡 Recuerda: El signo = es una asignación; guarda el valor de la derecha dentro de la variable de la izquierda.';
  if (cid.includes('leer-print')) return '💡 Recuerda: Para ver el valor de una variable, escribe su nombre dentro de print() SIN comillas.';
  if (cid.includes('vs-string')) return '💡 Recuerda: Entre comillas es una palabra literal de texto; sin comillas es el nombre de la variable.';
  if (cid.includes('reasignar')) return '💡 Recuerda: Las variables solo recuerdan su último valor asignado; lo anterior se sobrescribe.';
  if (cid.includes('contador')) return '💡 Recuerda: x = x + 1 toma el valor actual de la variable y le suma 1.';
  if (cid.includes('copia')) return '💡 Recuerda: Al copiar una variable en otra (b = a), cada una queda con su propia copia independiente.';
  if (cid.includes('type')) return '💡 Recuerda: type() siempre responde con una cadena de texto entre comillas como "number", "string" o "boolean".';
  if (cid.includes('number')) return '💡 Recuerda: En Lua los enteros y decimales son del tipo number. Usa // para división entera y % para el residuo.';
  if (cid.includes('string')) return '💡 Recuerda: Los textos usan comillas. \\n salta de renglón y [[ ]] permite bloques multilínea.';
  if (cid.includes('boolean')) return '💡 Recuerda: En Lua solo existen true y false. ¡El número 0 y el texto vacío "" cuentan como verdaderos!';
  if (cid.includes('falsy')) return '💡 Recuerda la regla sagrada de Lua: únicamente false y nil son falsos. Absolutamente todo lo demás es verdadero.';
  if (cid.includes('nil')) return '💡 Recuerda: nil representa la ausencia total de valor o la nada. No es el número cero ni texto vacío.';
  if (cid.includes('local')) return '💡 Recuerda: Declarar con local crea una variable segura y aislada que no contamina el entorno global.';
  if (cid.includes('conv')) return '💡 Recuerda: tostring() pasa a texto y tonumber() pasa a número (o devuelve nil si no puede convertir).';
  if (cid.includes('table')) return '💡 Recuerda: table {} es la estructura reina y único contenedor nativo de Lua para listas y mapas.';
  if (cid.includes('end')) return '💡 Recuerda: En Lua la palabra obligatoria para cerrar bloques de código es end.';
  return '💡 Pista: Vuelve a revisar la tarjeta de teoría y código de la izquierda para confirmar el concepto clave.';
}

// =========================================================
// MOTOR PIXIJS: MASCOTA COMPANION Y EFECTOS DE PARTÍCULAS
// =========================================================
let pixiApp = null;
let mascotContainer = null;
let mascotEyes = null;
let mascotMouth = null;
let particles = [];

function initPixiMascot() {
  const canvas = document.getElementById('pixi-mascot-canvas');
  if(!canvas || !window.PIXI) return;

  try {
    pixiApp = new PIXI.Application({
      view: canvas,
      width: 140,
      height: 120,
      backgroundColor: 0x0B0F19,
      backgroundAlpha: 0,
      antialias: true,
      resolution: window.devicePixelRatio || 1,
      autoDensity: true
    });

    mascotContainer = new PIXI.Container();
    mascotContainer.x = 70;
    mascotContainer.y = 65;
    pixiApp.stage.addChild(mascotContainer);

    // Sombra suave
    const shadow = new PIXI.Graphics();
    shadow.beginFill(0x000000, 0.25);
    shadow.drawEllipse(0, 38, 30, 8);
    shadow.endFill();
    mascotContainer.addChild(shadow);

    // Cuerpo esférico kawaii
    const body = new PIXI.Graphics();
    body.beginFill(0x3B82F6);
    body.drawCircle(0, 0, 34);
    body.endFill();

    // Brillo superior
    const highlight = new PIXI.Graphics();
    highlight.beginFill(0x93C5FD, 0.6);
    highlight.drawCircle(-10, -12, 10);
    highlight.endFill();
    body.addChild(highlight);

    // Colorete rosado kawaii
    const blushL = new PIXI.Graphics();
    blushL.beginFill(0xF472B6, 0.6);
    blushL.drawCircle(-18, 10, 5);
    blushL.endFill();
    body.addChild(blushL);

    const blushR = new PIXI.Graphics();
    blushR.beginFill(0xF472B6, 0.6);
    blushR.drawCircle(18, 10, 5);
    blushR.endFill();
    body.addChild(blushR);

    // Ojos interactivos
    mascotEyes = new PIXI.Graphics();
    drawMascotEyes('normal');
    body.addChild(mascotEyes);

    // Boca sonriente
    mascotMouth = new PIXI.Graphics();
    drawMascotMouth('smile');
    body.addChild(mascotMouth);

    mascotContainer.addChild(body);

    // Animación de respiración / flotación continua
    let time = 0;
    pixiApp.ticker.add((delta) => {
      time += 0.05 * delta;
      mascotContainer.y = 65 + Math.sin(time) * 4;
      body.scale.y = 1 + Math.sin(time) * 0.03;

      // Actualizar partículas
      for(let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1; // gravedad
        p.alpha -= 0.02;
        p.rotation += 0.05;
        if(p.alpha <= 0) {
          pixiApp.stage.removeChild(p);
          particles.splice(i, 1);
        }
      }
    });

    // Clic en la mascota para saludar
    canvas.addEventListener('click', () => {
      triggerMascotReaction('correct');
      showToast('🦊 Koda: ¡Sigue adelante, lo estás haciendo genial!');
    });

  } catch(e) {
    console.error('Error inicializando PixiJS Mascot:', e);
  }
}

function drawMascotEyes(mood) {
  if(!mascotEyes) return;
  mascotEyes.clear();
  if(mood === 'happy' || mood === 'correct') {
    // Ojos cerrados sonrientes (arcos ^ ^)
    mascotEyes.lineStyle(3, 0xFFFFFF);
    mascotEyes.arc(-12, -2, 6, Math.PI, 0);
    mascotEyes.arc(12, -2, 6, Math.PI, 0);
  } else if(mood === 'wrong') {
    // Ojos en cruz (x x)
    mascotEyes.lineStyle(2.5, 0xFFFFFF);
    mascotEyes.moveTo(-16, -6).lineTo(-8, 2);
    mascotEyes.moveTo(-8, -6).lineTo(-16, 2);
    mascotEyes.moveTo(8, -6).lineTo(16, 2);
    mascotEyes.moveTo(16, -6).lineTo(8, 2);
  } else {
    // Ojos normales con brillo
    mascotEyes.beginFill(0xFFFFFF);
    mascotEyes.drawCircle(-12, -2, 6);
    mascotEyes.drawCircle(12, -2, 6);
    mascotEyes.endFill();

    mascotEyes.beginFill(0x1E293B);
    mascotEyes.drawCircle(-11, -2, 3.5);
    mascotEyes.drawCircle(13, -2, 3.5);
    mascotEyes.endFill();
  }
}

function drawMascotMouth(mood) {
  if(!mascotMouth) return;
  mascotMouth.clear();
  mascotMouth.lineStyle(2.5, 0xFFFFFF);
  if(mood === 'smile' || mood === 'correct') {
    mascotMouth.arc(0, 4, 6, 0, Math.PI);
  } else if(mood === 'wrong') {
    mascotMouth.arc(0, 12, 6, Math.PI, 0);
  } else {
    mascotMouth.moveTo(-3, 8).lineTo(3, 8);
  }
}

function triggerMascotReaction(type) {
  if(!pixiApp) return;

  if(type === 'correct') {
    drawMascotEyes('correct');
    drawMascotMouth('correct');
    document.getElementById('mascot-status-txt').textContent = '🎉 ¡Increíble acierto!';
    document.getElementById('mascot-status-txt').style.color = '#10B981';

    // Ráfaga de confeti con PixiJS
    spawnPixiConfetti();

    setTimeout(() => {
      drawMascotEyes('normal');
      drawMascotMouth('smile');
      document.getElementById('mascot-status-txt').textContent = '🦊 Koda (PixiJS)';
      document.getElementById('mascot-status-txt').style.color = 'var(--muted)';
    }, 2200);

  } else if(type === 'wrong') {
    drawMascotEyes('wrong');
    drawMascotMouth('wrong');
    document.getElementById('mascot-status-txt').textContent = '💡 ¡Tú puedes, deduce!';
    document.getElementById('mascot-status-txt').style.color = '#EF4444';

    setTimeout(() => {
      drawMascotEyes('normal');
      drawMascotMouth('smile');
      document.getElementById('mascot-status-txt').textContent = '🦊 Koda (PixiJS)';
      document.getElementById('mascot-status-txt').style.color = 'var(--muted)';
    }, 2500);
  }
}

function spawnPixiConfetti() {
  if(!pixiApp) return;
  const colors = [0x3B82F6, 0x10B981, 0xF59E0B, 0xEC4899, 0x8B5CF6, 0xFFFFFF];
  for(let i = 0; i < 24; i++) {
    const p = new PIXI.Graphics();
    const c = colors[Math.floor(Math.random() * colors.length)];
    p.beginFill(c);
    if(Math.random() > 0.5) {
      p.drawCircle(0, 0, Math.random() * 4 + 2);
    } else {
      p.drawRect(-3, -3, 6, 6);
    }
    p.endFill();
    p.x = 70;
    p.y = 50;
    p.vx = (Math.random() - 0.5) * 6;
    p.vy = (Math.random() - 1.2) * 5;
    p.alpha = 1;
    pixiApp.stage.addChild(p);
    particles.push(p);
  }
}

          </p>
        </div>
        <div style="margin-top:16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--muted);border-top:1px solid var(--border);padding-top:10px;">
          <span>${!isUnlocked ? 'Requiere Sec ' + (sec.position - 1) : `${secDoneCount}/${sec.lessons.length} completadas`}</span>
          <span style="color:${isDone ? '#F59E0B' : 'var(--primary)'};">
            ${isDone ? (secStars < 3 ? '🔄 Rejugar para 3⭐' : '✓ 3⭐ Dominado') : `+${sec.xp_on_complete || 10} XP`}
          </span>
        </div>
      </div>
    `;
  });

  html = macroHtml + heroHtml + gridHtml + `</div>`;
  document.getElementById('view').innerHTML = html;
  updateHeaderStats();
}

function openCurrentLesson() {
  if(!currentSecId) currentSecId = MOD.sections[0].id;
  openLessonBySec(currentSecId);
}

// =========================================================
// VISTA 2: ESPACIO DE TRABAJO DE LECCIÓN (SPLIT-SCREEN 50% / 50%)
// =========================================================
let currentSecId = null;
let currentLesIdx = 0;

function openLessonBySec(secId) {
  const sec = MOD.sections.find(s => s.id === secId) || MOD.sections[0];
  if(!isSectionUnlocked(currentModKey, sec.position)) {
    triggerMascotReaction('wrong');
    showToast(`🔒 Sección ${sec.position} bloqueada: Debes completar y dominar la Sección ${sec.position - 1} primero.`);
    return;
  }
  currentSecId = secId;
  let firstPending = sec.lessons.findIndex(l => !l.exercises.every(q => !!state.ans[l.id + '::' + q.id]));
  if(firstPending === -1) firstPending = 0;
  viewLeccion(sec, firstPending);
}

function viewLeccion(sec, lesIdx) {
  if(!sec) sec = MOD.sections[0];
  currentSecId = sec.id;
  currentLesIdx = lesIdx;

  const lessons = sec.lessons;
  const les = lessons[lesIdx] || lessons[0];
  const isLastLes = lesIdx === lessons.length - 1;
  const isSecDone = !!state.secDone[sec.id];
  const modPending = (state.pendingReviews && state.pendingReviews[currentModKey]) || {};
  const pendingInSec = (modPending[sec.id] || []).length;

  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.nav === 'leccion'));
  document.getElementById('crumb').innerHTML = `Biblioteca › ${escapeHtml(MOD.title)} › ${escapeHtml(sec.title)} › <b>Lección ${lesIdx+1} de ${lessons.length}</b>`;

  let theoryHtml = '';
  (les.examples || []).forEach(ex => {
    theoryHtml += `
      <div class="card-box">
        <span class="badge-tag">Concepto Clave</span>
        <h3 class="theory-title">${escapeHtml(les.title)}</h3>
        <p class="theory-desc">${escapeHtml(les.explanation)}</p>
      </div>

      <div class="code-editor-card">
        <div class="code-header">
          <div style="display:flex;align-items:center;gap:6px;">
            <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#EF4444;"></span>
            <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#F59E0B;"></span>
            <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#10B981;"></span>
            <span style="margin-left:6px;font-weight:600;">main.lua</span>
          </div>
          <span>Lua 5.4</span>
        </div>
        <pre class="code-pre"><code>${escapeHtml(ex.code)}</code></pre>
        ${ex.output ? `
        <div class="terminal-box">
          <div class="terminal-label">▶ Salida en Terminal:</div>
          <div class="terminal-output">${escapeHtml(ex.output)}</div>
        </div>
        ` : ''}
      </div>
    `;
  });

  let practiceHtml = '';
  les.exercises.forEach(q => {
    const key = les.id + '::' + q.id;
    const answered = state.ans[key];

    practiceHtml += `
    <div class="card-box practice-card">
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <span class="badge-tag" style="background:#EFF6FF;color:#2563EB;">Práctica Interactiva</span>
          <span style="font-size:12px;color:var(--muted);font-weight:700;">${answered ? (answered.correct ? '✅ Superado (+5 XP)' : '❌ Para repasar') : '+5 XP'}</span>
        </div>
        <h4 class="question-title">${escapeHtml(q.prompt)}</h4>
        ${q.prompt_code ? `<pre class="question-snippet"><code>${escapeHtml(q.prompt_code)}</code></pre>` : ''}

        <div class="options-stack">
    `;

    if(q.type === 'single_choice' || q.type === 'predict_output' || q.type === 'true_false') {
      q.answers.forEach((a, aIdx) => {
        const chosen = answered && answered.aid === a.id;
        // ANTI-SPOILERS: No muestra en verde la correcta si el usuario falló
        let cls = 'opt-btn';
        if(answered) {
          if(answered.correct && a.is_correct) cls = 'opt-btn correct';
          else if(!answered.correct && chosen) cls = 'opt-btn wrong';
        }
        const keyLetter = String.fromCharCode(65 + aIdx);

        practiceHtml += `
          <button class="${cls}" ${answered ? 'disabled' : ''} onclick="answerChoice('${les.id}', '${q.id}', '${a.id}')">
            <span class="opt-letter">${keyLetter}</span>
            <span>${escapeHtml(a.body)}</span>
          </button>
        `;
      });
    } else if(q.type === 'fill_blank') {
      practiceHtml += `
        <div style="display:flex;gap:10px;margin-top:12px;">
          <input type="text" id="in-${q.id}" placeholder="Escribe tu respuesta..." value="${answered ? (answered.given || '') : ''}" ${answered ? 'disabled' : ''} style="flex:1;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-family:var(--font-code);font-size:14px;" onkeydown="if(event.key==='Enter') answerFill('${les.id}', '${q.id}')">
          <button class="btn-step" ${answered ? 'disabled' : ''} onclick="answerFill('${les.id}', '${q.id}')" style="background:var(--primary);color:#fff;border:none;padding:0 20px;font-weight:700;">Comprobar</button>
        </div>
      `;
    }

    practiceHtml += `
        </div>

        <div class="feedback-box ${answered ? (answered.correct ? 'ok' : 'no') : ''}" style="display:${answered ? 'block' : 'none'}">
          ${answered ? (answered.correct ? '🎉 ¡Correcto! ' : '❌ Respuesta incorrecta. ') + escapeHtml(q.explanation) : ''}
          ${answered && !answered.correct ? `<div class="feedback-hint">${hintFor(q)}</div>` : ''}
        </div>
      </div>

      <div class="action-footer">
        ${isLastLes ? (
          pendingInSec > 0 ?
          `<button class="btn-primary-action btn-action-review" onclick="startSectionReview('${sec.id}')">
            Iniciar Ronda de Repaso (${pendingInSec} pendientes) 🔁
          </button>` :
          `<button class="btn-primary-action ${isSecDone ? 'btn-action-success' : ''}" onclick="${isSecDone ? `completeSection('${sec.id}')` : 'nextLes()'}">
            ${isSecDone ? '¡Completar Sección! (+10 XP) 🏆' : 'Siguiente Lección →'}
          </button>`
        ) : `
          <button class="btn-primary-action" onclick="nextLes()">
            Siguiente Lección →
          </button>
        `}
      </div>
    </div>
    `;
  });

  let html = `
  <div class="stepper-header-card">
    <div class="stepper-info">
      <h3>Sección ${sec.position}: ${escapeHtml(sec.title)}</h3>
      <p>Lección ${lesIdx+1} de ${lessons.length} · ${escapeHtml(les.title)}</p>
    </div>
    <div class="stepper-dots">
      ${lessons.map((l, i) => {
        const isDone = l.exercises.every(q => !!state.ans[l.id + '::' + q.id]);
        const isActive = i === lesIdx;
        const cls = isActive ? 'dot-pill active' : (isDone ? 'dot-pill done' : 'dot-pill');
        const txt = isDone ? '✓' : (i + 1);
        return `<button class="${cls}" title="${i+1}. ${escapeHtml(l.title)}" onclick="viewLeccionByIdx(${i})">${txt}</button>`;
      }).join('')}
    </div>
    <div class="stepper-nav-btns">
      <button class="btn-step" onclick="prevLes()" ${lesIdx === 0 ? 'disabled' : ''}>← Anterior</button>
      <button class="btn-step" onclick="nextLes()" ${lesIdx === lessons.length - 1 ? 'disabled' : ''}>Siguiente →</button>
    </div>
  </div>

  <div class="workspace-split-2col">
    <div class="left-theory-col">
      ${theoryHtml}
    </div>
    <div class="right-practice-col">
      ${practiceHtml}
    </div>
  </div>
  `;

  document.getElementById('view').innerHTML = html;
  updateHeaderStats();
}

function viewLeccionByIdx(i) {
  const sec = MOD.sections.find(s => s.id === currentSecId) || MOD.sections[0];
  viewLeccion(sec, i);
}

function prevLes() {
  if(currentLesIdx > 0) viewLeccionByIdx(currentLesIdx - 1);
}

function nextLes() {
  const sec = MOD.sections.find(s => s.id === currentSecId) || MOD.sections[0];
  if(currentLesIdx < sec.lessons.length - 1) {
    viewLeccionByIdx(currentLesIdx + 1);
  } else {
    const modPending = (state.pendingReviews && state.pendingReviews[currentModKey]) || {};
    const pendingInSec = (modPending[sec.id] || []).length;
    if(pendingInSec > 0) {
      startSectionReview(sec.id);
    } else {
      const sIdx = MOD.sections.findIndex(s => s.id === currentSecId);
      if(sIdx < MOD.sections.length - 1) {
        openLessonBySec(MOD.sections[sIdx + 1].id);
      } else {
        showToast('¡Has terminado todas las secciones del módulo! 🎉');
        viewRuta();
      }
    }
  }
}

// RESPUESTAS Y REACCIONES DE PIXIJS
function answerChoice(lesId, qId, aId) {
  const sec = MOD.sections.find(s => s.id === currentSecId);
  const les = sec?.lessons.find(l => l.id === lesId);
  const q = les?.exercises.find(x => x.id === qId);
  if(!q) return;

  const key = lesId + '::' + qId;
  if(state.ans[key]) return;

  const a = q.answers.find(x => x.id === aId);
  const isOk = !!(a && a.is_correct);

  state.ans[key] = { aid: aId, correct: isOk, time: Date.now() };

  if(isOk) {
    addXP(5);
    triggerMascotReaction('correct');
    showToast('¡Respuesta correcta! +5 XP 🎉');
  } else {
    triggerMascotReaction('wrong');
    state.secErrors = state.secErrors || {};
    state.secErrors[sec.id] = (state.secErrors[sec.id] || 0) + 1;

    state.pendingReviews = state.pendingReviews || {};
    state.pendingReviews[currentModKey] = state.pendingReviews[currentModKey] || {};
    state.pendingReviews[currentModKey][sec.id] = state.pendingReviews[currentModKey][sec.id] || [];

    if(!state.pendingReviews[currentModKey][sec.id].some(item => item.qId === qId)) {
      state.pendingReviews[currentModKey][sec.id].push({ lesId, qId });
    }

    state.mistakes = state.mistakes || {};
    state.mistakes[qId] = {
      qId, lesId, secId: sec.id, modKey: currentModKey,
      prompt: q.prompt, concept_id: les.concept_id,
      time: Date.now(), resolved: false
    };
    saveState();
    showToast('❌ Incorrecto. Enviado a la Ronda de Repaso.');
  }

  viewLeccion(sec, currentLesIdx);
}

function answerFill(lesId, qId) {
  const sec = MOD.sections.find(s => s.id === currentSecId);
  const les = sec?.lessons.find(l => l.id === lesId);
  const q = les?.exercises.find(x => x.id === qId);
  if(!q) return;

  const key = lesId + '::' + qId;
  if(state.ans[key]) return;

  const inEl = document.getElementById('in-' + qId);
  const val = inEl ? inEl.value.trim() : '';
  const correctOpt = q.answers.find(a => a.is_correct);
  const isOk = correctOpt && val.toLowerCase() === correctOpt.body.trim().toLowerCase();

  state.ans[key] = { aid: isOk ? correctOpt.id : 'wrong', given: val, correct: isOk, time: Date.now() };

  if(isOk) {
    addXP(5);
    triggerMascotReaction('correct');
    showToast('¡Respuesta correcta! +5 XP 🎉');
  } else {
    triggerMascotReaction('wrong');
    state.secErrors = state.secErrors || {};
    state.secErrors[sec.id] = (state.secErrors[sec.id] || 0) + 1;

    state.pendingReviews = state.pendingReviews || {};
    state.pendingReviews[currentModKey] = state.pendingReviews[currentModKey] || {};
    state.pendingReviews[currentModKey][sec.id] = state.pendingReviews[currentModKey][sec.id] || [];

    if(!state.pendingReviews[currentModKey][sec.id].some(item => item.qId === qId)) {
      state.pendingReviews[currentModKey][sec.id].push({ lesId, qId });
    }

    state.mistakes = state.mistakes || {};
    state.mistakes[qId] = {
      qId, lesId, secId: sec.id, modKey: currentModKey,
      prompt: q.prompt, concept_id: les.concept_id,
      time: Date.now(), resolved: false
    };
    saveState();
    showToast('❌ Incorrecto. Enviado a la Ronda de Repaso.');
  }

  viewLeccion(sec, currentLesIdx);
}

function completeSection(secId) {
  const sec = MOD.sections.find(s => s.id === secId);
  if(!sec) return;

  const modPending = (state.pendingReviews && state.pendingReviews[currentModKey]) || {};
  const pendingInSec = (modPending[sec.id] || []).length;
  if(pendingInSec > 0) {
    showToast(`⚠️ Repasa las ${pendingInSec} preguntas falladas para completar la sección`);
    startSectionReview(secId);
    return;
  }

  const errorsCount = (state.secErrors && state.secErrors[secId]) || 0;
  let earnedStars = 3;
  if(errorsCount === 1) earnedStars = 2;
  else if(errorsCount >= 2) earnedStars = 1;

  state.stars = state.stars || {};
  const prevStars = state.stars[secId] || 0;
  state.stars[secId] = Math.max(prevStars, earnedStars);

  if(!state.secDone[secId]) {
    state.secDone[secId] = true;
    state.streak = (state.streak || 0) + 1;
    addXP(sec.xp_on_complete || 10);
  }

  // Reiniciar contador de errores para futuras partidas de perfeccionamiento
  state.secErrors[secId] = 0;
  saveState();
  triggerMascotReaction('correct');

  // Mostrar modal de celebración con estrellas y avance de Koda
  showSectionCelebrationModal(sec, earnedStars, errorsCount, prevStars);
}

    feedbackTxt = '💪 ¡Superado con esfuerzo! Cometiste 2 o más fallos. Recuerda que puedes reintentar para mejorar tu calificación de estrellas.';
  }
