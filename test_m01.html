"Comentario al final","code":"print(\"Hola\") -- Esta nota explica el saludo","language":"lua","output":"Hola","explanation":"La orden se ejecuta normalmente y la nota al final se ignora.","position":1}],"exercises":[{"id":"292f4b29-9314-436a-9a27-e184904af1cd","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"predict_output","difficulty":"easy","category":"fundamentos","prompt":"¿Qué se mostrará en pantalla al ejecutar esta línea con comentario al final?","prompt_code":"print(42) -- Muestra el número cuarenta y dos","score":10,"concept_ids":["lua-fund-comentario-inline"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"2f9b0195-e103-41a0-b010-c4d0da8fb608","label":"A","body":"42 -- Muestra el número cuarenta y dos","is_correct":false,"position":1},{"id":"e3cf051e-2070-4a28-8f3b-b56096c41963","label":"B","body":"42","is_correct":true,"position":2},{"id":"a9d3d153-43c3-4726-a58f-3c882f66acb3","label":"C","body":"Muestra el número cuarenta y dos","is_correct":false,"position":3},{"id":"e142953a-2576-44cc-bec7-074adf3286af","label":"D","body":"Error por mezclar código con guiones","is_correct":false,"position":4}],"correct_answer_ids":["e3cf051e-2070-4a28-8f3b-b56096c41963"],"explanation":"¡Correcto! Lua ejecuta `print(42)` y descarta todo lo que viene después de los dos guiones `--`.","hints":[],"section_id":"77f1181d-c778-4de5-aaf4-27492c974acd","lesson_id":"abee50ad-e201-4274-ae8f-6eddf6aca473"}]},{"id":"cdc9b475-3ba2-4350-a1fe-784aefb0a120","title":"Comentarios de bloque con --[[ y ]]","slug":"comentarios-de-bloque-multilinea","position":5,"concept_id":"lua-fund-comentario-bloque","explanation":"¿Y si quieres escribir un párrafo largo de 5 líneas? ¡No tienes que poner `--` en cada una! Paso 1: Escribes `--[[` al principio del bloque. Paso 2: Escribes todas las líneas de texto que quieras. Paso 3: Cierras el bloque escribiendo `]]`. Todo lo que quede en el medio queda desactivado.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Bloque multilínea","code":"--[[\n  Línea 1 del comentario\n  Línea 2 del comentario\n]]\nprint(\"¡Fin del bloque!\")","language":"lua","output":"¡Fin del bloque!","explanation":"Todo lo que esté entre --[[ y ]] forma un bloque de comentario.","position":1}],"exercises":[{"id":"3508482d-b898-4356-bff0-539a5cf4dca5","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Qué pareja de símbolos se utiliza en Lua para abrir y cerrar un comentario de varias líneas en bloque?","prompt_code":null,"score":10,"concept_ids":["lua-fund-comentario-bloque"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"95738b87-1b3a-4836-a556-846e321f7510","label":"A","body":"/* para abrir y */ para cerrar","is_correct":false,"position":1},{"id":"55f84713-bcdd-490e-b93a-da0868525c30","label":"B","body":"--[[ para abrir y ]] para cerrar","is_correct":true,"position":2},{"id":"05b7b95c-00cd-4037-b314-d1f66c280dcd","label":"C","body":"<-- para abrir y --> para cerrar","is_correct":false,"position":3},{"id":"8a199d8d-37b3-420c-942d-31d25dd14322","label":"D","body":"(( para abrir y )) para cerrar","is_correct":false,"position":4}],"correct_answer_ids":["55f84713-bcdd-490e-b93a-da0868525c30"],"explanation":"¡Muy bien! En Lua abres un bloque con `--[[` y lo cierras con `]]`.","hints":[],"section_id":"77f1181d-c778-4de5-aaf4-27492c974acd","lesson_id":"cdc9b475-3ba2-4350-a1fe-784aefb0a120"}]},{"id":"b85dc4c9-d7e2-480f-b875-84346a61a27d","title":"Apagar una orden temporalmente sin borrarla","slug":"apagar-una-orden-temporalmente","position":6,"concept_id":"lua-fund-debug-apagar-linea","explanation":"Un truco profesional de todo programador es 'comentar código'. Paso 1: Tienes una orden que sospechas que falla o no quieres usar hoy. Paso 2: En vez de borrarla para siempre, le pones `--` al inicio del renglón. Paso 3: La orden se apaga. Si mañana la necesitas de vuelta, ¡solo borras los dos guiones!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Orden apagada","code":"-- print(\"Hoy no quiero mostrar este mensaje\")\nprint(\"Solo este mensaje está encendido\")","language":"lua","output":"Solo este mensaje está encendido","explanation":"Poner -- antes de una orden la apaga temporalmente sin perder el código escrito.","position":1}],"exercises":[{"id":"b66b46a1-cc78-49c2-ba65-37e3aa8a0b25","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"Si añades `--` al inicio de una línea con código válido, ¿esa línea dejará de ejecutarse temporalmente sin necesidad de borrarla?","prompt_code":null,"score":10,"concept_ids":["lua-fund-debug-apagar-linea"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"8ad1d8a7-5890-439b-b263-f780368bb919","label":"A","body":"Verdadero","is_correct":true,"position":1},{"id":"3907f207-fcaa-4d26-8152-09e699bf3d6a","label":"B","body":"Falso","is_correct":false,"position":2}],"correct_answer_ids":["8ad1d8a7-5890-439b-b263-f780368bb919"],"explanation":"¡Verdadero! 'Comentar' código es la técnica estándar para desactivar instrucciones de prueba sin perderlas.","hints":[],"section_id":"77f1181d-c778-4de5-aaf4-27492c974acd","lesson_id":"b85dc4c9-d7e2-480f-b875-84346a61a27d"}]},{"id":"7d613184-952d-48e3-84d1-5222a2291968","title":"Apagar un bloque sospechoso de código","slug":"apagar-un-bloque-sospechoso","position":7,"concept_id":"lua-fund-debug-apagar-bloque","explanation":"Lo mismo puedes hacer con varias líneas a la vez usando `--[[` y `]]`. Paso 1: Imagina que tienes 10 líneas complejas. Paso 2: Abres con `--[[` arriba y cierras con `]]` abajo. Paso 3: Las 10 líneas se duermen al instante. Si tu programa ahora funciona bien, ya sabes que el problema estaba en ese grupo dormido.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Dormir bloque","code":"--[[\n  print(\"Dormido 1\")\n  print(\"Dormido 2\")\n]]\nprint(\"Despierto\")","language":"lua","output":"Despierto","explanation":"Las dos primeras líneas están dormidas dentro del bloque.","position":1}],"exercises":[{"id":"652d6c08-7f3e-49e0-bfa8-d08908ff0d02","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"predict_output","difficulty":"easy","category":"fundamentos","prompt":"¿Qué mensaje se mostrará en la pantalla al ejecutar este código?","prompt_code":"--[[\n  print(\"Mensaje secreto\")\n]]\nprint(\"Mensaje público\")","score":10,"concept_ids":["lua-fund-debug-apagar-bloque"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"0eca48ba-9aef-4d89-8329-c9c842567a85","label":"A","body":"Mensaje secreto y luego Mensaje público","is_correct":false,"position":1},{"id":"ec44f7b7-d081-4fa4-96a7-daed2aca43aa","label":"B","body":"Solo Mensaje secreto","is_correct":false,"position":2},{"id":"f9a8a29c-f9d0-4e71-9909-12009af2c041","label":"C","body":"Mensaje público","is_correct":true,"position":3},{"id":"6206c378-69db-4c05-b94d-ef49113ddc46","label":"D","body":"Error en el bloque","is_correct":false,"position":4}],"correct_answer_ids":["f9a8a29c-f9d0-4e71-9909-12009af2c041"],"explanation":"¡Exacto! El 'Mensaje secreto' está dentro de `--[[ ... ]]`, por lo que solo se ejecuta 'Mensaje público'.","hints":[],"section_id":"77f1181d-c778-4de5-aaf4-27492c974acd","lesson_id":"7d613184-952d-48e3-84d1-5222a2291968"}]},{"id":"6e84ec1e-693d-406b-b927-dbf5797cc74a","title":"Buenas prácticas: comentar el por qué y no el qué","slug":"buenas-practicas-al-comentar","position":8,"concept_id":"lua-fund-comentario-estilo","explanation":"Hay una regla de oro entre los buenos programadores: comenta el POR QUÉ, no lo obvio. Paso 1: Escribir `-- imprime hola` arriba de `print(\"hola\")` es perder el tiempo, porque cualquiera ve que imprime hola. Paso 2: Es mucho mejor explicar: `-- avisamos al jugador que la partida comenzó`. Paso 3: Los mejores comentarios aportan contexto valioso.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Comentario útil","code":"-- Damos 3 vidas porque el nivel 1 es de entrenamiento\nlocal vidas = 3","language":"lua","output":"","explanation":"Explica la razón de negocio o diseño, no la sintaxis obvia.","position":1}],"exercises":[{"id":"d2722f2b-fbe2-4c00-a073-a81408a19fc8","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Cuál de los siguientes comentarios se considera de mejor calidad según las buenas prácticas de programación?","prompt_code":null,"score":10,"concept_ids":["lua-fund-comentario-estilo"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"4d2f8385-d745-4ad4-87bb-ad19647710a0","label":"A","body":"-- print muestra texto","is_correct":false,"position":1},{"id":"ea391b11-8ef9-4813-801d-f1fa93ef40c3","label":"B","body":"-- esta es una suma","is_correct":false,"position":2},{"id":"9a33744d-4b78-4255-8b57-0da7035f7f0c","label":"C","body":"-- Multiplicamos por 2 para otorgar el bono del evento de fin de semana","is_correct":true,"position":3},{"id":"84b59deb-18e3-43bc-91d9-d0ad3bdb5acd","label":"D","body":"-- aquí termina la línea","is_correct":false,"position":4}],"correct_answer_ids":["9a33744d-4b78-4255-8b57-0da7035f7f0c"],"explanation":"¡Excelente! Un buen comentario explica el motivo detrás de una decisión y aporta información que el código por sí solo no muestra.","hints":[],"section_id":"77f1181d-c778-4de5-aaf4-27492c974acd","lesson_id":"6e84ec1e-693d-406b-b927-dbf5797cc74a"}]},{"id":"b988de90-535c-40ef-b978-18a2d70c4e14","title":"Los comentarios no hacen tu programa más lento","slug":"los-comentarios-no-ralentizan","position":9,"concept_id":"lua-fund-comentario-rendimiento","explanation":"Algunos principiantes temen escribir comentarios creyendo que harán que el juego vaya más lento. ¡Es totalmente falso! Paso 1: Cuando Lua compila tu programa, borra todos los comentarios antes de ejecutarlo. Paso 2: La máquina ni siquiera los almacena en la memoria del juego. Paso 3: Puedes comentar tanto como necesites sin perder ni un microsegundo de velocidad.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Cero impacto","code":"-- Puedes escribir 100 líneas de comentarios explicativos\n-- sin que tu juego pierda ni un fotograma por segundo.\nprint(\"Velocidad máxima garantizada\")","language":"lua","output":"Velocidad máxima garantizada","explanation":"Los comentarios se desechan al compilar; no ocupan memoria en ejecución.","position":1}],"exercises":[{"id":"0ed9c363-63de-42b0-8144-24107951c27d","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"¿Escribir muchos comentarios en tu archivo de Lua hace que tu videojuego o programa funcione más lento?","prompt_code":null,"score":10,"concept_ids":["lua-fund-comentario-rendimiento"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"5d866650-7461-4623-927a-052d66799f0f","label":"A","body":"Verdadero","is_correct":false,"position":1},{"id":"1c4f3cc5-eb78-4935-b24d-16e7026e830b","label":"B","body":"Falso","is_correct":true,"position":2}],"correct_answer_ids":["1c4f3cc5-eb78-4935-b24d-16e7026e830b"],"explanation":"¡Falso! El compilador de Lua elimina los comentarios durante el análisis léxico; no afectan en absoluto la velocidad de ejecución.","hints":[],"section_id":"77f1181d-c778-4de5-aaf4-27492c974acd","lesson_id":"b988de90-535c-40ef-b978-18a2d70c4e14"}]},{"id":"137c8581-8bb0-47fa-bd63-33e1c78cfd45","title":"Mini-repaso de la Sección 4","slug":"mini-repaso-seccion-cuatro","position":10,"concept_id":"lua-fund-s04-repaso","explanation":"¡Has dominado los comentarios en Lua! Paso 1: Sabes que `--` sirve para una sola línea. Paso 2: Sabes que `--[[` y `]]` sirven para bloques de varias líneas. Paso 3: Sabes que sirven para explicar el por qué y para apagar código de prueba sin borrarlo. ¡Ahora aprenderemos a crear y ordenar archivos `.lua`!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Resumen S04","code":"-- Sección 4 superada con honores\nprint(\"¡Comentarios dominados!\")","language":"lua","output":"¡Comentarios dominados!","explanation":"Código claro y bien documentado.","position":1}],"exercises":[{"id":"ffe8e610-83f5-45c0-ad90-b90a02217a97","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"Para convertir un renglón entero en un comentario en Lua, ¿qué símbolos exactos escribes al inicio?","prompt_code":null,"score":10,"concept_ids":["lua-fund-s04-repaso"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"3b8bb173-2e11-42e1-bb01-12b1f4da480d","label":"A","body":"#","is_correct":false,"position":1},{"id":"7d4525c6-39ee-4ef5-9da7-3d82742145aa","label":"B","body":"--","is_correct":true,"position":2},{"id":"87443947-24dc-4f1a-b87e-2d96ae4829c4","label":"C","body":"//","is_correct":false,"position":3},{"id":"9b174c4e-045c-4373-8526-f27b74f73d08","label":"D","body":"/*","is_correct":false,"position":4}],"correct_answer_ids":["7d4525c6-39ee-4ef5-9da7-3d82742145aa"],"explanation":"¡Correcto! Dos guiones `--` al principio del renglón lo convierten en comentario.","hints":[],"section_id":"77f1181d-c778-4de5-aaf4-27492c974acd","lesson_id":"137c8581-8bb0-47fa-bd63-33e1c78cfd45"}]}]},{"id":"cc75971b-33cd-4850-acf8-ceb493267680","title":"Archivos .lua","slug":"archivos-lua","position":5,"type":"exercise","status":"published","content_version":2,"estimated_minutes":15,"xp_on_complete":10,"lessons":[{"id":"0f2a4414-7c9e-4d7e-8f59-247b3e4adf9b","title":"Por qué guardamos código en archivos","slug":"por-que-guardamos-en-archivos","position":1,"concept_id":"lua-fund-archivo-por-que","explanation":"La consola interactiva es genial para ensayar una suma, pero cuando la cierras, todo lo que escribiste se evapora. Paso 1: Los programas reales deben persistir en el disco duro. Paso 2: Al guardar tus instrucciones en un archivo, puedes ejecutarlas mañana, compartirlas con amigos o subirlas a internet. Paso 3: El archivo es tu obra guardada para siempre.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Archivo guardado","code":"-- Este código vive seguro en un archivo de tu disco\nprint(\"Guardado permanente\")","language":"lua","output":"Guardado permanente","explanation":"Un archivo conserva tu código para siempre.","position":1}],"exercises":[{"id":"5a1955c0-595b-4069-98c9-b7846b111a18","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Cuál es la ventaja de guardar tu código en un archivo en lugar de escribirlo en la consola interactiva?","prompt_code":null,"score":10,"concept_ids":["lua-fund-archivo-por-que"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"6d0f2dc5-d3fe-496c-a958-7195cd4497d5","label":"A","body":"Que el código queda guardado de forma permanente y puedes reutilizarlo cuando quieras","is_correct":true,"position":1},{"id":"f932be31-ca58-42cc-b9cc-2e6d8556c884","label":"B","body":"Que la computadora se vuelve más pequeña físicamente","is_correct":false,"position":2},{"id":"2922bb30-a303-4177-8349-56d5342fd2ed","label":"C","body":"Que no necesitas electricidad para encender el equipo","is_correct":false,"position":3},{"id":"27a3b401-b90b-4e5a-88df-bb2933acc12d","label":"D","body":"Ninguna, la consola guarda todo automáticamente para siempre","is_correct":false,"position":4}],"correct_answer_ids":["6d0f2dc5-d3fe-496c-a958-7195cd4497d5"],"explanation":"¡Correcto! Guardar en archivos permite almacenar, versionar y distribuir programas completos.","hints":[],"section_id":"cc75971b-33cd-4850-acf8-ceb493267680","lesson_id":"0f2a4414-7c9e-4d7e-8f59-247b3e4adf9b"}]},{"id":"7ad0b335-4e29-434b-aacf-7e80015cb8bd","title":"La extensión .lua: la etiqueta de tu código","slug":"la-extension-punto-lua","position":2,"concept_id":"lua-fund-archivo-extension","explanation":"Así como una canción termina en '.mp3' y una foto en '.png', tu código de Lua debe terminar en '.lua'. Paso 1: La extensión le avisa a tu sistema operativo qué tipo de archivo es. Paso 2: Le avisa a tu editor de código para que pinte las palabras reservadas de colores bonitos. Paso 3: Si guardas como '.txt', Lua no sabrá que es un script ejecutable.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Extensión correcta","code":"-- Archivo nombrado: juego.lua\nprint(\"Extensión .lua correcta\")","language":"lua","output":"Extensión .lua correcta","explanation":"La extensión .lua identifica a los scripts de Lua.","position":1}],"exercises":[{"id":"e01342de-52d4-47e8-8bfb-ab2dd9d3d05c","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Cuál es la extensión obligatoria que deben tener los archivos que contienen código de Lua?","prompt_code":null,"score":10,"concept_ids":["lua-fund-archivo-extension"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"66970120-4255-47eb-9704-3589b0982c94","label":"A","body":".doc","is_correct":false,"position":1},{"id":"6c470c25-1dab-4180-b1c6-367a976aa2f9","label":"B","body":".exe","is_correct":false,"position":2},{"id":"5c9fe268-f36b-4d39-88ac-fc3d54188dbc","label":"C","body":".mp3","is_correct":false,"position":3},{"id":"72649c75-f680-4cb1-9511-a4b381e519dc","label":"D","body":".lua","is_correct":true,"position":4}],"correct_answer_ids":["72649c75-f680-4cb1-9511-a4b381e519dc"],"explanation":"¡Exacto! Los archivos de código Lua llevan la extensión `.lua`.","hints":[],"section_id":"cc75971b-33cd-4850-acf8-ceb493267680","lesson_id":"7ad0b335-4e29-434b-aacf-7e80015cb8bd"}]},{"id":"ad7b1c45-8d38-41b8-b240-eb221a74d1b6","title":"Editores de código vs procesadores de texto","slug":"editores-vs-word","position":3,"concept_id":"lua-fund-editores-vs-word","explanation":"¡Nunca uses Microsoft Word para programar! Paso 1: Word cambia las comillas rectas \"\" por comillas curvas decoradas “” que rompen el código de Lua. Paso 2: Además Word añade formato invisible de letras y márgenes que confunden a la máquina. Paso 3: Los programadores usamos editores puros como Visual Studio Code o Notepad++ que guardan texto limpio.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Texto plano limpio","code":"-- Un editor de código guarda texto puro sin adornos invisibles\nprint(\"Texto limpio\")","language":"lua","output":"Texto limpio","explanation":"Los editores de código cuidan que las comillas y caracteres sean exactos.","position":1}],"exercises":[{"id":"c5c89ea2-ad73-4b60-9707-47275b1a7d8e","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Por qué NO debemos usar procesadores como Microsoft Word para escribir código de programación?","prompt_code":null,"score":10,"concept_ids":["lua-fund-editores-vs-word"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"9e26d020-c13b-4334-b6bd-d01ed4649e78","label":"A","body":"Porque alteran las comillas y añaden formatos ocultos que causan errores de sintaxis","is_correct":true,"position":1},{"id":"1cc24f2e-55e1-4c58-83ad-fdb5b9b5c00a","label":"B","body":"Porque Word solo funciona en blanco y negro","is_correct":false,"position":2},{"id":"22deb04e-a5b7-4ffc-a1e5-838138e148c7","label":"C","body":"Porque Word borra los números del teclado","is_correct":false,"position":3},{"id":"648f0c2e-4dc4-433a-8390-974befcd6b71","label":"D","body":"Porque Word es un programa exclusivo para dibujar mapas","is_correct":false,"position":4}],"correct_answer_ids":["9e26d020-c13b-4334-b6bd-d01ed4649e78"],"explanation":"¡Muy bien! Los editores de código especializados (como VS Code) preservan el texto plano exacto sin alterar comillas ni caracteres.","hints":[],"section_id":"cc75971b-33cd-4850-acf8-ceb493267680","lesson_id":"ad7b1c45-8d38-41b8-b240-eb221a74d1b6"}]},{"id":"1bf630b6-e55b-48f0-8f2b-5972d84172fa","title":"El archivo principal: por qué lo llamamos main.lua","slug":"el-archivo-principal-main-lua","position":4,"concept_id":"lua-fund-archivo-main","explanation":"En casi todos los proyectos de Lua verás un archivo llamado 'main.lua'. Paso 1: En inglés 'main' significa 'principal'. Paso 2: Es una convención universal para que cualquier programador sepa por dónde arranca el proyecto. Paso 3: Motores como LÖVE (love2d) exigen que tu archivo de inicio se llame obligatoriamente main.lua.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Punto de entrada","code":"-- main.lua es la puerta de entrada a tu juego\nprint(\"¡Bienvenido a mi juego en main.lua!\")","language":"lua","output":"¡Bienvenido a mi juego en main.lua!","explanation":"main.lua es el estándar de la industria para el script principal.","position":1}],"exercises":[{"id":"25a7302d-bd4d-491c-9832-44881720dab3","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Por qué es una buena costumbre llamar 'main.lua' al archivo inicial de un proyecto de Lua?","prompt_code":null,"score":10,"concept_ids":["lua-fund-archivo-main"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"9b347614-0c83-4cc1-907d-698b40387044","label":"A","body":"Porque significa 'principal' y es el estándar que todos reconocen como punto de partida","is_correct":true,"position":1},{"id":"0de1f11b-2dab-4615-af83-a0946b5747cd","label":"B","body":"Porque si no se llama así la computadora no enciende","is_correct":false,"position":2},{"id":"ace6ed7a-c1e4-4318-9fa9-f132f8bd8960","label":"C","body":"Porque es una palabra inventada por los fabricantes de pantallas","is_correct":false,"position":3},{"id":"51296987-e1a5-4367-86d7-9923ae3388b1","label":"D","body":"Es obligatorio por ley internacional","is_correct":false,"position":4}],"correct_answer_ids":["9b347614-0c83-4cc1-907d-698b40387044"],"explanation":"¡Correcto! `main.lua` es la convención canónica para identificar el punto de entrada principal de un programa.","hints":[],"section_id":"cc75971b-33cd-4850-acf8-ceb493267680","lesson_id":"1bf630b6-e55b-48f0-8f2b-5972d84172fa"}]},{"id":"b45b100d-f60c-4ac3-89c0-3e232e27cc2e","title":"Guardar cambios antes de ejecutar","slug":"guardar-cambios-ctrl-s","position":5,"concept_id":"lua-fund-archivo-guardar","explanation":"El tropiezo número 1 de todo aprendiz: modificas tu código en el editor, ejecutas en la terminal y... ¡sigue saliendo lo de antes! Paso 1: ¿Por qué pasa? ¡Porque olvidaste guardar el archivo! Paso 2: La terminal lee el archivo que está en el disco, no lo que tienes flotando en la pantalla del editor. Paso 3: Adopta el reflejo ninja de pulsar Ctrl + S tras cada cambio.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Hábito ninja","code":"-- Recuerda siempre pulsar Ctrl + S antes de ejecutar\nprint(\"¡Cambios guardados con éxito!\")","language":"lua","output":"¡Cambios guardados con éxito!","explanation":"Guardar cambios en disco es el paso indispensable antes de correr el script.","position":1}],"exercises":[{"id":"cfe7b32a-3ce0-474a-a7da-22a5b968d65b","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"Si editas tu archivo de código pero no guardas los cambios con Ctrl + S antes de ejecutarlo en la terminal, ¿Lua ejecutará la versión anterior no guardada?","prompt_code":null,"score":10,"concept_ids":["lua-fund-archivo-guardar"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"134ee303-45fe-4248-9a2d-2086e1465c66","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"498435de-549f-47c2-9257-8180be4f95bc","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["498435de-549f-47c2-9257-8180be4f95bc"],"explanation":"¡Verdadero! Lua lee directamente el archivo almacenado en disco; si no guardaste tus cambios, ejecutará la versión previa.","hints":[],"section_id":"cc75971b-33cd-4850-acf8-ceb493267680","lesson_id":"b45b100d-f60c-4ac3-89c0-3e232e27cc2e"}]},{"id":"35eaeb9f-6319-4c75-bd60-efb115d2ed49","title":"Dónde vive tu archivo (Carpetas y rutas)","slug":"donde-vive-tu-archivo","position":6,"concept_id":"lua-fund-carpetas-rutas","explanation":"Tu computadora tiene miles de carpetas. Es vital que sepas en cuál de ellas guardaste tu script. Paso 1: No guardes todo desparramado en el Escritorio o en Descargas. Paso 2: Crea una carpeta ordenada, por ejemplo: `C:\\mis_proyectos\\juego_lua\\`. Paso 3: Saber la carpeta te permitirá abrir la terminal exactamente en ese lugar para ejecutar tu código.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Carpeta ordenada","code":"-- Estructura recomendada:\n-- mis_proyectos/\n--   └── mi_juego/\n--         └── main.lua","language":"lua","output":"","explanation":"Tener una carpeta propia para tu proyecto evita perder archivos.","position":1}],"exercises":[{"id":"e9b3a06b-f105-475f-b571-dbbbb8a82acb","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Cuál es la forma más recomendada y ordenada de guardar tus archivos de programación?","prompt_code":null,"score":10,"concept_ids":["lua-fund-carpetas-rutas"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"b74c02d1-e094-4915-8b69-2d324bdff5cd","label":"A","body":"Crear una carpeta dedicada para tu proyecto y guardar allí tus archivos .lua organizados","is_correct":true,"position":1},{"id":"88192cf4-074d-4235-b591-8d527c689698","label":"B","body":"Dejar los archivos sueltos en la Papelera de reciclaje","is_correct":false,"position":2},{"id":"544ceab6-e9b6-4395-9f41-3bcc09022545","label":"C","body":"Guardar todo en la carpeta de descargas revuelto con fotos y videos","is_correct":false,"position":3},{"id":"12353aba-2b73-4fc4-b1e0-0027a3f56abb","label":"D","body":"Cambiar de carpeta cada 5 minutos","is_correct":false,"position":4}],"correct_answer_ids":["b74c02d1-e094-4915-8b69-2d324bdff5cd"],"explanation":"¡Exacto! Mantener cada proyecto en su propia carpeta estructurada es fundamental para trabajar con orden y profesionalismo.","hints":[],"section_id":"cc75971b-33cd-4850-acf8-ceb493267680","lesson_id":"35eaeb9f-6319-4c75-bd60-efb115d2ed49"}]},{"id":"eb0c29be-188c-4713-911d-d503b9ca72a0","title":"Múltiples archivos en un mismo proyecto","slug":"multiples-archivos-en-proyecto","position":7,"concept_id":"lua-fund-multiples-archivos","explanation":"Cuando tu programa crezca y tenga cientos de líneas, no tienes por qué meterlo todo en un solo archivo gigante. Paso 1: Puedes tener `main.lua` para el juego principal. Paso 2: Puedes tener `personajes.lua` para tus héroes y `sonidos.lua` para la música. Paso 3: Lua permite conectar múltiples archivos fácilmente para que tu código sea un placer de leer.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Varios archivos","code":"mi_juego/\n├── main.lua\n├── personajes.lua\n└── mapa.lua","language":"lua","output":"","explanation":"Separar responsabilidades por archivo es la marca de un programador ordenado.","position":1}],"exercises":[{"id":"fb613a58-4ad5-40f4-86f0-ca969841e897","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"¿Un proyecto de programación en Lua puede estar compuesto por varios archivos `.lua` diferentes dentro de la misma carpeta?","prompt_code":null,"score":10,"concept_ids":["lua-fund-multiples-archivos"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"cb3eb68b-84d0-47dd-8907-5c40d5a07c4b","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"623f13c2-c67f-4dfe-9e62-8e3e9236604e","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["623f13c2-c67f-4dfe-9e62-8e3e9236604e"],"explanation":"¡Verdadero! Los proyectos reales dividen su código en múltiples archivos modulares según su función.","hints":[],"section_id":"cc75971b-33cd-4850-acf8-ceb493267680","lesson_id":"eb0c29be-188c-4713-911d-d503b9ca72a0"}]},{"id":"7a363302-82dc-4fae-aa49-85d7bf34355f","title":"Nombres limpios para archivos","slug":"nombres-limpios-para-archivos","position":8,"concept_id":"lua-fund-nombres-archivos","explanation":"Cuidado con cómo bautizas tus archivos en el disco. Paso 1: Evita usar espacios en blanco (en vez de `mi juego.lua`, usa `mi_juego.lua`). Paso 2: Evita tildes, signos de interrogación o letras como la ñ (en vez de `año.lua`, usa `anio.lua`). Paso 3: Las terminales y servidores sufren con espacios y tildes; con nombres limpios jamás tendrás errores extraños.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Nombres recomendados","code":"-- Bien: main.lua, juego_01.lua, nivel_facil.lua\n-- Mal: mi juego nuevo!!.lua, año2026?.lua","language":"lua","output":"","explanation":"Usa minúsculas, números y guiones bajos para tus nombres de archivo.","position":1}],"exercises":[{"id":"3f30d8a3-1c51-485c-bc52-c65d49f9bb0a","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Cuál de los siguientes nombres de archivo sigue las mejores prácticas profesionales para programar en Lua?","prompt_code":null,"score":10,"concept_ids":["lua-fund-nombres-archivos"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"6718349f-2a82-4aed-9c97-c27ea4fbdcbf","label":"A","body":"mi primer juego de lua super genial!!.txt","is_correct":false,"position":1},{"id":"b67a38c2-5d51-464c-8db5-4928d8427787","label":"B","body":"año 2026/juego?.lua","is_correct":false,"position":2},{"id":"ab484df6-7ec9-49f1-8f5d-4efa7497ebb8","label":"C","body":"juego_aventura.lua","is_correct":true,"position":3},{"id":"410d5b9e-7f76-4a91-bcc3-be93a5b2aec3","label":"D","body":"main lua con espacios","is_correct":false,"position":4}],"correct_answer_ids":["ab484df6-7ec9-49f1-8f5d-4efa7497ebb8"],"explanation":"¡Excelente! `juego_aventura.lua` usa minúsculas, guión bajo en vez de espacios, no tiene caracteres especiales y termina en `.lua`.","hints":[],"section_id":"cc75971b-33cd-4850-acf8-ceb493267680","lesson_id":"7a363302-82dc-4fae-aa49-85d7bf34355f"}]},{"id":"174d3517-0494-4dec-9be7-8a69032c4592","title":"Consola interactiva vs archivo guardado","slug":"consola-vs-archivo-guardado","position":9,"concept_id":"lua-fund-repl-vs-archivo","explanation":"Ahora que conoces ambos mundos, recapitulemos cuándo usar cada uno. Paso 1: Usa la consola `lua -i` cuando quieras ensayar una suma rápida o ver cómo funciona una palabra nueva en 30 segundos. Paso 2: Usa un archivo `.lua` cuando estés construyendo tu juego, tu script o cualquier trabajo que quieras conservar mañana. Paso 3: Ambos se complementan a la perfección.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Dos herramientas hermanas","code":"-- REPL: Pruebas efímeras inmediatas\n-- Archivo .lua: Tu software permanente","language":"lua","output":"","explanation":"Usa el REPL para experimentar y el archivo para construir.","position":1}],"exercises":[{"id":"1075ba71-487b-443b-8493-308804c9ad63","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"Si quieres desarrollar un minijuego que puedas abrir la próxima semana y seguir mejorándolo, ¿dónde debes escribir tu código?","prompt_code":null,"score":10,"concept_ids":["lua-fund-repl-vs-archivo"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"a1bfa978-bfca-4b17-993e-371b072dc6a3","label":"A","body":"En un archivo permanente guardado con extensión `.lua`","is_correct":true,"position":1},{"id":"fff688d8-6ceb-4a6e-a7f8-747f40239a58","label":"B","body":"En la consola interactiva `lua -i`","is_correct":false,"position":2},{"id":"8064f7f7-d5d9-427d-b57a-532e56a07545","label":"C","body":"En la barra de búsqueda de Google","is_correct":false,"position":3},{"id":"863465bc-07ae-48a7-9c6f-31d7b115d764","label":"D","body":"En la calculadora de tu celular","is_correct":false,"position":4}],"correct_answer_ids":["a1bfa978-bfca-4b17-993e-371b072dc6a3"],"explanation":"¡Correcto! Los proyectos permanentes deben escribirse y guardarse en archivos `.lua`.","hints":[],"section_id":"cc75971b-33cd-4850-acf8-ceb493267680","lesson_id":"174d3517-0494-4dec-9be7-8a69032c4592"}]},{"id":"4cef7fd5-3a01-4a3d-9ab2-80b2c1021d27","title":"Mini-repaso de la Sección 5","slug":"mini-repaso-seccion-cinco","position":10,"concept_id":"lua-fund-s05-repaso","explanation":"¡La Sección 5 es tuya! Paso 1: Aprendiste que los archivos conservan tu código para siempre. Paso 2: Aprendiste que la extensión obligatoria es `.lua`. Paso 3: Aprendiste a nombrar tu archivo principal como `main.lua` y a usar nombres limpios sin espacios. ¡Ahora aprenderemos a ejecutar tu archivo desde la terminal!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Resumen S05","code":"-- main.lua listo para brillar\nprint(\"¡Archivos dominados!\")","language":"lua","output":"¡Archivos dominados!","explanation":"Tus archivos están perfectamente organizados.","position":1}],"exercises":[{"id":"c4afe62c-388a-4684-8b37-5c940e3f2ae0","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"Para crear un programa en Lua duradero, debemos escribirlo en un editor de código puro y guardarlo con extensión `.lua` (por ejemplo `main.lua`). ¿Es verdadero?","prompt_code":null,"score":10,"concept_ids":["lua-fund-s05-repaso"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"54197825-c732-435a-a2b5-4c73339ff03b","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"ef64decd-9fe9-4e0a-a4b2-b4e0f50b7759","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["ef64decd-9fe9-4e0a-a4b2-b4e0f50b7759"],"explanation":"¡Verdadero! Esa es la base técnica de todo flujo de trabajo en programación.","hints":[],"section_id":"cc75971b-33cd-4850-acf8-ceb493267680","lesson_id":"4cef7fd5-3a01-4a3d-9ab2-80b2c1021d27"}]}]},{"id":"f9369da6-1e58-4168-b023-c7b7cf116180","title":"Ejecutar código","slug":"ejecutar-codigo","position":6,"type":"exercise","status":"published","content_version":2,"estimated_minutes":15,"xp_on_complete":10,"lessons":[{"id":"d5812e2e-0ae3-49eb-97fa-86dcd2d6a5af","title":"Abrir la terminal en tu carpeta de trabajo","slug":"abrir-la-terminal-en-tu-carpeta","position":1,"concept_id":"lua-fund-terminal-abrir","explanation":"Para poner en marcha tu archivo, necesitas abrir la terminal en el lugar correcto. Paso 1: La terminal debe estar 'parada' en la misma carpeta donde guardaste tu archivo. Paso 2: En Windows puedes escribir 'cmd' en la barra de direcciones de la carpeta. Paso 3: En VS Code basta con abrir la terminal integrada con Ctrl + Ñ. ¡Así la computadora sabe exactamente dónde buscar tu archivo!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Ubicación de terminal","code":"C:\\mis_proyectos\\juego> _\n-- La terminal está ubicada en la carpeta del script","language":"lua","output":"","explanation":"Estar en la carpeta correcta permite ejecutar tu archivo por su nombre.","position":1}],"exercises":[{"id":"8f70e6ce-742a-477c-9de1-4f83bce3cccb","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"Antes de indicarle a la computadora que ejecute tu archivo `main.lua`, ¿qué condición debe cumplirse?","prompt_code":null,"score":10,"concept_ids":["lua-fund-terminal-abrir"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"0829b504-6294-4c13-8659-d93d5bab3b83","label":"A","body":"La terminal debe estar situada en la misma carpeta donde guardaste tu archivo","is_correct":true,"position":1},{"id":"e387d0a1-41d6-42d7-bed1-41054714edf5","label":"B","body":"Debes apagar el monitor durante 10 segundos","is_correct":false,"position":2},{"id":"2cac609b-c501-4064-9e94-4c55e1fb95e2","label":"C","body":"Debes desconectar el ratón","is_correct":false,"position":3},{"id":"9c7deaaf-fa35-4e6b-9d01-cb02b7fad65d","label":"D","body":"Debes cambiarle el idioma a tu teclado","is_correct":false,"position":4}],"correct_answer_ids":["0829b504-6294-4c13-8659-d93d5bab3b83"],"explanation":"¡Correcto! La terminal debe estar apuntando a la carpeta de tu proyecto para encontrar el archivo.","hints":[],"section_id":"f9369da6-1e58-4168-b023-c7b7cf116180","lesson_id":"d5812e2e-0ae3-49eb-97fa-86dcd2d6a5af"}]},{"id":"a19c03f6-2141-44fa-9798-d417353b691f","title":"El comando maestro: lua main.lua","slug":"el-comando-maestro-lua-main-lua","position":2,"concept_id":"lua-fund-comando-ejecutar","explanation":"Llegó el gran momento: poner a andar tu archivo. Paso 1: Escribes en la terminal el nombre del programa: 'lua'. Paso 2: Das un espacio y escribes el nombre de tu archivo: 'main.lua'. Paso 3: Pulsas Enter. Todo junto forma la orden mágica: `lua main.lua`. ¡Es como darle al botón de encendido!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Ejecución maestra","code":"$ lua main.lua\n¡Bienvenido a mi programa!","language":"lua","output":"¡Bienvenido a mi programa!","explanation":"El comando 'lua main.lua' ejecuta el script de principio a fin.","position":1}],"exercises":[{"id":"bdaf0741-a16f-41ba-94ea-b7bb873850f0","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Cuál es el comando estándar en la terminal para ejecutar tu archivo guardado llamado 'main.lua'?","prompt_code":null,"score":10,"concept_ids":["lua-fund-comando-ejecutar"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"7d1b494f-11ac-4e4e-9ee8-bacdcbd85d28","label":"A","body":"abrir archivo main.lua por favor","is_correct":false,"position":1},{"id":"cb1fd25e-3d9c-4e6d-88ec-a52f8475b6f8","label":"B","body":"run game now","is_correct":false,"position":2},{"id":"f30a3c13-3d5f-4a8f-bc63-8416b79984f9","label":"C","body":"lua main.lua","is_correct":true,"position":3},{"id":"11d0d8a8-34d9-4f2f-8124-56aed4bacb8a","label":"D","body":"play main.lua","is_correct":false,"position":4}],"correct_answer_ids":["f30a3c13-3d5f-4a8f-bc63-8416b79984f9"],"explanation":"¡Exacto! El comando `lua` seguido del nombre del archivo le ordena al intérprete ejecutar el código.","hints":[],"section_id":"f9369da6-1e58-4168-b023-c7b7cf116180","lesson_id":"a19c03f6-2141-44fa-9798-d417353b691f"}]},{"id":"cb563fd4-b4b9-4d58-ae9a-c8bdb2444922","title":"Qué ocurre por dentro al pulsar Enter","slug":"que-ocurre-por-dentro-al-pulsar-enter","position":3,"concept_id":"lua-fund-ejecucion-interna","explanation":"Cuando pulsas Enter tras escribir `lua main.lua`, ocurren 3 cosas mágicas en milisegundos. Paso 1: Lua abre tu archivo y lee todo el texto. Paso 2: Lo traduce a un formato binario interno ultra rápido llamado bytecode. Paso 3: La máquina virtual de Lua ejecuta cada instrucción y muestra los resultados en tu pantalla.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"En milisegundos","code":"-- 1. Lee texto -> 2. Convierte a bytecode -> 3. Ejecuta\nprint(\"¡Ejecutado a la velocidad de la luz!\")","language":"lua","output":"¡Ejecutado a la velocidad de la luz!","explanation":"Todo el proceso toma menos de 5 milésimas de segundo en completarse.","position":1}],"exercises":[{"id":"774553b3-4de0-4837-bd07-364c29537c07","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"Al ejecutar `lua main.lua`, ¿el motor de Lua lee tu archivo, lo traduce a código interno y lo ejecuta casi instantáneamente?","prompt_code":null,"score":10,"concept_ids":["lua-fund-ejecucion-interna"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"aa0ac34e-e462-4d1e-bd58-b64bc45e26e4","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"20f8745c-7f91-42fe-a257-4a5648c3ceb1","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["20f8745c-7f91-42fe-a257-4a5648c3ceb1"],"explanation":"¡Verdadero! Lua es uno de los intérpretes más rápidos del mundo informático.","hints":[],"section_id":"f9369da6-1e58-4168-b023-c7b7cf116180","lesson_id":"cb563fd4-b4b9-4d58-ae9a-c8bdb2444922"}]},{"id":"9f3ce2f9-3c22-44e9-95e5-8f5808afc91f","title":"Ver el resultado de tu programa en la terminal","slug":"ver-el-resultado-en-terminal","position":4,"concept_id":"lua-fund-leer-terminal","explanation":"Una vez que termina la ejecución, verás las respuestas. Paso 1: Todo lo que ordenaste con `print` aparecerá debajo del comando. Paso 2: El programa termina cuando procesa la última línea del archivo. Paso 3: Cuando ves reaparecer el cursor de la terminal, significa que el programa cumplió su misión y se cerró limpiamente.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Salida y cierre","code":"print(\"Línea 1\")\nprint(\"Línea 2\")\n-- Aquí termina el archivo y regresa el control a la terminal","language":"lua","output":"Línea 1\nLínea 2","explanation":"Al terminar el script, la terminal vuelve a quedar disponible para nuevos comandos.","position":1}],"exercises":[{"id":"928f8c44-590a-42ed-ba4e-8549dbfe1393","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"predict_output","difficulty":"easy","category":"fundamentos","prompt":"Si tu archivo `main.lua` contiene estas dos líneas, ¿qué verás en la terminal al ejecutar `lua main.lua`?","prompt_code":"print(\"Cargando juego...\")\nprint(\"¡Listo!\")","score":10,"concept_ids":["lua-fund-leer-terminal"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"b2c7b003-51e0-4226-a9bd-65b5e15ac4fb","label":"A","body":"Cargando juego... y abajo ¡Listo!","is_correct":true,"position":1},{"id":"37f4e707-6469-42bc-b821-bada9b924f2a","label":"B","body":"Solo la palabra Cargando","is_correct":false,"position":2},{"id":"033c064e-3447-45be-a7f6-68797d02683a","label":"C","body":"Nada, la terminal se cierra","is_correct":false,"position":3},{"id":"35610a9a-6545-40b4-bd0a-b513e5210e5d","label":"D","body":"Error por usar signos de exclamación","is_correct":false,"position":4}],"correct_answer_ids":["b2c7b003-51e0-4226-a9bd-65b5e15ac4fb"],"explanation":"¡Correcto! Cada print dibuja su mensaje en su propio renglón secuencialmente.","hints":[],"section_id":"f9369da6-1e58-4168-b023-c7b7cf116180","lesson_id":"9f3ce2f9-3c22-44e9-95e5-8f5808afc91f"}]},{"id":"7baa23ab-c49d-401d-9db5-bc4dada1ccee","title":"Ejecutar archivos con otros nombres","slug":"ejecutar-archivos-con-otros-nombres","position":5,"concept_id":"lua-fund-ejecutar-otros","explanation":"No todos tus archivos tienen que llamarse `main.lua`. Paso 1: Si tienes un archivo llamado `personajes.lua`, ¿cómo lo ejecutas? Paso 2: Simplemente escribes `lua personajes.lua`. Paso 3: Escribes la palabra 'lua' seguida del nombre del archivo que quieras probar hoy. ¡Es así de sencillo!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Otro archivo","code":"$ lua personajes.lua\nPersonaje: Guerrero (Nivel 1)","language":"lua","output":"Personaje: Guerrero (Nivel 1)","explanation":"Puedes ejecutar cualquier archivo .lua pasándole su nombre al comando lua.","position":1}],"exercises":[{"id":"b640b531-4087-4dac-bd89-98fb53fe5045","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"Si tienes un archivo guardado con el nombre `niveles.lua`, ¿qué comando escribes en la terminal para ejecutarlo?","prompt_code":null,"score":10,"concept_ids":["lua-fund-ejecutar-otros"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"09931ac7-0b19-4302-86e2-364b9bc908c2","label":"A","body":"abrir niveles","is_correct":false,"position":1},{"id":"593063c7-bf71-4abf-b6ea-74550b086736","label":"B","body":"ejecutar juego","is_correct":false,"position":2},{"id":"ea3ab898-225a-4d2c-ac42-8e76b7e5c6c1","label":"C","body":"play niveles.mp4","is_correct":false,"position":3},{"id":"98c0d2e6-ecdc-49f5-a5f3-cf0d34a82a42","label":"D","body":"lua niveles.lua","is_correct":true,"position":4}],"correct_answer_ids":["98c0d2e6-ecdc-49f5-a5f3-cf0d34a82a42"],"explanation":"¡Exacto! El patrón es siempre `lua` seguido del nombre exacto de tu archivo.","hints":[],"section_id":"f9369da6-1e58-4168-b023-c7b7cf116180","lesson_id":"7baa23ab-c49d-401d-9db5-bc4dada1ccee"}]},{"id":"cfd4405e-c026-4dec-aa54-a2560a04ad83","title":"Qué es un bloque con apertura y cierre","slug":"bloques-apertura-y-cierre","position":6,"concept_id":"lua-fund-bloque-apertura","explanation":"En programación, un bloque es un grupo de instrucciones que pertenecen juntas a una condición o función. Paso 1: Imagina una habitación: tiene una puerta para entrar y una puerta para salir. Paso 2: En Lua, estructuras como condiciones ('if') abren un bloque. Paso 3: Todo lo que entra en un bloque necesita saber con precisión dónde termina.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Apertura de bloque","code":"if true then\n  print(\"Dentro del bloque\")\nend","language":"lua","output":"Dentro del bloque","explanation":"'if ... then' abre el bloque y 'end' lo cierra.","position":1}],"exercises":[{"id":"087f3e0a-4210-4965-90a4-4cb3bfd40aaf","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"En Lua, cuando abres una estructura de control como una condición `if`, ¿qué representa el contenido que está adentro?","prompt_code":null,"score":10,"concept_ids":["lua-fund-bloque-apertura"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"8c06393a-d579-4189-83a3-07a7b4dac171","label":"A","body":"Un bloque de instrucciones que pertenecen a esa condición","is_correct":true,"position":1},{"id":"1a226743-f720-4ab0-afb2-766db3ae1203","label":"B","body":"Un virus informático","is_correct":false,"position":2},{"id":"2c6b812b-08ca-420e-b569-c6ee29f89b7c","label":"C","body":"Una foto en blanco y negro","is_correct":false,"position":3},{"id":"41660dfb-b1d6-41a0-8502-b57b4ae85087","label":"D","body":"Un correo no deseado","is_correct":false,"position":4}],"correct_answer_ids":["8c06393a-d579-4189-83a3-07a7b4dac171"],"explanation":"¡Muy bien! Las estructuras de control delimitan bloques de código que se ejecutan bajo ciertas condiciones.","hints":[],"section_id":"f9369da6-1e58-4168-b023-c7b7cf116180","lesson_id":"cfd4405e-c026-4dec-aa54-a2560a04ad83"}]},{"id":"f9e54112-80ea-4267-9c80-042635e5979b","title":"La palabra obligatoria end","slug":"la-palabra-obligatoria-end","position":7,"concept_id":"lua-fund-palabra-end","explanation":"Aquí está una de las reglas de oro más importantes de Lua: la palabra `end`. Paso 1: En inglés 'end' significa 'fin'. Paso 2: Cada vez que abres un bloque con `if`, `for`, `while` o `function`, debes cerrarlo al final con la palabra `end`. Paso 3: Es como poner el punto final a una oración o cerrar la puerta con llave al salir.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Cierre con end","code":"if true then\n  print(\"Todo en orden\")\nend -- end cierra el bloque if","language":"lua","output":"Todo en orden","explanation":"La palabra end le dice a Lua dónde termina la condición.","position":1}],"exercises":[{"id":"0a2d364b-286d-4e4a-9323-c04cba330f7e","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"En Lua, ¿es obligatorio escribir la palabra `end` para cerrar bloques como condiciones `if` o funciones?","prompt_code":null,"score":10,"concept_ids":["lua-fund-palabra-end"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"63f06498-5024-4f02-a408-00c87898946a","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"7d884ae0-38f6-4881-ac29-ee67335557d0","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["7d884ae0-38f6-4881-ac29-ee67335557d0"],"explanation":"¡Verdadero! `end` es la palabra reservada que delimita el final de los bloques en Lua.","hints":[],"section_id":"f9369da6-1e58-4168-b023-c7b7cf116180","lesson_id":"f9e54112-80ea-4267-9c80-042635e5979b"}]},{"id":"1cdaaa5b-025e-48fb-95a1-f9b26569963c","title":"El error más famoso: 'end' expected","slug":"el-error-end-expected","position":8,"concept_id":"lua-fund-error-end-expected","explanation":"¿Qué pasa si olvidas escribir `end`? ¡Lua te dará el error más común de todo novato! Paso 1: Verás un mensaje en rojo que dice: `syntax error: 'end' expected near <eof>`. Paso 2: `<eof>` significa 'End Of File' (Fin del archivo). Paso 3: Lua te está diciendo con cariño: 'Llegué al final del archivo buscando el `end` para cerrar tu bloque y nunca lo encontré'. ¡Solo agrega el `end` y listo!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Falta end","code":"-- if true then print(\"hola\")\n-- Olvidar end produce: 'end' expected near <eof>","language":"lua","output":"error: 'end' expected","explanation":"Sin end, Lua no sabe dónde termina el bloque y avisa con este error.","position":1}],"exercises":[{"id":"1cc08f4f-6cf8-4e85-9c91-55438701d490","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"find_error","difficulty":"easy","category":"fundamentos","prompt":"Observa este código. ¿Cuál es el motivo exacto por el que Lua marcará error?","prompt_code":"if true then\n  print(\"Hola\")","score":10,"concept_ids":["lua-fund-error-end-expected"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"caeb0216-3279-49b0-b1fc-0e2dfbf5c094","label":"A","body":"Falta poner una coma al final","is_correct":false,"position":1},{"id":"f17537ea-726c-420d-906e-7fe12e26be98","label":"B","body":"Falta la palabra 'end' para cerrar el bloque de la condición","is_correct":true,"position":2},{"id":"af5fbab7-ce50-46e5-97dd-e70248a4289d","label":"C","body":"La palabra print está mal escrita","is_correct":false,"position":3},{"id":"cd4a508e-101b-4b0a-ae50-fd5621519e96","label":"D","body":"No hay ningún error","is_correct":false,"position":4}],"correct_answer_ids":["f17537ea-726c-420d-906e-7fe12e26be98"],"explanation":"¡Excelente ojo de detective! Faltaba cerrar la condición con la palabra `end`.","hints":[],"section_id":"f9369da6-1e58-4168-b023-c7b7cf116180","lesson_id":"1cdaaa5b-025e-48fb-95a1-f9b26569963c"}]},{"id":"d6883006-2958-45c6-bbae-d1a54439ca98","title":"El ciclo de trabajo del programador","slug":"el-ciclo-de-trabajo-profesional","position":9,"concept_id":"lua-fund-ciclo-desarrollo","explanation":"Así trabajan los mejores ingenieros de Google, Roblox y la NASA todos los días. Paso 1: Escribes o modificas código en tu editor. Paso 2: Guardas los cambios con `Ctrl + S`. Paso 3: Pasas a la terminal y ejecutas con `lua main.lua`. Paso 4: Miras el resultado y repites. Este ritmo se convertirá en una segunda naturaleza para ti.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Ciclo infinito","code":"-- 1. Escribir -> 2. Guardar (Ctrl+S) -> 3. Ejecutar (lua main.lua) -> 4. Verificar","language":"lua","output":"","explanation":"El ciclo continuo de desarrollo y prueba en programación.","position":1}],"exercises":[{"id":"f3f1dd82-5de6-43ae-88e2-ece7eedd64f1","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Cuál es el orden correcto de pasos en el ciclo de trabajo diario de un programador?","prompt_code":null,"score":10,"concept_ids":["lua-fund-ciclo-desarrollo"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"79a926b9-4e6e-4607-9d69-3e80674ef001","label":"A","body":"Escribir código → Guardar cambios (Ctrl+S) → Ejecutar en la terminal → Verificar el resultado","is_correct":true,"position":1},{"id":"935b2e5c-41d3-44b3-a08a-fc65ef5351af","label":"B","body":"Ejecutar → Apagar la máquina → Escribir → Borrar todo","is_correct":false,"position":2},{"id":"00649459-bc6b-4ba7-87c1-49632c4ac5e6","label":"C","body":"Guardar → No escribir nada → Reiniciar la computadora","is_correct":false,"position":3},{"id":"a23ace24-f697-4338-899d-f21a39341367","label":"D","body":"Esperar a que el código se escriba solo por telepatía","is_correct":false,"position":4}],"correct_answer_ids":["79a926b9-4e6e-4607-9d69-3e80674ef001"],"explanation":"¡Así es! Escribir, guardar, ejecutar y verificar es el bucle virtuoso del desarrollo de software.","hints":[],"section_id":"f9369da6-1e58-4168-b023-c7b7cf116180","lesson_id":"d6883006-2958-45c6-bbae-d1a54439ca98"}]},{"id":"f25095c2-400b-4b8e-9d81-1c37f77a6a96","title":"Mini-repaso de la Sección 6","slug":"mini-repaso-seccion-seis","position":10,"concept_id":"lua-fund-s06-repaso","explanation":"¡Sección 6 completada con éxito rotundo! Paso 1: Sabes ejecutar cualquier archivo con `lua nombre.lua`. Paso 2: Sabes qué pasa internamente en milisegundos. Paso 3: Conoces la regla sagrada del `end` y cómo solucionar `'end' expected`. ¡Ahora aprenderemos las reglas para inventar nombres de variables y escribir ordenado!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Resumen S06","code":"print(\"¡Ejecución dominada al 100%!\")","language":"lua","output":"¡Ejecución dominada al 100%!","explanation":"Ya sabes cómo darle play a tus programas en la consola.","position":1}],"exercises":[{"id":"c56983c3-f1d3-4c1b-8de1-97524230e609","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"En la terminal, ejecutamos nuestros scripts con `lua nombre.lua` y debemos recordar siempre cerrar bloques con `end`. ¿Es verdadero?","prompt_code":null,"score":10,"concept_ids":["lua-fund-s06-repaso"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"18bac5cd-b2b7-44ef-8798-de99beac6cab","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"a9028e44-d1de-4368-ba15-3ab77bd3dddf","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["a9028e44-d1de-4368-ba15-3ab77bd3dddf"],"explanation":"¡Verdadero! Has dominado la ejecución en terminal y la estructura de bloques.","hints":[],"section_id":"f9369da6-1e58-4168-b023-c7b7cf116180","lesson_id":"f25095c2-400b-4b8e-9d81-1c37f77a6a96"}]}]},{"id":"bb82c06d-c86c-4177-807f-fc07386dc5a2","title":"Palabras que Lua ya usa y cómo escribir ordenado","slug":"palabras-reservadas-y-estilo","position":7,"type":"theory","status":"published","content_version":2,"estimated_minutes":15,"xp_on_complete":10,"lessons":[{"id":"ef5f8816-ac13-42e6-b6dc-ac5783178782","title":"¿Qué son las palabras reservadas?","slug":"que-son-las-palabras-reservadas","position":1,"concept_id":"lua-fund-reservadas-concepto","explanation":"En Lua existen 21 palabras muy especiales llamadas 'palabras reservadas'. Paso 1: Son palabras que el lenguaje se guarda para sí mismo para dar sus órdenes internas (como `if`, `while`, `end`). Paso 2: No puedes usar ninguna de estas 21 palabras como nombres de tus propias cosas o variables. Paso 3: Son los botones sagrados del tablero de control de Lua.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Las 21 palabras","code":"-- Ejemplos de palabras reservadas:\n-- if, else, end, local, function, while, return","language":"lua","output":"","explanation":"Estas palabras ya tienen un trabajo oficial dentro del motor de Lua.","position":1}],"exercises":[{"id":"682f5750-b39b-4f69-8c11-b3e004585b7f","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Qué es una 'palabra reservada' en Lua?","prompt_code":null,"score":10,"concept_ids":["lua-fund-reservadas-concepto"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"066b3018-f504-43ed-bbac-b4a6eb159261","label":"A","body":"Una palabra con significado propio para el lenguaje que tú no puedes usar como nombre de variable","is_correct":true,"position":1},{"id":"d8500530-64ed-45e0-bf66-b6b17327e398","label":"B","body":"Una palabra que solo puedes usar si pagas una suscripción","is_correct":false,"position":2},{"id":"8827ee72-5d1e-4320-b829-23252265b53e","label":"C","body":"Una contraseña secreta para encender la computadora","is_correct":false,"position":3},{"id":"58149934-78e5-4b3f-8142-9394350b7173","label":"D","body":"Una palabra que está escrita en un diccionario de papel","is_correct":false,"position":4}],"correct_answer_ids":["066b3018-f504-43ed-bbac-b4a6eb159261"],"explanation":"¡Correcto! Las palabras reservadas son identificadores con significado sintáctico predefinido que el usuario no puede redefinir como nombres propios.","hints":[],"section_id":"bb82c06d-c86c-4177-807f-fc07386dc5a2","lesson_id":"ef5f8816-ac13-42e6-b6dc-ac5783178782"}]},{"id":"b3ead999-c643-43ca-9cfd-be0b1a26eafa","title":"Palabras prohibidas para nombres: local, if, while, function","slug":"palabras-prohibidas-para-nombres","position":2,"concept_id":"lua-fund-palabras-prohibidas","explanation":"Veamos ejemplos concretos de palabras que NO puedes usar para nombrar tus datos. Paso 1: `local`, `if`, `then`, `else`, `end`. Paso 2: `while`, `repeat`, `until`, `for`, `function`. Paso 3: `and`, `or`, `not`, `nil`, `true`, `false`. Si intentas nombrar una variable con cualquiera de ellas, ¡la máquina no entenderá nada!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Palabras del sistema","code":"-- local if = 10  => ¡ERROR! 'if' es palabra reservada\nlocal puntos = 10 -- ¡Correcto! 'puntos' es un nombre libre","language":"lua","output":"","explanation":"Nombres propios como 'puntos' son libres; palabras como 'if' están prohibidas.","position":1}],"exercises":[{"id":"3f9a15bf-409b-461b-8404-e496ce7bbf21","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Cuál de los siguientes nombres NO puedes utilizar para bautizar una variable porque es una palabra reservada de Lua?","prompt_code":null,"score":10,"concept_ids":["lua-fund-palabras-prohibidas"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"740eb4d4-3771-4e5c-b718-35f722af537c","label":"A","body":"mi_puntuacion","is_correct":false,"position":1},{"id":"2a15bdf7-c808-42a9-b51e-36563479569e","label":"B","body":"vidas_jugador","is_correct":false,"position":2},{"id":"16d58424-39c9-44b9-8698-b3651602ef43","label":"C","body":"local","is_correct":true,"position":3},{"id":"1bc9f7e8-9ddb-4e3b-bccc-168ff7d3ff4f","label":"D","body":"total_monedas","is_correct":false,"position":4}],"correct_answer_ids":["16d58424-39c9-44b9-8698-b3651602ef43"],"explanation":"¡Exacto! `local` es una palabra reservada fundamental de Lua y no puede ser utilizada como nombre propio.","hints":[],"section_id":"bb82c06d-c86c-4177-807f-fc07386dc5a2","lesson_id":"b3ead999-c643-43ca-9cfd-be0b1a26eafa"}]},{"id":"97c39afd-567f-4e91-83db-02de22e22af1","title":"Qué ocurre si usas una palabra reservada","slug":"que-ocurre-si-usas-palabra-reservada","position":3,"concept_id":"lua-fund-error-reservada","explanation":"Si por accidente intentas llamar a una variable con una palabra reservada, ¿qué pasa? Paso 1: Lua se detendrá al instante. Paso 2: Te mostrará un mensaje de error como: `syntax error: unexpected symbol near 'local'`. Paso 3: 'Unexpected symbol' significa que la máquina esperaba un nombre inventado por ti y se encontró con una orden propia que no encaja.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Error inmediato","code":"-- local while = 5\n-- Produce: syntax error: unexpected symbol near 'while'","language":"lua","output":"error: unexpected symbol","explanation":"Lua rechaza de inmediato el uso de palabras clave como nombres.","position":1}],"exercises":[{"id":"879c7996-6677-447a-8bf0-728656e26adc","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"Si intentas declarar una variable con el nombre de una palabra reservada (como `local if = 5`), ¿Lua marcará un error de sintaxis de inmediato?","prompt_code":null,"score":10,"concept_ids":["lua-fund-error-reservada"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"155e510c-978d-4fed-861f-7b1c532084ce","label":"A","body":"Falso","is_correct":false,"position":1},{"id":"8d165df5-886b-4ee1-9b22-e4555828c044","label":"B","body":"Verdadero","is_correct":true,"position":2}],"correct_answer_ids":["8d165df5-886b-4ee1-9b22-e4555828c044"],"explanation":"¡Verdadero! Las palabras reservadas no son aceptadas como nombres de identificadores.","hints":[],"section_id":"bb82c06d-c86c-4177-807f-fc07386dc5a2","lesson_id":"97c39afd-567f-4e91-83db-02de22e22af1"}]},{"id":"020d59de-44f8-4066-af57-b6b020993f23","title":"Reglas para inventar nombres válidos","slug":"reglas-para-inventar-nombres-validos","position":4,"concept_id":"lua-fund-nombres-reglas","explanation":"Entonces, ¿cómo sí puedes inventar nombres? ¡Las reglas son facilísimas! Paso 1: Puedes usar cualquier letra del abecedario en minúscula o mayúscula (de la A a la Z). Paso 2: Puedes usar números (del 0 al 9). Paso 3: Puedes usar el guión bajo `_`. Nombres como `puntos_vida`, `jugador2` o `nivel_maximo` son 100% válidos y hermosos.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Nombres válidos","code":"local nombre_jugador = \"Ana\"\nlocal vidas_2 = 3\nprint(nombre_jugador, vidas_2)","language":"lua","output":"Ana\t3","explanation":"Letras, números y guiones bajos son bienvenidos.","position":1}],"exercises":[{"id":"58592f58-0654-400f-ad03-3c0ad0a4295d","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Qué caracteres están permitidos para inventar nombres de variables en Lua?","prompt_code":null,"score":10,"concept_ids":["lua-fund-nombres-reglas"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"d7e50b61-77d8-48c9-b73f-6e318207d7e2","label":"A","body":"Solo números sin ninguna letra","is_correct":false,"position":1},{"id":"cc11bb56-3ce6-4e62-a75d-64bfddd1a15d","label":"B","body":"Espacios en blanco y signos de interrogación","is_correct":false,"position":2},{"id":"29a1007e-e103-4159-a6a6-675c65f728ab","label":"C","body":"Puntos, comas y barras diagonales","is_correct":false,"position":3},{"id":"c82c764a-07d9-48ab-818a-d88e7e411002","label":"D","body":"Letras, números y el guión bajo `_`","is_correct":true,"position":4}],"correct_answer_ids":["c82c764a-07d9-48ab-818a-d88e7e411002"],"explanation":"¡Correcto! Los identificadores válidos en Lua se componen de letras, dígitos y guiones bajos.","hints":[],"section_id":"bb82c06d-c86c-4177-807f-fc07386dc5a2","lesson_id":"020d59de-44f8-4066-af57-b6b020993f23"}]},{"id":"1d6d2f19-214b-4864-8ecd-b684a364bf7c","title":"La regla prohibida: nunca empezar un nombre con número","slug":"nunca-empezar-con-numero","position":5,"concept_id":"lua-fund-nombres-no-numero","explanation":"Hay una sola restricción estricta con los números en los nombres: Paso 1: Un nombre puede tener números en el medio (ej: `puntos1_extra`). Paso 2: Puede tener números al final (ej: `jugador2`). Paso 3: ¡Pero NUNCA puede empezar con un número al principio! `1jugador` causará un error porque Lua cree que estás escribiendo una cifra matemática.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Posición del número","code":"-- local 1jugador = \"Ana\"  => ¡ERROR! Empieza con número\nlocal jugador1 = \"Ana\"   -- ¡Correcto! El número va al final","language":"lua","output":"","explanation":"Los números nunca pueden ser el primer carácter de un nombre.","position":1}],"exercises":[{"id":"b18bb7a8-c1d8-4382-8b30-830af9980c5c","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Cuál de los siguientes nombres de variable es INVÁLIDO porque viola la regla de no empezar con un número?","prompt_code":null,"score":10,"concept_ids":["lua-fund-nombres-no-numero"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"e9429f22-f30b-45d4-859a-59edd9ba84bc","label":"A","body":"jugador_1","is_correct":false,"position":1},{"id":"10af47c8-9ccd-4bbd-8ffa-c3166260c1cc","label":"B","body":"puntos2","is_correct":false,"position":2},{"id":"f315afe0-1b28-45e1-9acb-0b197890850b","label":"C","body":"1jugador","is_correct":true,"position":3},{"id":"af3ed5dc-181f-4c26-99ad-d0fdfd2c6292","label":"D","body":"nivel_10","is_correct":false,"position":4}],"correct_answer_ids":["f315afe0-1b28-45e1-9acb-0b197890850b"],"explanation":"¡Exacto! `1jugador` empieza con un dígito numérico, lo cual es ilegal en la sintaxis de Lua.","hints":[],"section_id":"bb82c06d-c86c-4177-807f-fc07386dc5a2","lesson_id":"1d6d2f19-214b-4864-8ecd-b684a364bf7c"}]},{"id":"a65c21db-2457-4c02-b441-dd59bd7891f9","title":"Nombres claros y expresivos","slug":"nombres-claros-y-expresivos","position":6,"concept_id":"lua-fund-nombres-claros","explanation":"Un consejo de programador profesional: sé claro con tus nombres. Paso 1: Evita usar letras misteriosas como `local x = 5` o `local p = 100`. Paso 2: Es mil veces mejor escribir `local vidas = 5` y `local monedas = 100`. Paso 3: Cuando tu código se lee como un libro de cuentos en español, encontrar errores se vuelve facilísimo.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Claridad ante todo","code":"local vidas_restantes = 3\nlocal monedas_oro = 50\nprint(\"Vidas:\", vidas_restantes)","language":"lua","output":"Vidas:\t3","explanation":"Los nombres expresivos hacen que el código se entienda solo.","position":1}],"exercises":[{"id":"a3bd6575-2968-4644-b1b2-e962b2c2fd14","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Por qué es mejor nombrar a un dato `vidas_totales` en lugar de simplemente nombrarlo `v`?","prompt_code":null,"score":10,"concept_ids":["lua-fund-nombres-claros"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"7e56be31-cecb-4447-9b5a-275fd8b0e1b3","label":"A","body":"Porque hace que el código sea claro, legible y fácil de entender por cualquier persona","is_correct":true,"position":1},{"id":"55681c44-3997-4add-8802-c8b5b4d31f60","label":"B","body":"Porque las palabras largas hacen que el juego pese menos","is_correct":false,"position":2},{"id":"a882fcb0-efd5-42e6-b91a-f59c3a4977f1","label":"C","body":"Porque la letra v está prohibida en el abecedario","is_correct":false,"position":3},{"id":"bdd0c776-5c5a-4654-9ff1-4a4f5dc90ff1","label":"D","body":"No hay ninguna diferencia, es exactamente lo mismo","is_correct":false,"position":4}],"correct_answer_ids":["7e56be31-cecb-4447-9b5a-275fd8b0e1b3"],"explanation":"¡Muy bien! La legibilidad del código es una de las virtudes más apreciadas en la ingeniería de software.","hints":[],"section_id":"bb82c06d-c86c-4177-807f-fc07386dc5a2","lesson_id":"a65c21db-2457-4c02-b441-dd59bd7891f9"}]},{"id":"5a50d149-4e91-45d0-b09a-10f7b9728437","title":"La sangría o indentación de 2 espacios","slug":"la-sangria-o-indentacion","position":7,"concept_id":"lua-fund-indentacion","explanation":"La sangría (indentación) es el arte de alinear el código con escalones visuales. Paso 1: Cuando abres un bloque como un `if`, dejas dos espacios en blanco a la izquierda de cada renglón interior. Paso 2: Al terminar y escribir `end`, vuelves hacia la izquierda. Paso 3: Así tus ojos ven al instante la forma del bloque sin tener que adivinar.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Escalón visual","code":"if true then\n  print(\"Escalón de 2 espacios\")\nend","language":"lua","output":"Escalón de 2 espacios","explanation":"Los 2 espacios hacia adentro muestran claramente que la orden está dentro del if.","position":1}],"exercises":[{"id":"19b85309-7663-4925-a655-ab7b6ad84772","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"¿Dejar dos espacios de sangría (indentación) al escribir código dentro de un bloque ayuda a leer la jerarquía visual del programa con facilidad?","prompt_code":null,"score":10,"concept_ids":["lua-fund-indentacion"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"6834a9d1-5e20-43f8-b445-9e60ae3312fd","label":"A","body":"Verdadero","is_correct":true,"position":1},{"id":"290622cc-ed5a-4be0-a66a-d8d3efcb21c0","label":"B","body":"Falso","is_correct":false,"position":2}],"correct_answer_ids":["6834a9d1-5e20-43f8-b445-9e60ae3312fd"],"explanation":"¡Verdadero! La indentación limpia es fundamental para mantener el código ordenado y estructurado.","hints":[],"section_id":"bb82c06d-c86c-4177-807f-fc07386dc5a2","lesson_id":"5a50d149-4e91-45d0-b09a-10f7b9728437"}]},{"id":"d5c4e352-4820-472e-897a-dfe35f66ce20","title":"Lua es libre: el punto y coma ; no es obligatorio","slug":"el-punto-y-coma-no-es-obligatorio","position":8,"concept_id":"lua-fund-puntoycoma-opcional","explanation":"En lenguajes viejos como C++ o Java, si olvidas poner punto y coma `;` al final de cada línea, ¡la máquina se niega a funcionar! Paso 1: En Lua el punto y coma es 100% OPCIONAL. Paso 2: Casi ningún programador de Lua lo usa; cada instrucción vive limpia en su propia línea. Paso 3: Tu código queda despejado, moderno y libre de signos innecesarios.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Limpio sin punto y coma","code":"print(\"Línea 1 sin punto y coma\")\nprint(\"Línea 2 sin punto y coma\")","language":"lua","output":"Línea 1 sin punto y coma\nLínea 2 sin punto y coma","explanation":"En Lua no necesitas terminar cada renglón con punto y coma.","position":1}],"exercises":[{"id":"10b0b51c-0987-4aaf-9ebb-3239b9768274","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"true_false","difficulty":"easy","category":"fundamentos","prompt":"¿En Lua es obligatorio escribir punto y coma (;) al final de cada renglón para que el programa funcione?","prompt_code":null,"score":10,"concept_ids":["lua-fund-puntoycoma-opcional"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"6bef687d-bd4c-423f-939e-c597f4bd6799","label":"A","body":"Verdadero","is_correct":false,"position":1},{"id":"5b6622e7-9064-4b67-a7ba-cec6f23c9b39","label":"B","body":"Falso","is_correct":true,"position":2}],"correct_answer_ids":["5b6622e7-9064-4b67-a7ba-cec6f23c9b39"],"explanation":"¡Falso! En Lua el punto y coma es opcional y por convención de estilo se omite para mantener el código limpio.","hints":[],"section_id":"bb82c06d-c86c-4177-807f-fc07386dc5a2","lesson_id":"d5c4e352-4820-472e-897a-dfe35f66ce20"}]},{"id":"168db3c6-f940-45a3-a021-88871aa28cc6","title":"Mayúsculas y minúsculas: Lua distingue cada letra","slug":"lua-distingue-mayusculas-y-minusculas","position":9,"concept_id":"lua-fund-case-sensitive","explanation":"Lua es muy sensible a las mayúsculas (se dice que es 'case-sensitive'). Paso 1: La palabra `jugador` en minúsculas es totalmente distinta a `Jugador` con mayúscula. Paso 2: Y ambas son distintas a `JUGADOR`. Paso 3: Por eso la orden se escribe `print` en minúsculas; si escribes `Print` con P mayúscula, Lua no la reconocerá.","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Sensible a mayúsculas","code":"-- print(\"hola\")  => Correcto\n-- Print(\"hola\")  => Error: intento de llamar a algo que no existe","language":"lua","output":"","explanation":"print debe ser estrictamente en minúsculas.","position":1}],"exercises":[{"id":"e8e8ace5-4148-4665-aad8-6ee2f9159ef1","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"Si escribes la orden `Print(\"Hola\")` con la letra 'P' mayúscula en Lua, ¿qué sucederá?","prompt_code":null,"score":10,"concept_ids":["lua-fund-case-sensitive"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"c8726196-cfce-4a16-89ba-11bc1245d1aa","label":"A","body":"Funcionará de color dorado","is_correct":false,"position":1},{"id":"3fec3204-6a72-45a1-a3c0-33555b68471f","label":"B","body":"Marcará un error porque Lua distingue mayúsculas y minúsculas, y la orden es `print` en minúsculas","is_correct":true,"position":2},{"id":"9fa5c28d-402e-4c91-b423-ad25727d7af5","label":"C","body":"El texto saldrá el doble de grande en la pantalla","is_correct":false,"position":3},{"id":"01d6bce5-0165-43f3-97c6-98daf61f5104","label":"D","body":"Se activará la cámara web","is_correct":false,"position":4}],"correct_answer_ids":["3fec3204-6a72-45a1-a3c0-33555b68471f"],"explanation":"¡Exacto! Lua es case-sensitive; las funciones y palabras clave deben coincidir exactamente con sus mayúsculas y minúsculas oficiales.","hints":[],"section_id":"bb82c06d-c86c-4177-807f-fc07386dc5a2","lesson_id":"168db3c6-f940-45a3-a021-88871aa28cc6"}]},{"id":"fee4c51d-a1c5-4d0b-82ff-ffd3115fbb3b","title":"Mini-repaso de la Sección 7","slug":"mini-repaso-seccion-siete","position":10,"concept_id":"lua-fund-s07-repaso","explanation":"¡Sección 7 dominada con honores! Paso 1: Aprendiste que hay 21 palabras reservadas que no puedes usar de nombre. Paso 2: Aprendiste las reglas de nombres (letras, números y guión bajo; nunca empezar con número). Paso 3: Aprendiste sobre la indentación de 2 espacios, la ausencia de `;` y la importancia de las minúsculas. ¡Ahora aprenderemos a ser detectives de errores!","is_required":true,"status":"published","content_version":2,"examples":[{"title":"Resumen S07","code":"print(\"¡Estilo y palabras reservadas dominadas!\")","language":"lua","output":"¡Estilo y palabras reservadas dominadas!","explanation":"Escribes código elegante y profesional.","position":1}],"exercises":[{"id":"720ce2e8-aa86-4f48-86be-321882cf594d","version":1,"language_id":"a0e1b2c3-d4e5-4f6a-8b9c-0d1e2f3a4b5c","module_id":"b1e2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","type":"single_choice","difficulty":"easy","category":"fundamentos","prompt":"¿Cuál de los siguientes nombres es totalmente legal, descriptivo y sigue las mejores prácticas en Lua?","prompt_code":null,"score":10,"concept_ids":["lua-fund-s07-repaso"],"status":"published","content_version":2,"is_diagnostic":false,"time_estimated_seconds":30,"answers":[{"id":"5add109c-6f60-4044-b257-fda9526b13dd","label":"A","body":"local","is_correct":false,"position":1},{"id":"854036a5-eb2a-42d8-916d-e36467c4506b","label":"B","body":"1_puntos","is_correct":false,"position":2},{"id":"6893e48c-354f-42ca-8d5e-37434c7b2918","label":"C","body":"puntos_jugador","is_correct":true,"position":3},{"id":"0cf98fbc-b795-4c92-bf57-6e672a18a3d5","label":"D","body":"mi jugador con espacios","is_correct":false,"position":4}],"correct_answer_ids":["6893e48c-354f-42ca-8d5e-37434c7b2918"],"explanation":"¡Correcto! `puntos_jugador` no es palabra reservada, no empieza con número, no tiene espacios y es muy expresivo.","hints":[],"section_id":"bb82c06d-c86c-4177-807f-fc07386dc5a2","lesson_id":"fee4c51d-a1c5-4d0b-82ff-ffd3115fbb3b"}]}]},{"id":"d35989c6-0c4c-4b6d-a46b-e0980f17f147","title":"Kit para entender errores","slug":"kit-de-supervivencia","position":8,"type":"review","status":"published","content_version":2,"estimated_minutes":15,"xp_on_complete":10,"lessons":[{"id":"ef4f9aa3-062d-4f47-b02f-21c5b7f8633e","title":"Perder el miedo a los errores","slug":"perder-el-miedo-a-los-errores","position":1,"concept_id":"lua-fund-perder-miedo-error","explanation":"El mayor obstáculo de los novatos es asustarse cuando sale un texto en rojo en la pantalla. ¡No t
